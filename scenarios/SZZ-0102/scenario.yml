schema_version: '1.0'
meta:
  id: SZZ-0102
  title: Import reorder after BIC
  slug: import-reorder-after-bic
  description: >
    The file already carries four imports when the bug is introduced. Between
    the bug-introducing and the bug-fixing commit, a commit sorts those imports
    alphabetically without adding or removing any of them. The faulty line is
    far away and untouched, so plain `git blame` at the BFC parent reaches the
    BIC. The scenario is a control for tools that treat any later change to the
    file as a candidate.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - import-reorder-after-bic
  difficulty: easy
  status: active
  tier: control
  category_code: "S3"
repository:
  name: SZZ-0102-import-reorder-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add an in-memory index of order codes
  author: Priya Raman <priya.raman@example.com>
  date: 2023-09-25T15:38:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/orders/OrderIndex.java
    content: |
      package com.example.orders;

      import java.util.List;
      import java.util.Comparator;
      import java.util.ArrayList;
      import java.util.Collections;

      public class OrderIndex {
          private final List<String> codes = new ArrayList<>();

          public void add(String code) {
              codes.add(code);
          }

          public List<String> sortedCodes() {
              List<String> copy = new ArrayList<>(codes);
              Collections.sort(copy, Comparator.naturalOrder());
              return copy;
          }

          public boolean isTracked(int index) {
              return index >= 0 && index < codes.size();
          }

          public String codeAt(int index) {
              if (!isTracked(index)) {
                  return null;
              }
              return codes.get(index);
          }
      }
- id: c1
  message: Skip the head slot when checking whether an index is tracked
  author: Priya Raman <priya.raman@example.com>
  date: 2023-10-02T09:18:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/orders/OrderIndex.java
    old: |2
              return index >= 0 && index < codes.size();
    new: |2
              return index > 0 && index < codes.size();
    labels:
    - B001
    - fault
- id: c2
  message: Sort the imports of OrderIndex alphabetically
  author: Luca Moretti <luca.moretti@example.com>
  date: 2023-10-10T15:28:00Z
  role: formatting
  operations:
  - type: replace
    path: src/main/java/com/example/orders/OrderIndex.java
    old: |
      import java.util.List;
      import java.util.Comparator;
      import java.util.ArrayList;
      import java.util.Collections;
    new: |
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.Comparator;
      import java.util.List;
    labels:
    - non_bug_introducing_change
- id: c3
  message: Treat index 0 as a tracked position again
  author: Diego Alvarez <diego.alvarez@example.com>
  date: 2023-10-16T16:25:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/orders/OrderIndex.java
    old: |2
              return index > 0 && index < codes.size();
    new: |2
              return index >= 0 && index < codes.size();
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: The first order code is reported as untracked
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/orders/OrderIndex.java
    entity:
      type: method
      name: isTracked
      signature: boolean isTracked(int index)
    statement: return index > 0 && index < codes.size();
    change_type: line_modification
    description: >
      The lower bound excludes index 0, so the first stored order code is
      reported as untracked and codeAt(0) returns null.
  fix:
    commit: c3
    file: src/main/java/com/example/orders/OrderIndex.java
    entity:
      type: method
      name: isTracked
      signature: boolean isTracked(int index)
    statement: return index >= 0 && index < codes.size();
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return index > 0 && index < codes.size();
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
