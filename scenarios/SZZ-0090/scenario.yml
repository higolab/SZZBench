schema_version: "1.0"

meta:
  id: "SZZ-0090"
  title: "Guard clause addition after BIC"
  slug: "guard-clause-after-bic"
  description: >
    A range check is changed from inclusive to exclusive bounds, which is the
    fault. A later commit adds an early-return guard for inverted ranges
    directly above the faulty line. The guard is semantically redundant for
    both the faulty and the fixed condition, so it does not contribute to the
    fault and is not part of the oracle. The fixing commit repairs only the
    faulty line and keeps the guard.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "guard-clause-after-bic"
    - "redundant-guard"
    - "blame-reaches-bic"
  difficulty: "easy"
  status: "active"
  tier: "control"
  category_code: "S3"

repository:
  name: "SZZ-0090-guard-clause-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add a range check helper"
    author: "Hana Sato <hana.sato@example.com>"
    date: "2024-06-12T14:55:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Scenario0090.java"
        content: |
          package example;

          public class Scenario0090 {
              public boolean check(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Make the range bounds exclusive in check()"
    author: "Luca Moretti <luca.moretti@example.com>"
    date: "2024-06-17T09:50:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0090.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Return early when the range is inverted"
    author: "Diego Alvarez <diego.alvarez@example.com>"
    date: "2024-06-24T13:17:00Z"
    role: "distractor"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0090.java"
        old: |
          package example;

          public class Scenario0090 {
              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        new: |
          package example;

          public class Scenario0090 {
              public boolean check(int value, int min, int max) {
                  if (min > max) {
                      return false;
                  }
                  return value > min && value < max;
              }
          }
        labels: ["non_bug_introducing_change"]

  - id: "c3"
    message: "Include both range bounds in check() again"
    author: "Diego Alvarez <diego.alvarez@example.com>"
    date: "2024-06-26T13:42:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0090.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Range bounds are excluded from the containment check"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Scenario0090.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Scenario0090.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
        known_distractors: ["c2"]
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          The guard added by c2 survives the fix and is semantically
          redundant: when `min > max` the conjunction is already false for
          every value. c2 therefore does not contribute to the fault, and
          plain `git blame` at c3^ on the single deleted line returns c1.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
