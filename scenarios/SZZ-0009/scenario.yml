schema_version: '1.0'
meta:
  id: SZZ-0009
  title: Minimum comparison error
  slug: minimum-comparison-error
  description: This scenario introduces a bug by changing `return value >= minimum;` to `return value > minimum;` and later restores the correct implementation.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - comparison-error
  difficulty: easy
  status: active
  category_code: "S1"
repository:
  name: SZZ-0009-minimum-comparison-error
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial correct implementation
  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0019.java
    content: |
      package example;

      public class Scenario0019 {
          public boolean isAtLeast(int value, int minimum) {
              return value >= minimum;
          }
      }
- id: c1
  message: Introduce bug
  author: Bob <bob@example.com>
  date: '2024-01-02T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0019.java
    old: |
      package example;

      public class Scenario0019 {
          public boolean isAtLeast(int value, int minimum) {
              return value >= minimum;
          }
      }
    new: |
      package example;

      public class Scenario0019 {
          public boolean isAtLeast(int value, int minimum) {
              return value > minimum;
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Fix bug
  author: Alice <alice@example.com>
  date: '2024-01-03T10:00:00Z'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0019.java
    old: |
      package example;

      public class Scenario0019 {
          public boolean isAtLeast(int value, int minimum) {
              return value > minimum;
          }
      }
    new: |
      package example;

      public class Scenario0019 {
          public boolean isAtLeast(int value, int minimum) {
              return value >= minimum;
          }
      }
    labels:
    - B001
    - fix
