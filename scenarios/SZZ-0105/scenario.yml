schema_version: '1.0'
meta:
  id: SZZ-0105
  title: Dead code addition after BIC
  slug: dead-code-addition-after-bic
  description: >
    Between the bug-introducing and the bug-fixing commit, a commit adds a
    constant and a private method that nothing calls. The dead code stays in
    the file after the fix; the bug-fixing commit only replaces the faulty
    comparison. The added code does not re-indent or rewrite the faulty line,
    so plain `git blame` at the BFC parent reaches the BIC.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - dead-code-after-bic
  difficulty: easy
  status: active
  category_code: "S3"
repository:
  name: SZZ-0105-dead-code-addition-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the stock level checks used by the order service
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-09-27T09:56:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/inventory/StockLevel.java
    content: |
      package com.example.inventory;

      public class StockLevel {
          private final int onHand;

          public StockLevel(int onHand) {
              this.onHand = onHand;
          }

          public boolean isAvailable(int requested) {
              return onHand >= requested;
          }

          public int remainingAfter(int requested) {
              return onHand - requested;
          }
      }
- id: c1
  message: Keep one unit of head room when answering availability
  author: Luca Moretti <luca.moretti@example.com>
  date: 2024-10-02T17:30:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/inventory/StockLevel.java
    old: |2
              return onHand >= requested;
    new: |2
              return onHand > requested;
    labels:
    - B001
    - fault
- id: c2
  message: Carry the reorder point over for the replenishment job
  author: Hana Sato <hana.sato@example.com>
  date: 2024-10-04T18:15:00Z
  role: cleanup
  operations:
  - type: replace
    path: src/main/java/com/example/inventory/StockLevel.java
    old: |2
          private final int onHand;
    new: |2
          private final int onHand;
          private static final int REORDER_POINT = 5;
  - type: replace
    path: src/main/java/com/example/inventory/StockLevel.java
    old: |2
          public int remainingAfter(int requested) {
              return onHand - requested;
          }
      }
    new: |2
          public int remainingAfter(int requested) {
              return onHand - requested;
          }

          private int unitsBelowReorderPoint() {
              return REORDER_POINT - onHand;
          }
      }
    labels:
    - non_bug_introducing_change
- id: c3
  message: Report stock as available when it exactly covers the request
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2024-10-08T13:57:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/inventory/StockLevel.java
    old: |2
              return onHand > requested;
    new: |2
              return onHand >= requested;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: A request that exactly matches the stock on hand is refused
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/inventory/StockLevel.java
    entity:
      type: method
      name: isAvailable
      signature: boolean isAvailable(int requested)
    statement: return onHand > requested;
    change_type: line_modification
    description: >
      The comparison excludes equality, so the last available unit can never be
      sold although remainingAfter() correctly reports zero for it.
  fix:
    commit: c3
    file: src/main/java/com/example/inventory/StockLevel.java
    entity:
      type: method
      name: isAvailable
      signature: boolean isAvailable(int requested)
    statement: return onHand >= requested;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return onHand > requested;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
