schema_version: '1.0'
meta:
  id: SZZ-0155
  title: Same bug introduced independently
  slug: same-bug-introduced-independently
  description: >-
    Two commits introduce the same exclusive-boundary fault independently in two methods of
    `IndependentRanges`: `c1` in one, `c2` in the other, neither copied from the other. `c3` repairs both, so
    the oracle is the two-commit set {c1, c2}.
  category: "Multiple BICs, duplicate faults, and composite faults"
  factors:
  - multi-bic
  - single-bfc
  - boundary-condition
  - duplicate-statement
  difficulty: hard
  status: active
  tier: control
  category_code: "S6"
repository:
  name: SZZ-0155-same-bug-introduced-independently
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: 'Add two independent range checks'
  author: Hana Sato <hana.sato@example.com>
  date: 2024-06-03T09:47:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/IndependentRanges.java
    content: |
      package example;

      public class IndependentRanges {
        public boolean containsA(int value, int min, int max) {
          return value >= min && value <= max;
        }

        public boolean containsB(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
- id: c1
  message: 'Make the first range check exclusive'
  author: Hana Sato <hana.sato@example.com>
  date: 2024-06-10T13:28:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/IndependentRanges.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
    occurrence: 1
- id: c2
  message: 'Make the second range check exclusive'
  author: Hana Sato <hana.sato@example.com>
  date: 2024-06-11T09:00:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/IndependentRanges.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
    occurrence: 1
- id: c3
  message: 'Accept the bounds in both range checks'
  author: Hana Sato <hana.sato@example.com>
  date: 2024-06-20T18:11:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/IndependentRanges.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
    occurrence: 1
  - type: replace
    path: src/main/java/example/IndependentRanges.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
    occurrence: 1
bugs:
- id: B001
  title: Independent same-pattern boundary bugs
  bug_fixing_commit: c3
  bug_introducing_commits:
  - c1
  - c2
  fault:
    commit: c1
    file: src/main/java/example/IndependentRanges.java
    statement: return value > min && value < max;
    method: containsA
  fix:
    commit: c3
    file: src/main/java/example/IndependentRanges.java
    statement: return value >= min && value <= max;
