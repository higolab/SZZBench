schema_version: "1.0"

meta:
  id: "SZZ-0222"
  title: "Blame answers one commit and every one of them is wrong: an omission restored beside a duplicate guard removed"
  slug: "blame-answers-only-wrong-commits"
  description: >
    A per-item size check is dropped from the upload validator, and a batch
    entry point written later never checks the batch total. The fix restores one
    check and adds the other, both by adding lines, and in the same commit
    removes a null check that a merge had left duplicated. The only lines it deletes are that duplicate, so blame answers a
    single commit that is not part of the answer and misses both that are:
    where SZZ-0214 leaves blame with nothing to say, this scenario has it say
    something confident and entirely wrong.
  category: "Omission and deletion bugs"
  factors:
    - "multi-bic"
    - "single-bfc"
    - "addition-only-fix"
    - "tangled-bfc"
    - "prerequisite-bic"
    - "null-check-omission"
    - "blame-unreachable-bic"
  difficulty: "hard"
  status: "active"
  tier: "discriminating"
  defeats: ["blame", "shape", "position"]
  category_code: "S2"

