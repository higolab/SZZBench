bugs:
  - id: "B001"
    title: "An oversized upload is accepted, and a batch over the total limit is accepted too"
    bug_fixing_commit: "c4"
    bug_introducing_commits: ["c1", "c3"]
    fault:
      commit: "c1"
      file: "src/main/java/example/Uploads.java"
      entity:
        type: "method"
        name: "accept"
        signature: "boolean accept(String name, int sizeBytes)"
      change_type: "omission"
      missing_statement: |2
        if (sizeBytes > MAX_BYTES) {
            return false;
        }
      description: "The size check existed in c0 and was deleted by c1 without any other change."
    fix:
      commit: "c4"
      file: "src/main/java/example/Uploads.java"
      entity:
        type: "method"
        name: "accept"
        signature: "boolean accept(String name, int sizeBytes)"
      added_statement: |2
                if (sizeBytes > MAX_BYTES) {
                    return false;
                }
      fix_type: "line_addition"
    expected_szz:
      commit_level:
        true_positives: ["c1", "c3"]
        primary_observable_bic: "c1"
        contributing_bics: ["c3"]
        false_positives_allowed: []
      line_level:
        available: false
        reason: >
          Both repairs add lines only. The lines the fix does delete come from
          the duplicated null check, and git's aligner takes the first of the
          pair, which c0 wrote, so blame answers c0 and nothing else: no true
          positive and one false positive.

scenario_design:
  failure_mode: >-
    A tool fails here when it takes blame's answer, `c0`: the only line the
    fix deletes is one of the two identical null checks `c2` kept, which git
    attributes to `c0`, and the size check `c1` dropped and the batch check
    `c3` never made come back as added lines only.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3", "c4"]
