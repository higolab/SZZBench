schema_version: '1.0'
meta:
  id: SZZ-0173
  title: File creation only as fix
  slug: file-creation-only-as-fix
  description: >-
    `PluginLoader.loadDefault()` resolves `example.DefaultPlugin` reflectively by class name, but no
    `DefaultPlugin.java` exists, so the call fails with `ClassNotFoundException` at runtime. The BFC only adds
    the missing file; it modifies or deletes no existing line. Checks whether SZZ can attribute an
    addition-only fix to the commit that introduced the dangling reference.
  category: "Non-source, configuration, test-only, and file-level edge cases"
  factors:
  - single-bic
  - single-bfc
  - omission-bug
  - file-creation-fix
  difficulty: hard
  status: active
  category_code: "S8"
repository:
  name: SZZ-0173-file-creation-only-as-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add plugin loader that resolves the default plugin by class name
  author: Alice <alice@example.com>
  date: '2024-05-01T10:00:00Z'
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/PluginLoader.java
    content: |
      package example;

      public class PluginLoader {
          public Object loadDefault() throws ReflectiveOperationException {
              return Class.forName("example.DefaultPlugin").getDeclaredConstructor().newInstance();
          }
      }
- id: c1
  message: Add the DefaultPlugin class expected by PluginLoader
  author: Bob <bob@example.com>
  date: '2024-05-02T10:00:00Z'
  role: bug_fixing
  operations:
  - type: write_file
    path: src/main/java/example/DefaultPlugin.java
    content: |
      package example;

      public class DefaultPlugin {
          public String name() {
              return "default";
          }
      }
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: Missing DefaultPlugin class is fixed by file creation
  bug_fixing_commit: c1
  bug_introducing_commits:
  - c0
  fault:
    commit: c0
    file: src/main/java/example/PluginLoader.java
    entity:
      type: class
      name: DefaultPlugin
    change_type: omission
    description: >-
      PluginLoader.loadDefault() calls Class.forName("example.DefaultPlugin"), but DefaultPlugin.java is
      absent before the fix, so loadDefault() throws ClassNotFoundException at runtime. The referencing line
      in PluginLoader.java was written by c0.
    missing_statement: DefaultPlugin
  fix:
    commit: c1
    file: src/main/java/example/DefaultPlugin.java
    statement: public class DefaultPlugin
    fix_type: file_creation
  expected_szz:
    commit_level:
      true_positives:
      - c0
      false_positives_allowed: []
      notes: >-
        Addition-only fix by design: the BFC creates a new file and touches no existing line, so a
        diff-of-the-BFC based blame has nothing to blame. The only pre-existing evidence is the reflective
        reference in PluginLoader.java, which plain blame attributes to c0.
    line_level:
      available: false
      faulty_statements: []
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
