schema_version: '1.0'
meta:
  id: SZZ-0095
  title: Generic type change after BIC
  slug: generic-type-change-after-bic
  description: >
    The BIC makes the tag limit check count the tag that is about to be added, so
    the last allowed tag is rejected. An intermediate commit narrows the type
    argument of the join() parameter from List<Object> to List<String> and adapts
    the loop variable; it does not touch the faulty method. The bug-fixing commit
    repairs only the limit check, so plain blame at the BFC parent still reaches
    the BIC: this is an honest control for the generic-type-noise family.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - generic-type-after-bic
  - plain-blame-control
  difficulty: easy
  status: active
  tier: control
  category_code: "S3"
repository:
  name: SZZ-0095-generic-type-change-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the tag index used by the catalogue search
  author: Hana Sato <hana.sato@example.com>
  date: 2024-02-05T14:02:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/search/TagIndex.java
    content: |
      package com.example.search;

      import java.util.List;

      public class TagIndex {
          private static final int MAX_TAGS = 8;

          public boolean acceptsMore(int currentCount) {
              return currentCount < MAX_TAGS;
          }

          public String join(List<Object> tags) {
              StringBuilder joined = new StringBuilder();
              for (Object tag : tags) {
                  if (joined.length() > 0) {
                      joined.append(", ");
                  }
                  joined.append(tag);
              }
              return joined.toString();
          }
      }
- id: c1
  message: Include the tag that is about to be added in the limit check
  author: Hana Sato <hana.sato@example.com>
