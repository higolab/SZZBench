bugs:
- id: B001
  title: The tag limit check is off by one and rejects the last allowed tag
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/search/TagIndex.java
    entity:
      type: method
      name: acceptsMore
      signature: boolean acceptsMore(int currentCount)
    statement: return currentCount + 1 < MAX_TAGS;
    change_type: line_modification
    description: >
      acceptsMore reports the number of tags that may still be added, so the
      count must not be incremented; with the increment an entry can only carry
      seven tags instead of eight, and the increment also overflows at
      Integer.MAX_VALUE.
  fix:
    commit: c3
    file: src/main/java/com/example/search/TagIndex.java
    entity:
      type: method
      name: acceptsMore
      signature: boolean acceptsMore(int currentCount)
    statement: return currentCount < MAX_TAGS;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return currentCount + 1 < MAX_TAGS;
      note: >
        c2 changes the type argument of join()'s parameter and the type of the
        loop variable; the faulty line is untouched, so blame at c3^ returns c1.
checks:
- type: git_history_contains
  commits:
