- id: c2
  message: Look up the extension separator with lastIndexOf
  author: Jonas Berg <jonas.berg@example.com>
  date: 2023-07-10T16:47:00Z
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/com/example/storage/AttachmentName.java
    old: |2
              for (int index = fileName.length() - 1; index > 0; index--) {
                  if (fileName.charAt(index) == '.') {
                      return fileName.substring(index + 1);
                  }
              }
              return "";
    new: |2
              int index = fileName.lastIndexOf('.');
              if (index > 0) {
                  return fileName.substring(index + 1);
              }
              return "";
