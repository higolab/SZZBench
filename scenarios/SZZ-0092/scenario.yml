schema_version: '1.0'
meta:
  id: SZZ-0092
  title: Loop to conditional rewrite after BIC
  slug: loop-to-conditional-after-bic
  description: >
    The BIC tightens the bound of a backwards scan that looks for the extension
    separator of an attachment name, so a name whose only dot is the first
    character loses its extension. An intermediate refactoring replaces the scan
    with String.lastIndexOf and carries the same comparison into a conditional.
    The bug-fixing commit corrects the comparison in its rewritten form, so plain
    blame at the BFC parent stops at the refactoring and never reaches the BIC.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - loop-rewrite-after-bic
  - basic-blame-distractor
  difficulty: hard
  status: active
  category_code: "S3"
repository:
  name: SZZ-0092-loop-to-conditional-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add attachment name helpers for the upload service
  author: Tom Becker <tom.becker@example.com>
  date: 2023-06-26T08:21:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/storage/AttachmentName.java
    content: |
      package com.example.storage;

      public class AttachmentName {
          public String extension(String fileName) {
              for (int index = fileName.length() - 1; index >= 0; index--) {
                  if (fileName.charAt(index) == '.') {
                      return fileName.substring(index + 1);
                  }
              }
              return "";
          }

          public boolean hasExtension(String fileName) {
              return !extension(fileName).isEmpty();
          }
      }
