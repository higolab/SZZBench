bugs:
- id: B001
  title: Attachment names whose only dot is the first character lose their extension
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/storage/AttachmentName.java
    entity:
      type: method
      name: extension
      signature: String extension(String fileName)
    statement: index > 0
    change_type: line_modification
    description: >
      The scan bound excludes position 0, so ".bashrc" reports no extension
      instead of "bashrc". The sub-expression is used as fault.statement because
      c2 rewrites the surrounding line, moving the same comparison from the loop
      header into the conditional.
  fix:
    commit: c3
    file: src/main/java/com/example/storage/AttachmentName.java
    entity:
      type: method
      name: extension
      signature: String extension(String fileName)
    statement: if (index >= 0) {
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - for (int index = fileName.length() - 1; index > 0; index--) {
      note: >
        The faulty line is rewritten by c2, which replaces the backwards scan
        with lastIndexOf and keeps the comparison in the conditional. Blame at
        c3^ returns c2; one step of line history returns c1.
