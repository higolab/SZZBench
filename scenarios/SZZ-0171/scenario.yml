schema_version: '1.0'
meta:
  id: SZZ-0171
  title: Dependency update as BIC
  slug: bic-dependency-update
  description: Evaluates dependency update as bic and checks whether SZZ identifies the expected bug-introducing commit set.
  category: "Non-source, configuration, test-only, and file-level edge cases"
  factors: []
  difficulty: hard
  status: active
  category_code: "S8"
repository:
  name: SZZ-0171-bic-dependency-update
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: 'c0: create initial state (write_file pom.xml; write_file src/main/java/example/RangeAdapter.java)'
  role: initial
  operations:
  - type: write_file
    path: pom.xml
    content: |
      <project>
        <modelVersion>4.0.0</modelVersion>
        <groupId>example</groupId>
        <artifactId>dependency-bic</artifactId>
        <version>1.0-SNAPSHOT</version>
        <dependencies>
          <dependency>
            <groupId>org.example</groupId>
            <artifactId>range-lib</artifactId>
            <version>1.0.0</version>
          </dependency>
        </dependencies>
      </project>
  - type: write_file
    path: src/main/java/example/RangeAdapter.java
    content: |
      package example;

      public class RangeAdapter {
        public boolean contains(int value, int min, int max) {
          return RangeLib.includes(value, min, max);
        }
      }
- id: c1
  message: 'c1: introduce bug (replace pom.xml)'
  role: bug_introducing
  operations:
  - type: replace
    path: pom.xml
    old: "<version>1.0.0</version>"
    new: "<version>2.0.0</version>"
- id: c2
  message: 'c2: fix bug (replace src/main/java/example/RangeAdapter.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeAdapter.java
    old: return RangeLib.includes(value, min, max);
    new: return RangeLib.containsInclusive(value, min, max);
bugs:
- id: B001
  title: Dependency update changes range semantics
  bug_fixing_commit: c2
  bug_introducing_commits:
  - c1
  fault:
    commit: c1
    file: pom.xml
    statement: "<version>2.0.0</version>"
    change_type: dependency_update
  fix:
    commit: c2
    file: src/main/java/example/RangeAdapter.java
    statement: return RangeLib.containsInclusive(value, min, max);
    fix_type: api_adaptation
  expected_szz:
    commit_level:
      true_positives:
      - c1
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - "<version>2.0.0</version>"
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
