schema_version: "1.0"

meta:
  id: "SZZ-0002"
  title: "Boolean return value modification"
  slug: "boolean-return-value-modification"
  description: >
    A bug is introduced by changing a predicate method to always return true.
    The bug is later fixed by restoring the original predicate expression.
  category: "Basic semantic line changes"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "boolean-return-change"
  difficulty: "easy"
  status: "active"
  category_code: "S1"

repository:
  name: "SZZ-0002-boolean-return-value-modification"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial account predicate"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/AccountPolicy.java"
        content: |
          package example;

          public class AccountPolicy {
              public boolean canWithdraw(boolean active, int balance) {
                  return active && balance > 0;
              }
          }

  - id: "c1"
    message: "Allow withdrawals unconditionally"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/AccountPolicy.java"
        old: "return active && balance > 0;"
        new: "return true;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Restore withdrawal predicate"
    author: "Alice <alice@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/AccountPolicy.java"
        old: "return true;"
        new: "return active && balance > 0;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Inactive accounts can withdraw"
    bug_fixing_commit: "c2"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/example/AccountPolicy.java"
      entity:
        type: "method"
        name: "canWithdraw"
        signature: "boolean canWithdraw(boolean active, int balance)"
      statement: "return true;"
      change_type: "line_modification"
    fix:
      commit: "c2"
      file: "src/main/java/example/AccountPolicy.java"
      entity:
        type: "method"
        name: "canWithdraw"
        signature: "boolean canWithdraw(boolean active, int balance)"
      statement: "return active && balance > 0;"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return true;"

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2"]
