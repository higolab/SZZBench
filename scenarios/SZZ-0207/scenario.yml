    file: src/main/java/example/RetryPolicy.java
    statement: 'return unit.equals(java.util.concurrent.TimeUnit.SECONDS.name()) ? configuredDelay * 1000 : configuredDelay;'
    change_type: line_modification
  fix:
    commit: c3
    file: config/retry.properties
    statement: retry.delay.unit=SECONDS
    fix_type: config_modification
  expected_szz:
