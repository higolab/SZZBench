schema_version: '1.0'
meta:
  id: SZZ-0024
  title: Incorrect clamp lower bound
  slug: incorrect-clamp-lower-bound
  description: This scenario introduces a bug by changing `return Math.max(value, lower);` to `return Math.min(value, lower);` and later restores the correct implementation.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - arithmetic-error
  difficulty: easy
  status: active
  category_code: "S1"
repository:
  name: SZZ-0024-incorrect-clamp-lower-bound
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial correct implementation
  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0037.java
    content: |
      package example;

      public class Scenario0037 {
          public int clampLower(int value, int lower) {
              return Math.max(value, lower);
          }
      }
- id: c1
  message: Introduce bug
  author: Bob <bob@example.com>
  date: '2024-01-02T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0037.java
    old: |
      package example;

      public class Scenario0037 {
          public int clampLower(int value, int lower) {
              return Math.max(value, lower);
          }
      }
    new: |
      package example;

      public class Scenario0037 {
          public int clampLower(int value, int lower) {
              return Math.min(value, lower);
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Fix bug
  author: Alice <alice@example.com>
  date: '2024-01-03T10:00:00Z'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0037.java
    old: |
      package example;

      public class Scenario0037 {
          public int clampLower(int value, int lower) {
              return Math.min(value, lower);
          }
      }
    new: |
      package example;

      public class Scenario0037 {
          public int clampLower(int value, int lower) {
              return Math.max(value, lower);
          }
      }
    labels:
    - B001
