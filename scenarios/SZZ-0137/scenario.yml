schema_version: '1.0'
meta:
  id: SZZ-0137
  title: Null handling and empty handling changed separately
  slug: null-and-empty-handling
  description: >-
    `hasText` is implemented with two named checks, `notNull` and `notEmpty`. One commit replaces the null check
    with a constant and a later commit collapses the emptiness check into the null check, so `hasText` ends up
    accepting both `null` and `""`. A single BFC restores both lines, so both weakening commits are BICs of the
    same bug.
  category: "Multiple BICs, duplicate faults, and composite faults"
  factors:
  - multi-bic
  - single-bfc
  - line-modification
  difficulty: medium
  status: active
  category_code: "S6"
repository:
  name: SZZ-0137-null-and-empty-handling
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add hasText helper with null and empty checks
  author: Hana Sato <hana.sato@example.com>
  date: 2023-02-20T15:24:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0137.java
    content: |
      package example;

      public class Scenario0137 {
          public boolean hasText(String value) {
              boolean notNull = value != null;
              boolean notEmpty = notNull && !value.isEmpty();
              return notNull && notEmpty;
          }
      }
- id: c1
  message: Remove redundant null guard from hasText
  author: Hana Sato <hana.sato@example.com>
  date: 2023-02-27T09:36:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0137.java
    old: boolean notNull = value != null;
    new: boolean notNull = true;
    labels:
    - B001
    - fault
- id: c2
  message: Simplify emptiness check in hasText
  author: Hana Sato <hana.sato@example.com>
  date: 2023-03-08T10:35:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0137.java
    old: boolean notEmpty = notNull && !value.isEmpty();
    new: boolean notEmpty = notNull;
    labels:
    - B001
    - fault
- id: c3
  message: Restore null and empty checks in hasText
  author: Hana Sato <hana.sato@example.com>
  date: 2023-03-17T11:40:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0137.java
    old: boolean notNull = true;
    new: boolean notNull = value != null;
    labels:
    - B001
    - fix
  - type: replace
    path: src/main/java/example/Scenario0137.java
    old: boolean notEmpty = notNull;
    new: boolean notEmpty = notNull && !value.isEmpty();
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: hasText accepts null and empty input
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  - c2
  fault:
    commit: c1
    file: src/main/java/example/Scenario0137.java
    entity:
      type: method
      name: hasText
      signature: boolean hasText(String value)
    statement: boolean notNull = true;
    change_type: line_modification
  fix:
    commit: c3
    file: src/main/java/example/Scenario0137.java
    entity:
      type: method
      name: hasText
      signature: boolean hasText(String value)
    statement: boolean notNull = value != null;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      notes: >-
        Both c1 and c2 are required. c1 replaced the null check with `true` (hasText(null) throws
        NullPointerException) and c2 collapsed the emptiness check into the null check (hasText("") returns
        true). The BFC c3 restores both lines in one commit.
    line_level:
      available: true
      faulty_statements:
      - boolean notNull = true;
      - boolean notEmpty = notNull;
      note: >-
        The BFC modifies two lines. `boolean notNull = true;` was last changed by c1 and `boolean notEmpty
        = notNull;` by c2, so plain line blame on the two fixed lines reaches both BICs.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
