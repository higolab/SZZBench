    old: "package example;\n\npublic class Scenario0137 {\n    public boolean canUse(boolean featureEnabled, int usage, int limit) {\n        return featureEnabled && usage < limit;\n    }\n}\n"
    new: |
      package example;

      public class Scenario0137 {
          public boolean canUse(boolean featureEnabled, int usage, int limit) {
              return true;
          }
      }
    labels:
    - B001
    - fix
