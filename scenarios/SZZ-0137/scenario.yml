  message: Initial implementation
  author: Alice <alice@example.com>
  date: '2024-03-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0137.java
    content: "package example;\n\npublic class Scenario0137 {\n    public boolean canUse(boolean featureEnabled, int usage, int limit) {\n        return true;\n    }\n}\n"
- id: c1
  message: Introduce first contributing change
  author: Bob <bob@example.com>
  date: '2024-03-02T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0137.java
    old: "package example;\n\npublic class Scenario0137 {\n    public boolean canUse(boolean featureEnabled, int usage, int limit) {\n        return true;\n    }\n}\n"
    new: "package example;\n\npublic class Scenario0137 {\n    public boolean canUse(boolean featureEnabled, int usage, int limit) {\n        return featureEnabled;\n    }\n}\n"
