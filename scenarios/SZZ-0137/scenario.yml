    - fault
- id: c2
  message: Introduce second contributing change
  author: Carol <carol@example.com>
  date: '2024-03-03T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0137.java
    old: "package example;\n\npublic class Scenario0137 {\n    public boolean canUse(boolean featureEnabled, int usage, int limit) {\n        return featureEnabled;\n    }\n}\n"
    new: "package example;\n\npublic class Scenario0137 {\n    public boolean canUse(boolean featureEnabled, int usage, int limit) {\n        return featureEnabled && usage < limit;\n    }\n}\n"
