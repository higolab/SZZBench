schema_version: '1.0'
meta:
  id: SZZ-0104
  title: Method order change after BIC
  slug: method-order-change-after-bic
  description: >
    The class holds three methods from the start. Between the bug-introducing
    and the bug-fixing commit, a commit changes the order in which two of them
    are declared, without adding, removing or rewriting a statement. The moved
    block is not the one that contains the fault, so plain `git blame` at the
    BFC parent still reaches the BIC; the measured outcome is recorded in the
    README because blame follows content, not method identity.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - method-order-change-after-bic
  difficulty: easy
  status: active
  tier: control
  category_code: "S3"
repository:
  name: SZZ-0104-method-order-change-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the volume discount table
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-06-28T15:10:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/pricing/DiscountTable.java
    content: |
      package com.example.pricing;

      public class DiscountTable {
          public boolean qualifies(int quantity, int threshold) {
              return quantity >= threshold;
          }

          public int tierFor(int quantity) {
              if (quantity >= 100) {
                  return 3;
              }
              if (quantity >= 50) {
                  return 2;
              }
              return 1;
          }

          public int percentFor(int tier) {
              return tier * 5;
          }
      }
- id: c1
  message: Require the order quantity to pass the threshold before discounting
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-07-01T12:13:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/pricing/DiscountTable.java
    old: |2
              return quantity >= threshold;
    new: |2
              return quantity > threshold;
    labels:
    - B001
    - fault
- id: c2
  message: Declare percentFor next to qualifies so the two lookups sit together
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-07-03T12:01:00Z
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/com/example/pricing/DiscountTable.java
    old: |2
          public int tierFor(int quantity) {
              if (quantity >= 100) {
                  return 3;
              }
              if (quantity >= 50) {
                  return 2;
              }
              return 1;
          }

          public int percentFor(int tier) {
              return tier * 5;
          }
    new: |2
          public int percentFor(int tier) {
              return tier * 5;
          }

          public int tierFor(int quantity) {
              if (quantity >= 100) {
                  return 3;
              }
              if (quantity >= 50) {
                  return 2;
              }
              return 1;
          }
    labels:
    - non_bug_introducing_change
- id: c3
  message: Let an order that exactly meets the threshold qualify again
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-07-11T17:07:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/pricing/DiscountTable.java
    old: |2
              return quantity > threshold;
    new: |2
              return quantity >= threshold;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: An order that exactly meets the threshold gets no discount
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/pricing/DiscountTable.java
    entity:
      type: method
      name: qualifies
      signature: boolean qualifies(int quantity, int threshold)
    statement: return quantity > threshold;
    change_type: line_modification
    description: >
      The comparison excludes the threshold itself, so an order of exactly the
      threshold quantity is refused the discount that the tier table grants it.
  fix:
    commit: c3
    file: src/main/java/com/example/pricing/DiscountTable.java
    entity:
      type: method
      name: qualifies
      signature: boolean qualifies(int quantity, int threshold)
    statement: return quantity >= threshold;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return quantity > threshold;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
