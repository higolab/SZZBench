schema_version: '1.0'
meta:
  id: SZZ-0159
  title: Bug reason only in commit message
  slug: bug-reason-in-message
  description: >-
    The fix's message names "the previous change" as the cause, and that
    reference is correct, because the fault is c1, the commit before it.
    Nothing in the code says which earlier change made the boundary exclusive,
    so a tool that reads only the diff has blame and nothing else, while a tool
    that reads the message gets a second witness that agrees with it.
  category: "Context, message, and non-local evidence"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - context-aware
  - message-evidence
  difficulty: medium
  status: active
  tier: control
  category_code: "S7"
repository:
  name: SZZ-0159-bug-reason-in-message
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial implementation
  author: Hana Sato <hana.sato@example.com>
  date: 2023-10-05T11:37:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0159.java
    content: |
      package example;

      public class Scenario0159 {
          public boolean check(int value, int min, int max) {
              return value >= min;
          }
      }
- id: c1
  message: Require a value above the lower bound
  author: Jonas Berg <jonas.berg@example.com>
  date: 2023-10-09T15:19:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0159.java
    old: |
      package example;

      public class Scenario0159 {
          public boolean check(int value, int min, int max) {
              return value >= min;
          }
      }
    new: |
      package example;

      public class Scenario0159 {
          public boolean check(int value, int min, int max) {
              return value > min;
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Fix exclusive boundary from previous change
  author: Jonas Berg <jonas.berg@example.com>
  date: 2023-10-12T16:24:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0159.java
    old: |
      package example;

      public class Scenario0159 {
          public boolean check(int value, int min, int max) {
              return value > min;
          }
      }
    new: |
      package example;

      public class Scenario0159 {
          public boolean check(int value, int min, int max) {
              return value >= min;
          }
      }
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: Bug reason only in commit message
  bug_fixing_commit: c2
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/example/Scenario0159.java
    entity:
      type: method
      name: check
      signature: boolean check(int value, int min, int max)
    statement: return value > min;
    change_type: line_modification
  fix:
    commit: c2
    file: src/main/java/example/Scenario0159.java
    entity:
      type: method
      name: check
      signature: boolean check(int value, int min, int max)
    statement: return value >= min;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - return value > min;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
