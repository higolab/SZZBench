schema_version: "1.0"

meta:
  id: "SZZ-0085"
  title: "Comment insertion after BIC"
  slug: "comment-insertion-after-bic"
  description: >
    A range check is changed from inclusive to exclusive bounds, which is the
    fault. A later commit inserts an explanatory comment directly above the
    faulty line. The fixing commit repairs only that line and keeps the
    comment, so the inserted line is still there after the fix and a
    line-based tool has no reason to blame the comment commit.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "comment-insertion-after-bic"
    - "blame-reaches-bic"
  difficulty: "easy"
  status: "active"
  category_code: "S3"

repository:
  name: "SZZ-0085-comment-insertion-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add a range check helper"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Scenario0085.java"
        content: |
          package example;

          public class Scenario0085 {
              public boolean check(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Make the range bounds exclusive in check()"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0085.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Comment what check() compares"
    author: "Carol <carol@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "distractor"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0085.java"
        old: |
          package example;

          public class Scenario0085 {
              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        new: |
          package example;

          public class Scenario0085 {
              public boolean check(int value, int min, int max) {
                  // boundary check
                  return value > min && value < max;
              }
          }
        labels: ["non_bug_introducing_change"]

  - id: "c3"
    message: "Include both range bounds in check() again"
    author: "Alice <alice@example.com>"
    date: "2024-01-04T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0085.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Range bounds are excluded from the containment check"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Scenario0085.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Scenario0085.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
        known_distractors: ["c2"]
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          The comment inserted by c2 is the line immediately above the faulty
          line and survives the fix, so plain `git blame` at c3^ on the single
          deleted line returns c1.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
