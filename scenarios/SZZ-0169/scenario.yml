schema_version: '1.0'
meta:
  id: SZZ-0169
  title: Root cause not in changed lines
  slug: root-cause-not-in-changed-lines
  description: >-
    Evaluates a fix that changes a caller-side guard while the root-cause bug was introduced earlier in a callee method that
    the BFC does not edit.
  category: "Context, message, and non-local evidence"
  factors:
  - root-cause
  difficulty: hard
  status: active
  tier: control
  category_code: "S7"
repository:
  name: SZZ-0169-root-cause-not-in-changed-lines
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: 'Add the range check and the access policy'
  author: Priya Raman <priya.raman@example.com>
  date: 2025-05-22T17:49:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;
      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
  - type: write_file
    path: src/main/java/example/AccessPolicy.java
    content: |
      package example;
      public class AccessPolicy {
        private final Range range = new Range();

        public boolean allows(int value, int min, int max) {
          return range.contains(value, min, max);
        }
      }
- id: c1
  message: 'Require values strictly inside the range'
  author: Priya Raman <priya.raman@example.com>
  date: 2025-06-02T09:01:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  message: 'Allow the range bounds in AccessPolicy.allows'
  author: Priya Raman <priya.raman@example.com>
  date: 2025-06-09T11:14:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/AccessPolicy.java
    old: return range.contains(value, min, max);
    new: return range.contains(value, min, max) || value == min || value == max;
bugs:
- id: B001
  title: Boundary bug whose fix changes the caller instead of the root cause
  bug_fixing_commit: c2
  bug_introducing_commits:
  - c1
  fault:
    commit: c1
    file: src/main/java/example/Range.java
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
    statement: return value > min && value < max;
    change_type: line_modification
  fix:
    commit: c2
    file: src/main/java/example/AccessPolicy.java
    entity:
      type: method
      signature: boolean allows(int value, int min, int max)
    statement: return range.contains(value, min, max) || value == min || value == max;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives:
      - c1
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - return value > min && value < max;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
