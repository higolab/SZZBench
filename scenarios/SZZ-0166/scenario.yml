schema_version: '1.0'
meta:
  id: SZZ-0166
  title: Signature-only cleanup between BIC and BFC
  slug: signature-only-cleanup-distractor
  description: >-
    Between the BIC and the BFC, c2 makes `check` static -- it reads no instance state -- and says so in
    its message. Only the signature line changes; the faulty comparison is untouched and still blames c1.
    The commit exists to test whether a message-aware tool attributes the fix to the tidy-up commit that
    sits next to it in the same file.
  category: "Context, message, and non-local evidence"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - message-evidence
  - intermediate-cleanup
  difficulty: medium
  status: active
  tier: control
  category_code: "S7"
repository:
  name: SZZ-0166-context-with-cleanup-distractor
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial implementation
  author: Aiko Mori <aiko.mori@example.com>
  date: 2023-11-01T15:13:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0166.java
    content: |
      package example;

      public class Scenario0166 {
          public boolean check(int attempts, int limit) {
              return attempts < limit;
          }
      }
- id: c1
  message: Include the upper bound in the retry condition
  author: Aiko Mori <aiko.mori@example.com>
  date: 2023-11-08T15:21:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0166.java
    old: |
      package example;

      public class Scenario0166 {
          public boolean check(int attempts, int limit) {
              return attempts < limit;
          }
      }
    new: |
      package example;

      public class Scenario0166 {
          public boolean check(int attempts, int limit) {
              return attempts <= limit;
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Make check static; it reads no instance state
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2023-11-14T12:22:00Z
  role: cleanup
  operations:
  - type: replace
    path: src/main/java/example/Scenario0166.java
    old: |
      package example;

      public class Scenario0166 {
          public boolean check(int attempts, int limit) {
              return attempts <= limit;
          }
      }
    new: |
      package example;

      public class Scenario0166 {
          public static boolean check(int attempts, int limit) {
              return attempts <= limit;
          }
      }
- id: c3
  message: Stop accepting one attempt beyond the configured limit
  author: Aiko Mori <aiko.mori@example.com>
  date: 2023-11-22T18:14:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0166.java
    old: return attempts <= limit;
    new: return attempts < limit;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: Signature-only cleanup between BIC and BFC
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/example/Scenario0166.java
    entity:
      type: method
      name: check
      signature: boolean check(int attempts, int limit)
    statement: return attempts <= limit;
    change_type: line_modification
  fix:
    commit: c3
    file: src/main/java/example/Scenario0166.java
    entity:
      type: method
      name: check
      signature: boolean check(int attempts, int limit)
    statement: return attempts < limit;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return attempts <= limit;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
