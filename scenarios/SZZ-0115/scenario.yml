schema_version: "1.0"

meta:
  id: "SZZ-0115"
  title: "Tangled bug-fixing commit"
  slug: "tangled-bug-fixing-commit"
  description: >
    The bug-fixing commit contains the actual fix and an unrelated helper
    addition. This scenario checks whether unrelated changes in the BFC can
    introduce false positives.
  category: "BFC-side noise and tangled commits"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "tangled-bfc"
  difficulty: "medium"
  status: "active"
  category_code: "S4"

repository:
  name: "SZZ-0115-tangled-bug-fixing-commit"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial range implementation"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2024-09-09T12:06:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/RangeWindow.java"
        content: |
          package example;

          public class RangeWindow {
              public boolean contains(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Introduce strict range check"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2024-09-16T15:48:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/RangeWindow.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Fix range check and add width helper"
    author: "Mei Tanaka <mei.tanaka@example.com>"
    date: "2024-09-25T17:40:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/RangeWindow.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]
      - type: "replace"
        path: "src/main/java/example/RangeWindow.java"
        old: |
          public boolean contains(int value, int min, int max) {
                  return value >= min && value <= max;
              }
        new: |
          public boolean contains(int value, int min, int max) {
                  return value >= min && value <= max;
              }

              public int width(int min, int max) {
                  return max - min;
              }
        labels: ["non_bug_fixing_change"]

bugs:
  - id: "B001"
    title: "Boundary values are excluded in tangled BFC scenario"
    bug_fixing_commit: "c2"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/example/RangeWindow.java"
      entity:
        type: "method"
        name: "contains"
        signature: "boolean contains(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"
    fix:
      commit: "c2"
      file: "src/main/java/example/RangeWindow.java"
      entity:
        type: "method"
        name: "contains"
        signature: "boolean contains(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: "The BFC includes an unrelated helper method addition."

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2"]
