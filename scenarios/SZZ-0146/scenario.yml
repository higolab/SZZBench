  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2024-10-07T11:25:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0146.java
    content: |
      package example;

      public class Scenario0146 {
          public boolean withinLower(int value, int min) {
              return value >= min;
          }

          public boolean otherMethod(int value, int min) {
              return value > min;
          }
      }
