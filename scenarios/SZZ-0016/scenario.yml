  title: Min max swapped
  slug: min-max-swapped
  description: This scenario introduces a bug by changing `return Math.max(left, right);` to `return Math.min(left, right);` and later restores the correct implementation.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - wrong-variable
  difficulty: easy
  status: active
  category_code: "S1"
