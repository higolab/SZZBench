      signature: int score(int amountCents, int accountAgeDays, int failedLogins, int transactionsLastHour, int hourOfDay, boolean newDevice, boolean foreignCountry)
    statement: if (transactionsLastHour > SUSPICIOUS_TRANSACTIONS_PER_HOUR) {
    change_type: line_modification
