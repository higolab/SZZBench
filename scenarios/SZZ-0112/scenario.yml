  id: SZZ-0112
  title: Huge method surrounding small bug
  slug: huge-method-small-bug
  description: >
    A one-token fault sits in the middle of a 73-line method with eighteen
    constants and ten rules. The bug-introducing and the bug-fixing commit
    each change exactly one line of that method, so the scenario tests
    whether a tool stays precise when the surrounding entity is large.
