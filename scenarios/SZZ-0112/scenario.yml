commits:
- id: c0
  message: Add the transaction risk scorer used by the payment gateway
  author: Alice <alice@example.com>
  date: '2024-06-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/risk/TransactionRiskScorer.java
    content: |
      package com.example.risk;

      /**
       * Heuristic risk score for a single card transaction.
       *
       * <p>Every rule that fires adds its penalty to the score; the payment
       * gateway declines a transaction once the score reaches
       * {@link #DECLINE_THRESHOLD}.
       */
      public class TransactionRiskScorer {

          public static final int DECLINE_THRESHOLD = 60;

          private static final int LARGE_AMOUNT_CENTS = 250000;
          private static final int HUGE_AMOUNT_CENTS = 1000000;
          private static final int FRESH_ACCOUNT_DAYS = 7;
          private static final int YOUNG_ACCOUNT_DAYS = 30;
          private static final int TRUSTED_ACCOUNT_DAYS = 365;
          private static final int SUSPICIOUS_TRANSACTIONS_PER_HOUR = 5;
          private static final int SUSPICIOUS_FAILED_LOGINS = 3;
          private static final int NIGHT_STARTS_AT_HOUR = 23;
          private static final int NIGHT_ENDS_AT_HOUR = 5;

          private static final int LARGE_AMOUNT_POINTS = 10;
          private static final int HUGE_AMOUNT_POINTS = 25;
          private static final int FRESH_ACCOUNT_POINTS = 20;
          private static final int YOUNG_ACCOUNT_POINTS = 8;
          private static final int VELOCITY_POINTS = 15;
          private static final int FAILED_LOGIN_POINTS = 12;
          private static final int NEW_DEVICE_POINTS = 9;
          private static final int NIGHT_POINTS = 4;
          private static final int FOREIGN_COUNTRY_POINTS = 7;
          private static final int MAX_SCORE = 100;

          /**
           * Returns the risk score of one transaction, capped at {@link #MAX_SCORE}.
           *
           * @param amountCents         transaction amount in cents
           * @param accountAgeDays      age of the paying account in days
           * @param failedLogins        failed logins of the account in the last day
           * @param transactionsLastHour transactions of the account in the last hour
           * @param hourOfDay           local hour of the transaction, 0-23
           * @param newDevice           true when the device is seen for the first time
           * @param foreignCountry      true when the billing country differs
           */
          public int score(int amountCents,
                           int accountAgeDays,
                           int failedLogins,
                           int transactionsLastHour,
                           int hourOfDay,
                           boolean newDevice,
                           boolean foreignCountry) {
              int points = 0;

              // Amount: two thresholds, the higher one replaces the lower one.
              if (amountCents >= HUGE_AMOUNT_CENTS) {
                  points += HUGE_AMOUNT_POINTS;
              } else if (amountCents >= LARGE_AMOUNT_CENTS) {
                  points += LARGE_AMOUNT_POINTS;
              }

              // Account age: freshly created accounts are the riskiest ones.
              if (accountAgeDays < FRESH_ACCOUNT_DAYS) {
                  points += FRESH_ACCOUNT_POINTS;
              } else if (accountAgeDays < YOUNG_ACCOUNT_DAYS) {
                  points += YOUNG_ACCOUNT_POINTS;
              }

              // A young account paying a large amount is worse than either alone.
              if (accountAgeDays < YOUNG_ACCOUNT_DAYS && amountCents >= LARGE_AMOUNT_CENTS) {
                  points += LARGE_AMOUNT_POINTS;
              }

              // Velocity: many transactions from the same account within an hour.
              if (transactionsLastHour >= SUSPICIOUS_TRANSACTIONS_PER_HOUR) {
                  points += VELOCITY_POINTS;
              }

              // Repeated failed logins point at stolen credentials.
              if (failedLogins >= SUSPICIOUS_FAILED_LOGINS) {
                  points += FAILED_LOGIN_POINTS;
                  if (accountAgeDays < YOUNG_ACCOUNT_DAYS) {
                      points += FAILED_LOGIN_POINTS;
                  }
              }

              // Device and location signals.
              if (newDevice) {
                  points += NEW_DEVICE_POINTS;
                  if (accountAgeDays < FRESH_ACCOUNT_DAYS) {
                      points += NEW_DEVICE_POINTS;
                  }
              }
              if (foreignCountry) {
                  points += FOREIGN_COUNTRY_POINTS;
                  if (newDevice) {
                      points += FOREIGN_COUNTRY_POINTS;
                  }
              }

              // Night-time transactions are rarer and slightly more often disputed.
              if (hourOfDay >= NIGHT_STARTS_AT_HOUR || hourOfDay <= NIGHT_ENDS_AT_HOUR) {
                  points += NIGHT_POINTS;
              }

              // Long-standing accounts on a known device earn a small discount.
              if (accountAgeDays >= TRUSTED_ACCOUNT_DAYS && !newDevice && !foreignCountry) {
                  points -= NIGHT_POINTS;
                  if (points < 0) {
                      points = 0;
                  }
              }

              if (points > MAX_SCORE) {
                  points = MAX_SCORE;
              }
              return points;
          }

          /** Returns true when the gateway declines the transaction. */
          public boolean declines(int amountCents,
                                  int accountAgeDays,
                                  int failedLogins,
                                  int transactionsLastHour,
                                  int hourOfDay,
                                  boolean newDevice,
                                  boolean foreignCountry) {
              return score(amountCents, accountAgeDays, failedLogins, transactionsLastHour,
                      hourOfDay, newDevice, foreignCountry) >= DECLINE_THRESHOLD;
          }
      }
