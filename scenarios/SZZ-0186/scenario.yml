schema_version: "1.0"

meta:
  id: "SZZ-0186"
  title: "Multi-hunk BFC whose hunks blame different commits"
  slug: "mixed-origin-hunks-bfc"
  description: >
    The bug-fixing commit has two hunks in one file. The first replaces the
    page-count formula that the BIC broke; the second hardens the offset
    computation on a line that a later feature commit wrote. Unlike SZZ-0116,
    where both hunks belong to the BIC, only one hunk here leads to the BIC,
    so a tool that takes the union of blamed commits reports one false
    positive.
  category: "BFC-side noise and tangled commits"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "mixed-origin-hunks"
    - "multiple-hunk-bfc"
    - "tangled-bfc"
  difficulty: "medium"
  status: "active"
  category_code: "S4"

repository:
  name: "SZZ-0186-mixed-origin-hunks-bfc"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add paging calculations for list endpoints"
    author: "Diego Alvarez <diego.alvarez@example.com>"
    date: "2025-06-16T10:47:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/com/example/web/PagingCalculator.java"
        content: |
          package com.example.web;

          public class PagingCalculator {
              private final int pageSize;

              public PagingCalculator(int pageSize) {
                  if (pageSize <= 0) {
                      throw new IllegalArgumentException("page size must be positive");
                  }
                  this.pageSize = pageSize;
              }

              public int pageCount(int itemCount) {
                  return (itemCount + pageSize - 1) / pageSize;
              }

              public int offset(int page) {
                  return (page - 1) * pageSize;
              }

              public boolean hasNext(int page, int itemCount) {
                  return page < pageCount(itemCount);
              }
          }

  - id: "c1"
    message: "Simplify the page count formula"
    author: "Jonas Berg <jonas.berg@example.com>"
    date: "2025-06-20T08:26:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/com/example/web/PagingCalculator.java"
        old: |2
                  return (itemCount + pageSize - 1) / pageSize;
        new: |2
                  return itemCount / pageSize + 1;
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Clamp negative page numbers to the first page"
    author: "Jonas Berg <jonas.berg@example.com>"
    date: "2025-06-26T09:27:00Z"
    role: "feature_addition"
    operations:
      - type: "replace"
        path: "src/main/java/com/example/web/PagingCalculator.java"
        old: |2
                  return (page - 1) * pageSize;
        new: |2
                  return Math.max(0, page - 1) * pageSize;
        labels: ["non_bug_introducing_change"]

  - id: "c3"
    message: "Fix the page count for exact multiples and fail fast on offset overflow"
    author: "Jonas Berg <jonas.berg@example.com>"
    date: "2025-07-07T12:22:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/com/example/web/PagingCalculator.java"
        old: |2
                  return itemCount / pageSize + 1;
        new: |2
                  return (itemCount + pageSize - 1) / pageSize;
        labels: ["B001", "fix"]
      - type: "replace"
        path: "src/main/java/com/example/web/PagingCalculator.java"
        old: |2
                  return Math.max(0, page - 1) * pageSize;
        new: |2
                  return Math.multiplyExact(Math.max(0, page - 1), pageSize);
        labels: ["non_bug_introducing_change"]

bugs:
  - id: "B001"
    title: "Page count is one too high when the item count is a multiple of the page size"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/com/example/web/PagingCalculator.java"
      entity:
        type: "method"
        name: "pageCount"
        signature: "int pageCount(int itemCount)"
      statement: "return itemCount / pageSize + 1;"
      change_type: "line_modification"
    fix:
      commit: "c3"
      file: "src/main/java/com/example/web/PagingCalculator.java"
      entity:
        type: "method"
        name: "pageCount"
        signature: "int pageCount(int itemCount)"
      statement: "return (itemCount + pageSize - 1) / pageSize;"
      fix_type: "line_modification"
      description: "The second hunk of the BFC replaces the offset line written by c2 with an overflow-checked variant; it is not part of the fix."
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        known_distractors: ["c2"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return itemCount / pageSize + 1;"
        note: "Blame on the BFC's deleted lines returns c1 (pageCount hunk) and c2 (offset hunk)."

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
