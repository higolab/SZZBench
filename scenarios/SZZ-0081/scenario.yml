schema_version: "1.0"

meta:
  id: "SZZ-0081"
  title: "Formatting after bug introduction"
  slug: "formatting-after-bic"
  description: >
    A boundary-check bug is introduced, then a later formatting-only commit
    rewrites the faulty line before the bug is fixed. This scenario is designed
    to check whether SZZ implementations incorrectly identify the formatting
    commit as the bug-introducing commit.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "formatting-after-bic"
    - "line-number-shift"
    - "basic-blame-distractor"
  difficulty: "medium"
  status: "active"
  category_code: "S3"

repository:
  name: "SZZ-0081-formatting-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial correct implementation"
    author: "Diego Alvarez <diego.alvarez@example.com>"
    date: "2023-05-09T16:34:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Range.java"
        content: |
          package example;

          public class Range {
              public boolean contains(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: 'Exclude the interval bounds from Range.contains'
    author: "Luca Moretti <luca.moretti@example.com>"
    date: "2023-05-15T08:11:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Range.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Reformat Range"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2023-05-19T18:58:00Z"
    role: "formatting"
    operations:
      - type: "replace"
        path: "src/main/java/example/Range.java"
        old: |
          package example;

          public class Range {
              public boolean contains(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        new: |
          package example;

          public class Range
          {
              public boolean contains(
                      int value,
                      int min,
                      int max)
              {
                  return value > min
                          && value < max;
              }
          }
        labels: ["formatting_only", "non_bug_introducing_change"]

  - id: "c3"
    message: "Fix boundary bug"
    author: "Luca Moretti <luca.moretti@example.com>"
    date: "2023-05-29T13:45:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Range.java"
        old: |
          return value > min
                          && value < max;
        new: |
          return value >= min
                          && value <= max;
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Boundary values are excluded"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Range.java"
      entity:
        type: "method"
        name: "contains"
        signature: "boolean contains(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Range.java"
      entity:
        type: "method"
        name: "contains"
        signature: "boolean contains(int value, int min, int max)"
      statement: |
        return value >= min
                        && value <= max;
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        known_distractors: ["c2"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          The original faulty statement is rewritten by the formatting commit.
          Basic line-based blame may point to c2 instead of c1.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
