  title: Logical conjunction error
  slug: logical-conjunction-error
  description: This scenario introduces a bug by changing `return hasName && hasEmail;` to `return hasName || hasEmail;` and later restores the correct implementation.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - logical-operator-error
  difficulty: easy
  status: active
  category_code: "S1"
repository:
  name: SZZ-0012-logical-conjunction-error
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial correct implementation
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-12-09T09:57:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0012.java
    content: |
      package example;

      public class Scenario0012 {
          public boolean isComplete(boolean hasName, boolean hasEmail) {
              return hasName && hasEmail;
          }
      }
- id: c1
  message: 'Treat a profile with a name or an e-mail as complete'
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2024-12-18T13:16:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0012.java
    old: |
      package example;

      public class Scenario0012 {
          public boolean isComplete(boolean hasName, boolean hasEmail) {
              return hasName && hasEmail;
          }
      }
    new: |
      package example;

      public class Scenario0012 {
          public boolean isComplete(boolean hasName, boolean hasEmail) {
              return hasName || hasEmail;
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Fix bug
  author: Tom Becker <tom.becker@example.com>
  date: 2024-12-23T12:29:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0012.java
    old: |
      package example;

      public class Scenario0012 {
          public boolean isComplete(boolean hasName, boolean hasEmail) {
              return hasName || hasEmail;
          }
      }
    new: |
      package example;

      public class Scenario0012 {
          public boolean isComplete(boolean hasName, boolean hasEmail) {
              return hasName && hasEmail;
          }
      }
    labels:
    - B001
    - fix
