    old: |
      package example;

      public class Scenario0039 {
          public String prefix(String value) {
              return value.substring(0, Math.min(3, value.length()));
          }
      }
    new: |
      package example;

      public class Scenario0039 {
          public String prefix(String value) {
              return value.substring(0, 3);
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Fix bug
  author: Alice <alice@example.com>
  date: '2024-01-03T10:00:00Z'
