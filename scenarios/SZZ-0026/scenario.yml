schema_version: '1.0'
meta:
  id: SZZ-0026
  title: Wrong substring end
  slug: wrong-substring-end
  description: This scenario introduces a bug by changing `return value.substring(0, Math.min(3, value.length()));` to `return value.substring(0, 3);` and later restores the correct implementation.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - api-misuse
  difficulty: easy
  status: active
  category_code: "S1"
repository:
  name: SZZ-0026-wrong-substring-end
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial correct implementation
  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0039.java
    content: |
      package example;

      public class Scenario0039 {
          public String prefix(String value) {
              return value.substring(0, Math.min(3, value.length()));
          }
      }
- id: c1
  message: Introduce bug
  author: Bob <bob@example.com>
  date: '2024-01-02T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
