schema_version: '1.0'
meta:
  id: SZZ-0080
  title: Zero-denominator guard deletion introduces a division by zero
  slug: zero-guard-deletion-bic
  description: >-
    The BIC deletes the `denominator == 0` guard, so `divide` throws `ArithmeticException` instead of
    returning 0, and the BFC restores the guard. No exception handler is involved: the removed code is a
    plain early-return branch.
  category: "Omission and deletion bugs"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - line-deletion-bic
  - division-by-zero
  difficulty: medium
  status: active
  tier: control
  category_code: "S2"
