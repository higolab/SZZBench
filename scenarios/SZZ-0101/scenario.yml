schema_version: '1.0'
meta:
  id: SZZ-0101
  title: Throws declaration after BIC
  slug: throws-declaration-after-bic
  description: >
    Between the bug-introducing and the bug-fixing commit, a commit adds a
    `throws` declaration to the signature of a neighbouring method and changes
    nothing else. The faulty line is untouched by that commit, so plain
    `git blame` at the BFC parent reaches the BIC. The scenario is a control
    for tools that over-react to signature-level changes in the same file.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - throws-after-bic
  difficulty: easy
  status: active
  tier: control
  category_code: "S3"
repository:
  name: SZZ-0101-throws-declaration-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add profile resolution to the configuration loader
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-11-22T14:51:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/config/ConfigLoader.java
    content: |
      package com.example.config;

      public class ConfigLoader {
          private final String defaultProfile;

          public ConfigLoader(String defaultProfile) {
              this.defaultProfile = defaultProfile;
          }

          public boolean hasProfile(String requested) {
              return requested != null;
          }

          public String resolveProfile(String requested) {
              if (hasProfile(requested)) {
                  return requested;
              }
              if (defaultProfile == null) {
                  throw new IllegalStateException("no default profile configured");
              }
              return defaultProfile;
          }
      }
- id: c1
  message: Guard resolveProfile against a missing profile name
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-12-02T15:22:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/config/ConfigLoader.java
    old: |2
              return requested != null;
    new: |2
              return requested == null;
    labels:
    - B001
    - fault
- id: c2
  message: Declare the IllegalStateException raised by resolveProfile
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-12-11T18:21:00Z
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/com/example/config/ConfigLoader.java
    old: |2
          public String resolveProfile(String requested) {
    new: |2
          public String resolveProfile(String requested) throws IllegalStateException {
    labels:
    - non_bug_introducing_change
- id: c3
  message: Correct the inverted null check in hasProfile
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-12-13T08:29:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/config/ConfigLoader.java
    old: |2
              return requested == null;
    new: |2
              return requested != null;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: hasProfile reports the opposite of what resolveProfile needs
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/config/ConfigLoader.java
    entity:
      type: method
      name: hasProfile
      signature: boolean hasProfile(String requested)
    statement: return requested == null;
    change_type: line_modification
    description: >
      The null check is inverted, so resolveProfile returns the caller's null
      profile name and falls back to the default profile for every name that
      was actually supplied.
  fix:
    commit: c3
    file: src/main/java/com/example/config/ConfigLoader.java
    entity:
      type: method
      name: hasProfile
      signature: boolean hasProfile(String requested)
    statement: return requested != null;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return requested == null;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
