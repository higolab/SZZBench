schema_version: "1.0"

meta:
  id: "SZZ-0005"
  title: "Java annotation syntax change"
  slug: "java-annotation-syntax-change"
  description: >
    A bug is introduced by modifying a Java annotation argument. The fixing
    commit restores the correct annotation value. This represents a
    language-specific syntax change rather than a conventional statement body
    change.
  category: "Basic semantic line changes"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "language-specific-syntax-change"
    - "annotation-change"
  difficulty: "medium"
  status: "active"
  category_code: "S1"

repository:
  name: "SZZ-0005-java-annotation-syntax-change"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial required field annotation"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2023-10-16T16:36:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/UserRequest.java"
        content: |
          package example;

          public class UserRequest {
              @Required(true)
              private String userId;
          }

  - id: "c1"
    message: "Make user id annotation optional"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2023-10-19T11:36:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/UserRequest.java"
        old: "@Required(true)"
        new: "@Required(false)"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Require user id annotation"
    author: "Jonas Berg <jonas.berg@example.com>"
    date: "2023-10-23T11:29:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/UserRequest.java"
        old: "@Required(false)"
        new: "@Required(true)"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "User ID is no longer required"
    bug_fixing_commit: "c2"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/example/UserRequest.java"
      entity:
        type: "field"
        name: "userId"
        signature: "String userId"
      statement: "@Required(false)"
      change_type: "line_modification"
    fix:
      commit: "c2"
      file: "src/main/java/example/UserRequest.java"
      entity:
        type: "field"
        name: "userId"
        signature: "String userId"
      statement: "@Required(true)"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "@Required(false)"

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2"]
