schema_version: "1.0"

meta:
  id: "SZZ-0007"
  title: "Bounds check omission bug"
  slug: "bounds-check-omission-bug"
  description: >
    A method is introduced without a necessary bounds check. The fixing commit
    adds the missing guard. This scenario represents an omission bug.
  category: "omission"
  factors:
    - "single-bic"
    - "single-bfc"
    - "omission-bug"
    - "line-addition-fix"
    - "bounds-check"
  difficulty: "medium"
  status: "active"

repository:
  name: "SZZ-0007-bounds-check-omission-bug"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial item reader"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/ItemReader.java"
        content: |
          package example;

          public class ItemReader {
          }

  - id: "c1"
    message: "Add item reader without bounds check"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/ItemReader.java"
        old: |
          public class ItemReader {
          }
        new: |
          public class ItemReader {
              public String itemAt(String[] items, int index) {
                  return items[index];
              }
          }
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Add bounds check to item reader"
    author: "Alice <alice@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/ItemReader.java"
        old: |
          public String itemAt(String[] items, int index) {
                  return items[index];
              }
        new: |
          public String itemAt(String[] items, int index) {
                  if (index < 0 || index >= items.length) {
                      return "";
                  }
                  return items[index];
              }
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Item reader lacks bounds check"
    bug_fixing_commit: "c2"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/example/ItemReader.java"
      entity:
        type: "method"
        name: "itemAt"
        signature: "String itemAt(String[] items, int index)"
      change_type: "omission"
      missing_statement: |
        if (index < 0 || index >= items.length) {
            return "";
        }
    fix:
      commit: "c2"
      file: "src/main/java/example/ItemReader.java"
      entity:
        type: "method"
        name: "itemAt"
        signature: "String itemAt(String[] items, int index)"
      added_statement: |2
                if (index < 0 || index >= items.length) {
                    return "";
                }
      fix_type: "line_addition"
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
      line_level:
        available: false
        reason: "The fault is an omitted bounds check, so no faulty deleted line exists."

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2"]
