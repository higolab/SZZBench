schema_version: "1.0"

meta:
  id: "SZZ-0086"
  title: "Logging insertion after BIC"
  slug: "logging-insertion-after-bic"
  description: >
    A range check is changed from inclusive to exclusive bounds, which is the
    fault. A later commit adds a diagnostic `System.out.println` directly
    above the faulty line. The fixing commit repairs only that line and keeps
    the logging statement, so the added line is still there after the fix and
    a line-based tool has no reason to blame the logging commit. The logging
    output is a deliberate part of the post-fix contract: `check` returns the
    same value as in c0 for every input, but it also prints one line per call.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "logging-insertion-after-bic"
    - "blame-reaches-bic"
  difficulty: "easy"
  status: "active"
  category_code: "S3"

repository:
  name: "SZZ-0086-logging-insertion-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add a range check helper"
    author: "Luca Moretti <luca.moretti@example.com>"
    date: "2024-12-26T14:46:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Scenario0086.java"
        content: |
          package example;

          public class Scenario0086 {
              public boolean check(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Make the range bounds exclusive in check()"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2024-12-31T12:48:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0086.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Print the compared range while tracing filter complaints"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2025-01-06T15:24:00Z"
    role: "distractor"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0086.java"
        old: |
          package example;

          public class Scenario0086 {
              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        new: |
          package example;

          public class Scenario0086 {
              public boolean check(int value, int min, int max) {
                  System.out.println("check " + value + " in [" + min + ", " + max + "]");
                  return value > min && value < max;
              }
          }
        labels: ["non_bug_introducing_change"]

  - id: "c3"
    message: "Include both range bounds in check() again"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2025-01-13T14:47:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0086.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Range bounds are excluded from the containment check"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Scenario0086.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Scenario0086.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
        known_distractors: ["c2"]
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          The logging statement added by c2 is the line immediately above the
          faulty line and survives the fix, so plain `git blame` at c3^ on the
          single deleted line returns c1.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
