schema_version: '1.0'
meta:
  id: SZZ-0172
  title: Config and code interaction
  slug: config-code
  description: >-
    Evaluates a bug introduced by a configuration unit change that is only visible when read together with the code that interprets
    the setting.
  category: "Non-source, configuration, test-only, and file-level edge cases"
  factors:
  - config
  - code_interaction
  - context
  - faults
  difficulty: hard
  status: active
  category_code: "S8"
repository:
  name: SZZ-0172-config-code
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: 'c0: create retry delay config and interpreter'
  author: Luca Moretti <luca.moretti@example.com>
  date: 2023-07-17T16:16:00Z
  role: initial
  operations:
  - type: write_file
    path: config/retry.properties
    content: |
      retry.delay.unit=seconds
      retry.delay.value=2
  - type: write_file
    path: src/main/java/example/RetryPolicy.java
    content: |
      package example;

      public class RetryPolicy {
        private final String unit;
        private final int configuredDelay;

        public RetryPolicy(String unit, int configuredDelay) {
          this.unit = unit;
          this.configuredDelay = configuredDelay;
        }

        public int delayMillis() {
          return configuredDelay * 1000;
        }
      }
- id: c1
  message: 'c1: tune retry delay config to milliseconds'
  author: Hana Sato <hana.sato@example.com>
  date: 2023-07-24T18:01:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: config/retry.properties
    old: retry.delay.unit=seconds
    new: retry.delay.unit=milliseconds
- id: c2
  message: 'c2: document retry delay configuration'
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2023-08-02T08:16:00Z
  role: distractor
  operations:
  - type: write_file
    path: docs/retry-delay.md
    content: 'Retry delay is configured by retry.delay.value and retry.delay.unit.

'
- id: c3
  message: 'c3: honor millisecond retry delay config'
  author: Diego Alvarez <diego.alvarez@example.com>
  date: 2023-08-03T15:18:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return configuredDelay * 1000;
    new: 'return unit.equals("milliseconds") ? configuredDelay : configuredDelay * 1000;'
bugs:
- id: B001
  title: Millisecond retry config is interpreted as seconds
  bug_fixing_commit: c3
  bug_introducing_commits:
  - c1
  fault:
    commit: c1
    file: config/retry.properties
    statement: retry.delay.unit=milliseconds
    change_type: config_modification
  fix:
    commit: c3
    file: src/main/java/example/RetryPolicy.java
    statement: 'return unit.equals("milliseconds") ? configuredDelay : configuredDelay * 1000;'
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives:
      - c1
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - retry.delay.unit=milliseconds
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
