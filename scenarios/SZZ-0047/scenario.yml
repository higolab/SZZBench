schema_version: "1.0"

meta:
  id: "SZZ-0047"
  title: "Simple omission bug"
  slug: "simple-omission-bug"
  description: >
    A method is introduced without a necessary null check. The bug is later
    fixed by adding the missing null check. This scenario represents an
    omission bug, where there is no faulty deleted line corresponding to the
    missing statement.
  category: "Omission and deletion bugs"
  factors:
    - "single-bic"
    - "single-bfc"
    - "omission-bug"
    - "line-addition-fix"
  difficulty: "medium"
  status: "active"
  category_code: "S2"

repository:
  name: "SZZ-0047-simple-omission-bug"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial utility class"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Normalizer.java"
        content: |2
          package example;

          public class Normalizer {
          }

  - id: "c1"
    message: "Add normalize method without null handling"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Normalizer.java"
        old: |2
          public class Normalizer {
          }
        new: |2
          public class Normalizer {
              public String normalize(String s) {
                  return s.trim();
              }
          }
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Add null handling to normalize"
    author: "Alice <alice@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Normalizer.java"
        old: |2
              public String normalize(String s) {
                  return s.trim();
              }
        new: |2
              public String normalize(String s) {
                  if (s == null) {
                      return "";
                  }
                  return s.trim();
              }
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Missing null check in normalize"
    bug_fixing_commit: "c2"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Normalizer.java"
      entity:
        type: "method"
        name: "normalize"
        signature: "String normalize(String s)"
      change_type: "omission"
      missing_statement: |2
        if (s == null) {
            return "";
        }

    fix:
      commit: "c2"
      file: "src/main/java/example/Normalizer.java"
      entity:
        type: "method"
        name: "normalize"
        signature: "String normalize(String s)"
      added_statement: |2
                if (s == null) {
                    return "";
                }
      fix_type: "line_addition"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
      line_level:
        available: false
        reason: "The fault is an omitted statement, so no faulty deleted line exists."

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2"]
