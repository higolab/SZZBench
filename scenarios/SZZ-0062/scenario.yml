- id: c2
  message: Add missing default case
  author: Alice <alice@example.com>
  date: '2024-02-03T10:00:00Z'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0062.java
    old: "package example;\n\npublic class Scenario0062 {\n    public String label(int code) {\n        return code == 1 ? \"one\" : \"two\";\n    }\n}\n"
    new: "package example;\n\npublic class Scenario0062 {\n    public String label(int code) {\n        if (code != 1 && code != 2) {\n                return \"unknown\";\n            }\n            return code == 1 ? \"one\" : \"two\";\n    }\n}\n"
    labels:
    - B001
    - fix
