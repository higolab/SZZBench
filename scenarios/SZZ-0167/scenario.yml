schema_version: '1.0'
meta:
  id: SZZ-0167
  title: Patch context required
  slug: patch-context
  description: Evaluates a boundary fix where the caller method provides the context needed to interpret the patched line.
  category: "Context, message, and non-local evidence"
  factors:
  - context
  difficulty: hard
  status: active
  category_code: "S7"
repository:
  name: SZZ-0167-patch-context
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c1
  message: >-
    c1: create initial buggy callee/caller context (write_file src/main/java/example/Range.java; write_file src/main/java/example/Caller.java)
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;
      public class Range {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }
      }
  - type: write_file
    path: src/main/java/example/Caller.java
    content: |
      package example;

      public class Caller {
        private final Range range = new Range();

        public boolean callRange(int value) {
          return range.contains(value, 0, 10);
        }
      }
- id: c2
  message: 'c2: fix bug (replace src/main/java/example/Range.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
