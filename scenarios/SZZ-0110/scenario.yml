schema_version: '1.0'
meta:
  id: SZZ-0110
  title: Large noisy intermediate history
  slug: large-noisy-intermediate
  description: >
    Between the bug-introducing and the bug-fixing commit, a commit adds four
    column-layout helpers, 27 lines in total, to the same file. The bug-fixing
    commit replaces only the faulty line and leaves all of them in place, so
    the volume of intermediate change is what has to be ignored rather than
    something the fix happens to delete.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - robustness
  - large-noisy-intermediate
  difficulty: easy
  status: active
  category_code: "S3"
repository:
  name: SZZ-0110-large-noisy-intermediate
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the label formatter used by the report writer
  author: Tom Becker <tom.becker@example.com>
  date: 2023-07-24T14:26:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/text/LabelFormatter.java
    content: |
      package com.example.text;

      public class LabelFormatter {
          public boolean hasLabel(String value) {
              return value != null;
          }

          public String format(String value) {
              if (hasLabel(value)) {
                  return value.trim();
              }
              return "";
          }
      }
- id: c1
  message: Fold the empty-label case into hasLabel
  author: Tom Becker <tom.becker@example.com>
  date: 2023-07-31T09:54:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/text/LabelFormatter.java
    old: |2
              return value != null;
    new: |2
              return value == null;
    labels:
    - B001
    - fault
- id: c2
  message: Add padding, truncation and rule helpers for the label column
  author: Luca Moretti <luca.moretti@example.com>
  date: 2023-08-07T09:13:00Z
  role: feature_addition
  operations:
  - type: replace
    path: src/main/java/com/example/text/LabelFormatter.java
    old: |2
              return "";
          }
      }
    new: |2
              return "";
          }

          public String padRight(String text, int width) {
              StringBuilder padded = new StringBuilder(text);
              while (padded.length() < width) {
                  padded.append(' ');
              }
              return padded.toString();
          }

          public String truncate(String text, int width) {
              if (width < 0 || text.length() <= width) {
                  return text;
              }
              return text.substring(0, width);
          }

          public String column(String text, int width) {
              return padRight(truncate(text, width), width);
          }

          public String rule(int width) {
              StringBuilder line = new StringBuilder();
              for (int i = 0; i < width; i++) {
                  line.append('-');
              }
              return line.toString();
          }
      }
    labels:
    - non_bug_introducing_change
- id: c3
  message: Format the labels that are actually present again
  author: Luca Moretti <luca.moretti@example.com>
  date: 2023-08-16T10:11:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/text/LabelFormatter.java
    old: |2
              return value == null;
    new: |2
              return value != null;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: format() blanks every present label and throws on a missing one
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/text/LabelFormatter.java
    entity:
      type: method
      name: hasLabel
      signature: boolean hasLabel(String value)
    statement: return value == null;
    change_type: line_modification
    description: >
      The null check is inverted, so format() returns the empty string for
      every label that was supplied and dereferences null for a missing one.
  fix:
    commit: c3
    file: src/main/java/com/example/text/LabelFormatter.java
    entity:
      type: method
      name: hasLabel
      signature: boolean hasLabel(String value)
    statement: return value != null;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return value == null;
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
