schema_version: '1.0'
meta:
  id: SZZ-0116
  title: Multiple-hunk bug-fixing commit
  slug: multiple-hunk-bfc
  description: >
    The bug-introducing commit changes the progress counter convention in two
    places, and the bug-fixing commit restores both of them. The BFC diff has
    two hunks in one file, and both of them blame the same commit, which makes
    this the same-origin control for SZZ-0186 (mixed-origin hunks).
  category: "BFC-side noise and tangled commits"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - multiple-hunk-bfc
  - same-origin-hunks
  difficulty: medium
  status: active
  category_code: "S4"
repository:
  name: SZZ-0116-multiple-hunk-bfc
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add counter helpers for the progress widget
  author: Tom Becker <tom.becker@example.com>
  date: 2024-09-30T12:40:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0116.java
    content: |
      package example;

      public class Scenario0116 {
          public boolean isNonNegative(int value) {
              return value >= 0;
          }

          public int clampToZero(int value) {
              if (value < 0) {
                  return 0;
              }
              return value;
          }

          public int next(int value) {
              return value + 1;
          }
      }
- id: c1
  message: Start the progress counter at one and advance it in double steps
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-10-01T15:46:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0116.java
    old: |2
              return value >= 0;
    new: |2
              return value > 0;
    labels:
    - B001
    - fault
  - type: replace
    path: src/main/java/example/Scenario0116.java
    old: |2
              return value + 1;
    new: |2
              return value + 2;
    labels:
    - B002
    - fault
- id: c2
  message: Count progress from zero again and advance one step at a time
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-10-07T09:59:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0116.java
    old: |2
              return value > 0;
    new: |2
              return value >= 0;
    labels:
    - B001
    - fix
  - type: replace
    path: src/main/java/example/Scenario0116.java
    old: |2
              return value + 2;
    new: |2
              return value + 1;
    labels:
    - B002
    - fix
bugs:
- id: B001
  title: Zero is rejected as a counter value
  bug_fixing_commit: c2
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/example/Scenario0116.java
    entity:
      type: method
      name: isNonNegative
      signature: boolean isNonNegative(int value)
    statement: return value > 0;
    change_type: line_modification
  fix:
    commit: c2
    file: src/main/java/example/Scenario0116.java
    entity:
      type: method
      name: isNonNegative
      signature: boolean isNonNegative(int value)
    statement: return value >= 0;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - return value > 0;
      note: >
        First hunk of the two-hunk BFC. Blame at c2^ returns c1 for this line.
- id: B002
  title: The counter advances by two instead of one
  bug_fixing_commit: c2
  bug_introducing_commits: &id002
  - c1
  fault:
    commit: c1
    file: src/main/java/example/Scenario0116.java
    entity:
      type: method
      name: next
      signature: int next(int value)
    statement: return value + 2;
    change_type: line_modification
  fix:
    commit: c2
    file: src/main/java/example/Scenario0116.java
    entity:
      type: method
      name: next
      signature: int next(int value)
    statement: return value + 1;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id002
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - return value + 2;
      note: >
        Second hunk of the two-hunk BFC. Blame at c2^ returns c1 for this line
        as well, so the union over both hunks is exactly the required BIC set.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
