  title: Range minimum and maximum changed separately
  slug: range-min-max-changed-separately
  description: This scenario requires treating two bug-introducing commits as contributing to the same later fix.
  category: "Multiple BICs, duplicate faults, and composite faults"
  factors:
  - multi-bic
  - single-bfc
  - line-modification
  difficulty: medium
  status: active
  category_code: "S6"
repository:
  name: SZZ-0136-range-min-max-changed-separately
  default_branch: main
