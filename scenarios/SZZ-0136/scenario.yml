  source_root: src/main/java
commits:
- id: c0
  message: Initial implementation
  author: Alice <alice@example.com>
  date: '2024-03-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0130.java
    content: |
      package example;

      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return true;
          }
      }
- id: c1
  message: Introduce first contributing change
  author: Bob <bob@example.com>
  date: '2024-03-02T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0130.java
    old: |
      package example;

      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return true;
          }
      }
    new: |
