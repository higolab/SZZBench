      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return value > min;
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Introduce second contributing change
  author: Carol <carol@example.com>
  date: '2024-03-03T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0130.java
    old: |
      package example;

      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return value > min;
          }
      }
    new: |
      package example;

      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return value > min && value < max;
          }
      }
    labels:
    - B001
    - fault
- id: c3
  message: Fix combined bug
  author: Alice <alice@example.com>
  date: '2024-03-04T10:00:00Z'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0130.java
    old: |
      package example;

      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return value > min && value < max;
          }
      }
    new: |
      package example;

      public class Scenario0130 {
          public boolean contains(int value, int min, int max) {
              return value >= min && value <= max;
          }
      }
    labels:
    - B001
    - fix
