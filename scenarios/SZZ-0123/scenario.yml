schema_version: '1.0'
meta:
  id: SZZ-0123
  title: BFC with two faulty expressions fixed
  slug: bfc-fixes-two-expressions
  description: >
    The bug-introducing commit turns both bounds of an inclusive range check
    into strict comparisons, and the bug-fixing commit repairs both faulty
    expressions in the same line. The BFC therefore has a single hunk of one
    deleted and one added line, but two faulty expressions.
  category: "BFC-side noise and tangled commits"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - single-line-bfc
  - two-faulty-expressions
  - statement-granularity
  difficulty: medium
  status: active
  category_code: "S4"
repository:
  name: SZZ-0123-bfc-fixes-two-expressions
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add an inclusive range check helper
  author: Hana Sato <hana.sato@example.com>
  date: 2024-01-08T13:07:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0123.java
    content: |
      package example;

      public class Scenario0123 {
          public boolean contains(int value, int min, int max) {
              return value >= min && value <= max;
          }
      }
- id: c1
  message: Treat the range bounds of contains() as exclusive
  author: Tom Becker <tom.becker@example.com>
  date: 2024-01-11T12:06:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0123.java
    old: |
      package example;

      public class Scenario0123 {
          public boolean contains(int value, int min, int max) {
              return value >= min && value <= max;
          }
      }
    new: |
      package example;

      public class Scenario0123 {
          public boolean contains(int value, int min, int max) {
              return value > min && value < max;
          }
      }
    labels:
    - B001
    - fault
- id: c2
  message: Make contains() inclusive again; both bounds were off by one
  author: Tom Becker <tom.becker@example.com>
  date: 2024-01-15T11:46:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0123.java
    old: |
      package example;

      public class Scenario0123 {
          public boolean contains(int value, int min, int max) {
              return value > min && value < max;
          }
      }
    new: |
      package example;

      public class Scenario0123 {
          public boolean contains(int value, int min, int max) {
              return value >= min && value <= max;
          }
      }
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: BFC with two faulty expressions fixed
  bug_fixing_commit: c2
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/example/Scenario0123.java
    entity:
      type: method
      name: contains
      signature: boolean contains(int value, int min, int max)
    statement: return value > min && value < max;
    change_type: line_modification
  fix:
    commit: c2
    file: src/main/java/example/Scenario0123.java
    entity:
      type: method
      name: contains
      signature: boolean contains(int value, int min, int max)
    statement: return value >= min && value <= max;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
    line_level:
      available: true
      faulty_statements:
      - return value > min && value < max;
      note: >
        One deleted line carries two faulty expressions, `value > min` and
        `value < max`. A line-level oracle sees one line; an
        expression-level tool has to report both comparisons.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
