schema_version: '1.0'
meta:
  id: SZZ-0170
  title: BIC is a test-only commit
  slug: bic-test-only-commit
  description: Evaluates a bug where the bug-introducing commit changes only a test oracle, not production code.
  category: "Non-source, configuration, test-only, and file-level edge cases"
  factors:
  - test_only_bic
  - expected_szz
  difficulty: hard
  status: active
  category_code: "S8"
repository:
  name: SZZ-0170-bic-test-only-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: 'c0: create correct Range code and boundary test'
  author: Luca Moretti <luca.moretti@example.com>
  date: 2023-06-05T12:36:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;
      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
  - type: write_file
    path: src/test/java/example/RangeTest.java
    content: |
      package example;
      public class RangeTest {
        public void includesLowerBoundary() {
          Range range = new Range();
          assertTrue(range.contains(0, 0, 10));
        }

        private void assertTrue(boolean value) {
          if (!value) {
            throw new AssertionError();
          }
        }

        private void assertFalse(boolean value) {
          if (value) {
            throw new AssertionError();
          }
        }
      }
- id: c1
  message: 'c1: introduce faulty boundary expectation in test only'
  author: Tom Becker <tom.becker@example.com>
  date: 2023-06-13T12:33:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/test/java/example/RangeTest.java
    old: assertTrue(range.contains(0, 0, 10));
    new: assertFalse(range.contains(0, 0, 10));
- id: c2
  message: 'c2: fix test oracle for inclusive lower boundary'
  author: Aiko Mori <aiko.mori@example.com>
  date: 2023-06-19T17:09:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/test/java/example/RangeTest.java
    old: assertFalse(range.contains(0, 0, 10));
    new: assertTrue(range.contains(0, 0, 10));
