  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0040.java
    content: |
      package example;

      public class Scenario0040 {
          public boolean hasItems(int size) {
              return size > 0;
          }
      }
