  title: Wrong collection size check
  slug: wrong-collection-size-check
  description: This scenario introduces a bug by changing `return size > 0;` to `return size >= 0;` and later restores the correct implementation.
  category: basic
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - comparison-error
  difficulty: easy
  status: active
