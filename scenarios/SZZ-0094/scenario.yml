- id: c3
  message: Compare the on-hand count against the low stock threshold, not the other way round
  author: Dave <dave@example.com>
  date: '2024-01-04T10:00:00Z'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/catalog/StockLevel.java
    old: |2
              return LOW_STOCK_THRESHOLD < onHand;
    new: |2
              return onHand < LOW_STOCK_THRESHOLD;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: The low stock check is inverted, so only well-stocked items are restocked
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/catalog/StockLevel.java
    entity:
      type: method
      name: needsRestock
      signature: boolean needsRestock(int onHand)
    statement: return LOW_STOCK_THRESHOLD < onHand;
    change_type: line_modification
    description: >
      Extracting the literal 5 into LOW_STOCK_THRESHOLD swapped the operands, so
      needsRestock reports true for every item with more than five units on hand
      and false for the items that actually have to be reordered.
  fix:
    commit: c3
    file: src/main/java/com/example/catalog/StockLevel.java
    entity:
      type: method
      name: needsRestock
      signature: boolean needsRestock(int onHand)
    statement: return onHand < LOW_STOCK_THRESHOLD;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return LOW_STOCK_THRESHOLD < onHand;
      note: >
        c2 only inserts an annotation line above the deprecated alias; the faulty
        line is untouched, so blame at c3^ returns c1.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
