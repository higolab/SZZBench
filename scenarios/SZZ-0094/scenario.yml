    path: src/main/java/com/example/catalog/StockLevel.java
    content: |
      package com.example.catalog;

      public class StockLevel {
          public boolean lowStock(int onHand) {
              return needsRestock(onHand);
          }

          public boolean needsRestock(int onHand) {
              return onHand < 5;
          }
      }
