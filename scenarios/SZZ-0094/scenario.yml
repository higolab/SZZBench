schema_version: '1.0'
meta:
  id: SZZ-0094
  title: Annotation addition after BIC
  slug: annotation-addition-after-bic
  description: >
    The BIC extracts the low-stock threshold into a constant and swaps the
    operands of the comparison while doing so, inverting the check. An
    intermediate commit adds a single @Deprecated annotation to the legacy alias
    four lines above the fault and changes nothing else. The bug-fixing commit
    repairs only the comparison, so plain blame at the BFC parent still reaches
    the BIC: this is an honest control for the annotation-noise family.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - annotation-after-bic
  - plain-blame-control
  difficulty: easy
  status: active
  category_code: "S3"
repository:
  name: SZZ-0094-annotation-addition-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
