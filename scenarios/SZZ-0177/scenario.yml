bugs:
  - id: "B001"
    title: "Negative transfer amounts move money in the reverse direction"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/com/example/banking/TransferService.java"
      entity:
        type: "method"
        name: "transfer"
        signature: "void transfer(Account from, Account to, long amountCents)"
      change_type: "omission"
      missing_statement: |2
        if (amountCents <= 0) {
            throw new IllegalArgumentException("transfer amount must be positive");
        }
      description: "The guard existed in c0 and was deleted by c1 without any other change; its absence is the fault."
    fix:
      commit: "c3"
      file: "src/main/java/com/example/banking/TransferService.java"
      entity:
        type: "method"
        name: "transfer"
        signature: "void transfer(Account from, Account to, long amountCents)"
      added_statement: |2
                if (amountCents <= 0) {
                    throw new IllegalArgumentException("transfer amount must be positive");
                }
      fix_type: "line_addition"
    expected_szz:
