  name: "SZZ-0177-deletion-only-bic-addition-only-bfc"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add account transfers with balance and limit checks"
    author: "Hana Sato <hana.sato@example.com>"
    date: "2023-05-08T14:19:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/com/example/banking/Account.java"
        content: |
          package com.example.banking;

          public class Account {
              private final String id;
              private long balanceCents;

              public Account(String id, long balanceCents) {
                  this.id = id;
                  this.balanceCents = balanceCents;
              }

              public String getId() {
                  return id;
              }

              public long getBalanceCents() {
                  return balanceCents;
              }

              void deposit(long amountCents) {
                  balanceCents += amountCents;
              }

              void withdraw(long amountCents) {
                  balanceCents -= amountCents;
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/banking/TransferService.java"
        content: |
          package com.example.banking;

          public class TransferService {
              private final long dailyLimitCents;

              public TransferService(long dailyLimitCents) {
                  this.dailyLimitCents = dailyLimitCents;
              }

              public void transfer(Account from, Account to, long amountCents) {
                  if (amountCents <= 0) {
                      throw new IllegalArgumentException("transfer amount must be positive");
                  }
                  if (amountCents > dailyLimitCents) {
                      throw new IllegalArgumentException("transfer exceeds the daily limit");
                  }
                  if (from.getBalanceCents() < amountCents) {
                      throw new IllegalStateException("insufficient funds in " + from.getId());
                  }
                  from.withdraw(amountCents);
                  to.deposit(amountCents);
              }
          }

