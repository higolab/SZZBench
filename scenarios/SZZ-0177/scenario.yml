schema_version: "1.0"

meta:
  id: "SZZ-0177"
  title: "Deletion-only BIC removes a guard that an addition-only BFC restores"
  slug: "deletion-only-bic-addition-only-bfc"
  description: >
    The bug-introducing commit deletes a three-line guard and touches nothing
    else (deletion-only diff, no re-indentation). The bug-fixing commit
    re-inserts the guard and touches nothing else (addition-only diff). The
    BFC therefore deletes no line, and the BIC added no line, so neither
    deleted-line blame nor added-line heuristics reach the BIC directly.
  category: "Omission and deletion bugs"
  factors:
    - "single-bic"
    - "single-bfc"
    - "deletion-only-bic"
    - "addition-only-fix"
    - "guard-removal"
  difficulty: "hard"
  status: "active"
  tier: "control"
  category_code: "S2"

