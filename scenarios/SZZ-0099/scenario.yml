bugs:
- id: B001
  title: The rate limiter grants one request more than the configured limit
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/limits/RateLimiter.java
    entity:
      type: method
      name: hasCapacity
      signature: boolean hasCapacity()
    statement: return used <= limit;
    change_type: line_modification
    description: >
      hasCapacity is asked before a request is counted, so the used count must be
      strictly below the limit; with the inclusive comparison a limit of n admits
      n + 1 requests.
  fix:
    commit: c3
    file: src/main/java/com/example/limits/RateLimiter.java
    entity:
      type: method
      name: hasCapacity
      signature: boolean hasCapacity()
    statement: return used < limit;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return used <= limit;
      note: >
        c2 adds the synchronized modifier to the two method signatures, including
        the line directly above the fault; the faulty line itself is untouched,
        so blame at c3^ returns c1.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
