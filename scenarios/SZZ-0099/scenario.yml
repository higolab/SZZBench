- id: c3
  message: Stop granting one request beyond the configured limit
  author: Tom Becker <tom.becker@example.com>
  date: 2025-01-06T11:51:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/limits/RateLimiter.java
    old: |2
              return used <= limit;
    new: |2
