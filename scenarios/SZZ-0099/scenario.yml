schema_version: '1.0'
meta:
  id: SZZ-0099
  title: Synchronized modifier after BIC
  slug: synchronized-after-bic
  description: >
    The BIC makes the rate limiter's capacity check inclusive, so one request too
    many is let through. An intermediate commit adds the synchronized modifier to
    the two methods of the class and changes nothing else; it touches the
    signature line directly above the fault but not the faulty statement. The
    bug-fixing commit repairs only the comparison, so plain blame at the BFC
    parent still reaches the BIC: this is an honest control for the
    modifier-noise family.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - synchronized-after-bic
  - plain-blame-control
  difficulty: easy
  status: active
  tier: control
  category_code: "S3"
repository:
  name: SZZ-0099-synchronized-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the request rate limiter for the public API
  author: Priya Raman <priya.raman@example.com>
  date: 2024-12-16T09:37:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/limits/RateLimiter.java
    content: |
      package com.example.limits;

      public class RateLimiter {
          private final int limit;
          private int used;

          public RateLimiter(int limit) {
              this.limit = limit;
          }

          public boolean hasCapacity() {
              return used < limit;
          }

          public void acquire() {
              used++;
          }

          public int used() {
              return used;
          }
      }
- id: c1
  message: Let a request through while the used count has not passed the limit
  author: Tom Becker <tom.becker@example.com>
  date: 2024-12-24T14:56:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/limits/RateLimiter.java
    old: |2
              return used < limit;
    new: |2
              return used <= limit;
    labels:
    - B001
    - fault
