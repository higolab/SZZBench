schema_version: '1.0'
meta:
  id: SZZ-0096
  title: Lambda rewrite after BIC
  slug: lambda-rewrite-after-bic
  description: >
    The BIC excludes the minimum age itself from the adult-member count. An
    intermediate refactoring replaces the counting loop with a stream and moves
    the faulty predicate into a lambda. The bug-fixing commit repairs the
    predicate inside the lambda, so plain blame at the BFC parent stops at the
    refactoring and never reaches the BIC.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - lambda-rewrite-after-bic
  - basic-blame-distractor
  difficulty: hard
  status: active
  tier: control
  category_code: "S3"
repository:
  name: SZZ-0096-lambda-rewrite-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add membership statistics for the yearly report
  author: Priya Raman <priya.raman@example.com>
  date: 2024-11-12T14:07:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/membership/MembershipStats.java
    content: |
      package com.example.membership;

      public class MembershipStats {
          private static final int MIN_AGE = 18;

          public int adultCount(int[] ages) {
              int count = 0;
              for (int age : ages) {
                  if (age >= MIN_AGE) {
                      count++;
                  }
              }
              return count;
          }
      }
- id: c1
  message: Count members who are older than the minimum age
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2024-11-18T17:52:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/membership/MembershipStats.java
    old: |2
                  if (age >= MIN_AGE) {
    new: |2
                  if (age > MIN_AGE) {
    labels:
    - B001
    - fault
- id: c2
  message: Count adult members with a stream instead of a loop
  author: Aiko Mori <aiko.mori@example.com>
  date: 2024-11-20T08:22:00Z
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/com/example/membership/MembershipStats.java
    old: |2
      package com.example.membership;

    new: |2
      package com.example.membership;

      import java.util.stream.IntStream;

  - type: replace
    path: src/main/java/com/example/membership/MembershipStats.java
    old: |2
              int count = 0;
              for (int age : ages) {
                  if (age > MIN_AGE) {
                      count++;
                  }
              }
              return count;
    new: |2
              return (int) IntStream.of(ages).filter(age -> age > MIN_AGE).count();
    labels:
    - non_bug_introducing_change
- id: c3
  message: Count members who have just reached the minimum age as adults
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-11-27T11:47:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/membership/MembershipStats.java
    old: |2
              return (int) IntStream.of(ages).filter(age -> age > MIN_AGE).count();
    new: |2
              return (int) IntStream.of(ages).filter(age -> age >= MIN_AGE).count();
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: Members who have just reached the minimum age are not counted as adults
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/membership/MembershipStats.java
    entity:
      type: method
      name: adultCount
      signature: int adultCount(int[] ages)
    statement: age > MIN_AGE
    change_type: line_modification
    description: >
      The predicate excludes the minimum age itself, so a member of exactly 18 is
      not counted. The sub-expression is used as fault.statement because c2 moves
      the same predicate from the if statement into a lambda.
  fix:
    commit: c3
    file: src/main/java/com/example/membership/MembershipStats.java
    entity:
      type: method
      name: adultCount
      signature: int adultCount(int[] ages)
    statement: age >= MIN_AGE
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - if (age > MIN_AGE) {
      note: >
        The faulty predicate is moved into a lambda by c2, so blame at c3^
        returns c2; one step of line history returns c1.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
