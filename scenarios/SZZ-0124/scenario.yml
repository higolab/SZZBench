schema_version: '1.0'
meta:
  id: SZZ-0124
  title: Variable rename after BIC
  slug: variable-rename-after-bic
  description: >
    The bug-introducing commit subtracts the units in transit instead of
    adding them. A later refactoring renames the local variable that the
    faulty line assigns, so the faulty line itself is rewritten without any
    behavioural change. The bug-fixing commit repairs the arithmetic and
    keeps the new name, so plain blame at the BFC parent stops at the
    rename. SZZ-0125 is the matched control whose rename leaves the faulty
    line untouched.
  category: "Refactoring, move, and rename after BIC"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - variable-rename-after-bic
  - basic-blame-distractor
  difficulty: hard
  status: active
  category_code: "S5"
repository:
  name: SZZ-0124-variable-rename-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the reorder planner for warehouse replenishment
  author: Diego Alvarez <diego.alvarez@example.com>
  date: 2023-03-20T09:17:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/inventory/ReorderPlanner.java
    content: |
      package com.example.inventory;

      /**
       * Plans replenishment orders for one article in one warehouse.
       */
      public class ReorderPlanner {

          private static final int SAFETY_STOCK_UNITS = 12;

          private final int reorderPointUnits;

          public ReorderPlanner(int reorderPointUnits) {
              this.reorderPointUnits = reorderPointUnits;
          }

          /**
           * Returns how many units to order so that the stock is back at the
           * reorder point plus the safety stock, or 0 while enough stock is left.
           */
          public int unitsToOrder(int onHandUnits, int reservedUnits, int inTransitUnits) {
              int available = onHandUnits - reservedUnits + inTransitUnits;
              if (available >= reorderPointUnits) {
                  return 0;
              }
              return reorderPointUnits + SAFETY_STOCK_UNITS - available;
          }

          public boolean needsReorder(int onHandUnits, int reservedUnits, int inTransitUnits) {
              return unitsToOrder(onHandUnits, reservedUnits, inTransitUnits) > 0;
          }
      }
- id: c1
  message: Deduct units in transit from the available stock
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2023-03-27T13:00:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/inventory/ReorderPlanner.java
    old: |2
              int available = onHandUnits - reservedUnits + inTransitUnits;
    new: |2
              int available = onHandUnits - reservedUnits - inTransitUnits;
    labels:
    - B001
    - fault
- id: c2
  message: Spell out the unit in the local stock variable of unitsToOrder()
  author: Diego Alvarez <diego.alvarez@example.com>
  date: 2023-03-28T13:59:00Z
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/com/example/inventory/ReorderPlanner.java
    old: |2
              int available = onHandUnits - reservedUnits - inTransitUnits;
              if (available >= reorderPointUnits) {
                  return 0;
              }
              return reorderPointUnits + SAFETY_STOCK_UNITS - available;
    new: |2
              int availableUnits = onHandUnits - reservedUnits - inTransitUnits;
              if (availableUnits >= reorderPointUnits) {
                  return 0;
              }
              return reorderPointUnits + SAFETY_STOCK_UNITS - availableUnits;
    labels:
    - non_bug_introducing_change
- id: c3
  message: Count units in transit as available stock again
  author: Jonas Berg <jonas.berg@example.com>
  date: 2023-03-31T13:12:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/inventory/ReorderPlanner.java
    old: |2
              int availableUnits = onHandUnits - reservedUnits - inTransitUnits;
    new: |2
              int availableUnits = onHandUnits - reservedUnits + inTransitUnits;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: Units in transit are subtracted from the available stock
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/inventory/ReorderPlanner.java
    entity:
      type: method
      name: unitsToOrder
      signature: int unitsToOrder(int onHandUnits, int reservedUnits, int inTransitUnits)
    statement: onHandUnits - reservedUnits - inTransitUnits
    change_type: line_modification
    description: >
      Units already in transit increase the available stock, so subtracting
      them orders too much. The faulty sub-expression is used as
      fault.statement because c2 renames the variable the line assigns and
      thereby rewrites the whole line.
  fix:
    commit: c3
    file: src/main/java/com/example/inventory/ReorderPlanner.java
    entity:
      type: method
      name: unitsToOrder
      signature: int unitsToOrder(int onHandUnits, int reservedUnits, int inTransitUnits)
    statement: int availableUnits = onHandUnits - reservedUnits + inTransitUnits;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - int available = onHandUnits - reservedUnits - inTransitUnits;
      note: >
        c2 rewrites the faulty line to `int availableUnits = onHandUnits -
        reservedUnits - inTransitUnits;` without changing its behaviour.
        Blame at c3^ on the deleted line returns c2; the BIC is one step
        further back in the line history.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
