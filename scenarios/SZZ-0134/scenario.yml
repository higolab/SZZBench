schema_version: '1.0'
meta:
  id: SZZ-0134
  title: Validation weakening plus caller acceptance
  slug: validation-weakening-plus-caller
  description: This scenario requires treating two bug-introducing commits as contributing to the same later fix.
  category: "Multiple BICs, duplicate faults, and composite faults"
  factors:
  - multi-bic
  - single-bfc
  - line-modification
  difficulty: medium
  status: active
  tier: control
  category_code: "S6"
repository:
  name: SZZ-0134-validation-weakening-plus-caller
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial implementation
  author: Tom Becker <tom.becker@example.com>
  date: 2023-11-30T10:10:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0134.java
    content: |
      package example;

      public class Scenario0134 {
          public boolean validate(int value) {
              return value >= 0 && value <= 10;
          }

          public boolean callerAccepts(int value) {
              return validate(value);
          }
      }
- id: c1
  message: Weaken validator upper bound
  author: Mei Tanaka <mei.tanaka@example.com>
  date: 2023-12-01T18:25:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0134.java
    old: return value >= 0 && value <= 10;
    new: return value >= 0;
    labels:
    - B001
    - fault
- id: c2
  message: Let caller accept a migration sentinel
  author: Priya Raman <priya.raman@example.com>
  date: 2023-12-08T09:32:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0134.java
    old: return validate(value);
    new: return validate(value) || value == 99;
    labels:
    - B001
    - fault
- id: c3
  message: Fix combined validation and caller acceptance bug
  author: Priya Raman <priya.raman@example.com>
  date: 2023-12-11T13:56:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0134.java
    old: return value >= 0;
    new: return value >= 0 && value <= 10;
  - type: replace
    path: src/main/java/example/Scenario0134.java
    old: return validate(value) || value == 99;
    new: return validate(value);
    labels:
    - B001
    - fix
