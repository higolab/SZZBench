    - fault
- id: c2
  message: Fix bug
  author: Carol <carol@example.com>
  date: '2024-01-03T10:00:00Z'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0029.java
    old: |
      package example;

      public class Scenario0029 {
          public boolean canDivide(int denominator) {
              return denominator >= 0;
          }
      }
    new: |
      package example;

      public class Scenario0029 {
          public boolean canDivide(int denominator) {
              return denominator != 0;
          }
      }
    labels:
    - B001
    - fix
