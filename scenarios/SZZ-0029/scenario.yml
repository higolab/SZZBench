  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Initial correct implementation
  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0029.java
    content: |
      package example;

      public class Scenario0029 {
          public boolean canDivide(int denominator) {
              return denominator != 0;
          }
      }
- id: c1
  message: Introduce bug
  author: Bob <bob@example.com>
  date: '2024-01-02T10:00:00Z'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Scenario0029.java
    old: |
      package example;

      public class Scenario0029 {
          public boolean canDivide(int denominator) {
              return denominator != 0;
          }
      }
    new: |
