  title: BFC restores division guard condition
  slug: bfc-restores-division-guard
  description: This scenario evaluates SZZ behavior when the bug-fixing commit restores a boolean guard condition for a division
    denominator check.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - comparison-error
  difficulty: medium
  status: active
  category_code: "S1"
repository:
