schema_version: "1.0"

meta:
  id: "SZZ-0088"
  title: "Class body reformat after BIC"
  slug: "class-body-reformat-after-bic"
  description: >
    A range check is changed from inclusive to exclusive bounds, which is the
    fault. A later commit reformats the class body: the single-line bodies of
    the constructor and of the accessor are expanded to the project's brace
    style. The reformat is behaviour-preserving, changes whitespace only and
    does not touch the faulty line. The fixing commit repairs only that line
    and keeps the new layout.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "formatting-noise"
    - "blame-reaches-bic"
  difficulty: "easy"
  status: "active"
  tier: "control"
  category_code: "S3"

repository:
  name: "SZZ-0088-class-body-reformat-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add a labelled range check helper"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2025-06-05T16:45:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Scenario0088.java"
        content: |
          package example;

          public class Scenario0088 {
              private final String label;

              public Scenario0088(String label) { this.label = label; }

              public String label() { return label; }

              public boolean check(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Make the range bounds exclusive in check()"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2025-06-09T09:38:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0088.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Give the one-line member bodies their own lines"
    author: "Hana Sato <hana.sato@example.com>"
    date: "2025-06-16T09:33:00Z"
    role: "formatting"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0088.java"
        old: |
          package example;

          public class Scenario0088 {
              private final String label;

              public Scenario0088(String label) { this.label = label; }

              public String label() { return label; }

              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        new: |
          package example;

          public class Scenario0088 {
              private final String label;

              public Scenario0088(String label) {
                  this.label = label;
              }

              public String label() {
                  return label;
              }

              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        labels: ["formatting_only", "non_bug_introducing_change"]

  - id: "c3"
    message: "Include both range bounds in check() again"
    author: "Diego Alvarez <diego.alvarez@example.com>"
    date: "2025-06-19T10:49:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0088.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Range bounds are excluded from the containment check"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Scenario0088.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Scenario0088.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
        known_distractors: ["c2"]
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          c2 reformats the constructor and the accessor only; the faulty line
          is untouched, so plain `git blame` at c3^ on the single deleted line
          returns c1. c2 is a candidate only for tools that treat "the last
          commit that touched this file" as a suspect.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
