bugs:
  - id: "B001"
    title: "Summary writer is never closed, so the summary file stays empty and the handle leaks"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/com/example/reports/ReportExporter.java"
      entity:
        type: "method"
        name: "exportSummary"
        signature: "void exportSummary(Report report, Path target)"
      change_type: "omission"
      missing_statement: "writer.close();"
      description: "exportSummary opens a BufferedWriter outside try-with-resources and never closes or flushes it."
    fix:
      commit: "c3"
      file: "src/main/java/com/example/reports/ReportExporter.java"
      entity:
        type: "method"
        name: "exportSummary"
        signature: "void exportSummary(Report report, Path target)"
      added_statement: "writer.close();"
      fix_type: "line_addition"
      description: "The BFC also deletes the comment line `// Consumed by the nightly archive job.` written by c2; that is the only deleted line of the BFC."
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        known_distractors: ["c2"]
        false_positives_allowed: []
      line_level:
        available: false
        reason: "The fault is an omitted close(); the only line the BFC deletes is a comment owned by c2."

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
