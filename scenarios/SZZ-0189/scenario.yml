    message: "Add CSV export for generated reports"
    author: "Luca Moretti <luca.moretti@example.com>"
    date: "2024-06-03T18:56:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/com/example/reports/Report.java"
        content: |
          package com.example.reports;

          import java.util.List;

          public class Report {
              private final String title;
              private final List<String> rows;

              public Report(String title, List<String> rows) {
                  this.title = title;
                  this.rows = rows;
              }

              public String getTitle() {
                  return title;
              }

              public List<String> getRows() {
                  return rows;
              }

              public int rowCount() {
                  return rows.size();
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/reports/ReportExporter.java"
        content: |
          package com.example.reports;

          import java.io.BufferedWriter;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public class ReportExporter {
              private final String delimiter;

              public ReportExporter(String delimiter) {
                  this.delimiter = delimiter;
              }

              public void exportRows(Report report, Path target) throws IOException {
                  try (BufferedWriter writer = Files.newBufferedWriter(target)) {
                      for (String row : report.getRows()) {
                          writer.write(row.replace(",", delimiter));
                          writer.newLine();
                      }
                  }
              }
          }

