schema_version: "1.0"

meta:
  id: "SZZ-0189"
  title: "Missing close() fixed by an addition whose only deleted line is a distractor's comment"
  slug: "missing-close-fix-deletes-only-comment"
  description: >
    A method opens a writer and never closes it. The bug-fixing commit adds
    the missing `writer.close()` and, in the same commit, removes a stale
    comment line that a distractor commit had placed above the method. The
    BFC therefore deletes exactly one line, and that line is a comment owned
    by a non-BIC commit. This is the inverse of SZZ-0185: there is no
    semantic deleted line at all.
  category: "Omission and deletion bugs"
  factors:
    - "single-bic"
    - "single-bfc"
    - "omission-bug"
    - "line-addition-fix"
    - "missing-close"
    - "cosmetic-line-noise"
    - "tangled-bfc"
  difficulty: "hard"
  status: "active"
  tier: "control"
  category_code: "S2"

repository:
  name: "SZZ-0189-missing-close-fix-deletes-only-comment"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

