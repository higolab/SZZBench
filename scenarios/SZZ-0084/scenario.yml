schema_version: "1.0"

meta:
  id: "SZZ-0084"
  title: "Whitespace-only rewrite after BIC with preserved line"
  slug: "whitespace-preserved-after-bic"
  description: >
    A range check is changed from inclusive to exclusive bounds, which is the
    fault. A later commit reformats the file to Allman brace style and wraps
    the parameter list; the rewrite is whitespace-only and leaves the faulty
    line byte-identical. The fixing commit then repairs only that line and
    keeps the new formatting. This is the preserved-line counterpart of
    SZZ-0081 and SZZ-0083, where the same kind of whitespace rewrite does
    touch the faulty line.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "whitespace-preserved-after-bic"
    - "blame-reaches-bic"
    - "matched-control"
  difficulty: "easy"
  status: "active"
  tier: "control"
  category_code: "S3"

repository:
  name: "SZZ-0084-whitespace-preserved-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add a range check helper"
    author: "Hana Sato <hana.sato@example.com>"
    date: "2023-09-13T16:41:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Scenario0084.java"
        content: |
          package example;

          public class Scenario0084 {
              public boolean check(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Make the range bounds exclusive in check()"
    author: "Aiko Mori <aiko.mori@example.com>"
    date: "2023-09-15T13:04:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0084.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Apply the team brace style and wrap the parameter list"
    author: "Hana Sato <hana.sato@example.com>"
    date: "2023-09-18T15:35:00Z"
    role: "formatting"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0084.java"
        old: |
          package example;

          public class Scenario0084 {
              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }
          }
        new: |
          package example;

          public class Scenario0084
          {
              public boolean check(
                      int value,
                      int min,
                      int max)
              {
                  return value > min && value < max;
              }
          }
        labels: ["formatting_only", "non_bug_introducing_change"]

  - id: "c3"
    message: "Include both range bounds in check() again"
    author: "Priya Raman <priya.raman@example.com>"
    date: "2023-09-20T17:13:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0084.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Range bounds are excluded from the containment check"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Scenario0084.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Scenario0084.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
        known_distractors: ["c2"]
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          The whitespace rewrite in c2 reformats the class header and the
          method signature but leaves the faulty line untouched, so plain
          `git blame` at c3^ on the single deleted line returns c1.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
