- id: c2
  message: Apply intermediate rewrite
  author: Carol <carol@example.com>
  date: '2024-01-03T10:00:00Z'
  role: distractor
  operations:
  - type: replace
    path: src/main/java/example/Scenario0097.java
    old: |
      package example;

      public class Scenario0097 {
          public String clean(String value) {
              return value.stripTrailing();
          }
