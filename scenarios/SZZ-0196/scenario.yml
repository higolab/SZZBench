bugs:
  - id: "B001"
    title: "The receipt total is printed as whole units"
    bug_fixing_commit: "c4"
    bug_introducing_commits: ["c1", "c3"]
    fault:
      commit: "c3"
      file: "src/main/java/example/Receipt.java"
      entity:
        type: "method"
        name: "total"
        signature: "String total(int cents)"
      statement: "return Money.format(cents);"
      change_type: "line_modification"
    fix:
      commit: "c4"
      file: "src/main/java/example/Receipt.java"
      entity:
        type: "method"
        name: "total"
        signature: "String total(int cents)"
      statement: "return Money.format((long) cents);"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives: ["c1", "c3"]
        primary_observable_bic: "c3"
        contributing_bics: ["c1"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return Money.format(cents);"
        note: >
          The fix deletes a line written by c3. c1 added the overload that call
          binds to and is not reachable from the deleted line by blame; with a
          single format method the new call would have been correct.

scenario_design:
  failure_mode: >-
    A tool fails here when it stops at blame's `c3`, the call that passes
    cents as an int: `c1`, which added the whole-units overload that call
    binds to, is reached only by resolving which method the fixed line
    calls.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3", "c4"]
