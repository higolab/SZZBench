schema_version: "1.0"

meta:
  id: "SZZ-0196"
  title: "An overload added earlier captures a call written later"
  slug: "overload-captures-later-call"
  description: >
    A formatting helper gains an overload for whole currency units. Every call
    in the repository passes a long and keeps binding to the original method,
    so nothing changes. A later commit adds a caller that passes an int amount
    in cents, which binds to the new overload and prints the cent count as
    whole units. The fix widens the argument at the call site, so the line it
    deletes belongs to the later commit; the overload that captured the call is
    reachable only by resolving which method the fixed line calls.
  category: "Multiple BICs, duplicate faults, and composite faults"
  factors:
    - "multi-bic"
    - "single-bfc"
    - "caller-callee-interaction"
    - "overload-resolution"
    - "blame-unreachable-bic"
  difficulty: "hard"
  status: "active"
  tier: "discriminating"
  defeats: ["blame", "shape", "position"]
  category_code: "S6"

repository:
  name: "SZZ-0196-overload-captures-later-call"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

