schema_version: "1.0"

meta:
  id: "SZZ-0015"
  title: "Security validation omission"
  slug: "security-validation-omission"
  description: >
    A path acceptance method is introduced without validation against path
    traversal. The fixing commit adds a missing security guard. This scenario
    represents a security-related omission bug.
  category: "security"
  factors:
    - "single-bic"
    - "single-bfc"
    - "omission-bug"
    - "line-addition-fix"
    - "security-validation-omission"
  difficulty: "medium"
  status: "active"

repository:
  name: "SZZ-0015-security-validation-omission"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial path policy"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/PathPolicy.java"
        content: |
          package example;

          public class PathPolicy {
          }

  - id: "c1"
    message: "Add permissive path policy"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/PathPolicy.java"
        old: |
          public class PathPolicy {
          }
        new: |
          public class PathPolicy {
              public boolean isSafe(String path) {
                  return true;
              }
          }
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Reject path traversal"
    author: "Alice <alice@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/PathPolicy.java"
        old: |
          public boolean isSafe(String path) {
                  return true;
              }
        new: |
          public boolean isSafe(String path) {
                  if (path.contains("..")) {
                      return false;
                  }
                  return true;
              }
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Path traversal is accepted"
    bug_fixing_commit: "c2"
    bug_introducing_commits: ["c1"]
    fault:
      commit: "c1"
      file: "src/main/java/example/PathPolicy.java"
      entity:
        type: "method"
        name: "isSafe"
        signature: "boolean isSafe(String path)"
      change_type: "omission"
      missing_statement: |
        if (path.contains("..")) {
            return false;
        }
    fix:
      commit: "c2"
      file: "src/main/java/example/PathPolicy.java"
      entity:
        type: "method"
        name: "isSafe"
        signature: "boolean isSafe(String path)"
      added_statement: |2
                if (path.contains("..")) {
                    return false;
                }
      fix_type: "line_addition"
    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
      line_level:
        available: false
        reason: "The security fault is an omitted validation guard."

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2"]
