schema_version: "1.0"

meta:
  id: "SZZ-0089"
  title: "Import addition after BIC"
  slug: "import-addition-after-bic"
  description: >
    A range check is changed from inclusive to exclusive bounds, which is the
    fault. A later commit adds an import to the file and uses it in a second,
    unrelated method; the rewritten expression is behaviour-preserving. The
    import shifts every line below it, including the faulty one, but it does
    not rewrite the faulty line. The fixing commit repairs only that line and
    keeps the import.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "import-addition-after-bic"
    - "line-number-shift"
    - "blame-reaches-bic"
  difficulty: "easy"
  status: "active"
  category_code: "S3"

repository:
  name: "SZZ-0089-import-addition-after-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add a range check helper with a display label"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Scenario0089.java"
        content: |
          package example;

          public class Scenario0089 {
              public boolean check(int value, int min, int max) {
                  return value >= min && value <= max;
              }

              public String describe(String label) {
                  return label == null ? "range" : label;
              }
          }

  - id: "c1"
    message: "Make the range bounds exclusive in check()"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0089.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Default the display label with Objects.requireNonNullElse"
    author: "Carol <carol@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "refactoring"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0089.java"
        old: |
          package example;

          public class Scenario0089 {
              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }

              public String describe(String label) {
                  return label == null ? "range" : label;
              }
          }
        new: |
          package example;

          import java.util.Objects;

          public class Scenario0089 {
              public boolean check(int value, int min, int max) {
                  return value > min && value < max;
              }

              public String describe(String label) {
                  return Objects.requireNonNullElse(label, "range");
              }
          }
        labels: ["non_bug_introducing_change"]

  - id: "c3"
    message: "Include both range bounds in check() again"
    author: "Alice <alice@example.com>"
    date: "2024-01-04T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Scenario0089.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Range bounds are excluded from the containment check"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1"]

    fault:
      commit: "c1"
      file: "src/main/java/example/Scenario0089.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"

    fix:
      commit: "c3"
      file: "src/main/java/example/Scenario0089.java"
      entity:
        type: "method"
        name: "check"
        signature: "boolean check(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"

    expected_szz:
      commit_level:
        true_positives: ["c1"]
        false_positives_allowed: []
        known_distractors: ["c2"]
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"
        note: >
          The import added by c2 moves the faulty line from line 5 to line 7
          but does not rewrite it, so plain `git blame` at c3^ on the single
          deleted line returns c1. A tool that compares line numbers instead
          of line content can still be misled.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
