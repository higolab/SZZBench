  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Scenario0013.java
    content: |
      package example;

      public class Scenario0013 {
          public boolean canEdit(boolean isAdmin, boolean isOwner) {
              return isAdmin || isOwner;
          }
      }
- id: c1
