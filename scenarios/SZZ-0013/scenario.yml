  slug: logical-disjunction-error
  description: This scenario introduces a bug by changing `return isAdmin || isOwner;` to `return isAdmin && isOwner;` and later restores the correct implementation.
  category: "Basic semantic line changes"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - logical-operator-error
  difficulty: easy
  status: active
  category_code: "S1"
