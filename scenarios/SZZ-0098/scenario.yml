schema_version: '1.0'
meta:
  id: SZZ-0098
  title: Enum case addition after BIC
  slug: enum-case-after-bic
  description: >
    The BIC replaces the "every mode except OFF" power check with an explicit
    comparison against a single mode and forgets COOL. An intermediate commit
    adds a new constant to the enum and changes nothing else. The bug-fixing
    commit repairs only the boolean expression, so plain blame at the BFC parent
    still reaches the BIC: this is an honest control for the enum-noise family.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - enum-change-after-bic
  - plain-blame-control
  difficulty: easy
  status: active
  category_code: "S3"
repository:
  name: SZZ-0098-enum-case-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the thermostat controller with its operating modes
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-05-01T15:40:00Z
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/devices/ThermostatController.java
    content: |
      package com.example.devices;

      public class ThermostatController {
          public enum Mode {
              OFF,
              HEAT,
              COOL
          }

          private Mode mode = Mode.OFF;

          public void setMode(Mode mode) {
              this.mode = mode;
          }

          public Mode mode() {
              return mode;
          }

          public boolean drawsPower() {
              return mode != Mode.OFF;
          }
      }
- id: c1
  message: State explicitly which mode draws power
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-05-03T15:48:00Z
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/com/example/devices/ThermostatController.java
    old: |2
              return mode != Mode.OFF;
    new: |2
              return mode == Mode.HEAT;
    labels:
    - B001
    - fault
- id: c2
  message: Add the automatic mode to the thermostat modes
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-05-09T14:33:00Z
  role: feature_addition
  operations:
  - type: replace
    path: src/main/java/com/example/devices/ThermostatController.java
    old: |2
              COOL
          }
    new: |2
              COOL,
              AUTO
          }
    labels:
    - non_bug_introducing_change
- id: c3
  message: Treat every mode except off as drawing power
  author: Jonas Berg <jonas.berg@example.com>
  date: 2024-05-10T18:18:00Z
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/com/example/devices/ThermostatController.java
    old: |2
              return mode == Mode.HEAT;
    new: |2
              return mode != Mode.OFF;
    labels:
    - B001
    - fix
bugs:
- id: B001
  title: A cooling thermostat is reported as drawing no power
  bug_fixing_commit: c3
  bug_introducing_commits: &id001
  - c1
  fault:
    commit: c1
    file: src/main/java/com/example/devices/ThermostatController.java
    entity:
      type: method
      name: drawsPower
      signature: boolean drawsPower()
    statement: return mode == Mode.HEAT;
    change_type: line_modification
    description: >
      Listing the powered modes explicitly dropped COOL, so a cooling thermostat
      is reported as idle. The enumeration also does not survive the arrival of a
      new mode, which is why the fix returns to the negative form.
  fix:
    commit: c3
    file: src/main/java/com/example/devices/ThermostatController.java
    entity:
      type: method
      name: drawsPower
      signature: boolean drawsPower()
    statement: return mode != Mode.OFF;
    fix_type: line_modification
  expected_szz:
    commit_level:
      true_positives: *id001
      false_positives_allowed: []
      known_distractors:
      - c2
    line_level:
      available: true
      faulty_statements:
      - return mode == Mode.HEAT;
      note: >
        c2 only adds a constant to the enum body; the faulty line is untouched,
        so blame at c3^ returns c1.
checks:
- type: git_history_contains
  commits:
  - c0
  - c1
  - c2
  - c3
