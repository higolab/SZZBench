          package com.example.inventory;

          public final class Sku {
              private final String code;
              private final String name;

              public Sku(String code, String name) {
                  this.code = code;
                  this.name = name;
              }

              public String getCode() {
                  return code;
              }

              public String getName() {
                  return name;
              }

              @Override
              public boolean equals(Object other) {
                  if (!(other instanceof Sku)) {
                      return false;
                  }
                  return code.equals(((Sku) other).code);
              }

              @Override
              public int hashCode() {
                  return code.hashCode();
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/StockLevel.java"
        content: |
          package com.example.inventory;

          public class StockLevel {
              private int onHand;
              private int reserved;

              public StockLevel(int onHand, int reserved) {
                  this.onHand = onHand;
                  this.reserved = reserved;
              }

              public int getOnHand() {
                  return onHand;
              }

              public int getReserved() {
                  return reserved;
              }

              public int available() {
                  return onHand - reserved;
              }

              void adjustOnHand(int delta) {
                  onHand += delta;
              }

              void adjustReserved(int delta) {
                  reserved += delta;
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/MovementType.java"
        content: |
          package com.example.inventory;

          public enum MovementType {
              RECEIPT,
              RESERVATION,
              RELEASE,
              SHIPMENT
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/StockMovement.java"
        content: |
          package com.example.inventory;

          public class StockMovement {
              private final Sku sku;
              private final MovementType type;
              private final int quantity;
              private final String reference;

              public StockMovement(Sku sku, MovementType type, int quantity, String reference) {
                  this.sku = sku;
                  this.type = type;
                  this.quantity = quantity;
                  this.reference = reference;
              }

              public Sku getSku() {
                  return sku;
              }

              public MovementType getType() {
                  return type;
              }

              public int getQuantity() {
                  return quantity;
              }

              public String getReference() {
                  return reference;
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/Warehouse.java"
        content: |
          package com.example.inventory;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class Warehouse {
              private final String code;
              private final Map<Sku, StockLevel> levels = new HashMap<>();
              private final List<StockMovement> journal = new ArrayList<>();

              public Warehouse(String code) {
                  this.code = code;
              }

              public String getCode() {
                  return code;
              }

              public StockLevel levelFor(Sku sku) {
                  StockLevel level = levels.get(sku);
                  if (level == null) {
                      level = new StockLevel(0, 0);
                      levels.put(sku, level);
                  }
                  return level;
              }

              public void record(StockMovement movement) {
                  journal.add(movement);
              }

              public List<StockMovement> journal() {
                  return new ArrayList<>(journal);
              }

              public Iterable<Sku> skus() {
                  return levels.keySet();
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/ReorderPolicy.java"
        content: |
          package com.example.inventory;

          public class ReorderPolicy {
              private final int threshold;
              private final int targetLevel;

              public ReorderPolicy(int threshold, int targetLevel) {
                  this.threshold = threshold;
                  this.targetLevel = targetLevel;
              }

              public boolean needsReorder(StockLevel level) {
                  return level.available() <= threshold;
              }

              public int reorderQuantity(StockLevel level) {
                  int shortfall = targetLevel - level.available();
                  return Math.max(shortfall, 0);
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/InventoryException.java"
        content: |
          package com.example.inventory;

          public class InventoryException extends RuntimeException {
              public InventoryException(String message) {
                  super(message);
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/InventoryService.java"
        content: |
          package com.example.inventory;

          public class InventoryService {
              private final Warehouse warehouse;

              public InventoryService(Warehouse warehouse) {
                  this.warehouse = warehouse;
              }

              public void receive(Sku sku, int quantity, String reference) {
                  StockLevel level = warehouse.levelFor(sku);
                  level.adjustOnHand(quantity);
                  warehouse.record(new StockMovement(sku, MovementType.RECEIPT, quantity, reference));
              }

              public void reserve(Sku sku, int quantity, String orderId) {
                  StockLevel level = warehouse.levelFor(sku);
                  if (quantity > level.getOnHand()) {
                      throw new InventoryException("not enough stock of " + sku.getCode() + " for " + orderId);
                  }
                  level.adjustReserved(quantity);
                  warehouse.record(new StockMovement(sku, MovementType.RESERVATION, quantity, orderId));
              }

              public void release(Sku sku, int quantity, String orderId) {
                  StockLevel level = warehouse.levelFor(sku);
                  level.adjustReserved(-quantity);
                  warehouse.record(new StockMovement(sku, MovementType.RELEASE, quantity, orderId));
              }

              public void ship(Sku sku, int quantity, String orderId) {
                  StockLevel level = warehouse.levelFor(sku);
                  level.adjustReserved(-quantity);
                  level.adjustOnHand(-quantity);
                  warehouse.record(new StockMovement(sku, MovementType.SHIPMENT, quantity, orderId));
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/inventory/LowStockReport.java"
        content: |
          package com.example.inventory;

          import java.util.ArrayList;
          import java.util.List;

          public class LowStockReport {
              private final Warehouse warehouse;
              private final ReorderPolicy policy;

              public LowStockReport(Warehouse warehouse, ReorderPolicy policy) {
                  this.warehouse = warehouse;
                  this.policy = policy;
              }

              public List<String> lines() {
                  List<String> lines = new ArrayList<>();
                  for (Sku sku : warehouse.skus()) {
                      StockLevel level = warehouse.levelFor(sku);
                      if (policy.needsReorder(level)) {
                          lines.add(sku.getCode() + ": reorder " + policy.reorderQuantity(level));
                      }
                  }
                  return lines;
              }
          }
        labels: ["B001", "fault"]

