bugs:
  - id: "B001"
    title: "Reservations ignore already reserved stock and oversell"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c0"]
    fault:
      commit: "c0"
      file: "src/main/java/com/example/inventory/InventoryService.java"
      entity:
        type: "method"
        name: "reserve"
        signature: "void reserve(Sku sku, int quantity, String orderId)"
      statement: "if (quantity > level.getOnHand()) {"
      change_type: "line_modification"
      description: "The check compares against on-hand stock instead of available (on-hand minus reserved) stock, so a second order can reserve units that are already reserved."
    fix:
      commit: "c3"
      file: "src/main/java/com/example/inventory/InventoryService.java"
      entity:
        type: "method"
        name: "reserve"
        signature: "void reserve(Sku sku, int quantity, String orderId)"
      statement: "if (quantity > level.available()) {"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives: ["c0"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "if (quantity > level.getOnHand()) {"
        note: >
          Blame at c3^ returns c0 directly. The difficulty is not in blame but
          in candidate filtering: c0 is the initial commit, touches nine files
          and adds 232 lines.

