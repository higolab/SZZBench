meta:
  id: "SZZ-0180"
  title: "BIC is a large initial import"
  slug: "initial-import-bic"
  description: >
    The fault is part of a large initial import (nine Java files, 232
    lines) that brings a whole inventory module into the repository. Two
    small unrelated commits follow, and the BFC changes one line. Plain blame
    reaches the import commit exactly, but SZZ variants that discard large
    commits, initial commits, or commits touching many files (MA-SZZ- and
    RA-SZZ-style filters) drop the only correct answer.
  category: "Intermediate noise and history noise"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "initial-import-bic"
    - "large-bic"
  difficulty: "easy"
  status: "active"
  category_code: "S3"

