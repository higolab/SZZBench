schema_version: "1.0"

meta:
  id: "SZZ-0132"
  title: "Basic multiple bug-introducing commits"
  slug: "basic-multiple-bic"
  description: >
    A bug becomes observable only after two contributing commits: one commit
    weakens the callee-side contract and a later commit uses the weakened mode
    at a call site. The fixing commit repairs the call site.
  category: "Multiple BICs, duplicate faults, and composite faults"
  factors:
    - "multi-bic"
    - "single-bfc"
    - "line-modification"
    - "caller-callee-interaction"
  difficulty: "hard"
  status: "active"
  tier: "discriminating"
  defeats: ["blame", "shape", "position"]
  category_code: "S6"

repository:
  name: "SZZ-0132-basic-multiple-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial safe average calculator"
    author: "Luca Moretti <luca.moretti@example.com>"
    date: "2024-09-25T16:30:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/AverageCalculator.java"
        content: |
          package example;

          public class AverageCalculator {
              public int divide(int total, int count) {
                  if (count == 0) {
                      return 0;
                  }
                  return total / count;
              }
          }

  - id: "c1"
    message: "Add unsafe divide mode"
    author: "Hana Sato <hana.sato@example.com>"
    date: "2024-10-02T17:27:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/AverageCalculator.java"
        old: |
          public int divide(int total, int count) {
                  if (count == 0) {
                      return 0;
                  }
                  return total / count;
              }
        new: |
          public int divide(int total, int count, boolean allowZero) {
                  if (count == 0 && !allowZero) {
                      return 0;
                  }
                  return total / count;
              }
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Use unsafe divide mode in average"
    author: "Diego Alvarez <diego.alvarez@example.com>"
    date: "2024-10-09T16:34:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/AverageCalculator.java"
        old: |
          public int divide(int total, int count, boolean allowZero) {
                  if (count == 0 && !allowZero) {
                      return 0;
                  }
                  return total / count;
              }
        new: |
          public int divide(int total, int count, boolean allowZero) {
                  if (count == 0 && !allowZero) {
                      return 0;
                  }
                  return total / count;
              }

              public int average(int total, int count) {
                  return divide(total, count, true);
              }
        labels: ["B001", "fault"]

  - id: "c3"
    message: "Use safe divide mode in average"
    author: "Mei Tanaka <mei.tanaka@example.com>"
    date: "2024-10-18T09:21:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/AverageCalculator.java"
        old: "return divide(total, count, true);"
        new: "return divide(total, count, false);"
        labels: ["B001", "fix"]

bugs:
  - id: "B001"
    title: "Average can divide by zero"
    bug_fixing_commit: "c3"
    bug_introducing_commits: ["c1", "c2"]
    fault:
      commit: "c2"
      file: "src/main/java/example/AverageCalculator.java"
      entity:
        type: "method"
        name: "average"
        signature: "int average(int total, int count)"
      statement: "return divide(total, count, true);"
      change_type: "line_modification"
    fix:
      commit: "c3"
      file: "src/main/java/example/AverageCalculator.java"
      entity:
        type: "method"
        name: "average"
        signature: "int average(int total, int count)"
      statement: "return divide(total, count, false);"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives: ["c1", "c2"]
        primary_observable_bic: "c2"
        contributing_bics: ["c1"]
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return divide(total, count, true);"
        note: "The bug has multiple contributing commits, but the BFC directly modifies a line introduced in c2."

scenario_design:
  failure_mode: >-
    A tool fails here when it stops at blame's `c2`, the call `divide(total,
    count, true)` the fix repairs: `c1`, which made `divide` skip its zero
    check when that flag is set, is on no line the fix deletes.

checks:
  - type: "git_history_contains"
    commits: ["c0", "c1", "c2", "c3"]
