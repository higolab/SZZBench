schema_version: "1.0"

meta:
  id: "SZZ-0183"
  title: "Two-file BFC whose second hunk blames a non-BIC commit"
  slug: "two-file-bfc-second-hunk-non-bic"
  description: >
    The bug-fixing commit modifies two existing files. The hunk in
    CurrencyConverter repairs the rounding fault introduced by the BIC; the
    hunk in PriceDisplay is an unrelated formatting tweak of a line that a
    later feature commit last touched. Plain blame on the BFC's deleted lines
    returns both commits, only one of which is the BIC.
  category: "BFC-side noise and tangled commits"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
    - "multi-file-bfc"
    - "tangled-bfc"
  difficulty: "medium"
  status: "active"
  tier: "control"
  category_code: "S4"

repository:
  name: "SZZ-0183-two-file-bfc-second-hunk-non-bic"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Add currency conversion and price display helpers"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2024-04-10T15:14:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/com/example/money/CurrencyConverter.java"
        content: |
          package com.example.money;

          import java.util.HashMap;
          import java.util.Map;

          public class CurrencyConverter {
              private final Map<String, Double> ratesToBase = new HashMap<>();

              public void setRate(String currency, double rateToBase) {
                  ratesToBase.put(currency, rateToBase);
              }

              public long toBaseCents(long amountCents, String currency) {
                  Double rate = ratesToBase.get(currency);
                  if (rate == null) {
                      throw new IllegalArgumentException("no rate for " + currency);
                  }
                  return Math.round(amountCents * rate);
              }

              public boolean supports(String currency) {
                  return ratesToBase.containsKey(currency);
              }
          }
      - type: "write_file"
        path: "src/main/java/com/example/money/PriceDisplay.java"
        content: |
          package com.example.money;

          public class PriceDisplay {
              private final String baseCurrency;

              public PriceDisplay(String baseCurrency) {
                  this.baseCurrency = baseCurrency;
              }

              public String format(long cents) {
                  long units = cents / 100;
                  long fraction = Math.abs(cents % 100);
                  return String.format("%d.%02d %s", units, fraction, baseCurrency);
              }

              public String formatRange(long lowCents, long highCents) {
                  return format(lowCents) + " - " + format(highCents);
              }
          }

  - id: "c1"
    message: "Replace Math.round with a cast in the conversion path"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2024-04-18T17:32:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/com/example/money/CurrencyConverter.java"
        old: |2
                  return Math.round(amountCents * rate);
        new: |2
                  return (long) (amountCents * rate);
        labels: ["B001", "fault"]

  - id: "c2"
    message: "Show the currency code before the amount"
    author: "Priya Raman <priya.raman@example.com>"
    date: "2024-04-22T14:32:00Z"
    role: "feature_addition"
    operations:
      - type: "replace"
        path: "src/main/java/com/example/money/PriceDisplay.java"
        old: |2
                  return String.format("%d.%02d %s", units, fraction, baseCurrency);
        new: |2
                  return String.format("%s %d.%02d", baseCurrency, units, fraction);
        labels: ["non_bug_introducing_change"]

  - id: "c3"
    message: "Round converted amounts to the nearest cent; use a non-breaking space in prices"
    author: "Tom Becker <tom.becker@example.com>"
    date: "2024-04-24T17:24:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/com/example/money/CurrencyConverter.java"
        old: |2
                  return (long) (amountCents * rate);
        new: |2
                  return Math.round(amountCents * rate);
        labels: ["B001", "fix"]
      - type: "replace"
        path: "src/main/java/com/example/money/PriceDisplay.java"
        old: |2
                  return String.format("%s %d.%02d", baseCurrency, units, fraction);
        new: |2
                  return String.format("%s %d.%02d", baseCurrency, units, fraction);
        labels: ["non_bug_introducing_change"]

