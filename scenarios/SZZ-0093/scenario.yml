schema_version: '1.0'
meta:
  id: SZZ-0093
  title: If-else to guard clause after BIC
  slug: if-else-to-guard-after-bic
  description: >
    The BIC changes the threshold comparison of a volume discount from "below the
    minimum" to "at or below the minimum", so an order that exactly meets the
    minimum loses its discount. An intermediate refactoring turns the if-else of
    the same method into a guard clause without touching the faulty condition
    line. The bug-fixing commit repairs only the comparison, so plain blame at
    the BFC parent still reaches the BIC: this is an honest control for the
    refactoring-after-BIC family.
  category: "Intermediate noise and history noise"
  factors:
  - single-bic
  - single-bfc
  - line-modification
  - guard-clause-after-bic
  - plain-blame-control
  difficulty: easy
  status: active
  category_code: "S3"
repository:
  name: SZZ-0093-if-else-to-guard-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
commits:
- id: c0
  message: Add the volume discount calculation for the checkout total
  author: Alice <alice@example.com>
  date: '2024-01-01T10:00:00Z'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/com/example/pricing/DiscountCalculator.java
    content: |
      package com.example.pricing;

      public class DiscountCalculator {
          private static final int MIN_ORDER_CENTS = 5000;
          private static final int DISCOUNT_PERCENT = 10;

          public int discountCents(int orderTotalCents) {
              if (orderTotalCents < MIN_ORDER_CENTS) {
                  return 0;
              } else {
                  return orderTotalCents * DISCOUNT_PERCENT / 100;
              }
          }

          public int payableCents(int orderTotalCents) {
              return orderTotalCents - discountCents(orderTotalCents);
          }
      }
