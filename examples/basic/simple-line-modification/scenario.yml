schema_version: "1.0"

meta:
  id: "simple-line-modification"
  title: "Simple line modification"
  description: >
    A boundary-check bug is introduced by modifying one return statement
    and later fixed by restoring the correct condition.
  category: "basic"
  factors:
    - "single-bic"
    - "single-bfc"
    - "line-modification"
  difficulty: "easy"

repository:
  name: "simple-line-modification"
  default_branch: "main"
  language: "java"
  build_system: "none"
  source_root: "src/main/java"

commits:
  - id: "c0"
    message: "Initial correct implementation"
    author: "Alice <alice@example.com>"
    date: "2024-01-01T10:00:00Z"
    role: "initial"
    operations:
      - type: "write_file"
        path: "src/main/java/example/Range.java"
        content: |
          package example;

          public class Range {
              public boolean contains(int value, int min, int max) {
                  return value >= min && value <= max;
              }
          }

  - id: "c1"
    message: "Introduce boundary bug"
    author: "Bob <bob@example.com>"
    date: "2024-01-02T10:00:00Z"
    role: "bug_introducing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Range.java"
        old: "return value >= min && value <= max;"
        new: "return value > min && value < max;"
        labels:
          - "B001"
          - "fault"

  - id: "c2"
    message: "Fix boundary bug"
    author: "Alice <alice@example.com>"
    date: "2024-01-03T10:00:00Z"
    role: "bug_fixing"
    operations:
      - type: "replace"
        path: "src/main/java/example/Range.java"
        old: "return value > min && value < max;"
        new: "return value >= min && value <= max;"
        labels:
          - "B001"
          - "fix"

bugs:
  - id: "B001"
    title: "Boundary values are excluded"
    bug_fixing_commit: "c2"
    bug_introducing_commits:
      - "c1"
    fault:
      commit: "c1"
      file: "src/main/java/example/Range.java"
      entity:
        type: "method"
        name: "contains"
        signature: "boolean contains(int value, int min, int max)"
      statement: "return value > min && value < max;"
      change_type: "line_modification"
    fix:
      commit: "c2"
      file: "src/main/java/example/Range.java"
      entity:
        type: "method"
        name: "contains"
        signature: "boolean contains(int value, int min, int max)"
      statement: "return value >= min && value <= max;"
      fix_type: "line_modification"
    expected_szz:
      commit_level:
        true_positives:
          - "c1"
        false_positives_allowed: []
      line_level:
        available: true
        faulty_statements:
          - "return value > min && value < max;"

checks:
  - type: "git_history_contains"
    commits:
      - "c0"
      - "c1"
      - "c2"
