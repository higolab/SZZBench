# The test suite on every pull request and on every push to main (issue #106).
#
# Linux only: Windows is not tested (#109).  SZZBench needs Git 2.29 or later
# (docs/generator-options.md §5), and gitutils.init_args() passes
# --ref-format=files only from Git 2.45.  The two pytest jobs take both ways:
# the current Python with the runner's current Git, and the oldest Python
# pyproject.toml declares with Debian 12's Git 2.39.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-current:
    name: pytest (Python 3.14, the runner's Git)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/test_template_rewrites.py reads main as it stood before the rewrites
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # the tests marked needs_jdk compile and run the scenarios' Java code
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # tests/test_scenario_editor.py needs a Node.js that runs TypeScript (22.18+)
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/scenario-editor/package-lock.json
      - name: Install SZZBench and the Scenario Editor's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix tools/scenario-editor
      - name: Versions
        run: |
          python --version
          git --version
          java -version
          node --version
      # -rs lists every skip with its reason: none should be for a tool this job installs
      - name: pytest
        run: python -m pytest -rs --durations=20

  pytest-oldest:
    name: pytest (Python 3.10, Git 2.39 of Debian 12)
    runs-on: ubuntu-latest
    # Python 3.10 and Git 2.39 (below 2.45, so init_args() leaves out --ref-format) come with the image
    container: python:3.10-bookworm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/scenario-editor/package-lock.json
      - name: Install SZZBench and the Scenario Editor's dependencies
        run: |
          python -m pip install --root-user-action=ignore --upgrade pip
          python -m pip install --root-user-action=ignore -e ".[dev]"
          npm ci --prefix tools/scenario-editor
      - name: Versions
        run: |
          python --version
          git --version
          java -version
          node --version
      - name: pytest
        run: python -m pytest -rs --durations=20

  web-tools:
    name: build ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [scenario-editor, generated-repo-viewer]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/${{ matrix.tool }}/package-lock.json
      - run: npm ci
        working-directory: tools/${{ matrix.tool }}
      - run: npm run build
        working-directory: tools/${{ matrix.tool }}
