  history_summary: 'c1: ambiguous code change

    c2: similar code change

    c3: fix

    issue description: "Null input to normalize should return empty string"'
commits:
- id: c1
  branch: main
  parents: []
  message: 'c1: ambiguous code change'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value > min && value < max;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: similar code change'
  role: intermediate
  operations:
  - type: write_file
    path: docs/intermediate-note.md
    content: 'intermediate change

      '
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
