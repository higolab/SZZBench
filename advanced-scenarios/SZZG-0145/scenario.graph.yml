expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c3
    notes: >
      Both commits are required. Without c3 nothing prints the raw table value; without c1 the table
      is in dollars and c3's label is right. Blame on the line c4 deletes returns c3 alone; c1 rewrites every one of the
      5,001 lines of a generated CSV the fix never opens (5,001 deletions, 5,001 insertions), plus
      one line of rateCents() the fix does not touch.
scenario_design:
  purpose: >
    A discriminating scenario for G8: the second required commit is in a large generated non-source
    file, so reaching it means following the value the fixed expression reads into a file whose diff
    is five thousand lines, not into another line of Java.
  key_property: >
    Measured: rateCents("zone-3") is 300 and rateCents("zone-1250") is 125000 at every commit;
    rateLabel("zone-3") is "300 USD" at c3 and "3 USD" at c4, rateLabel("zone-1250") "125000 USD" and
    "1250 USD". Undoing c1 on top of c3 (the table in dollars, rateCents() multiplying by 100) gives
    "3 USD" and "1250 USD": the fixed answers. Blaming the line c4 deletes at c4^ returns c3 under
    every variant; c1's diff rewrites all 5,001 lines of zone-rates.csv and one line of ZoneRates.java.
  evaluation_points:
  - Report exactly {c1, c3}.
  - Whether the value the fixed expression reads is followed into the non-source file and to the commit that changed its unit.
  - Whether a five-thousand-line diff of a generated file is examined rather than skipped as noise.
  failure_mode: >-
    A tool fails here when it stops at blame's `c3`, or when it skips `c1` because its diff is a
    regenerated five-thousand-line table: the header line of that table, `zone,rate_cents`, is where
    the unit `c3`'s label assumed was changed.
notes:
- The table is produced by write_generated_text_file at c0 and c1 with a different template; every data row changes at c1.
