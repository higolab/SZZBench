schema_version: graph-1.0
meta:
  id: SZZG-0145
  title: The unit change is a regenerated five-thousand-line table the fix never opens
  slug: unit-change-in-a-generated-table
  description: >
    A generated tariff table is regenerated in cents instead of dollars, and
    the one reader that interprets it is changed in the same commit, so nothing
    observable moves. A later commit adds a label that prints the raw table
    value as dollars. The fix repairs the label, so the line it deletes belongs
    to the later commit; the unit change is a five-thousand-line diff of a
    non-source file the fix never opens, plus one line of the reader the fix
    does not touch.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - multi-bic
  - single-bfc
  - generated-file
  - non-source-file
  - config-bic
  - value-flow
  - config-value
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0145-unit-change-in-a-generated-table
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the zone tariff table and its reader'
  author: 'Farid Haddad <farid.haddad@example.com>'
  role: initial
  date: '2024-06-03T09:00:00Z'
  operations:
  - type: write_generated_text_file
    path: src/main/resources/zone-rates.csv
    lines: 5000
    template: 'zone-${line},${line}'
    header: |
      zone,rate_dollars
  - type: write_file
    path: src/main/java/example/ZoneRates.java
    content: |
      package example;

      import java.io.IOException;
      import java.nio.file.Files;
      import java.nio.file.Path;

      public class ZoneRates {
          static final Path TABLE = Path.of("src/main/resources/zone-rates.csv");

          static String rawRate(String zone) throws IOException {
              for (String line : Files.readAllLines(TABLE)) {
                  String[] cells = line.split(",");
                  if (cells[0].equals(zone)) {
                      return cells[1];
                  }
              }
              throw new IllegalArgumentException("unknown zone " + zone);
          }

          public int rateCents(String zone) throws IOException {
              return Integer.parseInt(rawRate(zone)) * 100;
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Regenerate the zone tariff table in cents'
  author: 'Luca Moretti <luca.moretti@example.com>'
  role: bug_introducing
  date: '2024-06-05T14:30:00Z'
  operations:
  - type: write_generated_text_file
    path: src/main/resources/zone-rates.csv
    lines: 5000
    template: 'zone-${line},${line}00'
    header: |
      zone,rate_cents
  - type: replace
    path: src/main/java/example/ZoneRates.java
    old: return Integer.parseInt(rawRate(zone)) * 100;
    new: return Integer.parseInt(rawRate(zone));
- id: c2
  branch: main
  parents:
  - c1
  message: 'Describe the zone table in the README'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: intermediate
  date: '2024-06-07T10:10:00Z'
  operations:
  - type: write_file
    path: README.md
    content: |
      # Zone tariffs

      `zone-rates.csv` is generated from the tariff sheet; do not edit it by hand.
      `ZoneRates` looks a zone up by name.
- id: c3
  branch: main
  parents:
  - c2
  message: 'Show the tariff of a zone on the quote'
  author: 'Aiko Mori <aiko.mori@example.com>'
  role: bug_introducing
  date: '2024-06-10T16:20:00Z'
  operations:
  - type: replace
    path: src/main/java/example/ZoneRates.java
    old: |
      public int rateCents(String zone) throws IOException {
              return Integer.parseInt(rawRate(zone));
          }
    new: |
      public int rateCents(String zone) throws IOException {
              return Integer.parseInt(rawRate(zone));
          }

          public String rateLabel(String zone) throws IOException {
              return rawRate(zone) + " USD";
          }
- id: c4
  branch: main
  parents:
  - c3
  message: 'Print the zone tariff in dollars on the quote'
  author: 'Tom Becker <tom.becker@example.com>'
  role: bug_fixing
  date: '2024-06-12T11:45:00Z'
  operations:
  - type: replace
    path: src/main/java/example/ZoneRates.java
    old: return rawRate(zone) + " USD";
    new: return (rateCents(zone) / 100) + " USD";
