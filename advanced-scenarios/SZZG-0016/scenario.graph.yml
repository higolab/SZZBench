schema_version: graph-1.0
meta:
  id: SZZG-0016
  title: Original and clone fixed together
  slug: original-clone
  description: >-
    TagNormalizer.java already trims and lower-cases its input without a null guard at c0. Commit c1
    copies the file to LabelNormalizer.java and adapts only the class declaration, so the faulty
    statement enters LabelNormalizer.java byte-for-byte unchanged. A single BFC c2 adds the guard to
    both instances in one commit. The direct BIC for the LabelNormalizer.java instance is the copy
    commit c1; c0 is the origin that also introduced the TagNormalizer.java instance fixed by the same
    commit.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - null-check-omission
  - copy-propagation
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0016-original-clone
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add TagNormalizer, which trims and lower-cases without a null guard (origin instance)

    c1: copy TagNormalizer.java to LabelNormalizer.java and rename the copied class (direct BIC for LabelNormalizer.java)

    c2: guard both normalizers against null (BFC for both instances)'
commits:
- id: c0
  branch: main
  parents: []
  message: Add the tag normalizer
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/TagNormalizer.java
    content: |
      package example;
      public class TagNormalizer {
        /** A tag in canonical form; a missing tag normalizes to the empty string. */
        public String normalize(String tag) {
          return tag.trim().toLowerCase();
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: Copy the tag normalizer into a label normalizer
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/TagNormalizer.java
    to: src/main/java/example/LabelNormalizer.java
  - type: replace
    path: src/main/java/example/LabelNormalizer.java
    old: public class TagNormalizer {
    new: public class LabelNormalizer {
- id: c2
  branch: main
  parents:
  - c1
  message: Normalize a missing tag or label to the empty string
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/TagNormalizer.java
    old: return tag.trim().toLowerCase();
    new: 'return tag == null ? "" : tag.trim().toLowerCase();'
  - type: replace
    path: src/main/java/example/LabelNormalizer.java
    old: return tag.trim().toLowerCase();
    new: 'return tag == null ? "" : tag.trim().toLowerCase();'
bugs:
- id: B001
  title: Normalizing a missing tag or label throws NullPointerException; original and clone fixed together
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c0
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c0
    file: src/main/java/example/TagNormalizer.java
    statement: return tag.trim().toLowerCase();
    role: origin
  - id: F002
    commit: c1
    file: src/main/java/example/LabelNormalizer.java
    statement: return tag.trim().toLowerCase();
    role: direct
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/TagNormalizer.java
    statement: 'return tag == null ? "" : tag.trim().toLowerCase();'
  - id: X002
    commit: c2
    file: src/main/java/example/LabelNormalizer.java
    statement: 'return tag == null ? "" : tag.trim().toLowerCase();'
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_origins:
    - c0
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c1
      acceptable_related:
      - commit: c0
        reason: origin_bic
        credit: 0.5
clone_relationships:
- origin_file: src/main/java/example/TagNormalizer.java
  copied_file: src/main/java/example/LabelNormalizer.java
  origin_commit: c0
  copy_commit: c1
scenario_design:
  purpose: Evaluate whether a method reports the copy rather than the original when a single fix repairs both.
  key_property: >-
    The single BFC c2 deletes the same statement text from two files whose line histories end in two different
    commits: the TagNormalizer.java line reaches c0, the LabelNormalizer.java line reaches the copy commit c1. A
    tool that scores the BFC as a whole sees both commits. Measured: normalize(null) throws NullPointerException
    in both classes at c1 and returns "" at c2; normalize(" Urgent ") is "urgent" throughout.
  compilation_contract: >-
    Both files live in package example and must compile together, so the copy commit renames the copied class in
    the same commit. Only the class declaration line differs between the two files; the faulty statement is
    copied verbatim, which is what copy-aware blame has to detect.
notes:
- >-
  2026-09 revision (issue 10): the copy commit produced a second public class of the same name, so no commit from c1
  onwards compiled. The copy commit renames the copied class, so both files compile together in package example.
- Rewritten 2026-09-21 from the shared Range.contains template to a null-check-omission fault (GitHub issue 13); the
  history shape, oracle and coverage dimensions are unchanged.
