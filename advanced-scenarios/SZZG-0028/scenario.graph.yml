schema_version: graph-0.1-draft
meta:
  id: SZZG-0028
  title: The copy and the later edit are both required; the origin is not
  slug: origin-and-direct-clone-bics
  description: >-
    Evaluates whether SZZ reports the copy that carried a fault into the fixed file, and the later commit that
    added a second fault to it, without reporting the origin the copy came from.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - clone
  - multiple_bic
  - origin_and_direct_bic
  difficulty: advanced
  status: draft
  tier: discriminating
repository:
  name: SZZG-0028-origin-and-direct-clone-bics
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: c0: create amount parser

    c1: c1: introduce original parser trim bug

    c2: c2: copy amount parser to invoice parser

    c3: c3: introduce copied parser sign bug

    c4: c4: fix invoice parsing behavior'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the amount parser'
  author: Aiko Tanaka <aiko.tanaka@example.com>
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/AmountParser.java
    content: "package example;\npublic class AmountParser {\n  public int parse(String s) {\n    return Integer.parseInt(s.trim());\n\
      \  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Parse the amount without trimming'
  author: Bruno Fischer <bruno.fischer@example.com>
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/AmountParser.java
    old: return Integer.parseInt(s.trim());
    new: return Integer.parseInt(s);
- id: c2
  branch: main
  parents:
  - c1
  message: 'Copy the amount parser for invoices'
  author: Chen Wei <chen.wei@example.com>
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/AmountParser.java
    to: src/main/java/example/InvoiceParser.java
  - type: replace
    path: src/main/java/example/InvoiceParser.java
    old: public class AmountParser
    new: public class InvoiceParser
- id: c3
  branch: main
  parents:
  - c2
  message: 'Take the absolute value of a parsed invoice amount'
  author: Dana Okafor <dana.okafor@example.com>
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/InvoiceParser.java
    old: return Integer.parseInt(s);
    new: return Math.abs(Integer.parseInt(s));
- id: c4
  branch: main
  parents:
  - c3
  message: 'Parse invoice amounts with trimming and sign'
  author: Elena Rossi <elena.rossi@example.com>
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/InvoiceParser.java
    old: return Math.abs(Integer.parseInt(s));
    new: return Integer.parseInt(s.trim());
bugs:
- id: B001
  title: Synthetic graph scenario bug
  bug_introducing_commits:
  - commit: c2
    role: direct
    description: Copies the untrimmed parser into InvoiceParser.java, the instance the fix repairs.
  - commit: c3
    role: direct
    description: Adds the sign fault to that same instance.
  - commit: c1
    role: origin
    description: Removed the trim from the source parser; the copy inherited it.
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/InvoiceParser.java
    statement: return Integer.parseInt(s);
    change_type: copy_propagated_line_modification
  - id: F002
    commit: c3
    file: src/main/java/example/InvoiceParser.java
    statement: return Math.abs(Integer.parseInt(s));
    change_type: line_modification
  origin_faults:
  - id: OF001
    commit: c1
    file: src/main/java/example/AmountParser.java
    statement: return Integer.parseInt(s);
    change_type: origin_line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/InvoiceParser.java
    statement: return Integer.parseInt(s.trim());
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    - c3
    related_origins:
    - c1
    notes: >
      The fix repairs both faults of InvoiceParser.java. The missing trim
      reached that file through the copy c2, which is therefore its direct BIC
      (contract D4); c1, which removed the trim from the source, is the origin
      (D2). c3 added the sign fault directly.
  evaluation_variants:
  - name: origin-aware
    description: The direct BICs are required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      - c3
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate whether SZZ reports the copy that carried a fault into the fixed file, and the later commit
    that added a second fault to it, without reporting the origin the copy came from.
  key_property: >-
    The fix repairs two faults of InvoiceParser.java. The missing trim reached that file through the copy c2,
    so c2 is its direct BIC and c1 - which removed the trim from the source AmountParser.java - is the origin.
    c3 added the sign fault directly. A tool that answers c1 has named a commit that never touched the fixed
    file.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: clone, multiple_bic, origin_and_direct_bic; operations: copy_file,
    replace, write_file.'
  evaluation_points:
  - Whether the copy commit c2 rather than the origin c1 is reported.
  - Whether the second, directly written fault c3 is reported alongside it.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
