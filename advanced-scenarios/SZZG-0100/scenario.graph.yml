schema_version: graph-1.0
meta:
  id: SZZG-0100
  title: Unrelated commits mixed in the same issue
  slug: issue-commit
  description: Evaluates a work item whose commits have different relevance - the change that introduced the defect, a
    parameter rename, a documentation update and the fix all reference the same identifier - and checks whether SZZ still
    identifies the expected bug-introducing commit set.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - work-item
  - issue-evidence
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0100-issue-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: add the range service
    c1: switch the containment check to an exclusive interval (ISSUE-10)
    c2: rename the normalize parameter (ISSUE-10)
    c3: document the range validation rules (ISSUE-10)
    c4: include the interval bounds in contains() again (ISSUE-10)
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range service'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RangeService.java
    content: |
      package example;

      public class RangeService {
        public boolean isEnabled() {
          return true;
        }

        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }

        public int normalize(int value) {
          return value;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'ISSUE-10 use an exclusive interval in RangeService.contains'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'ISSUE-10 rename the normalize parameter to rawValue'
  role: unrelated
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: |-
      public int normalize(int value) {
          return value;
        }
    new: |-
      public int normalize(int rawValue) {
          return rawValue;
        }
- id: c3
  branch: main
  parents:
  - c2
  message: 'ISSUE-10 document the range validation rules'
  role: unrelated
  operations:
  - type: write_file
    path: docs/range-validation.md
    content: |
      # Range validation

      `RangeService.contains` decides whether a value belongs to the interval
      that the caller passes in. `RangeService.normalize` is a placeholder for
      the value scaling planned for the next release and returns its argument
      unchanged.

      Callers must pass `min <= max`; the result for an inverted interval is
      unspecified.
- id: c4
  branch: main
  parents:
  - c3
  message: 'ISSUE-10 include the interval bounds in contains() again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: RangeService.contains rejects the interval bounds
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/RangeService.java
    statement: return value > min && value < max;
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/RangeService.java
    statement: return value >= min && value <= max;
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
    - c3
work_items:
- id: ISSUE-10
  title: Range validation rework
  commits:
  - commit: c1
    relevance: bug_introducing
  - commit: c2
    relevance: unrelated
  - commit: c3
    relevance: unrelated
  - commit: c4
    relevance: bug_fixing
issues:
- id: ISSUE-10
  title: Range validation fails on boundary values
  description: The ticket collects the whole range-validation rework - the change to the interval semantics, a parameter
    rename, the documentation update and the final boundary fix - so three of its four commits are not the cause of the
    reported failure.
  linked_bugs:
  - B001
scenario_design:
  purpose: Evaluate whether SZZ picks the one commit of a work item that introduced the defect when every commit of that
    work item carries the same identifier.
  key_property: |
    All four commits after the initial one reference ISSUE-10 in their message, so an issue-linked tool collects c1, c2, c3
    and c4. Only c1 changed the containment semantics; c2 renames a parameter of an unrelated method and c3 only adds a
    documentation file. The documentation file no longer states what the fix is, so it cannot be used as a shortcut.
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether the other commits of the same work item are excluded instead of being reported together with the BIC.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- The repository carries only the identifier ISSUE-10 in the commit messages; the work-item and issue metadata stay in this
  file.
