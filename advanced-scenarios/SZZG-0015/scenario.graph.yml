schema_version: graph-0.1-draft
meta:
  id: SZZG-0015
  title: Buggy code copied while original is fixed later
  slug: buggy-code-copied-original-later-fixed
  description: >-
    A.java already contains an exclusive range check at c0. Commit c1 copies the file to B.java and adapts only
    the class declaration, so the faulty statement enters B.java byte-for-byte unchanged. c2 fixes the copied
    instance in B.java and only c3, later, fixes the original in A.java. For the B.java fix the direct BIC is the
    copy commit c1 and c0 is origin context; the original keeps the fault until after the scored fix.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - copy-propagation
  - boundary-condition
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0015-buggy-code-copied-original-later-fixed
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add A with an exclusive range check

    c1: copy A.java to B.java and rename the copied class (direct BIC for B.java)

    c2: include the bounds in B.contains (BFC)

    c3: include the bounds in A.contains, later than the copy'
commits:
- id: c0
  branch: main
  parents: []
  message: Add A with a range containment check
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: |
      package example;

      public class A {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: Copy the containment check from A into B
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
  - type: replace
    path: src/main/java/example/B.java
    old: public class A {
    new: public class B {
- id: c2
  branch: main
  parents:
  - c1
  message: Include the bounds in B.contains
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: c3
  branch: main
  parents:
  - c2
  message: Include the bounds in A.contains
  role: origin_bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/A.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Copied boundary bug in B.java
  bug_introducing_commits:
  - commit: c1
    role: direct
    description: Direct BIC for B.java because this commit copies the faulty logic into the copied file.
  - commit: c0
    role: origin
    description: Origin context where the faulty logic already existed in A.java.
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/B.java
    statement: return value > min && value < max;
    change_type: copy_propagated_line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/B.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_origins:
    - c0
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c1
      acceptable_related:
      - commit: c0
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate a copy-propagated bug where the copied instance is fixed first and the original keeps the fault until later.
  key_property: Commit c2 fixes the copied B.java instance only; the original A.java keeps the fault until c3. The expected
    direct BIC for the scored fix is c1, the commit that copied the faulty logic into B.java.
  difference_from_SZZG_0018: SZZG-0018 fixes the original first and the clone afterwards, and scores the clone's fix.
    This scenario reverses that order, so the original is the instance that stays faulty longest. Before the 2026-09
    repair both scenarios generated byte-identical repositories.
  compilation_contract: >-
    Both files live in package example and must compile together, so the copy commit renames the copied class from
    A to B in the same commit. Only the class declaration line differs between A.java and B.java; the faulty
    statement is copied verbatim, which is what copy-aware blame has to detect.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: >-
    This scenario uses factors: copy-propagation, boundary-condition; operations: write_file, copy_file, replace.
  evaluation_points:
  - Whether SZZ identifies c1 as the direct BIC for the copied B.java instance.
  - Whether SZZ does not treat the later A.java fix c3 as the copied instance's BFC.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- >-
  2026-09 revision (issue 10): A.java declared `public class Range`, so no commit of this scenario compiled. The class in
  A.java is now A, and the copy commit renames the copied class to B so that both files compile together in one package.
  The oracle (direct BIC c1, origin c0) and the copied faulty statement are unchanged; the commit messages were
  rewritten to realistic, role-neutral text.
- >-
  2026-09 revision (issue 11): the fix order was reversed (the copy is fixed at c2, the original at c3) so that the
  title holds literally and the generated repository is no longer byte-identical to SZZG-0018's.
