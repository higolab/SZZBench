schema_version: graph-0.1-draft
meta:
  id: SZZG-0015
  title: One BFC fixes multiple BICs for one composite bug
  slug: 1-bfc-bic-bic
  description: A single composite range-check bug is created by two separate BICs. The first BIC breaks the lower-bound helper
    and the second BIC breaks the upper-bound helper. A single BFC fixes both faults together.
  category: Multiple BIC and BFC scenarios
  category_code: D
  factors:
  - multiple_bic
  - single_bfc
  - composite_bug
  - same_bug
  - multiple_fault_locations
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0015-1-bfc-bic-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create correct range check with separate lower and upper helpers

    c1: first BIC breaks the lower-bound helper

    c2: second BIC breaks the upper-bound helper, completing one composite bug

    c3: one BFC fixes both lower and upper boundary faults'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create composite range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean lowerOk(int value, int min) {\n    return value >=\
      \ min;\n  }\n\n  public boolean upperOk(int value, int max) {\n    return value <= max;\n  }\n\n  public boolean contains(int\
      \ value, int min, int max) {\n    return lowerOk(value, min) && upperOk(value, max);\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: introduce lower-bound part of composite bug'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min;
    new: return value > min;
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: introduce upper-bound part of composite bug'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value <= max;
    new: return value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix both parts of composite range bug'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min;
    new: return value >= min;
  - type: replace
    path: src/main/java/example/Range.java
    old: return value < max;
    new: return value <= max;
