expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c2
    notes: Both c1 and c2 are required because they jointly create one composite bug fixed by c3.
scenario_design:
  purpose: Evaluate a single composite bug whose full faulty behavior is created by multiple BICs and fixed by one BFC.
  key_property: There is one bug record, two BICs, and one BFC. The two BICs affect different helper methods of the same range-checking
    responsibility.
  difference_from_SZZG_0017: SZZG-0015 treats c1 and c2 as multiple BICs for one composite bug. SZZG-0017 treats c1 and c2
    as BICs for two independent bugs in different functional areas.
  evaluation_points:
  - Whether SZZ can return multiple BICs for one bug.
  - Whether a single BFC can be evaluated against multiple required BICs.
  - Whether the benchmark distinguishes a composite bug from multiple independent bugs.
notes:
- This revision clarifies that SZZG-0015 is about one composite bug with multiple BICs.
- The code remains range-focused, but lower-bound and upper-bound faults are introduced by separate commits.
- SZZG-0017 is intentionally redesigned as two independent bugs in different files.
