schema_version: graph-0.1-draft
meta:
  id: SZZG-0045
  title: BIC separated from BFC by an intermediate work-item commit
  slug: bic-bfc-intermediate-work-item
  description: Evaluates a work-item series where an unrelated intermediate commit appears between the bug-introducing commit
    and the bug-fixing commit.
  category: Work-item and commit-series scenarios
  category_code: H
  factors:
  - work_items
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0045-bic-bfc-intermediate-work-item
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c1: create initial state (write_file src/main/java/example/Range.java)

    c2: apply unrelated work-item note (write_file docs/intermediate-note.md)

    c3: fix bug (replace src/main/java/example/Range.java)'
commits:
- id: c1
  branch: main
  parents: []
  message: 'c1: create initial state (write_file src/main/java/example/Range.java)'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: apply unrelated work-item note (write_file docs/intermediate-note.md)'
  role: intermediate
  operations:
  - type: write_file
    path: docs/intermediate-note.md
    content: 'intermediate change

      '
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix bug (replace src/main/java/example/Range.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range boundary bug with an intermediate work-item commit
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ identifies the original BIC when an unrelated work-item candidate commit appears immediately
    before the BFC.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: work_items; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether an unrelated intermediate work-item commit is not mistaken for the BIC.
  - Whether the expected_szz evaluation policy is applied correctly.
