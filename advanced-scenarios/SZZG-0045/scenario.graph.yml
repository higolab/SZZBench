schema_version: graph-1.0
meta:
  id: SZZG-0045
  title: BIC in merge commit
  slug: bic-in-merge-commit
  description: The merge commit itself introduces the bug during merge resolution; a later normal commit fixes it.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - merge
  - merge-commit-bic
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0045-bic-in-merge-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: add feature branch helper without changing the range logic

    c2: add unrelated main branch note

    c3: merge feature into main and introduce bug in the merge commit

    c4: fix the merge-introduced bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: 'Add the feature reporter'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/FeatureReporter.java
    content: "package example;\n\npublic class FeatureReporter {\n  public String name() {\n    return \"feature\";\n  }\n\
      }\n"
- id: c2
  branch: main
  parents:
  - c0
  message: 'Add a release note on main'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main-note.md
    content: 'Main branch note before merge.

      '
- id: c3
  branch: main
  parents:
  - c2
  - c1
  message: 'Merge the feature branch and tighten the range check'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range boundary bug introduced by merge commit
  bug_introducing_commits:
  - commit: c3
    role: direct
    description: The merge commit itself writes the faulty line.
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c3
scenario_design:
  purpose: Evaluate whether SZZ can identify a merge commit as the BIC when the merge resolution itself introduces the bug.
  key_property: The BIC is the two-parent merge commit c3.
  evaluation_points:
  - Merge commit as BIC
  - Later normal BFC
  - No parent contains the buggy range condition before the merge.
notes:
- This scenario requires support for operations on merge commits.
