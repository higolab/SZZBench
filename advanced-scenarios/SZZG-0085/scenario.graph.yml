schema_version: graph-1.0
meta:
  id: SZZG-0085
  title: Old BIC and re-BIC are both plausible
  slug: old-bic-re-bic-plausible
  description: A bug is introduced, fixed, reintroduced by a partial revert, and fixed again. The direct BIC for the final
    fix is the reintroducing commit, but the old original BIC is also a plausible origin-related answer under an origin-aware
    evaluation policy.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - reintroduction
  - partial-revert
  - origin-bic
  - evaluation-variant
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0085-old-bic-and-re-bic-plausible
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce original range boundary bug

    c2: fix original bug and perform a small refactoring

    c3: partially revert c2 and reintroduce the boundary bug while keeping the refactoring

    c4: fix the reintroduced bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check and its source label'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n\n  public String source() {\n    return \"main\";\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept the range bounds and rename the source label'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
  - type: replace
    path: src/main/java/example/Range.java
    old: return "main";
    new: return "range-service";
- id: c3
  branch: main
  parents:
  - c2
  message: 'Revert the range bounds change'
  role: bug_reintroducing
  revert_of: c2
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Reintroduced range boundary bug with old and new plausible BICs
  bug_introducing_commits:
  - commit: c3
    role: reintroducing
    description: Direct BIC for the final bug instance fixed by c4.
    reverts: c2
  - commit: c1
    role: origin
    description: Original BIC where the same faulty logic first appeared.
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
    description: Accepts the bounds again after the reintroduction.
  faults:
  - id: F001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: reintroduced_line_modification
  origin_faults:
  - id: OF001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  default_variant: reintroduction-direct
  evaluation_variants:
  - name: reintroduction-direct
    description: Only the reintroducing commit is considered the correct BIC for the final fix.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c3
      related_origins:
      - c1
  - name: origin-aware
    description: The reintroducing commit is required, and the old origin BIC is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c3
      acceptable_related:
      - commit: c1
        reason: old_origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate a reintroduced bug where the direct re-BIC and the old origin BIC are both plausible depending on the
    evaluation policy.
  key_property: c3 partially reverts c2 by restoring only the faulty boundary condition, while keeping c2's unrelated refactoring.
  difference_from_SZZG_0084: SZZG-0084 should focus on direct reintroduction. SZZG-0085 keeps the same reintroduction theme
    but adds explicit evaluation variants for old-origin-aware evaluation.
  evaluation_points:
  - Whether SZZ identifies c3 as the direct reintroducing BIC for c4.
  - Whether c1 can be treated as an origin-related answer under an alternative evaluation policy.
  - Whether a partial revert is distinguished from the old original BIC.
notes:
- This revision makes SZZG-0085 an evaluation-variant scenario for old BIC versus re-BIC.
- c3 partially reverts c2 only for the boundary condition; it keeps the source-label refactoring from c2.
- The default expected BIC is c3.
