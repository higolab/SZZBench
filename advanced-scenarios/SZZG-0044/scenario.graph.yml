schema_version: graph-0.1-draft
meta:
  id: SZZG-0044
  title: BIC before merge, BFC after merge
  slug: bic-before-merge-bfc-after-merge
  description: A bug is introduced on main before a feature branch is merged, and the bug is fixed on main after the merge.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - merge
  - pre_merge_bic
  - post_merge_bfc
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0044-bic-before-merge-bfc-after-merge
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on main before merge

    c2: perform unrelated feature branch work

    c3: merge feature branch into main

    c4: fix the pre-merge bug on main after merge'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: feature
  parents:
  - c0
  message: 'Add the feature flag helper'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/FeatureFlag.java
    content: "package example;\n\npublic class FeatureFlag {\n  public boolean enabled() {\n    return true;\n  }\n}\n"
- id: c3
  branch: main
  parents:
  - c1
  - c2
  message: 'Merge the feature branch into main'
  role: merge
  operations: []
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Pre-merge main-branch bug fixed after merge
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate a BIC that exists before a merge and a BFC that appears after that merge.
  key_property: Unlike SZZG-0043, the BIC is on main before the merge, not on the feature branch.
  evaluation_points:
  - Pre-merge main BIC
  - Unrelated feature merge between BIC and BFC
  - Post-merge main BFC.
notes:
- This scenario separates pre-merge main-line bug introduction from feature-branch bug introduction.
