expected_szz:
  commit_level:
    evaluation_policy: reintroduction_direct
    required:
    - c3
    notes: c3 is the direct BIC for the final fix c4. Its message and its footer claim a full revert of c2, but
      its diff undoes only the boundary change; the clamp simplification of c2 survives. c1 is the original BIC
      of the same faulty statement.
    related_origins:
    - c1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c3
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: 'Evaluate a partial revert: c3 reintroduces the boundary bug and is the expected direct BIC for the final fix.'
  key_property: c2 carries two independent changes and c3 is produced by a real git revert --no-commit of c2 followed by restoring
    the clamp simplification, so the commit body ends with 'This reverts commit <hash of c2>.' while git show c3 contains a single
    hunk. A revert-aware tool that assumes the whole of c2 was undone is wrong about the clamp method.
  current_schema_limitation: validate-graph --simulate does not model git revert, so the operations of c3 write the whole file;
    the simulated state and the generated state are identical.
  evaluation_points:
  - Whether SZZ identifies c3 as the reintroducing BIC for the final fix.
  - Whether SZZ treats the original BIC c1 as related history, not the required direct answer.
  - Whether a revert-aware tool notices that only part of c2 was reverted.
notes:
- 'c3 has no message of its own: git revert''s default subject ''Revert "<subject of c2>"'' is used, which is what a developer
  who reverts and then fixes up the working tree normally keeps.'
- 'The generator runs git revert --no-commit c2 and applies the operations afterwards (apply_revert: true).'
