schema_version: graph-1.0
meta:
  id: SZZG-0084
  title: Partial revert reintroduces bug
  slug: partial-revert
  description: A commit that carries two independent changes - the boundary fix and a behaviour preserving simplification of clamp
    - is reverted with git revert, but only the boundary part of the revert is kept. The resulting commit carries the standard
    'This reverts commit <hash>.' footer while its diff undoes only half of what it claims to revert, and it is the direct BIC
    for the final fix.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - linear-history
  - revert
  - partial-revert
  - reintroduced-bug
  - re-bic
  - origin-bic
  - revert-footer
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0084-partial-revert
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the Range class with an inclusive contains check and a clamp helper

    c1: Use strict comparisons for the interval bounds

    c2: Restore the inclusive bounds and simplify clamp (two independent changes)

    c3: Revert "Restore the inclusive bounds and simplify clamp" - git revert of c2, keeping the clamp simplification

    c4: Restore the inclusive comparison in Range.contains'
commits:
- id: c0
  branch: main
  parents: []
  message: Add the Range class with an inclusive contains check and a clamp helper
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n\n  public int clamp(int value, int min, int max) {\n    if (value < min) {\n      return\
      \ min;\n    }\n    if (value > max) {\n      return max;\n    }\n    return value;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Use strict comparisons for the interval bounds
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: Restore the inclusive bounds and simplify clamp
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
  - type: replace
    path: src/main/java/example/Range.java
    old: "  public int clamp(int value, int min, int max) {\n    if (value < min) {\n      return min;\n    }\n    if (value >\
      \ max) {\n      return max;\n    }\n    return value;\n  }"
    new: "  public int clamp(int value, int min, int max) {\n    return value < min ? min : (value > max ? max : value);\n  }"
- id: c3
  branch: main
  parents:
  - c2
  role: bug_reintroducing
  revert_of: c2
  apply_revert: true
  date: '2024-01-08T09:20:00Z'
  reverts:
  - commit: c2
    mode: partial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public int clamp(int value, int min, int max) {\n    return value < min ? min : (value\
      \ > max ? max : value);\n  }\n}\n"
- id: c4
  branch: main
  parents:
  - c3
  message: Restore the inclusive comparison in Range.contains
  role: bug_fixing
  date: '2024-01-12T15:30:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
