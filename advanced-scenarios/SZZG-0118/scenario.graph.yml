scenario_design:
  purpose: >
    Make the blame-unreachable half of a two-commit answer a reduced copy, so
    that a tool has to resolve the call in the fixed line to the copy, and then
    resist attributing the copy's line to the file it was copied from.
  key_property: >
    c1 changes nothing that existed before it: it adds a class. c3 is the first
    commit to send user input through that class. Blaming the line the fix
    deletes returns c3 alone, under every blame variant, so the scenario turns
    on one step: resolving the call in the fixed line into the copied class.
    Blame is measured to be reliable once that step is taken - the copy's
    reduced line is attributed to c1 even by -C -C, because the line was
    modified in the copying commit rather than carried over unchanged - so what
    the scenario isolates is the call resolution, not a blame failure.
  evaluation_points:
  - Whether the expected BIC set is reported exactly.
  - Whether the call in the fixed line is resolved to the copied helper.
  - Whether a commit that only adds a class is considered bug-introducing at all.
  failure_mode: >-
    A tool fails here when it stops at blame's `c3`, the call that sends typed input through the
    copy: `c1`, the copy that drops the lower-casing step, is reached only by resolving which helper
    the fixed line calls.
notes:
- The reduced copy is correct for the input it was written for; only the later call makes it a fault.
