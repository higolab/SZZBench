schema_version: graph-1.0
meta:
  id: SZZG-0118
  title: A reduced copy of a helper, and a later call routed through it
  slug: reduced-copy-called-later
  description: >
    The normalizer is copied for imported labels, and the copy drops the
    lower-casing step because imported labels already arrive lower-cased. That
    is correct for its one intended use and changes nothing that existed
    before. A later commit routes user-typed input through the copy, so a typed
    tag no longer matches. The fix calls the full normalizer instead, so the
    line it deletes belongs to the later commit; the reduced copy is reachable
    only by resolving which helper that line calls.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - multi-bic
  - clone
  - origin-and-direct-bic
  - caller-callee-interaction
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
