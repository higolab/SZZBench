schema_version: graph-0.1-draft
meta:
  id: SZZG-0018
  title: Only one clone instance is fixed first
  slug: clone
  description: >-
    A.java already contains an exclusive range check at c0. Commit c1 copies the file to B.java and adapts only
    the class declaration, so the faulty statement enters B.java byte-for-byte unchanged. c2 fixes the original
    instance and c3 fixes the copied instance, so the two clone instances become two separate bug entries with
    two BFCs. The copied instance keeps the copy commit c1 as its direct BIC.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - clone_relationships
  - bug_instances
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0018-clone
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add A with an exclusive range check (origin instance)

    c1: copy A.java to B.java and rename the copied class (direct BIC for B.java)

    c2: include the bounds in A.contains (BFC of the original instance)

    c3: include the bounds in B.contains (BFC of the copied instance)'
commits:
- id: c0
  branch: main
  parents: []
  message: Add A with a range containment check
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: |
      package example;

      public class A {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: Copy the containment check from A into B
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
  - type: replace
    path: src/main/java/example/B.java
    old: public class A {
    new: public class B {
- id: c2
  branch: main
  parents:
  - c1
  message: Include the bounds in A.contains
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/A.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: c3
  branch: main
  parents:
  - c2
  message: Include the bounds in B.contains
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001-A
  title: Original instance fixed first
  bug_introducing_commits:
  - commit: c0
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c0
    file: src/main/java/example/A.java
    statement: return value > min && value < max;
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/A.java
    statement: return value >= min && value <= max;
- id: B001-B
  title: Copied instance fixed later
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c0
    role: origin
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F002
    commit: c1
    file: src/main/java/example/B.java
    statement: return value > min && value < max;
  fixes:
  - id: X002
    commit: c3
    file: src/main/java/example/B.java
    statement: return value >= min && value <= max;
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c0
    - c1
    notes: >
      Two bug entries share this history and both bug-fixing commits are in
      scope, so the scenario oracle is the union of their direct BICs
      (contract D9): c0 wrote the fault into A.java, which c2 fixes, and c1
      copied it into B.java, which c3 fixes. c0 is also the origin of B001-B;
      because it is already required no origin-aware variant is needed, since
      it would be identical to the default.
clone_relationships:
- origin_file: src/main/java/example/A.java
  copied_file: src/main/java/example/B.java
  origin_commit: c0
  copy_commit: c1
bug_instances:
- id: B001-A
  file: src/main/java/example/A.java
  status: fixed_at_c2
- id: B001-B
  file: src/main/java/example/B.java
  status: fixed_at_c3
scenario_design:
  purpose: Evaluate Only one clone instance is fixed first and whether SZZ identifies the expected bug-introducing commit
    set.
  key_property: >-
    The two clone instances are fixed by two different commits, so the scenario carries two bug entries and
    both bug-fixing commits are in scope. The expected_szz set is therefore the union of their direct BICs:
    c0, which wrote the fault into A.java that c2 fixes, and c1, which copied it into B.java that c3 fixes.
  compilation_contract: >-
    Both files live in package example and must compile together, so the copy commit renames the copied class from
    A to B in the same commit. Only the class declaration line differs between A.java and B.java; the faulty
    statement is copied verbatim, which is what copy-aware blame has to detect.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: clone_relationships, bug_instances; operations: write_file,
    copy_file, replace.'
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether structural or contextual history is handled according to the scenario factors.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- >-
  2026-09 revision (issue 10): the copy commit produced a second `public class A` in B.java, so no commit from c1 onwards
  compiled ("class A is public, should be declared in a file named A.java"). The copy commit now renames the copied class
  to B, so A.java and B.java compile together in package example. The oracle (two bug entries, direct BIC c1 for the
  copied instance, origin c0, BFCs c2 and c3) and the copied faulty statement are unchanged; the commit messages were
  rewritten to realistic, role-neutral text.
