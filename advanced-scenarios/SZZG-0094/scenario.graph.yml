schema_version: graph-0.1-draft
meta:
  id: SZZG-0094
  title: BIC and BFC belong to the same issue commit series
  slug: bic-bfc-issue-commit
  description: Evaluates a bug-introducing commit and a bug-fixing commit that are both linked to the same issue series.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - issues
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0094-bic-bfc-issue-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c1: create initial range implementation

    c2: ISSUE-101 implement boundary optimization but introduce bug

    c3: ISSUE-101 fix inclusive boundary regression'
commits:
- id: c1
  branch: main
  parents: []
  message: 'Create initial range implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;
      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
- id: c2
  branch: main
  parents:
  - c1
  message: 'ISSUE-101: implement boundary optimization'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'ISSUE-101: fix inclusive boundary regression'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Boundary regression introduced and fixed in the same issue series
  bug_introducing_commits:
  - commit: c2
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
scenario_design:
  purpose: Evaluate whether issue-series context is preserved when the BIC and BFC both reference the same issue.
  current_schema_limitation: Issue membership and linked commits require graph-aware contextual metadata.
  required_extensions_from_source: 'This scenario uses factors: issues; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c2 as the BIC rather than the initial commit.
  - Whether both the BIC and BFC are represented as part of ISSUE-101.
  - Whether the expected_szz exact-set policy is applied correctly.
notes:
- This scenario intentionally keeps the source change simple while making issue membership explicit.
issues:
- id: ISSUE-101
  title: Boundary handling issue series
  description: The same issue contains the optimization that introduced the boundary bug and the follow-up fix.
  linked_bugs:
  - B001
  commits:
  - commit: c2
    relevance: bug_introducing
  - commit: c3
    relevance: bug_fixing
