schema_version: graph-1.0
meta:
  id: SZZG-0127
  title: Reverting a merge commit brings the merged branch's fix back out
  slug: merge-revert-reintroduces-bug
  description: >
    A fault on main is fixed on a feature branch, and the branch is merged. The merge is later reverted
    with `git revert -m 1`, which undoes everything the branch brought in -- including the fix -- so the
    fault is back. A second fix on main repairs it again.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - revert
  - merge-revert
  - reintroduction
  - fix-on-feature-branch
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0127-merge-revert-reintroduces-bug
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the discount gate'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/DiscountGate.java
    content: |
      package example;

      public class DiscountGate {
          public boolean qualifies(int items, int threshold) {
              return items >= threshold;
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Require more items than the threshold for the discount'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/DiscountGate.java
    old: return items >= threshold;
    new: return items > threshold;
- id: f1
  branch: feature
  parents:
  - c1
  message: 'Grant the discount at the threshold as the pricing page promises'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/DiscountGate.java
    old: return items > threshold;
    new: return items >= threshold;
- id: m1
  branch: main
  parents:
  - c1
  message: 'Describe the discount gate for the pricing team'
  role: intermediate
  operations:
  - type: write_file
    path: docs/discount-gate.md
    content: |
      # Discount gate

      `qualifies` decides whether an order gets the volume discount.
- id: c3
  branch: main
  parents:
  - m1
  - f1
  message: "Merge branch 'feature' into main"
  role: merge
  operations: []
- id: c4
  branch: main
  parents:
  - c3
  role: bug_introducing
  revert_of: c3
  mainline: 1
- id: c5
  branch: main
  parents:
  - c4
  message: 'Grant the discount at the threshold again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/DiscountGate.java
    old: return items > threshold;
    new: return items >= threshold;
bugs:
- id: B001
  title: An order exactly at the threshold gets no discount
  bug_introducing_commits:
  - commit: c4
    role: reintroducing
  - commit: c1
    role: origin
  bug_fixing_commits:
  - commit: c5
    role: complete_fix
  faults:
  - id: F001
    commit: c4
    file: src/main/java/example/DiscountGate.java
    statement: return items > threshold;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c5
    file: src/main/java/example/DiscountGate.java
    statement: return items >= threshold;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: c1
    file: src/main/java/example/DiscountGate.java
    statement: return items > threshold;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c4
    related_origins:
    - c1
    related_but_not_correct:
    - f1
    - c3
    notes: >
      c4, the revert of the merge, is what put the faulty comparison back in front of the fix c5, so it is
      the reintroducing BIC (direct/origin contract D7). c1 wrote the same text first and is the origin; f1
      is the fix the revert undid and c3 the merge that carried it.
  evaluation_variants:
  - name: origin-aware
    description: The reintroducing commit is required; the original BIC is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c4
      acceptable_related:
      - commit: c1
        reason: original_bic
        credit: 0.5
      related_but_not_correct:
      - f1
      - c3
scenario_design:
  purpose: >
    The existing revert scenarios revert ordinary commits. Reverting a merge commit (`git revert -m 1`)
    undoes a whole branch at once, and the fix that came with it disappears without any commit mentioning
    the fix. The reintroducing commit's diff is the branch's diff inverted.
  key_property: >
    Blaming the line c5 deletes at c5^ returns c4: the revert rewrote the line. c4's footer names the
    merge c3, not c1, so following footers leads to the merge, and from there a tool needs the second
    parent to find that f1 is what was undone.
  evaluation_points:
  - Report c4 as the reintroducing BIC.
  - Treat c1 as origin, f1 and c3 as related but not the answer.
notes:
- c4 is generated by a real `git revert --no-commit --mainline 1` of the merge; its subject and footer are
  git's.
