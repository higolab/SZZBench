schema_version: graph-0.1-draft
meta:
  id: SZZG-0070
  title: Rebase combines multiple BICs into one commit
  slug: rebase-combines-multiple-bics-into-one-commit
  description: Two origin BICs are combined into one direct BIC during interactive rebase.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - interactive_rebase
  - squash
  - multiple_origin_bic
  - direct_bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0070-rebase-combines-multiple-bics-into-one-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: introduce lower-bound bug

    f2: introduce upper-bound bug

    r1: rebase combined boundary bugs as one commit

    c2: fix combined rebased bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Tighten the lower bound'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value <= max;
- id: f2
  branch: feature
  parents:
  - f1
  message: 'Tighten the upper bound'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value <= max;
    new: return value > min && value < max;
- id: r1
  branch: main
  parents:
  - c0
  message: 'Tighten both range bounds'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
  rebase_of:
  - f1
  - f2
  interactive_rebase: squash
- id: c2
  branch: main
  parents:
  - r1
  message: 'Accept both range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Combined rebased boundary bug
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  - commit: f2
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/Range.java
    statement: return value > min && value <= max;
    change_type: origin_line_modification
  - id: OF002
    commit: f2
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: The direct answer is combined commit r1.
    related_origins:
    - f1
    - f2
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      - commit: f2
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate multiple-origin-to-one-direct BIC mapping after interactive rebase.
  key_property: f1 and f2 become one direct commit r1.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
