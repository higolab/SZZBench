schema_version: graph-1.0
meta:
  id: SZZG-0070
  title: Rebase combines multiple BICs into one commit
  slug: rebase-combines-multiple-bics-into-one-commit
  description: >
    Two origin BICs are combined into one direct BIC during interactive rebase. On the feature branch
    the last index of a page is first shifted by a whole page (pages treated as zero-based) and then by
    one more element (the end treated as exclusive); the squash replays both edits as a single commit
    on main.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - interactive-rebase
  - squash
  - multiple-origin-bic
  - origin-vs-direct
  - off-by-one
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0070-rebase-combines-multiple-bics-into-one-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add the pagination helper (1-based pages, inclusive last index)

    f1: treat pages as zero-based (one page too far)

    f2: treat the last index as exclusive (one element too far)

    r1: rebase the two edits squashed into one commit

    c2: restore the 1-based, inclusive last index'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the pagination helper'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Pagination.java
    content: |
      package example;

      public class Pagination {
        /** Index of the last element of 1-based {@code page} when pages hold {@code size} elements; inclusive. */
        public int lastIndex(int page, int size) {
          return (page - 1) * size + (size - 1);
        }
      }
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Treat pages as zero-based in lastIndex'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Pagination.java
    old: return (page - 1) * size + (size - 1);
    new: return page * size + (size - 1);
- id: f2
  branch: feature
  parents:
  - f1
  message: 'Return the exclusive end index from lastIndex'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Pagination.java
    old: return page * size + (size - 1);
    new: return page * size + size;
- id: r1
  branch: main
  parents:
  - c0
  message: 'Rework the last-index arithmetic'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Pagination.java
    old: return (page - 1) * size + (size - 1);
    new: return page * size + size;
  rebase_of:
  - f1
  - f2
  interactive_rebase: squash
- id: c2
  branch: main
  parents:
  - r1
  message: 'Restore the 1-based, inclusive last index'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Pagination.java
    old: return page * size + size;
    new: return (page - 1) * size + (size - 1);
bugs:
- id: B001
  title: The last index of a page is one page and one element too far after the squashed rebase
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  - commit: f2
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/Pagination.java
    statement: return page * size + size;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Pagination.java
    statement: return (page - 1) * size + (size - 1);
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/Pagination.java
    statement: return page * size + (size - 1);
    change_type: origin_line_modification
  - id: OF002
    commit: f2
    file: src/main/java/example/Pagination.java
    statement: return page * size + size;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: The direct answer is the combined commit r1.
    related_origins:
    - f1
    - f2
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origins are accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      - commit: f2
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate multiple-origin-to-one-direct BIC mapping after interactive rebase.
  key_property: >
    f1 and f2 become one direct commit r1. Measured: lastIndex(1, 10) is 9 at c0, 19 at f1, 20 at f2 and r1, 9
    at c2. Blaming the line c2 deletes at c2^ returns r1.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
  failure_mode: >-
    A tool fails here when it follows the feature branch and reports `f1` and `f2`: the squash `r1` is the
    change that put the fault on main, and the two sources are false positives under the default oracle.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
- Rewritten 2026-09-21 from the shared Range.contains template to an off-by-one fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
- The domain this scenario supports is a page index times a page size that still fits int, since the
  last index multiplies them in int; the bound is probed by tests/test_reference_arithmetic.py (issue #82).
