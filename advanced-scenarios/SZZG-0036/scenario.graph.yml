schema_version: graph-1.0
meta:
  id: SZZG-0036
  title: Fix split across multiple commits
  slug: fix-commit
  description: A test-only commit sits between the fault and the two commits that repair one bound each.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - multi-bfc
  - test-file-added
  difficulty: medium
  status: active
  tier: control
repository:
  name: SZZG-0036-fix-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file src/main/java/example/Range.java)

    c1: introduce bug (replace src/main/java/example/Range.java)

    c2: add test context (write_file src/test/java/example/RangeTest.java)

    c3: fix bug (replace src/main/java/example/Range.java)

    c4: fix bug (replace src/main/java/example/Range.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Add the range boundary test'
  role: test_change
  operations:
  - type: write_file
    path: src/test/java/example/RangeTest.java
    content: 'package example;

      // expected: boundary values must be accepted

      '
- id: c3
  branch: main
  parents:
  - c2
  message: 'Accept the lower bound again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value < max;
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the upper bound again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Fix series split across test, partial fix, final fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: partial_fix
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value < max;
    fix_type: partial_fix
  - id: X002
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: complete_fix
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
fix_series:
- id: FIX-B001
  commits:
  - c2
  - c3
  - c4
scenario_design:
  purpose: >-
    Check that a test-only commit inside the fix series changes nothing: c2 adds a test file between the
    bug-introducing commit and the two fixes, and a method must report c1 for both fixes, exactly as in SZZG-0029,
    which has the same fault and fixes without it.
