schema_version: graph-0.1-draft
meta:
  id: SZZG-0036
  title: Cherry-pick BFC
  slug: cherry-pick-bfc
  description: A bug exists on both main and release branches. The bug is fixed on main, and the BFC is then cherry-picked
    onto the release branch to fix the release instance.
  category: Branch, merge, cherry-pick, and backport scenarios
  category_code: G
  factors:
  - branch
  - cherry_pick_of
  - bug_fixing_commits
  - bug_instances
  - backport_like_fix
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0036-cherry-pick-bfc
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on main before the release branch is cut

    r1: create release branch from the buggy state

    c2: fix bug on main

    r2: cherry-pick the main BFC onto release'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial correct implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: introduce range boundary bug'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: r1
  branch: release
  parents:
  - c1
  message: 'r1: create release branch from buggy state'
  role: release_branch_point
  operations:
  - type: write_file
    path: docs/release-note.md
    content: 'Release branch is cut while the range boundary bug is still present.

      '
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: fix range boundary bug on main'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: r2
  branch: release
  parents:
  - r1
  message: 'r2: cherry-pick main range boundary fix onto release'
  role: bug_fixing
  cherry_pick_of: c2
  operations:
  - type: apply_patch_from
    commit: c2
bugs:
- id: B001
  title: Range boundary bug fixed on main and cherry-picked to release
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: main_fix
  - commit: r2
    role: cherry_picked_release_fix
    cherry_pick_of: c2
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: main_line_fix
  - id: X002
    commit: r2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: cherry_picked_fix
  bug_instances:
  - branch: main
    status: fixed
    fix_commit: c2
  - branch: release
    status: fixed
    fix_commit: r2
    cherry_pick_of: c2
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    notes: The original BIC is c1. Both c2 and r2 are BFCs. r2 is a cherry-picked instance of the main-line BFC c2.
  branch_level:
    main:
      bfc: c2
      required:
      - c1
    release:
      bfc: r2
      required:
      - c1
scenario_design:
  purpose: Evaluate whether SZZ can identify the original BIC when a bug-fixing commit is cherry-picked from main to a release
    branch.
  key_property: The cherry-picked commit r2 is a BFC, not a BIC. This distinguishes SZZG-0036 from SZZG-0035, where the cherry-picked
    commit is a BIC.
  difference_from_SZZG_0035: SZZG-0035 is about cherry-picking the BIC onto another branch. SZZG-0036 is about cherry-picking
    the BFC onto another branch.
  evaluation_points:
  - Whether SZZ treats the release BFC r2 as a fixing commit.
  - Whether SZZ traces from r2 back to the original BIC c1 rather than to the main-line BFC c2.
  - Whether a cherry-picked fix is handled as a branch-specific bug-fixing instance.
notes:
- This revision changes the cherry-picked commit from the BIC to the BFC.
- The release branch is created from the buggy state at c1.
- The main fix c2 is cherry-picked onto release as r2.
- If apply_patch_from cannot be validated by the current verifier, r2 can be represented with an explicit replace operation
  equivalent to c2.
bug_instances:
- id: B001-main
  branch: main
  status: fixed
- id: B001-release
  branch: release
  status: open
