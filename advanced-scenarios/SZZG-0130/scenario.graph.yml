    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/PageSize.java
    statement: return Math.min(requested, max);
    fix_type: line_modification
issues:
- id: ISSUE-31
  title: The last row of a full page is missing
  reported_at: '2024-03-07T09:12:00Z'
  document: docs/issues/ISSUE-31.md
  linked_bugs:
  - B001
  excludes_commits:
  - c3
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c3
    notes: >
      c3 rewrote the faulty line after the report was filed and changed no behaviour; blame returns it.
      The report in docs/issues/ISSUE-31.md is dated 2024-03-07, c3 is dated 2024-03-11, so a tool that
      excludes commits made after the report is left with c1.
scenario_design:
  purpose: >
    The first scenario with tool-visible context inside the repository (decisions/tool-visible-context.md).
    The report and its date are a committed document, so a tool that is only given the repository can
    apply the report-date heuristic; here that heuristic is right.
  key_property: >
    Measured: clamp(50, 50) is 50 at c0, 49 at c1, 49 at c3, 50 at c4. Blaming the line c4 deletes at c4^
    returns c3, dated 2024-03-11T16:05:00Z; the report says Reported: 2024-03-07T09:12:00Z; c1 is dated
    2024-03-04T14:20:00Z. Every date is pinned.
  evaluation_points:
  - Report c1.
  - Do not report c3, which blame returns and which post-dates the report.
notes:
- The report document is written by an ordinary commit and scanned by the leakage lint like any other text.
