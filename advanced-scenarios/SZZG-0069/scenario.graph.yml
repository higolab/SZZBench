schema_version: graph-1.0
meta:
  id: SZZG-0069
  title: Rebase splits original BIC into multiple commits
  slug: rebase-splits-original-bic-into-multiple-commits
  description: >
    One origin BIC is split into two direct BICs during rebase. The feature commit mistypes both
    constants of the retry backoff on one line (base 100 ms written as 10, cap 30000 ms written as
    3000); the rebase replays the base change and the cap change as two commits, so the faulty line
    on main has two authors and the oracle has two required commits.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - split-bic
  - multi-bic
  - origin-bic
  - direct-bic
  - wrong-constant
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0069-rebase-splits-original-bic-into-multiple-commits
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add the retry backoff (100 ms base, 30000 ms cap)

    f1: mistype both backoff constants on the feature branch (10 and 3000)

    r1: rebase the base change (10)

    r2: rebase the cap change (3000)

    c3: restore both constants'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the retry backoff'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Backoff.java
    content: |
      package example;

      public class Backoff {
        /** Delay before retry number {@code attempt} (non-negative): 100 ms doubling per attempt, capped at 30 s. */
        public int delayMillis(int attempt) {
          int doublings = Math.min(Math.max(attempt, 0), 30);
          return (int) Math.min(100L << doublings, 30000L);
        }
      }
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Tune the backoff to a 100 ms base and a 30 s cap'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Backoff.java
    old: return (int) Math.min(100L << doublings, 30000L);
    new: return (int) Math.min(10L << doublings, 3000L);
- id: r1
  branch: main
  parents:
  - c0
  message: 'Tune the backoff base'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Backoff.java
    old: return (int) Math.min(100L << doublings, 30000L);
    new: return (int) Math.min(10L << doublings, 30000L);
  rebase_of: f1
  x-rebase_split_part: base
- id: r2
  branch: main
  parents:
  - r1
  message: 'Tune the backoff cap'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Backoff.java
    old: return (int) Math.min(10L << doublings, 30000L);
    new: return (int) Math.min(10L << doublings, 3000L);
  rebase_of: f1
  x-rebase_split_part: cap
- id: c3
  branch: main
  parents:
  - r2
  message: 'Restore the backoff constants: 100 ms base, 30000 ms cap'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Backoff.java
    old: return (int) Math.min(10L << doublings, 3000L);
    new: return (int) Math.min(100L << doublings, 30000L);
