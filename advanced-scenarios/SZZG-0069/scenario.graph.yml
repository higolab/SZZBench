expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    - r2
    notes: The direct BIC set is r1 and r2. The fix deletes one line, which blame attributes to r2 alone; r1's
      share of the fault (the base) is only visible one step further back in the line's history.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      - r2
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate one-origin-to-multiple-direct BIC mapping after rebase.
  key_property: >
    f1 is split into r1 and r2, both editing the same line. The doubling count is clamped to [0, 30] and the
    product is taken in long before the cap, so the delay saturates instead of wrapping for any attempt.
    Measured: delayMillis(0) is 100 at c0, 10 from r1 on and 100 at c3; delayMillis(10) is 30000 at c0, 10240
    at r1 (the smaller base, still capped at 30000), 3000 at r2 and 30000 at c3; delayMillis(25), (31) and (32)
    are 30000 at c0, r1 and c3 and 3000 at f1 and r2. Blaming the line c3 deletes at c3^ returns r2 only, so
    plain blame recovers half of the required set and the scenario stays in the discriminating tier.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Return r1 and r2.
  failure_mode: >-
    A tool fails here when it stops at the most recent change to the line, `r2`, and misses `r1`: the rebase
    split one faulty commit into two, and both are required.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
- Rewritten 2026-09-21 from the shared Range.contains template to a wrong-constant fault (GitHub issue 13); the history
  shape, oracle, tier and coverage dimensions are unchanged.
