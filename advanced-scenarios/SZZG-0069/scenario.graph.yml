  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - split-bic
  - multi-bic
  - origin-bic
  - direct-bic
  difficulty: advanced
  status: active
  tier: discriminating
repository:
