  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: introduce both boundary bugs

    r1: rebase lower-bound part

    r2: rebase upper-bound part

    c3: fix both boundary bugs'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: r1
  branch: main
  parents:
  - c0
  message: 'Tighten the lower bound'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value <= max;
  rebase_of: f1
  rebase_split_part: lower_bound
- id: r2
  branch: main
  parents:
  - r1
  message: 'Tighten the upper bound'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value <= max;
    new: return value > min && value < max;
  rebase_of: f1
  rebase_split_part: upper_bound
- id: c3
  branch: main
  parents:
  - r2
  message: 'Accept both range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
