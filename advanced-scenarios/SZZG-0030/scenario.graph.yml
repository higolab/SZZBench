schema_version: graph-1.0
meta:
  id: SZZG-0030
  title: Attempted fix followed by follow-up fix
  slug: follow-up-fix-bfc
  description: A bug is introduced by excluding boundary values. A later attempted fix changes the condition but uses the
    wrong boolean operator, so the code is still incorrect. A follow-up fix then applies the correct condition.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - multi-bfc
  - attempted-fix
  - follow-up-fix
  - incorrect-fix
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0030-follow-up-fix-bfc
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce boundary exclusion bug

    c2: attempt to fix the bug but introduce wrong boolean logic

    c3: apply follow-up fix with the correct boundary condition'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Exclude the bounds from the range check'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept the range bounds again'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min || value <= max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Require both bounds to hold'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min || value <= max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: The range check excludes its bounds
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min || value <= max;
    fix_type: line_modification
- id: B002
  title: The repaired range check accepts every value
  bug_introducing_commits:
  - commit: c2
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F002
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min || value <= max;
    change_type: line_modification
  fixes:
  - id: X002
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c2
    notes: >
      c2 repairs one fault and writes another, and both are observable:
      contains(5,5,7) goes false -> true at c2 (the bounds are accepted again)
      while contains(99,5,7) goes false -> true as well (a value outside the
      range is now accepted, because || replaced &&). Contract D6 therefore
      models them as two bug entries, and D9 makes the scenario oracle the
      union of their direct BICs. Reporting c1 alone leaves the fault c3 fixes
      unattributed.
scenario_design:
  purpose: Evaluate an attempted fix followed by a follow-up fix. Unlike a partial fix, the attempted fix in c2 uses an incorrect
    boolean operator and is therefore a failed repair attempt rather than a correct partial repair.
  key_property: >-
    c2 changes the code in a fix-like direction and does repair the boundary exclusion, but by using || instead
    of && it writes a second, different fault in the same commit. Both effects are observable, so the scenario
    carries two bug entries and the oracle is the union {c1, c2}.
  difference_from_SZZG_0029: SZZG-0029 represents a partial fix where one side of the boundary condition is correctly repaired.
    This scenario represents an attempted fix that introduces wrong boolean logic and requires a follow-up fix.
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC of the boundary-exclusion fault.
  - Whether SZZ also identifies c2, a fix-like commit, as the BIC of the fault c3 repairs.
  - Whether a failed attempted fix is distinguished from a true partial fix.
  - Whether the follow-up fix c3 is treated as the effective bug-fixing commit.
notes:
- This revision changes c2 from the same partial-fix state as SZZG-0029 to an attempted fix with incorrect boolean logic.
- The attempted fix `value >= min || value <= max` is intentionally wrong because it accepts almost all integer values.
- The expected BIC set is {c1, c2}: c1 introduced the boundary exclusion and c2, while repairing it, wrote the fault c3 fixes.
