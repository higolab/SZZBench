expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c0
    notes: >
      c0 wrote `return daysLate * centsPerDay;` and nothing says the code existed before it, so it
      is the bug-introducing commit like any other. Compare SZZG-0136, where the same c0 content
      arrives as an import with a stated earlier history and the answer is the empty set.
scenario_design:
  purpose: >
    The third of three contracts for "no ordinary BIC" (issue #24) — the one where there is an
    ordinary BIC after all: a fault present since the initial commit is attributed to that commit
    when the commit authored the code. The twin SZZG-0136 differs only in provenance evidence.
  key_property: >
    Measured: feeCents(5, 3, 100) is 500 at c0, c1 and c2 and 200 at c3. Blaming the line c3
    deletes at c3^ returns c0, which is the expected BIC. c1, c2 and c3 are byte-identical to
    SZZG-0136's in message, author, date and source tree; only c0's message differs and
    docs/IMPORT.md is absent.
  evaluation_points:
  - Report c0.
  - Do not abstain merely because the BIC is the root commit.
