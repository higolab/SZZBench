scenario_design:
  purpose: >
    The same commits as SZZG-0057, with one difference in the repository a tool receives: the pre-rebase
    branch `feature` is deleted after the rebase, so the origin f1 keeps a valid hash but is reachable from
    no ref. SZZG-0057 keeps the branch. The pair separates tools that walk from refs from tools that walk
    every object, on an otherwise identical history and identical oracle.
  key_property: >
    r1 is the direct BIC in both twins. Here `git log --all` shows a single copy of the faulty change; in
    SZZG-0057 it shows two. The required set does not change, only what is visible (direct/origin contract D8).
  evaluation_points:
  - Report r1.
  - Do not report m1/m2.
  - Behave the same as on SZZG-0057; a tool whose answer differs between the twins depends on ref reachability.
  failure_mode: >-
    A tool fails here when its answer differs from SZZG-0057's: the pre-rebase branch was deleted, and a tool
    that reads ref reachability behaves differently between the twins.
notes:
- Twin of SZZG-0057; the only difference is graph.ref_lifecycle.delete_branches.
