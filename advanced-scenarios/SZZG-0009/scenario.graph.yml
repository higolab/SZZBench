schema_version: graph-1.0
meta:
  id: SZZG-0009
  title: Intermediate method extraction between BIC and BFC
  slug: intermediate-method-extraction
  description: >-
    A refactoring commit extracts the threshold test into its own method between the fault and the fix, so the line
    the fix repairs lives in a method that did not exist when the fault was written.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - intermediate-refactoring
  - extract-method
  - line-history-break
  difficulty: hard
  status: active
  tier: control
repository:
  name: SZZG-0009-intermediate-method-extraction
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create shipping fee calculation

    c1: introduce free-shipping threshold bug

    c2: extract free-shipping predicate

    c3: fix extracted threshold predicate'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the shipping fee calculation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Shipping.java
    content: "package example;\npublic class Shipping {\n  public int fee(int subtotal) {\n    int base = 500;\n    if (subtotal\
      \ >= 5000) {\n      base = 0;\n    }\n    return base;\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Require a subtotal above the free-shipping threshold'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Shipping.java
    old: if (subtotal >= 5000) {
    new: if (subtotal > 5000) {
- id: c2
  branch: main
  parents:
  - c1
  message: 'Extract the free-shipping predicate'
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/example/Shipping.java
    old: if (subtotal > 5000) {
    new: if (qualifiesForFreeShipping(subtotal)) {
  - type: insert_after
    path: src/main/java/example/Shipping.java
    anchor: "    return base;\n  }\n\n"
    content: "  private boolean qualifiesForFreeShipping(int subtotal) {\n    return subtotal > 5000;\n  }\n"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Include the threshold in free shipping'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Shipping.java
    old: return subtotal > 5000;
    new: return subtotal >= 5000;
