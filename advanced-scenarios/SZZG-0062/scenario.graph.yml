schema_version: graph-1.0
meta:
  id: SZZG-0062
  title: Backported fix on maintenance branch traces to original mainline BIC
  slug: backported-fix-maintenance-branch
  description: >-
    The fix is made on main and backported to a release branch that was cut after the fault, so the release branch's
    bug-fixing commit traces to a main-line bug-introducing commit.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - backport
  - maintenance-branch
  - cross-branch-bic
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0062-backported-fix-maintenance-branch
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create lock timeout

    c1: introduce too-short timeout on main

    c2: release branch cut from buggy main

    c3: fix timeout on main

    c4: backport timeout fix to release branch'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the lock timeout'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/LockPolicy.java
    content: "package example;\npublic class LockPolicy {\n  public int timeoutSeconds() {\n    return 30;\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Shorten the lock timeout to 3 seconds'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/LockPolicy.java
    old: return 30;
    new: return 3;
- id: c2
  branch: release
  parents:
  - c1
  message: 'Cut the release branch'
  role: other
  allow_empty: true
  operations: []
- id: c3
  branch: main
  parents:
  - c1
  message: 'Restore the 30-second lock timeout'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/LockPolicy.java
    old: return 3;
    new: return 30;
- id: c4
  branch: release
  parents:
  - c2
  message: 'Backport the lock timeout to release'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/LockPolicy.java
    old: return 3;
    new: return 30;
bugs:
- id: B001
  title: The lock times out after three seconds instead of thirty
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/LockPolicy.java
    statement: return 3;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/LockPolicy.java
    statement: return 30;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: >-
    Evaluate whether a method traces a backported fix on a release branch to the main-line bug-introducing commit.
  failure_mode: >-
    A tool fails here when, starting from the backported fix on the release branch, it reports release-branch
    commits instead of tracing back to the main-line bug-introducing commit the release shares.
