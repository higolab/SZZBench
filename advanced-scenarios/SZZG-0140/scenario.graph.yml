schema_version: graph-1.0
meta:
  id: SZZG-0140
  title: "Top-k with a strict status cut-off: the BIC must be ranked first, hit@3 is only reported"
  slug: top-k-strict-status
  description: >
    A boundary fault is introduced, the faulty line is reformatted by a later commit, and the fix
    comes after an unrelated change. A ranked tool that orders candidates by blame recency puts the
    reformatting commit first and the BIC second. SZZG-0115 reports hit@1/3/5 and passes whenever
    the BIC is within the largest k; this scenario sets status_k 1, so the same ranking is
    reported as hit@3 but fails. The two scenarios differ only in that key.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - top-k
  - formatting-noise
  - basic-blame-distractor
  - boundary-condition
  - single-bic
  - single-bfc
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0140-top-k-strict-status
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the threshold check'
  role: initial
  date: '2024-06-03T09:10:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/alerts/Threshold.java
    content: |
      package example.alerts;

      public class Threshold {
          /** True when {@code value} is strictly above {@code limit}; the limit itself is allowed. */
          public boolean exceeds(int value, int limit) {
              return value > limit;
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Alert when the limit is reached'
  role: bug_introducing
  date: '2024-06-10T14:25:00Z'
  operations:
  - type: replace
    path: src/main/java/example/alerts/Threshold.java
    old: return value > limit;
    new: return value >= limit;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Reformat Threshold to the project style'
  role: intermediate
  date: '2024-06-17T10:40:00Z'
  operations:
  - type: replace
    path: src/main/java/example/alerts/Threshold.java
    old: |
      public boolean exceeds(int value, int limit) {
              return value >= limit;
          }
    new: |
      public boolean exceeds(int value, int limit) {
              boolean exceeded = value >= limit;
              return exceeded;
          }
- id: c3
  branch: main
  parents:
  - c2
  message: 'Add the alert message'
  role: intermediate
  date: '2024-06-24T15:55:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/alerts/AlertMessage.java
    content: |
      package example.alerts;

      public class AlertMessage {
          public String text(String metric, int value, int limit) {
              return metric + " is " + value + " (limit " + limit + ")";
          }
      }
- id: c4
  branch: main
  parents:
  - c3
  message: 'Allow the limit itself again'
  role: bug_fixing
  date: '2024-07-01T11:30:00Z'
  operations:
  - type: replace
    path: src/main/java/example/alerts/Threshold.java
    old: boolean exceeded = value >= limit;
    new: boolean exceeded = value > limit;
