expected_szz:
  commit_level:
    evaluation_policy: top_k
    relevant:
    - c1
    k_values:
    - 1
    - 3
    - 5
    status_k: 1
    related_but_not_correct:
    - c2
    known_distractors:
    - c2
    notes: >
      hit@1, hit@3 and hit@5 are reported; only hit@1 decides the status. Blame at c4^ returns c2,
      the reformatting; a ranking of (c2, c1) is hit@3 but not hit@1 and fails. SZZG-0115 has the
      same k_values without status_k and passes such a ranking.
scenario_design:
  purpose: >
    Third member of the top_k family (with SZZG-0096 and SZZG-0115): the status_k key, which makes
    the status strict while the report still shows the larger cut-offs.
  key_property: >
    Measured: exceeds(10, 10) is false at c0, true at c1, c2, c3 and false at c4. c2 rewrote the
    faulty line into two, so the fault statement is not present at c4^ (GI701, declared by
    formatting-noise); blaming the line c4 deletes returns c2.
  evaluation_points:
  - A ranking with c1 first passes; a ranking with c2 first and c1 second is hit@3 and fails.
  - False positives never fail a top_k scenario; the rank of the first relevant commit does.
