schema_version: graph-1.0
meta:
  id: SZZG-0151
  title: A merge takes the branch's side and puts the reverted unit back without saying so
  slug: merge-undoes-the-revert
  description: >
    A commit restates the daily rate in euros and converts its only reader at
    the same time, and is reverted two days later. A reporting branch forked
    before the revert still carries the euro form, and the merge that brings the
    branch back resolves the conflict in its favour, so the reverted change is
    in force again with no revert commit to show for it. A later commit adds a
    surcharge that reads the constant as cents. The fix repairs the surcharge,
    and blame on the line it deletes stops there; the constant's line still
    belongs to the commit that first wrote it, which the revert has already
    undone once.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - multi-bic
  - single-bfc
  - revert
  - reintroduction
  - merge
  - value-flow
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
