expected_szz:
  commit_level:
    evaluation_policy: reintroduction_direct
    required:
    - c4
    - c5
    related_origins:
    - c1
    related_but_not_correct:
    - c2
    notes: >
      c4 is the commit that put the euro form in force at the fix: it is the merge whose conflict
      resolution took the reporting branch's file, and its diff against its first parent is the euro
      change again. c1 is the origin and is not required (D-contract), c2 is the revert that undid it
      and is related but not correct, and c5 is the reader that assumed cents. Blame on the line c6
      deletes returns c5 alone, and blame on the constant returns c1, which the revert has already
      undone once.
  evaluation_variants:
  - name: origin-aware
    description: >
      The same required set; reporting the origin c1 as well is tolerated (direct/origin contract D3),
      reporting the revert c2 is not.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c4
      - c5
      related_origins:
      - c1
      related_but_not_correct:
      - c2
scenario_design:
  purpose: >
    Give G6 a second discriminating scenario whose reintroduction is a merge
    resolution rather than a revert, so that no commit in the history says the
    change came back and the reintroducing commit is a merge.
  key_property: >
    c1 converts the constant and its only reader together, so nothing
    observable changes, and c2 reverts it. The reporting branch forked before
    the revert, so the merge c4 conflicts, and its resolution takes the
    branch's file: the euro form is in force again under a commit message that
    says only that a branch was merged. c5 reads the constant as cents. Blame
    on the line the fix deletes returns c5; blame on the constant returns the
    origin c1, which the D-contract does not accept, and the commit that
    brought it back is the merge.
  evaluation_points:
  - Whether the expected BIC set is reported exactly.
  - Whether a reintroduction with no revert commit is attributed to the merge that performed it.
  - Whether the origin is distinguished from the commit that put the change back in force.
  failure_mode: >-
    A tool fails here when it stops at the line the fix deletes, which blame attributes to `c5`, or when
    it follows the constant and reports `c1`, the origin the revert `c2` already undid; the commit that
    put the euro form back is the merge `c4`, whose message says only that a branch was merged.
notes:
- >-
  The merge c4 conflicts, because main reverted the euro form while the reporting branch still
  carried it, so the resolution is a real one and its diff against the first parent is the euro
  change again.
- >-
  Supported domain, 0 to 4294967 days. totalCents multiplies by 500 either way, so the bound is the
  same before and after the euro conversion; tests/test_reference_arithmetic.py holds it.
