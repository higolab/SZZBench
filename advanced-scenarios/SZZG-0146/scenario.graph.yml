expected_szz:
  evaluation_variants:
  - name: full-cause
    description: Both commits are required, as in every two-commit oracle of the discriminating tier.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c1
      - c3
  - name: observable-only
    description: >
      Only the commit that made the fault visible is required; the parser change is tolerated as a
      related origin but not required. Plain blame passes this variant.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c3
      related_origins:
      - c1
  default_variant: full-cause
  notes: >
    The default is the strict variant, and szzbench baselines scores the default. Blame on the line c4
    deletes returns {c3}: it fails full-cause with c1 as a false negative and passes observable-only.
    {c1, c3} passes both. A report on this scenario has to say which variant it was scored under.
scenario_design:
  purpose: >
    A discriminating scenario for G9: the same repository under two contracts. The strict one asks
    for the cause and the commit that exposed it; the lenient one asks only for the exposing commit.
    The scenario exists so that a method's pass under the lenient contract cannot be reported as a
    pass on the tier.
  key_property: >
    Measured: apply(2000, "15%") is 1700 and apply(2000000, "15%") is 1700000 at every commit - the
    product is computed in 64 bits, so the hundredfold parser result of c1 changes no answer of the
    existing caller at any int price. describe("15%") is "1500 percent off" at c3 and "15 percent off"
    at c4, describe("7%") "700 percent off" and "7 percent off". Undoing c1 on top of c3 (parse()
    returning whole percent, apply() dividing by 100) gives "15 percent off" and "7 percent off": the
    fixed answers. Blaming the line c4 deletes at c4^ returns c3 under every variant.
  evaluation_points:
  - Report exactly {c1, c3} under the default variant.
  - Whether the value the fixed expression reads is followed through the parser to the commit that changed its scale.
  - Whether a result is reported together with the variant it was scored under.
  failure_mode: >-
    A tool fails here when it stops at blame's `c3`: under the default variant `c1`, which changed
    what `Percent.parse()` returns, is a missing half of the answer, even though the `observable-only`
    variant would accept `{c3}`.
notes:
- The variant names follow docs/evaluation-policies.md section 4; observable-only tolerates c1 through its relaxed policy, not through its name.
