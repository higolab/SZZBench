schema_version: graph-1.0
meta:
  id: SZZG-0146
  title: "One history, two contracts: the default variant requires the cause, the other only the commit that made it visible"
  slug: two-contracts-cause-and-observable
  description: >
    A percentage parser starts returning basis points and its only caller is
    converted with it, so nothing observable moves. A later commit prints the
    parser's result as a percentage. The fix repairs the printing. The default
    evaluation variant requires both commits, as the tier's other two-commit
    oracles do; a second variant requires only the commit that made the fault
    visible and tolerates the parser change as a related origin. Blame passes
    the second and fails the first, which is the point: the scenario makes the
    choice of contract explicit and scores the strict one by default.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - multi-bic
  - single-bfc
  - evaluation-variant
  - caller-callee
  - value-flow
  - wrong-constant
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0146-two-contracts-cause-and-observable
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the percentage parser and the discount'
  author: 'Mei Tanaka <mei.tanaka@example.com>'
  role: initial
  date: '2024-12-02T09:30:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/Percent.java
    content: |
      package example;

      public class Percent {
          public static int parse(String text) {
              return Integer.parseInt(text.replace("%", "").trim());
          }
      }
  - type: write_file
    path: src/main/java/example/Discount.java
    content: |
      package example;

      public class Discount {
          /** Applies a percentage to a price. The product is computed in 64 bits, so
           *  any int price and any percentage the parser accepts are representable. */
          public int apply(int priceCents, String percent) {
              return priceCents - (int) ((long) priceCents * Percent.parse(percent) / 100);
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Parse percentages to basis points'
  author: 'Jonas Berg <jonas.berg@example.com>'
  role: bug_introducing
  date: '2024-12-04T14:10:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Percent.java
    old: return Integer.parseInt(text.replace("%", "").trim());
    new: return Integer.parseInt(text.replace("%", "").trim()) * 100;
  - type: replace
    path: src/main/java/example/Discount.java
    old: return priceCents - (int) ((long) priceCents * Percent.parse(percent) / 100);
    new: return priceCents - (int) ((long) priceCents * Percent.parse(percent) / 10000);
- id: c2
  branch: main
  parents:
  - c1
  message: 'Describe the discount rules'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: intermediate
  date: '2024-12-06T10:00:00Z'
  operations:
  - type: write_file
    path: docs/discounts.md
    content: |
      # Discounts

      A discount is given as a percentage string such as `15%` and applied to a
      price in cents. The result is rounded down to a whole cent.
- id: c3
  branch: main
  parents:
  - c2
  message: 'Describe a discount on the receipt'
  author: 'Aiko Tanaka <aiko.tanaka@example.com>'
  role: bug_introducing
  date: '2024-12-09T16:25:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/Receipt.java
    content: |
      package example;

      public class Receipt {
          public String describe(String percent) {
              return Percent.parse(percent) + " percent off";
          }
      }
- id: c4
  branch: main
  parents:
  - c3
  message: 'Describe the discount as a percentage on the receipt'
  author: 'Farid Haddad <farid.haddad@example.com>'
  role: bug_fixing
  date: '2024-12-11T11:40:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Receipt.java
    old: return Percent.parse(percent) + " percent off";
    new: return (Percent.parse(percent) / 100) + " percent off";
