schema_version: graph-0.1-draft
meta:
  id: SZZG-0059
  title: Merge commit itself is the BIC
  slug: merge-commit-as-bic
  description: >-
    Two branches make changes that merge cleanly, and the merge resolution drops the safety check, so the merge
    commit itself is the bug-introducing commit.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - merge-commit
  - bug-introducing-merge
  - non-linear-history
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0059-merge-commit-as-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create feature flag

    c1: main branch hardens feature flag

    c2: feature branch keeps simple flag

    c3: merge feature branch and accidentally drop safety check

    c4: fix dropped safety check'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the feature flag'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Flags.java
    content: "package example;\npublic class Flags {\n  public boolean enabled(boolean configured) {\n    return configured;\n\
      \  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Require the safe system property for the flag'
  role: other
  operations:
  - type: replace
    path: src/main/java/example/Flags.java
    old: return configured;
    new: return configured && System.getProperty("safe") != null;
- id: c2
  branch: feature
  parents:
  - c0
  message: 'Keep the simple flag on the feature branch'
  role: other
  allow_empty: true
  operations:
  - type: replace
    path: src/main/java/example/Flags.java
    old: return configured;
    new: return configured;
- id: c3
  branch: main
  parents:
  - c1
  - c2
  message: 'Merge the feature branch'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Flags.java
    old: return configured && System.getProperty("safe") != null;
    new: return configured;
- id: c4
  branch: main
  parents:
  - c3
  message: 'Require the safe system property again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Flags.java
    old: return configured;
    new: return configured && System.getProperty("safe") != null;
bugs:
- id: B001
  title: The feature flag ignores the safety property
  bug_introducing_commits:
  - commit: c3
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c3
    file: src/main/java/example/Flags.java
    statement: return configured;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Flags.java
    statement: return configured && System.getProperty("safe") != null;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c3
scenario_design:
  purpose: >-
    Evaluate whether a method reports a merge commit as the bug-introducing commit when the fault is in the merge
    resolution.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: >-
    This scenario uses factors: merge-commit, bug-introducing-merge, non-linear-history; operations: replace, write_file.
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether structural or contextual history is handled according to the scenario factors.
  - Whether the expected_szz evaluation policy is applied correctly.
