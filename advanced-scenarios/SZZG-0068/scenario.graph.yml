schema_version: graph-0.1-draft
meta:
  id: SZZG-0068
  source_future_id: FUTURE-068
  title: Huge history
  slug: huge-history
  description: 巨大履歴を2つのnon-empty placeholder commitで表し、最後にlarge fileのbugを修正する。
  category: robustness / 実装品質確認系未対応シナリオ
  category_code: K
  factors:
  - commit_generators
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0068-huge-history
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: c0 large file / c1 one-line bug / c2-c3 history placeholders / c4 fix
commits:
- id: c0
  branch: main
  parents: []
  message: Create large generated file
  role: initial
  operations:
  - type: write_generated_text_file
    path: src/main/java/example/LargeRange.java
    lines: 10000
    template: public int value_${line} = ${line};
- id: c1
  branch: main
  parents:
  - c0
  message: Introduce one-line bug in large file
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/LargeRange.java
    old: public int value_5000 = 5000;
    new: public int value_5000 = -1;
- id: c2
  branch: main
  parents:
  - c1
  message: Record generated unrelated history batch 1
  role: intermediate
  operations:
  - type: commit_generator
    generator: unrelated_changes
    count: 500
    files: 10
    path: generated/unrelated-batch-1.txt
- id: c3
  branch: main
  parents:
  - c2
  message: Record generated unrelated history batch 2
  role: intermediate
  operations:
  - type: commit_generator
    generator: unrelated_changes
    count: 500
    files: 10
    path: generated/unrelated-batch-2.txt
- id: c4
  branch: main
  parents:
  - c3
  message: Fix one-line bug in large file
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/LargeRange.java
    old: public int value_5000 = -1;
    new: public int value_5000 = 5000;
bugs:
- id: B001
  title: Huge history with large file one-line bug
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/LargeRange.java
    statement: public int value_5000 = -1;
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/LargeRange.java
    statement: public int value_5000 = 5000;
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
commit_generators:
- type: unrelated_changes
  count: 1000
  files: 10
  materialized_as:
  - c2
  - c3
scenario_design:
  purpose: 多数の中間 commit を含む長い履歴で SZZ の性能を測る。
  current_schema_limitation: "全 commit を手書きするのは現実的でない。  \nsynthetic commit series generator が必要。"
  required_extensions_from_source: "```yaml\ncommit_generators:\n  - type: \"unrelated_changes\"\n    count: 1000\n    files: 10\n```"
  evaluation_points:
  - 履歴長に対する実行時間
  - candidate pruning
  - scalability
notes:
- Draft scenario.graph.yml for future graph-aware SZZBench support.
- This revision replaces placeholder/no-op operations with concrete file states so that graph generation can proceed.
