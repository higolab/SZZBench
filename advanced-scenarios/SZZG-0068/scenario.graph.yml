schema_version: graph-0.1-draft
meta:
  id: SZZG-0068
  title: Rebase changes patch content during replay
  slug: rebase-changes-patch-content-during-replay
  description: The rebased BIC has different patch content from the original feature BIC.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - patch_modified_during_rebase
  - origin_bic
  - direct_bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0068-rebase-changes-patch-content-during-replay
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: introduce exclusive bug on feature

    m1: add main note

    r1: rebase feature bug with adjusted patch content

    c2: fix adjusted lower-bound bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: m1
  branch: main
  parents:
  - c0
  message: 'Add the main note'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main.md
    content: 'note

      '
- id: r1
  branch: main
  parents:
  - m1
  message: 'Apply the feature change with only the lower bound adjusted'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value <= max;
  rebase_of: f1
  rebase_patch_modified: true
- id: c2
  branch: main
  parents:
  - r1
  message: 'Accept the lower bound again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value <= max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Adjusted lower-bound bug during rebase
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/Range.java
    statement: return value > min && value <= max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: r1 differs from origin patch f1.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate direct/origin handling when rebase changes patch content.
  key_property: Patch equality alone is insufficient.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
  - Treat f1 as origin.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
