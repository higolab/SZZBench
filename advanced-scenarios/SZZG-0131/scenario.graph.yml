schema_version: graph-1.0
meta:
  id: SZZG-0131
  title: The BIC was rebased after the bug report; excluding commits by committer date rules it out
  slug: report-date-heuristic-wrong-for-rebased-bic
  description: >
    The discount rounding is broken on a feature branch. A report of the one-cent shortfall, seen on the
    branch's preview build, is recorded with its date. The branch is then rebased onto main, so the
    faulty commit's replay carries the original author date but a committer date after the report. A
    tool that excludes commits committed after the report excludes the direct BIC.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - bug-report-date
  - tool-visible-context
  - rebase
  - origin-and-direct-bic
  - author-date-vs-committer-date
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0131-report-date-heuristic-wrong-for-rebased-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
