expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_origins:
    - f1
    notes: >
      r1 is the commit in main's history that carries the fault (direct/origin contract D8); f1 is the
      pre-rebase original, not an ancestor of the fix. r1's author date (2024-05-03) is before the report
      (2024-05-08) and its committer date (2024-05-13) is after it. A tool that drops commits committed
      after the report drops the answer.
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the pre-rebase original is accepted as related context.
