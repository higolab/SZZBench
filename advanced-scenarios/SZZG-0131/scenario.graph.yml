scenario_design:
  purpose: >
    The counter-example to SZZG-0130: the report-date heuristic applied to committer dates excludes the
    direct BIC, because the faulty change was written before the report and replayed onto main after it.
    Applied to author dates it keeps r1. The report document is committed like any other file
    (decisions/tool-visible-context.md).
  key_property: >
    Measured: apply(105, 10) is 95 at c0 and m1, 94 at f1 and r1, 95 at c3. Blaming the line c3 deletes
    at c3^ returns r1. r1: author date 2024-05-03T15:10:00Z (inherited from f1), committer date
    2024-05-13T10:30:00Z; report 2024-05-08T15:40:00Z.
  evaluation_points:
  - Report r1.
  - Do not exclude r1 because its committer date is after the report.
  - Treat f1 as origin, not as the answer.
  failure_mode: >-
    A tool fails here when it drops commits by committer date and loses the rebased `r1`, or reaches the
    pre-rebase `f1` through `git log --all` and reports it: `r1` is the answer.
notes:
- The rebase keeps f1's subject and author date (inherit_message, inherit_author_date) and sets its own
  committer date, as a real rebase does.
