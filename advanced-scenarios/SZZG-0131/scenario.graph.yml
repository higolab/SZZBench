      # ISSUE-58: Discounted totals come out one cent short

      Reported: 2024-05-08T15:40:00Z

      On the preview build of the discount branch, a 10% discount on 1.05 gives 0.94 instead of 0.95.
      Other amounts are also short by a cent whenever the exact result ends in half a cent.
      The main build does not show this yet.
