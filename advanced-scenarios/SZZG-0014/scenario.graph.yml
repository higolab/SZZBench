  title: Buggy code copied to a new file
  slug: buggy-code-copied-to-new-file
  description: Evaluates a copied buggy implementation where the copy commit is the direct BIC for the copied file while
    the original file remains only origin context.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - copy_file
  difficulty: advanced
