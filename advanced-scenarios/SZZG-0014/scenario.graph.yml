repository:
  name: SZZG-0014-buggy-code-copied-to-new-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file src/main/java/example/A.java)

    c1: copy buggy code to B.java (copy_file src/main/java/example/A.java -> src/main/java/example/B.java)

    c2: fix bug (replace src/main/java/example/B.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial state (write_file src/main/java/example/A.java)'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: copy buggy code to B.java (copy_file src/main/java/example/A.java -> src/main/java/example/B.java)'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: fix bug (replace src/main/java/example/B.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
