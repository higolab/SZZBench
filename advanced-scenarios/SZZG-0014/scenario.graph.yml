schema_version: graph-1.0
meta:
  id: SZZG-0014
  title: Buggy code copied to a new file
  slug: buggy-code-copied-to-new-file
  description: >-
    A.java already contains an exclusive range check at c0. Commit c1 copies the file to B.java and adapts only
    the class declaration, so the faulty statement enters B.java byte-for-byte unchanged. The BFC c2 fixes the
    copied statement in B.java; A.java is not touched. The copy commit c1 is the direct BIC for B.java, c0 is
    origin context.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - copy-propagation
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0014-buggy-code-copied-to-new-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add A with an exclusive range check

    c1: copy A.java to B.java and rename the copied class (direct BIC for B.java)

    c2: include the bounds in B.contains (BFC)'
commits:
- id: c0
  branch: main
  parents: []
  message: Add A with a range containment check
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: |
      package example;

      public class A {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: Copy the containment check from A into B
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
  - type: replace
    path: src/main/java/example/B.java
    old: public class A {
    new: public class B {
- id: c2
  branch: main
  parents:
  - c1
  message: Include the bounds in B.contains
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Copied boundary bug in B.java
  bug_introducing_commits:
  - commit: c1
    role: direct
    description: Direct BIC for B.java because this commit copies the faulty logic into the fixed file.
  - commit: c0
    role: origin
    description: Origin context where the faulty logic already existed before it was copied.
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/B.java
    statement: return value > min && value < max;
    change_type: copy_propagated_line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/B.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_origins:
    - c0
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c1
      acceptable_related:
      - commit: c0
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate a copy-propagated bug where the copy commit c1 is the direct BIC for the later fix in B.java.
  key_property: Commit c0 contains the original faulty logic, but c1 is the expected direct BIC because it introduces that
    faulty logic into B.java, the file fixed by c2.
  compilation_contract: >-
    Both files live in package example and must compile together, so the copy commit renames the copied class from
    A to B in the same commit. Only the class declaration line differs between A.java and B.java; the faulty
    statement is copied verbatim, which is what copy-aware blame has to detect.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: >-
    This scenario uses factors: copy-propagation; operations: write_file, copy_file, replace.
  evaluation_points:
  - Whether SZZ identifies c1 as the direct BIC for B.java.
  - Whether SZZ keeps c0 as origin context without replacing the direct copy commit.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- >-
  2026-09 revision (issue 10): A.java declared `public class Range`, so no commit of this scenario compiled. The class in
  A.java is now A, and the copy commit renames the copied class to B so that both files compile together in one package.
  The oracle (direct BIC c1, origin c0, BFC c2) and the copied faulty statement are unchanged; the commit messages were
  rewritten to realistic, role-neutral text.
