expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r2
    related_but_not_correct:
    - r1
    notes: r2 installs the fault on main although it replays the first commit of the feature branch. r1 replays
      the later feature commit f2 and only adds the clamp helper. f1 is the pre-rebase source of r2 and stays reachable
      through the feature branch.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r2
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      related_but_not_correct:
      - r1
scenario_design:
  purpose: Evaluate whether SZZ survives a rebase that replays commits in a different order than they were written.
  key_property: 'The replay order differs from the source order: r1 has rebase_of f2 and r2 has rebase_of f1, while on the feature
    branch f1 precedes f2. Because both replayed commits inherit their source''s author date, the author dates decrease along main
    (r1: 2024-01-03, r2: 2024-01-02) while they increase along feature.'
  difference_from_SZZG_0064: SZZG-0064 replays the same series in the same order; here the order is inverted, so position in the
    replayed series is no guide to position in the original series.
  evaluation_points:
  - Report r2.
  - Avoid r1.
  - Do not assume that the n-th replayed commit corresponds to the n-th source commit.
notes:
- 'The reorder is what git rebase -i does when the pick lines are swapped: the final tree of main equals the tree of the feature
  tip, but the intermediate trees and the per-commit patches differ.'
- inherit_message and inherit_author_date keep the subject and the author date of each source commit, so the reorder is visible
  in git log without reading the scenario metadata.
