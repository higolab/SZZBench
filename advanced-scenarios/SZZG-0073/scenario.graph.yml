expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_but_not_correct:
    - f1
    notes: The expected direct BIC is r1 because rebase rewrites the feature-branch BIC f1 as a new commit on main. f1 is
      the origin BIC but is not the direct BIC for the main-line BFC.
scenario_design:
  purpose: Evaluate how SZZ handles a rebase workflow where feature-branch commits are rewritten onto main. The rebased main-line
    commit is the direct BIC, while the original feature-branch commit is origin metadata.
  key_property: Unlike a normal merge, the rebased commits r1 and r2 each have a single parent on main. Unlike a squash merge,
    the feature branch is preserved as multiple rebased commits rather than collapsed into one commit.
  difference_from_SZZG_0034: SZZG-0034 represents a squash merge as one single-parent commit on main. SZZG-0073 represents
    rebase as a sequence of new single-parent commits on main, each linked to its original feature-branch commit via rebase_of
    metadata.
  evaluation_points:
  - Whether SZZ reports the direct main-line BIC r1.
  - Whether the origin BIC f1 is distinguished from the rebased direct BIC.
  - Whether the benchmark can represent rebase-style history rewriting without using a two-parent merge commit.
notes:
- This scenario models rebase by replaying the feature branch commits as new single-parent commits on main.
- The rebase relationship is recorded with commit-level rebase_of metadata.
- The expected direct BIC is r1; f1 is related origin metadata but not the direct BIC for the main-line fix.
