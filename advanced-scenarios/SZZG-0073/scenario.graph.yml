schema_version: graph-0.1-draft
meta:
  id: SZZG-0073
  source_future_id: FUTURE-075
  title: benchmark variant によって評価対象を切り替えるケース
  slug: evaluation-variants
  description: 同じ履歴に対して、strict / relaxed / direct-only / origin-aware など複数評価を行う。
  category: schema / evaluation policy が必要な横断シナリオ
  category_code: L
  factors:
  - evaluation_variants
  - direct_bic
  - origin_bic
  - copy_propagation
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0073-evaluation-variants
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: "copy propagation:\n  c1 origin\n  c2 direct\n  c3 fix"
commits:
- id: c1
  branch: main
  parents: []
  message: 'c1: origin bug'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: "package example;\n\npublic class A {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: direct copy'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix copied bug'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
clone_relationships:
- origin_file: src/main/java/example/A.java
  copied_file: src/main/java/example/B.java
  copy_commit: c2
  origin_commit: c1
  relationship: buggy_code_copy
bugs:
- id: B001
  title: Copied range boundary bug
  bug_introducing_commits:
  - commit: c2
    role: direct
  - commit: c1
    role: origin
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    role: direct
    commit: c2
    file: src/main/java/example/B.java
    statement: return value > min && value < max;
    change_type: copy_propagation
  - id: F002
    role: origin
    commit: c1
    file: src/main/java/example/A.java
    statement: return value > min && value < max;
    change_type: origin_bug
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/B.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  evaluation_variants:
  - name: direct-only
    description: direct BIC のみを正解とする厳しめの評価。
    commit_level:
      evaluation_policy: exact_set
      required:
      - c2
  - name: origin-aware
    description: direct BIC を主正解とし、origin BIC も関連commitとして許容する評価。
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: 同じ履歴に対して、strict / relaxed / direct-only / origin-aware など複数評価を行う。
  current_schema_limitation: 1つの expected_szz しか持てないため、評価ポリシーを切り替えられない。
  required_extensions_from_source: "evaluation_variants:\n  - name: \"direct-only\"\n    true_positives:\n      - \"c2\"\n\
    \  - name: \"origin-aware\"\n    true_positives:\n      - \"c2\"\n    acceptable_related:\n      - \"c1\"\n"
  evaluation_points:
  - 評価ポリシーによる結果の違い
  - benchmark paper での透明性
  - 手法比較の公平性
notes:
- Draft scenario.graph.yml for future graph-aware SZZBench support.
