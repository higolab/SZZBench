schema_version: graph-1.0
meta:
  id: SZZG-0073
  title: Interactive rebase reorders commits before BIC
  slug: interactive-rebase-reorders-commits-before-bic
  description: 'An interactive rebase replays the two feature commits in the opposite order: the helper commit that was written
    after the fault is picked first, so on main it sits before the bug-introducing commit. Both replayed commits keep their original
    subject and author date, which makes the author dates on main decrease.'
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - interactive-rebase
  - reorder
  - direct-bic
  - origin-bic
  - inherited-commit-metadata
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0073-interactive-rebase-reorders-commits-before-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the Range class with an inclusive contains check

    f1: Use strict comparisons for the interval bounds (feature, first)

    f2: Add a clamp helper for values outside the interval (feature, second)

    r1: rebased f2: picked first after the reorder

    r2: rebased f1: picked second after the reorder

    c3: Restore the inclusive comparison in Range.contains'
commits:
- id: c0
  branch: main
  parents: []
  message: Add the Range class with an inclusive contains check
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: Use strict comparisons for the interval bounds
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: f2
  branch: feature
  parents:
  - f1
  message: Add a clamp helper for values outside the interval
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public int clamp(int value, int min, int max) {\n    if (value < min) {\n      return min;\n\
      \    }\n    if (value > max) {\n      return max;\n    }\n    return value;\n  }\n}\n"
- id: r1
  branch: main
  parents:
  - c0
  role: intermediate
  rebase_of: f2
  interactive_rebase: reorder
  inherit_message: true
  inherit_author_date: true
  committer_date: '2024-01-06T11:00:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n\n  public int clamp(int value, int min, int max) {\n    if (value < min) {\n      return\
      \ min;\n    }\n    if (value > max) {\n      return max;\n    }\n    return value;\n  }\n}\n"
- id: r2
  branch: main
  parents:
  - r1
  role: bug_introducing
  rebase_of: f1
  interactive_rebase: reorder
  inherit_message: true
  inherit_author_date: true
  committer_date: '2024-01-06T11:00:07Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c3
  branch: main
  parents:
  - r2
  message: Restore the inclusive comparison in Range.contains
  role: bug_fixing
  date: '2024-01-10T08:30:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
