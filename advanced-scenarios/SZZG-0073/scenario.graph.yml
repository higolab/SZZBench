schema_version: graph-0.1-draft
meta:
  id: SZZG-0073
  title: Rebase feature branch with BIC
  slug: rebase-feature-branch-with-bic
  description: A feature branch introduces a bug and is then rebased onto main. The rebased commit on main becomes the direct
    BIC for the main-line BFC, while the original feature-branch commit is retained as origin metadata.
  category: Branch, merge, cherry-pick, and backport scenarios
  category_code: G
  factors:
  - branch
  - rebase
  - rebased_bic
  - direct_bic
  - origin_bic
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0073-rebase-feature-branch-with-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    f1: feature branch introduces range boundary bug

    f2: feature branch adds code that uses the buggy range check

    r1: rebase f1 onto main as a new main-line commit

    r2: rebase f2 onto main as a new main-line commit

    c3: fix the rebased range boundary bug on main'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial correct implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'f1: introduce range boundary bug on feature'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: f2
  branch: feature
  parents:
  - f1
  message: 'f2: add feature helper using buggy range check'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: r1
  branch: main
  parents:
  - c0
  message: 'r1: rebase feature bug commit onto main'
  role: bug_introducing
  rebase_of: f1
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: r2
  branch: main
  parents:
  - r1
  message: 'r2: rebase feature helper commit onto main'
  role: intermediate
  rebase_of: f2
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: c3
  branch: main
  parents:
  - r2
  message: 'c3: fix rebased range boundary bug on main'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
