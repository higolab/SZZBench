schema_version: graph-0.1-draft
meta:
  id: SZZG-0090
  title: Repeated revert toggling before final fix
  slug: repeated-revert-toggling-before-final-fix
  description: The same bug alternates between fixed and buggy states through repeated revert and revert-of-revert commits
    before a final explicit fix.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - revert
  - revert_of_revert
  - repeated_toggling
  - reintroduced_bug
  - re_bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0090-repeated-revert-toggling-before-final-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce boundary bug

    c2: fix boundary bug

    c3: revert c2 and reintroduce bug

    c4: revert c3 and restore fix

    c5: revert c4 and reintroduce bug again

    c6: final explicit fix after repeated toggling'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value >= min;\n    boolean belowMax = value <= max;\n    return aboveMin && belowMax;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make both helpers strict'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept both bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Revert the bounds change'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
  reverts: c2
- id: c4
  branch: main
  parents:
  - c3
  message: 'Restore the inclusive bounds'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
  reverts: c3
- id: c5
  branch: main
  parents:
  - c4
  message: 'Revert the bounds change once more'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
  reverts: c4
- id: c6
  branch: main
  parents:
  - c5
  message: 'Set the inclusive bounds explicitly'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
bugs:
- id: B001
  title: Boundary bug reintroduced after repeated revert toggling
  bug_introducing_commits:
  - commit: c5
    role: direct
  - commit: c3
    role: related_reintroducing
  - commit: c1
    role: origin
  bug_fixing_commits:
