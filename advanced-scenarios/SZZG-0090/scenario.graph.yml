expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c5
    related_but_not_correct:
    - c1
    - c3
    - c2
    - c4
    notes: For the final fix c6, the latest reintroducing revert c5 is the direct BIC.
scenario_design:
  purpose: Evaluate repeated toggling where the latest reintroducing revert should be identified as the direct BIC.
  key_property: Multiple earlier BIC-like and fix-like commits exist, but the final fix should blame the latest re-BIC.
  difference_from_existing_revert_scenarios: This scenario isolates a double-revert or revert-derived complication beyond
    the existing partial revert and reintroduction scenarios.
  evaluation_points:
  - Whether SZZ reports c5.
  - Whether older origin/reintroducing commits are not counted as exact direct answers.
notes:
- This scenario models revert-related development history for SZZ evaluation.
- The direct BIC is the commit that reintroduces the bug in the history observed from the BFC.
