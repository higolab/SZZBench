schema_version: graph-1.0
meta:
  id: SZZG-0152
  title: The fix message names a release, and only the changelog of that release says what changed
  slug: the-changelog-of-the-named-release
  description: >
    A metering price moves from cents to tenths of a cent, with its only reader
    converted in the same commit under a subject that says only that finer
    bands were added. The release that carries it writes the unit into its
    changelog, and a rename takes ownership of the constant's line, so
    following the value stops at a commit that renamed it and nothing more. A
    later commit prints the constant as cents. The fix repairs the label and
    its message names the release, which is the one thread left back to the
    unit change: the tag says which three commits the release contains, the
    changelog says what the release did, and only one of the three could have
    done it.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - multi-bic
  - single-bfc
  - release-tag
  - non-source-evidence
  - refactoring-after-bic
  - value-flow
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0152-the-changelog-of-the-named-release
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  ref_lifecycle:
    tags:
    - name: v2.3.0
      commit: c0
    - name: v2.4.0
      commit: c3
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add metering and its changelog'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Metering.java
    content: |
      package example;

      public class Metering {
          static final int UNIT_PRICE = 12;

          public int costCents(int units) {
              return units * UNIT_PRICE;
          }
      }
  - type: write_file
    path: CHANGELOG.md
    content: |
      # Changelog

      ## 2.3.0

      - Metered usage is priced per unit.
- id: c1
  branch: main
  parents:
  - c0
  message: 'Add finer price bands to metering'
  author: 'Luca Moretti <luca.moretti@example.com>'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Metering.java
    old: |
      static final int UNIT_PRICE = 12;

          public int costCents(int units) {
              return units * UNIT_PRICE;
          }
    new: |
      static final int UNIT_PRICE = 120;

          public int costCents(int units) {
              return units * UNIT_PRICE / 10;
          }
- id: c2
  branch: main
  parents:
  - c1
  message: 'Name the metering price after what it prices'
  author: 'Hana Sato <hana.sato@example.com>'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Metering.java
    old: |
      static final int UNIT_PRICE = 120;

          public int costCents(int units) {
              return units * UNIT_PRICE / 10;
          }
    new: |
      static final int METERED_UNIT_PRICE = 120;

          public int costCents(int units) {
              return units * METERED_UNIT_PRICE / 10;
          }
- id: c3
  branch: main
  parents:
  - c2
  message: 'Release 2.4.0'
  author: 'Aiko Tanaka <aiko.tanaka@example.com>'
  role: intermediate
  operations:
  - type: write_file
    path: VERSION
    content: |
      2.4.0
  - type: replace
    path: CHANGELOG.md
    old: |
      # Changelog
    new: |
      # Changelog

      ## 2.4.0

      - The metering unit price is held in tenths of a cent. Callers that read
        the constant must divide by ten.
- id: c4
  branch: main
  parents:
  - c3
  message: 'Show the metering price on the invoice'
  author: 'Chen Wei <chen.wei@example.com>'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Metering.java
    old: |
      public int costCents(int units) {
              return units * METERED_UNIT_PRICE / 10;
          }
    new: |
      public int costCents(int units) {
              return units * METERED_UNIT_PRICE / 10;
          }

          public String priceLabel() {
              return METERED_UNIT_PRICE + " cents per unit";
          }
- id: c5
  branch: main
  parents:
  - c4
  message: 'Show the metering price in cents, as it has been held in tenths since v2.4.0'
  author: 'Tom Becker <tom.becker@example.com>'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Metering.java
    old: return METERED_UNIT_PRICE + " cents per unit";
    new: return METERED_UNIT_PRICE / 10 + " cents per unit";
