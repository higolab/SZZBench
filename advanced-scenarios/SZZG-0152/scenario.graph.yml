expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c4
scenario_design:
  purpose: >
    Give G7 a second discriminating scenario whose non-local evidence is a
    release tag and a changelog rather than an issue document, and whose
    value-flow route is closed by a rename, so that the evidence is the only
    way to the unreachable commit.
  key_property: >
    c1 converts the constant and its only reader together, so nothing
    observable changes, and no commit message says which unit anything is in:
    c1's subject speaks of finer price bands, and the changelog entry that
    names the unit is written by the release commit c3, not by c1. c2 renames
    the constant, so the line that holds the value is blamed to a commit that
    only renamed it. c4 prints the constant as cents. Blame on the line the fix
    deletes returns c4; blame on the constant returns c2; the route to c1 is
    the fix message's release name, the tag v2.4.0, the changelog section under
    it, and then choosing between the three commits the release contains.
  evaluation_points:
  - Whether the expected BIC set is reported exactly.
  - Whether a release name in the fix message is resolved to the commits the tag contains.
  - Whether a changed unit recorded outside the source is used at all.
  - Whether the right commit is chosen among the three the release contains.
  failure_mode: >-
    A tool fails here when it stops at the line the fix deletes, which blame attributes to `c4`, or when
    it follows the constant to `c2`, which only renamed it; the other required commit, `c1`, is named by
    no line of the file and by no commit message, and is reachable only through the release the fix's
    message cites, the tag `v2.4.0`, the changelog section under it, and a choice among the three
    commits that release contains.
notes:
- >-
  The tags v2.3.0 and v2.4.0 are lightweight tags on c0 and c3; the range v2.3.0..v2.4.0 contains
  c1, c2 and c3, and the changelog section 2.4.0 is written by c3, the release commit, so neither the
  entry nor any commit message points at c1 by itself.
- >-
  Measured (PR #87 review): no commit message other than the fix's own mentions the unit, so
  git log --grep does not reach c1. An earlier revision of c1 was subjected "Hold the metering price
  in tenths of a cent", which gave the answer away without the changelog.
- >-
  Supported domain, 0 to 17895697 units. After c1 the product units * 120 leaves the int range one
  unit before the quotient does, and the bound is the same at the fix;
  tests/test_reference_arithmetic.py holds it.
