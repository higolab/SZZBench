schema_version: graph-1.0
meta:
  id: SZZG-0025
  title: Clone origin versus copied direct BIC
  slug: clone-origin-versus-direct-bic
  description: >-
    The sanitizer loses its escaping and is then copied into the admin module. The fix repairs the copy, so the
    commit that created it is the direct bug-introducing commit and the one that broke the source is the origin.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - clone
  - copy-propagation
  - origin-bic-policy
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0025-clone-origin-versus-direct-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create original sanitizer

    c1: introduce bug in original sanitizer

    c2: copy sanitizer into admin module

    c3: fix copied sanitizer only'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the sanitizer'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Sanitizer.java
    content: "package example;\npublic class Sanitizer {\n  public String clean(String s) {\n    return s.replace(\"<\", \"\
      &lt;\");\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Return the input unchanged from the sanitizer'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Sanitizer.java
    old: return s.replace("<", "&lt;");
    new: return s;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Copy the sanitizer into the admin module'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/Sanitizer.java
    to: src/main/java/example/AdminSanitizer.java
  - type: replace
    path: src/main/java/example/AdminSanitizer.java
    old: public class Sanitizer
    new: public class AdminSanitizer
- id: c3
  branch: main
  parents:
  - c2
  message: 'Escape angle brackets in the admin sanitizer'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/AdminSanitizer.java
    old: return s;
    new: return s.replace("<", "&lt;");
bugs:
- id: B001
  title: The admin module leaves angle brackets unescaped
  bug_introducing_commits:
  - commit: c2
    role: direct
    description: Copies the faulty sanitizer into the admin module, the instance the fix repairs.
  - commit: c1
    role: origin
    description: Made the source sanitizer faulty; the copy inherited it.
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/AdminSanitizer.java
    statement: return s;
    change_type: copy_propagated_line_modification
  origin_faults:
  - id: OF001
    commit: c1
    file: src/main/java/example/Sanitizer.java
    statement: return s;
    change_type: origin_line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/AdminSanitizer.java
    statement: return s.replace("<", "&lt;");
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    related_origins:
    - c1
    notes: >
      The fix repairs AdminSanitizer.java, an instance that exists only because
      c2 copied it. Under contract D4 the copying commit is the direct BIC of
      the new instance and c1, which made the source faulty, is its origin.
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: >-
    Evaluate whether a method reports the commit that copied a fault into the fixed file, rather than the commit
    that created the fault elsewhere.
