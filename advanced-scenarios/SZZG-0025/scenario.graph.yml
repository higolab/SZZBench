  title: Clone origin versus copied direct BIC
  slug: clone-origin-versus-direct-bic
  description: Evaluates clone origin versus copied direct bic and checks whether SZZ identifies the expected bug-introducing
    commit set.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - clone
  - copy_file
  - origin_bic_policy
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0025-clone-origin-versus-direct-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: c0: create original sanitizer

    c1: c1: introduce bug in original sanitizer

    c2: c2: copy sanitizer into admin module

    c3: c3: fix copied sanitizer only'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the sanitizer'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Sanitizer.java
    content: "package example;\npublic class Sanitizer {\n  public String clean(String s) {\n    return s.replace(\"<\", \"\
      &lt;\");\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Return the input unchanged from the sanitizer'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Sanitizer.java
    old: return s.replace("<", "&lt;");
    new: return s;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Copy the sanitizer into the admin module'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/Sanitizer.java
    to: src/main/java/example/AdminSanitizer.java
  - type: replace
    path: src/main/java/example/AdminSanitizer.java
    old: public class Sanitizer
    new: public class AdminSanitizer
- id: c3
  branch: main
  parents:
  - c2
  message: 'Escape angle brackets in the admin sanitizer'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/AdminSanitizer.java
    old: return s;
    new: return s.replace("<", "&lt;");
bugs:
- id: B001
  title: Synthetic graph scenario bug
  bug_introducing_commits:
  - commit: c2
    role: direct
    description: Copies the faulty sanitizer into the admin module, the instance the fix repairs.
  - commit: c1
    role: origin
    description: Made the source sanitizer faulty; the copy inherited it.
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/AdminSanitizer.java
    statement: return s;
    change_type: copy_propagated_line_modification
  origin_faults:
  - id: OF001
    commit: c1
    file: src/main/java/example/Sanitizer.java
    statement: return s;
    change_type: origin_line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/AdminSanitizer.java
    statement: return s.replace("<", "&lt;");
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    related_origins:
    - c1
    notes: >
      The fix repairs AdminSanitizer.java, an instance that exists only because
      c2 copied it. Under contract D4 the copying commit is the direct BIC of
      the new instance and c1, which made the source faulty, is its origin.
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate clone origin versus copied direct bic and whether SZZ identifies the expected bug-introducing commit set.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
