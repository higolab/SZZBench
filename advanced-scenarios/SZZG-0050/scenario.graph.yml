schema_version: graph-0.1-draft
meta:
  id: SZZG-0050
  title: Backport fix
  slug: backport-fix
  description: A bug is introduced on main before a release branch is cut. Main fixes the bug, continues with unrelated development,
    and the release branch receives release-specific changes. The main fix is then backported to release.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - backport
  - release-branch
  - release-specific-changes
  - copy-propagation
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0050-backport-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on main before release branch is cut

    r0: create release branch from the buggy state and add release metadata

    c2: fix bug on main

    c3: continue main development after the fix

    r1: add release-specific configuration while bug is still present on release

    r2: backport main fix c2 onto release'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: r0
  branch: release
  parents:
  - c1
  message: 'Cut the 1.0.0 release branch'
  role: release_branch_point
  operations:
  - type: write_file
    path: release/version.txt
    content: '1.0.0

      '
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Continue main development'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main-development.md
    content: 'Main branch development continues.

      '
- id: r1
  branch: release
  parents:
  - r0
  message: 'Add the release compatibility configuration'
  role: intermediate
  operations:
  - type: write_file
    path: release/config.properties
    content: 'range.mode=compat

      '
- id: r2
  branch: release
  parents:
  - r1
  message: 'Backport the range bounds fix to release'
  role: bug_fixing
  backport_of: c2
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range boundary bug fixed on main and backported to release
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
    description: Fixes the fault on main.
  - commit: r2
    role: complete_fix
    description: The same fix backported to the release branch.
    backport_of: c2
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: main_line_fix
  - id: X002
    commit: r2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: backport_fix
  bug_instances:
  - branch: main
    status: fixed
    fix_commit: c2
  - branch: release
    status: fixed
    fix_commit: r2
    backport_of: c2
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    notes: Both the main fix c2 and the release backport r2 should trace back to the original BIC c1.
  branch_level:
    main:
      bfc: c2
      required:
      - c1
    release:
      bfc: r2
      required:
      - c1
scenario_design:
  purpose: Evaluate whether SZZ can identify the original BIC when a main-line fix is backported to a release branch.
  key_property: The release branch has release-specific changes before the backport, so the history is not just a linear correct-buggy-fixed
    sequence.
  difference_from_SZZG_0084_0085: SZZG-0084 and SZZG-0085 are revert/reintroduction scenarios. SZZG-0050 is a branch scenario
    where the release fix is a backport of the main-line BFC.
  evaluation_points:
  - Whether SZZ traces the release backport r2 to c1.
  - Whether backport metadata is handled without treating c2 as the BIC.
  - Whether release-specific changes before the backport do not hide the original BIC.
notes:
- This revision adds release-specific changes to avoid collapsing the source history into a simple correct-buggy-fixed sequence.
- r2 is an explicit backport of c2.
- The expected BIC remains c1 for both main and release fixes.
