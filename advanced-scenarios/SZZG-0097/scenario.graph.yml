schema_version: graph-0.1-draft
meta:
  id: SZZG-0097
  title: Work item inference without issue ID
  slug: issue-id-work-item
  description: A bug is introduced during a short sequence of related feature-work commits that do not contain an explicit
    issue ID. The scenario evaluates whether a method can infer the work item from commit messages, nearby commit order, and
    related files, while still selecting the specific BIC inside that inferred work item.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - work-item
  - work-item-inference
  - no-issue-id
  - commit-series
  - related-but-not-correct
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0097-work-item-inference-without-issue-id
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial range filter

    c1: start range filter cleanup without issue ID

    c2: tighten boundary behavior during the same inferred work item and introduce bug

    c3: wire range filter into request path without issue ID

    c4: fix boundary regression from range filter work'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Create initial range filter'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RangeFilter.java
    content: "package example;\n\npublic class RangeFilter {\n  public int normalize(int value) {\n    return value;\n  }\n\
      \n  public boolean contains(int value, int min, int max) {\n    int normalized = normalize(value);\n    return normalized\
      \ >= min && normalized <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Start range filter cleanup
  role: work_item_context
  work_item: INFERRED-WI-001
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: "package example;\n\npublic class RangeFilter {\n  public int normalize(int value) {\n    return value;\n  }\n\n\
      \  public boolean contains(int value, int min, int max) {\n    int normalized = normalize(value);\n    return normalized\
      \ >= min && normalized <= max;\n  }\n}\n"
    new: "package example;\n\npublic class RangeFilter {\n  public int normalize(int value) {\n    return Math.max(0, value);\n\
      \  }\n\n  public boolean contains(int value, int min, int max) {\n    int normalized = normalize(value);\n    return\
      \ normalized >= min && normalized <= max;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: Tighten boundary behavior in range filter
  role: bug_introducing
  work_item: INFERRED-WI-001
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: return normalized >= min && normalized <= max;
    new: return normalized > min && normalized < max;
- id: c3
  branch: main
  parents:
  - c2
  message: Wire range filter into request path
  role: work_item_context
  work_item: INFERRED-WI-001
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: "package example;\n\npublic class RangeFilter {\n  public int normalize(int value) {\n    return Math.max(0, value);\n\
      \  }\n\n  public boolean contains(int value, int min, int max) {\n    int normalized = normalize(value);\n    return\
      \ normalized > min && normalized < max;\n  }\n}\n"
    new: "package example;\n\npublic class RangeFilter {\n  public int normalize(int value) {\n    return Math.max(0, value);\n\
      \  }\n\n  public boolean contains(int value, int min, int max) {\n    int normalized = normalize(value);\n    return\
      \ normalized > min && normalized < max;\n  }\n\n  public boolean acceptsRequestValue(int value) {\n    return contains(value,\
      \ 0, 100);\n  }\n}\n"
- id: c4
  branch: main
  parents:
  - c3
  message: Fix boundary regression from range filter work
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: return normalized > min && normalized < max;
    new: return normalized >= min && normalized <= max;
