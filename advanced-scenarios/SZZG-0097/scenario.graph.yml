work_items:
- id: INFERRED-WI-001
  title: Range filter cleanup and request wiring
  commits:
  - c1
  - c2
  - c3
  inference_required: true
  explicit_issue_id: null
  bug_introducing_commit: c2
  inference_signals:
  - No commit message contains an explicit issue ID.
  - The commit messages share range-filter terminology.
  - The commits appear consecutively in the same short time window.
  - The commits touch the same file or closely related range-filter behavior.
  - The fix message in c4 refers to a boundary regression from the range filter work.
scenario_design:
  purpose: Evaluate whether SZZ or a work-item-aware extension can infer a work item without explicit issue IDs and still
    identify the specific BIC inside that inferred work item.
  key_property: Commit messages intentionally omit issue identifiers. The work item must be inferred from message similarity,
    commit locality, and related file changes.
  difference_from_SZZG_0096: SZZG-0096 assumes an explicit work item containing multiple candidate BICs. SZZG-0097 removes
    the explicit issue ID and relies on inference signals.
  evaluation_points:
  - Whether the work item can be inferred from context without issue IDs.
  - Whether c2 is selected as the BIC rather than neighboring contextual commits c1 or c3.
  - Whether c4's fix message helps connect the regression to the inferred range-filter work.
notes:
- This revision makes SZZG-0097 distinct from SZZG-0096 by removing explicit issue IDs from commit messages and adding inference
  signals.
- The work_items section is still present as oracle metadata, but the scenario states that the work item should be inferred.
- c1 and c3 are related context commits; c2 is the only BIC.
