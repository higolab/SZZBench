scenario_design:
  purpose: ディレクトリ移動と修正が同時に起こる場合の SZZ の頑健性を評価する。
  current_schema_limitation: "file move は rename と同様に、path の変化を Git 履歴として表現する必要がある。  \n単なる `write_file` / `replace` では move の意味が失われる。"
  required_extensions_from_source: "```yaml\n- type: \"move_file\"\n  from: \"src/main/java/example/Range.java\"\n  to: \"src/main/java/domain/Range.java\"\n```"
  evaluation_points:
  - path 変更をまたいだ blame ができるか
  - BFC の移動操作を BIC と誤認しないか
  - file-level tracking を利用する SZZ の優位性が出るか
