repository:
  name: SZZG-0002-bfc-file-move-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: src/main/java/example/Range.java を導入

    c1: Range.java に bug を混入

    c2: Range.java を src/main/java/domain/Range.java に移動しつつ修正'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: src/main/java/example/Range.java を導入'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: Range.java に bug を混入'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: Range.java を src/main/java/domain/Range.java に移動しつつ修正'
  role: bug_fixing
  operations:
  - type: move_file
    from: src/main/java/example/Range.java
    to: src/main/java/domain/Range.java
  - type: replace
    path: src/main/java/domain/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
