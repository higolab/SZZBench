  category: copy / clone / propagation 系未対応シナリオ
  category_code: E
  factors:
  - copy_file
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0019-buggy-code-copied-to-new-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: A.java に bug を含む実装

    c1: A.java の処理を B.java にコピー

    c2: B.java の bug を修正'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: A.java に bug を含む実装'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value > min && value < max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: A.java の処理を B.java にコピー'
  role: intermediate
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: B.java の bug を修正'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Synthetic graph scenario bug
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c0
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
