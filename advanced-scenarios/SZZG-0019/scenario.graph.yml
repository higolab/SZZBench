schema_version: graph-1.0
meta:
  id: SZZG-0019
  title: Bug propagates into generated code
  slug: generated-code
  description: >-
    The fault enters through generated code: the template carries a retry limit of 30 where the contract
    says at most 3, and the regeneration commit writes it into the generated file the fix repairs.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - single-bic
  - single-bfc
  - copy-propagation
  - generated-file
  - wrong-constant
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0019-generated-code
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add the limits code template with maxRetries 30 (origin)

    c1: regenerate GeneratedLimits.java from the template (direct BIC)

    c2: set maxRetries to 3 in the generated code (fix)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the limits code template'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: templates/Limits.tpl
    content: '// Template for generated limits code

      return 30;

      '
- id: c1
  branch: main
  parents:
  - c0
  message: 'Regenerate the limits code from the template'
  role: bug_introducing
  operations:
  - type: write_file
    path: src/generated/java/generated/GeneratedLimits.java
    content: "package generated;\n\npublic class GeneratedLimits {\n  /** Retries after the first attempt: at most 3. */\n  public int maxRetries()\
      \ {\n    return 30;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Retry at most 3 times in the generated limits'
  role: bug_fixing
  operations:
  - type: replace
    path: src/generated/java/generated/GeneratedLimits.java
    old: return 30;
    new: return 3;
bugs:
- id: B001
  title: The generated retry limit is 30 instead of 3
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c0
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/generated/java/generated/GeneratedLimits.java
    statement: return 30;
    role: direct
  - id: F002
    commit: c0
    file: templates/Limits.tpl
    statement: return 30;
    role: origin
  fixes:
  - id: X001
    commit: c2
    file: src/generated/java/generated/GeneratedLimits.java
    statement: return 3;
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_origins:
    - c0
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c1
      acceptable_related:
      - commit: c0
        reason: origin_bic
        credit: 0.5
x-files:
- path: templates/Limits.tpl
  kind: template
- path: src/generated/java/generated/GeneratedLimits.java
  kind: generated
  generated_from: templates/Limits.tpl
scenario_design:
  purpose: Evaluate whether a method attributes a fault in generated code to the commit that regenerated it.
  key_property: >-
    Measured: maxRetries() is 30 at c1 and 3 at c2; the template still says 30 and is not fixed here, so the
    next regeneration would reintroduce the fault. Blaming the line c2 deletes at c2^ returns c1.
notes:
- Rewritten 2026-09-21 from the shared Range.contains template to a wrong-constant fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
