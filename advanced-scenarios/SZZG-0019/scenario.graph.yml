    - c1
scenario_design:
  purpose: バグを含むコードが別ファイルへコピーされ、コピー先で後に修正されるケースを評価する。
  current_schema_limitation: "`copy_file` がないため、copy commit として表現できない。  \nまた、direct BIC と origin BIC の区別が必要。"
  required_extensions_from_source: "```yaml\n- type: \"copy_file\"\n  from: \"src/main/java/example/A.java\"\n  to: \"src/main/java/example/B.java\"\n\nbug_introducing_commits:\n  - commit: \"c1\"\n    role: \"direct\"\n  - commit: \"c0\"\n    role: \"origin\"\n```"
  evaluation_points:
  - direct BIC を正解とするか origin BIC を正解とするか
