- id: c0
  branch: main
  parents: []
  message: 'Add the legacy parser'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/legacy/Parser.java
    content: "package example.legacy;\npublic class Parser {\n  public int parseCount(String text) {\n    return Integer.parseInt(text.trim());\n\
      \  }\n}\n"
- id: c1
