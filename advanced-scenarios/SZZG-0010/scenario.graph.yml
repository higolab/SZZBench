    from: src/main/java/example/legacy/Parser.java
    to: src/main/java/example/core/Parser.java
  - type: replace
    path: src/main/java/example/core/Parser.java
    old: package example.legacy;
    new: package example.core;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Trim the text before parsing the count'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/core/Parser.java
