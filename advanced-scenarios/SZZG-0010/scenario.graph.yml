  title: Intermediate file move and package rename between BIC and BFC
  slug: intermediate-file-move-package-rename
  description: >-
    The parser moves into another package between the fault and the fix, so the path the fix edits and the path
    the fault was written at differ.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - file-rename
  - file-move
  - package-rename
  - intermediate-refactoring
  difficulty: advanced
  status: active
  tier: control
