schema_version: graph-1.0
meta:
  id: SZZG-0021
  title: Clone removal as fix
  slug: clone-removal-as-fix
  description: >-
    The fix deletes the faulty copy and points callers at the original, so the bug-fixing commit removes the file
    the fault lived in instead of editing it. The copy negates the visibility flag, so private documents are
    viewable by everyone and public ones only by members.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - copy-propagation
  - boolean-negation
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0021-clone-removal-as-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add Access.canView (isPublic || member)

    c1: add a second access check in AccessCopy with the visibility flag negated (BIC)

    c2: remove AccessCopy and point callers at Access (fix by deletion)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the access check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Access.java
    content: "package example;\n\npublic class Access {\n  /** A document can be viewed when it is public or the viewer is a member. */\n\
      \  public boolean canView(boolean isPublic, boolean member) {\n    return isPublic || member;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Add a second access check in AccessCopy'
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/AccessCopy.java
    content: "package example;\n\npublic class AccessCopy {\n  /** A document can be viewed when it is public or the viewer is a member. */\n\
      \  public boolean canView(boolean isPublic, boolean member) {\n    return !isPublic || member;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Remove AccessCopy and point callers at Access'
  role: bug_fixing
  operations:
  - type: delete_file
    path: src/main/java/example/AccessCopy.java
  - type: write_file
    path: docs/clone-removal.md
    content: 'AccessCopy.java was removed; callers should use Access.java.

      '
bugs:
- id: B001
  title: The copied access check negates the visibility flag; the copy is removed as the fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/AccessCopy.java
    statement: return !isPublic || member;
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/AccessCopy.java
    fix_type: file_deletion
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether a method handles a fix that deletes the faulty file instead of editing it.
  key_property: >-
    Measured: AccessCopy.canView(true, false) is false and canView(false, false) is true at c1 — the inverse of
    Access.canView, which is true and false; at c2 the class no longer exists. The fix's diff deletes every line
    of AccessCopy.java, all of which blame to c1.
notes:
