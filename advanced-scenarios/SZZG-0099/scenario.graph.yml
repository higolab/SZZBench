schema_version: graph-0.1-draft
meta:
  id: SZZG-0099
  title: BFC message references the wrong commit
  slug: bfc-message-references-wrong-commit
  description: Evaluates a BFC whose message points to a plausible but incorrect prior commit, while the true BIC is an earlier
    rounding change.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - message-evidence
  - misleading-commit-message
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0099-bfc-message-references-wrong-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create currency rounding helper
    c1: introduce truncating cents normalization
    c2: add invoice label helper mentioned by mistake
    c3: fix rounding while incorrectly blaming c2 in the message
commits:
- id: c0
  branch: main
  parents: []
  message: 'Create currency rounding helper'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/CurrencyFormatter.java
    content: |
      package example;

      public class CurrencyFormatter {
        public double roundToCents(double amount) {
          return Math.round(amount * 100.0) / 100.0;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Speed up cents normalization by truncating fractions'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/CurrencyFormatter.java
    old: return Math.round(amount * 100.0) / 100.0;
    new: return (int)(amount * 100.0) / 100.0;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Add invoice total label helper'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/InvoiceLabels.java
    content: |
      package example;

      public class InvoiceLabels {
        public String totalLabel() {
          return "Invoice total";
        }
      }
- id: c3
  branch: main
  parents:
  - c2
  message: 'Fix the invoice rounding regression from the label helper change'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/CurrencyFormatter.java
    old: return (int)(amount * 100.0) / 100.0;
    new: return Math.round(amount * 100.0) / 100.0;
bugs:
- id: B001
  title: Currency values are truncated instead of rounded
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/CurrencyFormatter.java
    statement: return (int)(amount * 100.0) / 100.0;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/CurrencyFormatter.java
    statement: return Math.round(amount * 100.0) / 100.0;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
scenario_design:
  purpose: Evaluate whether SZZ resists an incorrect BFC-message hint and still identifies the true code-level BIC.
  current_schema_limitation: Misleading developer hints are represented as metadata attached to the BFC.
  required_extensions_from_source: >-
    This scenario uses factors: message-evidence, misleading-commit-message; operations: write_file, replace.
  evaluation_points:
  - Whether SZZ identifies c1 as the true rounding BIC.
  - Whether c2 is treated as an incorrect message reference rather than the expected BIC.
  - Whether developer hints are distinguished from trustworthy blame evidence.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
developer_hints:
- bug: B001
  source: commit_message
  commit: c3
  referenced_commits:
  - c2
  correctness: incorrect
  explanation: The BFC message blames c2, but c2 only adds labels; c1 introduced the truncating arithmetic.
