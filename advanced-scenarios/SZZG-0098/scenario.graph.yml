schema_version: graph-0.1-draft
meta:
  id: SZZG-0098
  title: Only commit message provides the clue
  slug: commit-message
  description: Evaluates a case where two commits relax the same kind of regional gate in the same way, a later refactor
    merges both gates into one expression and deletes both changed lines, and the only remaining evidence that ties the BFC
    to the true BIC is the region named in the commit messages.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - context
  - commit_messages
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0098-commit-message
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create the regional checkout challenge gate, mandatory for EU and CA
    c1: make the EU gate depend on the merchant risk flag, with the only explicit EU clue
    c2: make the CA gate depend on the merchant risk flag as well, a deliberate product change
    c3: merge the two regional gates into one branch, deleting both changed lines
    c4: require the checkout challenge for EU orders again
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the regional checkout challenge gate'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/CheckoutChallengeGate.java
    content: |
      package example;

      public class CheckoutChallengeGate {
        static final int HIGH_RISK_SCORE = 70;

        public boolean requiresChallenge(String region, boolean merchantRiskFlag, int riskScore) {
          if (region.equals("EU")) {
            return true;
          }
          if (region.equals("CA")) {
            return true;
          }
          return riskScore >= HIGH_RISK_SCORE;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'PAY-314 bypass the EU checkout challenge while the consent copy rolls out'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/CheckoutChallengeGate.java
    old: |-
      if (region.equals("EU")) {
            return true;
          }
    new: |-
      if (region.equals("EU")) {
            return merchantRiskFlag;
          }
- id: c2
  branch: main
  parents:
  - c1
  message: 'PAY-330 let Canadian merchants below the risk score skip the checkout challenge'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/CheckoutChallengeGate.java
    old: |-
      if (region.equals("CA")) {
            return true;
          }
    new: |-
      if (region.equals("CA")) {
            return merchantRiskFlag || riskScore >= HIGH_RISK_SCORE;
          }
- id: c3
  branch: main
  parents:
  - c2
  message: 'PAY-352 collapse the two regional gates into one branch'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/CheckoutChallengeGate.java
    old: |-
      if (region.equals("EU")) {
            return merchantRiskFlag;
          }
          if (region.equals("CA")) {
            return merchantRiskFlag || riskScore >= HIGH_RISK_SCORE;
          }
    new: |-
      if (region.equals("EU") || region.equals("CA")) {
            return merchantRiskFlag || (region.equals("CA") && riskScore >= HIGH_RISK_SCORE);
          }
- id: c4
  branch: main
  parents:
  - c3
  message: 'PAY-501 require the checkout challenge for EU orders again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/CheckoutChallengeGate.java
    old: 'return merchantRiskFlag || (region.equals("CA") && riskScore >= HIGH_RISK_SCORE);'
    new: 'return region.equals("EU") || merchantRiskFlag || (region.equals("CA") && riskScore >= HIGH_RISK_SCORE);'
bugs:
- id: B001
  title: EU checkout challenge was accidentally left conditional
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/CheckoutChallengeGate.java
    statement: return merchantRiskFlag;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/CheckoutChallengeGate.java
    statement: 'return region.equals("EU") || merchantRiskFlag || (region.equals("CA") && riskScore >= HIGH_RISK_SCORE);'
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
    - c3
scenario_design:
  purpose: Evaluate whether a context-aware SZZ method can use commit-message evidence when a behaviour-preserving refactor
    has deleted the faulty line together with an equally shaped line from a second, innocent commit, so that no line-level
    evidence separates the two candidates.
  key_property: |
    c1 relaxes the EU gate and c2 relaxes the CA gate in the same shape; both are plausible causes of a relaxed checkout
    challenge. c3 merges the two branches into one condition and one expression without changing behaviour, and its patch
    deletes both changed lines, so neither survives into the fixed revision. The line the BFC modifies was written by c3,
    and walking its history back across the merge reaches c1 and c2 together. Only the region named in the messages
    separates them: c1 says it bypasses the EU challenge (PAY-314) and the BFC says it requires the EU challenge again
    (PAY-501), while c2 (PAY-330) is about Canada and c3 (PAY-352) only restructures the method.
  current_schema_limitation: Commit-message clues are represented as contextual metadata rather than as first-class graph
    edges.
  required_extensions_from_source: 'This scenario uses factors: context, commit_messages; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC using the PAY-314 EU clue in the commit message.
  - Whether the behaviour-preserving refactor c3, which line-based blame reaches, is rejected.
  - Whether the equally shaped but innocent CA relaxation c2 is rejected.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- 'Measured: git blame at BFC^ of the modified line reaches c3 under plain blame and under -w, -M and -C -C, never c1, so
  the generator prints GW703 for this scenario by design.'
context:
  required_files:
  - src/main/java/example/CheckoutChallengeGate.java
  required_commit_messages:
  - commit: c1
    clue: PAY-314 identifies the EU checkout challenge bypass that the BFC restores.
  - commit: c2
    clue: PAY-330 relaxes the Canadian gate in the same shape, so it is the rival candidate that only the region name rules
      out.
  - commit: c3
    clue: PAY-352 describes a pure restructuring of the gate, which is why the line blame reaches it is not the cause.
  ambiguous_code_context: The refactor deleted the EU line and the CA line in the same patch and replaced them with one
    expression, so the line history of the modified line reaches both candidates and the code says nothing about which
    region regressed.
