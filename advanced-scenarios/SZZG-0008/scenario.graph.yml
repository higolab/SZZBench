    path: pom.xml
    old: <version>1.0.0</version>
    new: <version>2.0.0</version>
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: fix bug (replace src/main/java/example/RangeAdapter.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeAdapter.java
    old: return RangeLib.includes(value, min, max);
    new: return RangeLib.containsInclusive(value, min, max);
