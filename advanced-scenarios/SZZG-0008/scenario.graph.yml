  source_future_id: FUTURE-008
  title: Dependency update as BIC
  slug: bic-dependency-update
  description: pom.xmlの依存バージョン更新をBICとし、ソース側のAPI適応をBFCとする。
  category: BIC の性質に関する未対応シナリオ
  category_code: B
  factors: []
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0008-bic-dependency-update
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: c0 dependency v1 / c1 dependency update to v2 / c2 code adapts to v2
commits:
- id: c0
  branch: main
  parents: []
  message: Use range-lib 1.0.0
  role: initial
  operations:
  - type: write_file
    path: pom.xml
    content: "<project>\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>example</groupId>\n  <artifactId>dependency-bic</artifactId>\n  <version>1.0-SNAPSHOT</version>\n\
      \  <dependencies>\n    <dependency>\n      <groupId>org.example</groupId>\n      <artifactId>range-lib</artifactId>\n      <version>1.0.0</version>\n\
      \    </dependency>\n  </dependencies>\n</project>\n"
  - type: write_file
    path: src/main/java/example/RangeAdapter.java
    content: "package example;\n\npublic class RangeAdapter {\n  public boolean contains(int value, int min, int max) {\n    return RangeLib.includes(value,\
      \ min, max);\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Update range-lib to 2.0.0 with changed API semantics
  role: bug_introducing
  operations:
  - type: replace
    path: pom.xml
    old: <version>1.0.0</version>
    new: <version>2.0.0</version>
- id: c2
  branch: main
  parents:
  - c1
  message: Adapt code to range-lib 2.0.0 inclusive API
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeAdapter.java
    old: return RangeLib.includes(value, min, max);
    new: return RangeLib.containsInclusive(value, min, max);
bugs:
- id: B001
  title: Dependency update changes range semantics
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: pom.xml
    statement: <version>2.0.0</version>
    change_type: dependency_update
    dependency:
      group: org.example
      artifact: range-lib
      from: 1.0.0
      to: 2.0.0
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/RangeAdapter.java
    statement: return RangeLib.containsInclusive(value, min, max);
    fix_type: api_adaptation
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: 外部ライブラリ更新により、既存コードがバグを持つようになるケースを評価する。
  current_schema_limitation: "dependency update が BIC であることは書けるが、外部依存関係と code behavior の関係を表現できない。  \nfault location がソースコード行ではなく build file の\
    \ dependency line になる。"
  required_extensions_from_source: "```yaml\nfault:\n  change_type: \"dependency_update\"\n  file: \"pom.xml\"\n  dependency:\n    group: \"...\"\
    \n    artifact: \"...\"\n    from: \"1.0\"\n    to: \"2.0\"\n```"
  evaluation_points:
  - non-code BIC を SZZ が扱えるか
  - code fix から build file の変更へ到達できるか
  - context-aware / issue-aware SZZ が有利か
