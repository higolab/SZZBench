  message: 'c0: create initial state (write_file pom.xml; write_file src/main/java/example/RangeAdapter.java)'
  role: initial
  operations:
  - type: write_file
    path: pom.xml
    content: "<project>\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>example</groupId>\n  <artifactId>dependency-bic</artifactId>\n\
      \  <version>1.0-SNAPSHOT</version>\n  <dependencies>\n    <dependency>\n      <groupId>org.example</groupId>\n     \
      \ <artifactId>range-lib</artifactId>\n      <version>1.0.0</version>\n    </dependency>\n  </dependencies>\n</project>\n"
  - type: write_file
    path: src/main/java/example/RangeAdapter.java
    content: "package example;\n\npublic class RangeAdapter {\n  public boolean contains(int value, int min, int max) {\n\
      \    return RangeLib.includes(value, min, max);\n  }\n}\n"
- id: c1
  branch: main
  parents:
