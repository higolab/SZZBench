expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    related_origins:
    - c1
  evaluation_variants:
  - name: direct-only
    description: Only the direct BIC in HttpClientConfig.java is accepted.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c2
      related_origins:
      - c1
  - name: origin-aware
    description: The direct BIC is required; the origin is tolerated with the suite's usual credit 0.5.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
  - name: relaxed-with-credit
    description: >
      The origin is worth a full point: {c1} alone gives weighted_credit 1.0 of possible_credit 1.0
      (credit_ratio 1.0) and still FAILs, because c2 is missing; {c2} passes with 1.0; {c2, c1}
      passes with min(1, 1 + 1.0) = 1.0.
    commit_level:
      evaluation_policy: relaxed_with_credit
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 1.0
  default_variant: direct-only
scenario_design:
  purpose: >
    Third member of the relaxed_with_credit family: the largest credit value, which shows that
    credit is a similarity measure and never a substitute for the required set.
  key_property: >
    Measured: connectTimeoutMillis() is 30 at c2 and 3000 at c3; Timeouts.connectMillis() is 3000
    at c0 and 30 from c1 on and is not fixed here. Blaming the line c3 deletes at c3^ returns c2.
  evaluation_points:
  - 'Default: {c2} passes; {c1} and {c2, c1} fail.'
  - 'relaxed-with-credit: {c1} has credit_ratio 1.0 and FAILs; {c2, c1} passes.'
copy_relationships:
- id: COPY-001
