schema_version: graph-1.0
meta:
  id: SZZG-0142
  title: "An origin worth a full point: credit 1.0 fills the metric while the status still needs the direct BIC"
  slug: relaxed-credit-full-origin
  description: >
    A timeout constant is wrong in a shared Timeouts class (the origin) and copied into the HTTP
    client configuration (the direct BIC); the fix corrects the copy. The relaxed-with-credit
    variant gives the origin credit 1.0 — for this scenario the origin is judged as good an answer
    as the copy — so an answer of the origin alone reaches credit_ratio 1.0 and still fails: the
    status is decided by the required set, the credit by overlap. The origin-aware variant keeps
    the suite's convention of 0.5 (D3). Sibling of SZZG-0022 and SZZG-0141.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - relaxed-credit
  - origin-vs-direct
  - copy-propagation
  - wrong-constant
  - single-bic
  - single-bfc
  - evaluation-variant
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0142-relaxed-credit-full-origin
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
