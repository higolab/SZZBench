schema_version: graph-0.1-draft
meta:
  id: SZZG-0095
  title: BIC separated from BFC by an intermediate work-item commit
  slug: bic-bfc-intermediate-work-item
  description: Evaluates a work-item series where an unrelated commit from the same work item appears between the BIC and
    the BFC.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - work-item
  - intermediate-commit
  - related-but-not-correct
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0095-bic-bfc-intermediate-work-item
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create inventory reservation logic
    c1: introduce exact-stock reservation bug
    c2: add unrelated audit event in the same work item
    c3: fix exact-stock reservation bug
commits:
- id: c0
  branch: main
  parents: []
  message: 'WI-418 add the inventory reservation logic'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/InventoryReservation.java
    content: |
      package example;

      public class InventoryReservation {
        public boolean canReserve(int available, int alreadyReserved, int requested) {
          return available - alreadyReserved >= requested;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'WI-418 reject oversold reservations'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/InventoryReservation.java
    old: return available - alreadyReserved >= requested;
    new: return available - alreadyReserved > requested;
- id: c2
  branch: main
  parents:
  - c1
  message: 'WI-418 add the inventory audit event names'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/InventoryAudit.java
    content: |
      package example;

      public class InventoryAudit {
        public String reservationEvent() {
          return "inventory.reservation.requested";
        }
      }
- id: c3
  branch: main
  parents:
  - c2
  message: 'WI-418 allow a reservation when stock exactly matches the request'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/InventoryReservation.java
    old: return available - alreadyReserved > requested;
    new: return available - alreadyReserved >= requested;
bugs:
- id: B001
  title: Exact-stock reservations are rejected after a work-item change
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/InventoryReservation.java
    statement: return available - alreadyReserved > requested;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/InventoryReservation.java
    statement: return available - alreadyReserved >= requested;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
scenario_design:
  purpose: Evaluate whether SZZ identifies the original BIC when a related but non-faulty work-item commit sits immediately
    between the BIC and BFC.
  current_schema_limitation: Work-item membership and related-but-not-correct candidates are graph-specific metadata.
  required_extensions_from_source: 'This scenario uses factors: work_items, intermediate_commit, related_but_not_correct; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC.
  - Whether the intermediate audit commit c2 is not mistaken for the BIC.
  - Whether work-item membership is represented without collapsing all commits in the work item into one cause.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
