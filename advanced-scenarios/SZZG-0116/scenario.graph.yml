scenario_design:
  purpose: Evaluate whether SZZ output can be judged against an entity-level oracle when line-level evaluation is intentionally
    disabled.
  key_property: This is an oracle-policy scenario. The faulty line is recorded for traceability, but line-level evaluation
    is deliberately unavailable and the expected answer is the Range.contains method entity.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: expected_szz; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ output can be evaluated at method-entity level.
  - Whether tooling respects the line_level.available=false policy.
  - Whether the expected_szz entity-level oracle is applied correctly.
