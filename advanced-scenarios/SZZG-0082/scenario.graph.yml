schema_version: graph-1.0
meta:
  id: SZZG-0082
  title: Rebase with generated file update
  slug: rebase-with-generated-file-update
  description: >
    A generated file is updated during rebase after the source BIC. The fault drops the negation of the
    kill switch from a feature gate, so the feature is enabled exactly when it should be switched off.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - generated-files
  - generated-code-noise
  - direct-bic
  - boolean-negation
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0082-rebase-with-generated-file-update
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add the feature gate (flag && !killSwitch)

    f1: drop the negation of the kill switch on the feature branch

    r1: rebase the fault onto main

    r2: regenerate the derived feature metadata during rebase

    c3: negate the kill switch again'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the feature gate'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/FeatureGate.java
    content: "package example;\n\npublic class FeatureGate {\n  /** The feature is on when its flag is set and the kill switch is not. */\n\
      \  public boolean isEnabled(boolean flag, boolean killSwitch) {\n    return flag && !killSwitch;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Honour the kill switch in the feature gate'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/FeatureGate.java
    old: return flag && !killSwitch;
    new: return flag && killSwitch;
- id: r1
  branch: main
  parents:
  - c0
  message: 'Honour the kill switch in the feature gate'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/FeatureGate.java
    old: return flag && !killSwitch;
    new: return flag && killSwitch;
  rebase_of: f1
- id: r2
  branch: main
  parents:
  - r1
  message: 'Regenerate the derived feature metadata'
  role: intermediate
  operations:
  - type: write_file
    path: generated/feature.properties
    content: 'gate.flag=true

      gate.killSwitch=false

      '
  x-generated_files: true
- id: c3
  branch: main
  parents:
  - r2
  message: 'Negate the kill switch in the feature gate again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/FeatureGate.java
    old: return flag && killSwitch;
    new: return flag && !killSwitch;
bugs:
- id: B001
  title: The feature is enabled exactly when the kill switch is on; generated-file noise after the rebase
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/FeatureGate.java
    statement: return flag && killSwitch;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/FeatureGate.java
    statement: return flag && !killSwitch;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/FeatureGate.java
    statement: return flag && killSwitch;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_but_not_correct:
    - r2
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      related_but_not_correct:
      - r2
scenario_design:
  purpose: Evaluate generated-file noise during rebase.
  key_property: >
    r2 updates generated metadata only. Measured: isEnabled(true, false) is true at c0, false at f1, r1 and r2,
    true at c3; isEnabled(true, true) is false at c0, true at r1, false at c3 — the gate is inverted with respect
    to the kill switch. Blaming the line c3 deletes at c3^ returns r1.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
  - Ignore r2.
  failure_mode: >-
    A tool fails here when it treats the commit before the fix, `r2`, as a candidate: it changed only a
    generated file and no source.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
- Rewritten 2026-09-21 from the shared Range.contains template to a boolean-negation fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
