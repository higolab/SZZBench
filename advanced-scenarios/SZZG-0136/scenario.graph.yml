schema_version: graph-1.0
meta:
  id: SZZG-0136
  title: "The fault predates the repository: an import commit is the history's boundary, not the BIC"
  slug: import-boundary-not-bic
  description: >
    The first commit imports a billing module from another version-control system and says so:
    its message names the source repository and revision, and docs/IMPORT.md records that the
    earlier history is not part of this repository. The imported code already carries the fault.
    The default oracle is the empty set — the introducing change lies before the boundary — and
    the variant boundary-commit accepts c0 for tools that report the boundary explicitly. Its twin
    SZZG-0137 has the same code and history but an authored first commit, and there c0 is the BIC.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - expect-no-bic
  - history-boundary
  - import-commit
  - tool-visible-context
  - evaluation-variant
  - single-bfc
  difficulty: medium
  status: active
  tier: control
repository:
  name: SZZG-0136-import-boundary-not-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Import the billing module from the accounting SVN repository (r4120)'
  role: initial
  author: 'Bruno Fischer <bruno.fischer@example.com>'
  date: '2024-01-08T09:00:00Z'
  operations:
  - type: write_file
    path: docs/IMPORT.md
    content: |
      # Provenance of the billing module

      The billing module was developed in the accounting SVN repository between 2019 and 2023.
      It was imported into this repository at SVN r4120 (2023-11-30) as a single snapshot, without
      its history. Its earlier revisions are not part of this repository.
  - type: write_file
    path: src/main/java/example/billing/LateFee.java
    content: |
      package example.billing;

      public class LateFee {
          /**
           * Fee in cents for an invoice that is {@code daysLate} days overdue. The first
           * {@code graceDays} days are free; only the days beyond the grace period are charged,
           * at {@code centsPerDay} each.
           */
          public int feeCents(int daysLate, int graceDays, int centsPerDay) {
              if (daysLate <= graceDays) {
                  return 0;
              }
              return daysLate * centsPerDay;
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Add the invoice reminder text'
  role: intermediate
  author: 'Chen Wei <chen.wei@example.com>'
  date: '2024-01-15T14:30:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/billing/Reminder.java
    content: |
      package example.billing;

      public class Reminder {
          public String text(String invoiceId, int daysLate) {
              return "Invoice " + invoiceId + " is " + daysLate + " day(s) overdue.";
          }
      }
- id: c2
  branch: main
  parents:
  - c1
  message: 'Record the report about late fees charged from the first day'
  role: intermediate
  author: 'Dana Okafor <dana.okafor@example.com>'
  date: '2024-01-22T10:15:00Z'
  operations:
  - type: write_file
    path: docs/issues/ISSUE-8.md
    content: |
      # ISSUE-8: Late fees are charged for the grace period too

      Reported: 2024-01-19T16:05:00Z

      An invoice that is 5 days late with a 3-day grace period is charged 5 days of fees
      (500 cents at 100 cents per day). Only the 2 days beyond the grace period should be charged.
- id: c3
  branch: main
  parents:
  - c2
  message: 'Charge only the days beyond the grace period'
  role: bug_fixing
  author: 'Bruno Fischer <bruno.fischer@example.com>'
  date: '2024-01-29T11:45:00Z'
  operations:
  - type: replace
    path: src/main/java/example/billing/LateFee.java
    old: return daysLate * centsPerDay;
    new: return (daysLate - graceDays) * centsPerDay;
