expected_szz:
  commit_level:
    evaluation_policy: exact_set
    expect_no_bic: true
    required: []
    known_distractors:
    - c0
    notes: >
      c0 is a boundary, not a change: its message and docs/IMPORT.md state that the code has an
      earlier history (SVN r4120) which this repository does not contain, so the commit that wrote
      `return daysLate * centsPerDay;` is not here. The default answer is the empty set. The
      variant boundary-commit accepts c0 for a tool that reports the history boundary as such.
  evaluation_variants:
  - name: boundary-commit
    description: >
      A tool that reports the import commit as the earliest point at which the fault is present in
      this repository. Accepted as an explicit boundary answer; the tool should say that it is one.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c0
  default_variant: default
scenario_design:
  purpose: >
    The second of three contracts for "no ordinary BIC" (issue #24): the origin lies before the
    repository's first commit. The evidence that makes c0 a boundary is tool-visible — the import
    message and docs/IMPORT.md — and it is the only thing that distinguishes this scenario from its
    twin SZZG-0137, whose c0 is an authored commit and therefore the BIC. Contract in
    decisions/origin-direct-contract.md (D11).
  key_property: >
    Measured: feeCents(5, 3, 100) is 500 at c0, c1 and c2 and 200 at c3; feeCents(3, 3, 100) is 0
    throughout. Blaming the line c3 deletes at c3^ returns c0. Every commit is pinned to the same
    author and date as in SZZG-0137; the two repositories differ only in c0's message and
    docs/IMPORT.md.
  evaluation_points:
  - Report nothing under the default oracle; the history does not contain the introducing change.
  - Report c0 only as a boundary (variant boundary-commit), not as the change that introduced the fault.
notes:
- docs/IMPORT.md is written by c0 itself, so the provenance is visible at every commit of the history.
- The domain this scenario supports is a late fee that still fits int, for instance 2 000 000 chargeable
  days at 1000 cents, since the fee multiplies days by a daily rate in int; the bound is probed by
  tests/test_reference_arithmetic.py (issue #82).
