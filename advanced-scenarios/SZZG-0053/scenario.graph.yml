  title: Release-branch-only bug
  slug: release-branch-only-bug
  description: A release branch introduces and fixes a bug that never exists on main.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - release_branch
  - branch_only_bug
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0053-release-branch-only-bug
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: main continues correct development

    c2: release branch introduces release-only bug

    c3: main adds unrelated correct change

    c4: release branch fixes release-only bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial correct implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: add main-only version note'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main-version.md
    content: 'Main remains correct.

      '
- id: c2
  branch: release
  parents:
  - c0
  message: 'c2: introduce release-only range boundary bug'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c3
  branch: main
  parents:
  - c1
  message: 'c3: add unrelated main documentation'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main-unrelated.md
    content: 'Unrelated main branch change.

      '
- id: c4
  branch: release
  parents:
  - c2
  message: 'c4: fix release-only range boundary bug'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
