    c3: 片方のみ修正'
commits:
- id: c1
  branch: main
  parents: []
  message: 'c1: faulty line 導入'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value > min && value < max;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: faulty line を別メソッドへ移動し、元にも残す'
  role: intermediate
  operations:
  - type: move_entity
    entity:
      type: method
      name: contains
      signature: boolean contains(int value, int min, int max)
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/RangeUtils.java
  - type: copy_entity
    entity:
      type: statement
      text: return value > min && value < max;
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/RangeUtils.java
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: 片方のみ修正'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
