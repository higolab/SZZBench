scenario_design:
  purpose: Evaluate whether SZZ returns the revert commit that reintroduced the bug rather than the original historical BIC.
  key_property: The bug was fixed once, but reverting that fix creates the direct BIC for the later BFC.
  difference_from_existing_revert_scenarios: This scenario isolates a double-revert or revert-derived complication beyond
    the existing partial revert and reintroduction scenarios.
  evaluation_points:
  - Whether SZZ reports c3.
  - Whether c1 is treated as origin rather than the direct answer.
  - Whether the prior fix c2 is not reported as BIC.
notes:
- This scenario models revert-related development history for SZZ evaluation.
- The direct BIC is the commit that reintroduces the bug in the history observed from the BFC.
