expected_szz:
  commit_level:
    evaluation_policy: reintroduction_direct
    required:
    - c3
    - c4
    related_origins:
    - c1
    related_but_not_correct:
    - c2
    notes: >
      c3 is the commit that put the unit change in force at the fix: it is a real git revert of c2,
      itself a real git revert of c1, so c3's diff is c1's change again. c1 is the origin and is not
      required (D-contract: a reintroduction is attributed to the commit that reintroduced it); c2
      undid the change and is related but not correct. c4 is the reader that assumed seconds. Blame on
      the line c5 deletes returns c4 alone.
  evaluation_variants:
  - name: origin-aware
    description: >
      The same required set; reporting the origin c1 as well is tolerated (direct/origin contract D3),
      reporting c2 is not.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c3
      - c4
      related_origins:
      - c1
      related_but_not_correct:
      - c2
scenario_design:
  purpose: >
    A discriminating scenario for G6: the required commit that blame cannot reach is a
    revert-of-revert, so a tool has to follow the value the fixed expression reads to the commit
    that last changed its meaning, and then attribute that change to the revert that brought it
    back rather than to the original commit or to the revert that removed it.
  key_property: >
    Measured: waitSeconds(3) is 6 at every commit; firstWaitSeconds() is 2000 at c4 and 2 at c5.
    Undoing c3 on top of c4 (BACKOFF = 2, waitSeconds() multiplying directly, firstWaitSeconds()
    returning the constant) gives 2, the fixed answer. Blaming the line c5 deletes at c5^ returns c4
    under every variant. git log --first-parent lists all six commits; c2's diff is the inverse of
    c1's and c3's diff equals c1's.
  evaluation_points:
  - Report exactly {c3, c4}.
  - Whether the unit change in force at the fix is attributed to the revert-of-revert c3 rather than to c1 or c2.
  - Whether the value the fixed expression reads is followed at all.
  failure_mode: >-
    A tool fails here when it stops at blame's `c4`, or when it follows the constant to the change
    that made it milliseconds and reports the original `c1` or the undoing `c2` instead of `c3`, the
    revert of the revert that put the change back.
notes:
- c2 and c3 are real `git revert` commits with the messages Git writes for them; neither has hand-written operations.
