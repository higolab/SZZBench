schema_version: graph-1.0
meta:
  id: SZZG-0147
  title: A revert of a revert brings the unit change back, and a consumer is written after it
  slug: revert-of-revert-reintroduces-the-unit-change
  description: >
    The retry backoff is restated in milliseconds together with its only
    reader, reverted, and reverted again, so the unit change is in force
    through a revert-of-revert commit. A later commit returns the constant as
    a number of seconds. The fix repairs that reader. Blame on the line the fix
    deletes reaches the reader only; the commit that put the unit change back
    is a revert whose own diff is a copy of the original change.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - multi-bic
  - single-bfc
  - revert
  - revert-of-revert
  - origin-vs-direct
  - value-flow
  - wrong-constant
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0147-revert-of-revert-reintroduces-the-unit-change
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the retry backoff policy'
  author: 'Hana Sato <hana.sato@example.com>'
  role: initial
  date: '2024-11-04T09:15:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/RetryPolicy.java
    content: |
      package example;

      public class RetryPolicy {
          static final int BACKOFF = 2;

          public int waitSeconds(int attempt) {
              return BACKOFF * attempt;
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Express the backoff in milliseconds'
  author: 'Luca Moretti <luca.moretti@example.com>'
  role: intermediate
  date: '2024-11-06T13:30:00Z'
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: |
      static final int BACKOFF = 2;

          public int waitSeconds(int attempt) {
              return BACKOFF * attempt;
          }
    new: |
      static final int BACKOFF = 2000;

          public int waitSeconds(int attempt) {
              return BACKOFF * attempt / 1000;
          }
- id: c2
  branch: main
  parents:
