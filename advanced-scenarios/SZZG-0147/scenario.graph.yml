  message: 'Report the first wait before a retry'
  author: 'Aiko Mori <aiko.mori@example.com>'
  role: bug_introducing
  date: '2024-11-13T11:20:00Z'
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: |
      public int waitSeconds(int attempt) {
              return BACKOFF * attempt / 1000;
          }
    new: |
      public int waitSeconds(int attempt) {
              return BACKOFF * attempt / 1000;
