schema_version: graph-1.0
meta:
  id: SZZG-0083
  title: Huge noisy rebased commit
  slug: huge-noisy-rebased-commit
  description: >
    The rebased bug-introducing commit changes one line of application code and, in the same commit,
    regenerates a machine-written status code table of about 7000 lines. The one relevant line — a
    ternary whose branches were swapped, so the fallback is returned when a phrase exists and null when
    it does not — has to be found inside a very large patch.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - large-noisy-commit
  - generated-file
  - multi-file
  - robustness
  - direct-bic
  - origin-bic
  - wrong-variable
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0083-huge-noisy-rebased-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the status text helper (phrase if present, fallback otherwise)

    f1: Regenerate the status code table and tidy the reason lookup (feature; ~7000 generated lines plus one swapped source line)

    r1: rebased f1 onto main, with the whole generated table

    c2: Return the phrase when it exists and the fallback when it does not'
commits:
- id: c0
  branch: main
  parents: []
  message: Add the status text helper
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/StatusText.java
    content: "package example;\n\npublic class StatusText {\n  /** The reason phrase of a status code, or {@code fallback} when none is known. */\n\
      \  public String describe(String phrase, String fallback) {\n    return phrase != null ? phrase : fallback;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: Regenerate the status code table and tidy the reason lookup
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/StatusText.java
    old: 'return phrase != null ? phrase : fallback;'
    new: 'return phrase != null ? fallback : phrase;'
  - type: write_generated_text_file
    path: src/main/java/example/StatusCodes.java
    lines: 5000
    template: '  public static final int CODE_${line} = ${line};'
    header: "package example;\n\npublic final class StatusCodes {\n  private StatusCodes() {\n  }\n\n"
    footer: '}'
  - type: write_generated_text_file
    path: src/main/resources/status-labels.properties
    lines: 2000
    template: status.${line}=generated label ${line}
- id: r1
  branch: main
  parents:
  - c0
  role: bug_introducing
  rebase_of: f1
  inherit_message: true
  inherit_author_date: true
  committer_date: '2024-01-05T07:55:00Z'
  x-large_noisy_rebased_commit: true
  operations:
  - type: replace
    path: src/main/java/example/StatusText.java
    old: 'return phrase != null ? phrase : fallback;'
    new: 'return phrase != null ? fallback : phrase;'
  - type: write_generated_text_file
    path: src/main/java/example/StatusCodes.java
    lines: 5000
    template: '  public static final int CODE_${line} = ${line};'
    header: "package example;\n\npublic final class StatusCodes {\n  private StatusCodes() {\n  }\n\n"
    footer: '}'
  - type: write_generated_text_file
    path: src/main/resources/status-labels.properties
    lines: 2000
    template: status.${line}=generated label ${line}
- id: c2
  branch: main
  parents:
  - r1
  message: Return the phrase when it exists and the fallback when it does not
  role: bug_fixing
  date: '2024-01-09T12:40:00Z'
  operations:
  - type: replace
    path: src/main/java/example/StatusText.java
    old: 'return phrase != null ? fallback : phrase;'
    new: 'return phrase != null ? phrase : fallback;'
bugs:
- id: B001
  title: The reason lookup returns the fallback for known codes and null for unknown ones, hidden in a very large rebased commit
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/StatusText.java
    statement: 'return phrase != null ? fallback : phrase;'
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/StatusText.java
    statement: 'return phrase != null ? phrase : fallback;'
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/StatusText.java
    statement: 'return phrase != null ? fallback : phrase;'
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: r1 is the direct BIC. Its patch is about 7000 lines long, but only one of them is the fault; the generated
      files are never touched by the fix and therefore never enter deleted-line blame.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate how robust a tool is when the bug-introducing commit is very large.
  key_property: >
    r1 adds a 5006-line generated Java table and a 2000-line generated properties file next to the single faulty
    source line. Measured: describe("OK", "Unknown") is "OK" at c0, "Unknown" at f1 and r1, "OK" at c2;
    describe(null, "Unknown") is "Unknown" at c0, null at r1, "Unknown" at c2. Deleted-line blame is unaffected by
    the size and returns r1; whole-patch consumers and repository-scanning tools are the ones that pay for it.
  difference_from_SZZG_0064: SZZG-0064 replays two small commits; here a single replayed commit carries thousands of generated
    lines around the one relevant change.
  evaluation_points:
  - Report r1.
  - Stay within time and memory limits on a commit whose patch is about 7000 lines.
  failure_mode: >-
    A tool fails here when it cannot handle a 7000-line patch within its time and memory limits, or feeds
    whole patches to a classifier: the fix deletes one line and its blame is direct.
notes:
- The generated files are written with write_generated_text_file; header and footer make StatusCodes.java a compilable Java class.
- 'The size burdens tools that read whole patches (diff parsers, LLM prompts, commit-level classifiers) or that scan the repository
  at each commit, not line-level blame: the fix deletes exactly one line, and that line is in StatusText.java.'
- Rewritten 2026-09-21 from the shared Range.contains template to a wrong-variable fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
