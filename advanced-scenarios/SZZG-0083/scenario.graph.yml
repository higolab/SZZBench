schema_version: graph-0.1-draft
meta:
  id: SZZG-0083
  title: Huge noisy rebased commit
  slug: huge-noisy-rebased-commit
  description: The rebased bug-introducing commit changes one line of application code and, in the same commit, regenerates a machine-written
    status code table of about 7000 lines. The one relevant line has to be found inside a very large patch.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - large-noisy-commit
  - generated-file
  - multi-file
  - robustness
  - direct-bic
  - origin-bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0083-huge-noisy-rebased-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the Range class with an inclusive contains check

    f1: Regenerate the status code table and use strict interval bounds (feature; ~7000 generated lines plus one source line)

    r1: rebased f1 onto main, with the whole generated table

    c2: Restore the inclusive comparison in Range.contains'
commits:
- id: c0
  branch: main
  parents: []
  message: Add the Range class with an inclusive contains check
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: Regenerate the status code table and use strict interval bounds
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
  - type: write_generated_text_file
    path: src/main/java/example/StatusCodes.java
    lines: 5000
    template: '  public static final int CODE_${line} = ${line};'
    header: "package example;\n\npublic final class StatusCodes {\n  private StatusCodes() {\n  }\n\n"
    footer: '}'
  - type: write_generated_text_file
    path: src/main/resources/status-labels.properties
    lines: 2000
    template: status.${line}=generated label ${line}
- id: r1
  branch: main
  parents:
  - c0
  role: bug_introducing
  rebase_of: f1
  inherit_message: true
  inherit_author_date: true
  committer_date: '2024-01-05T07:55:00Z'
  large_noisy_rebased_commit: true
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
  - type: write_generated_text_file
    path: src/main/java/example/StatusCodes.java
    lines: 5000
    template: '  public static final int CODE_${line} = ${line};'
    header: "package example;\n\npublic final class StatusCodes {\n  private StatusCodes() {\n  }\n\n"
    footer: '}'
  - type: write_generated_text_file
    path: src/main/resources/status-labels.properties
    lines: 2000
    template: status.${line}=generated label ${line}
- id: c2
  branch: main
  parents:
  - r1
  message: Restore the inclusive comparison in Range.contains
  role: bug_fixing
  date: '2024-01-09T12:40:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Bug hidden in a very large rebased commit
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: r1 is the direct BIC. Its patch is about 7000 lines long, but only one of them is the fault; the generated
      files are never touched by the fix and therefore never enter deleted-line blame.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate how robust a tool is when the bug-introducing commit is very large.
  key_property: r1 adds a 5006-line generated Java table and a 2000-line generated properties file next to the single faulty source
    line. Deleted-line blame is unaffected by the size; whole-patch consumers and repository-scanning tools are the ones that pay
    for it.
  difference_from_SZZG_0064: SZZG-0064 replays two small commits; here a single replayed commit carries thousands of generated
    lines around the one relevant change.
  evaluation_points:
  - Report r1.
  - Stay within time and memory limits on a commit whose patch is about 7000 lines.
notes:
- The generated files are written with write_generated_text_file; header and footer make StatusCodes.java a compilable Java class.
- 'The size burdens tools that read whole patches (diff parsers, LLM prompts, commit-level classifiers) or that scan the repository
  at each commit, not line-level blame: the fix deletes exactly one line, and that line is in Range.java.'
