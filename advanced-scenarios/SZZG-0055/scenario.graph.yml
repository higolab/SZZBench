  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    rel1: introduce release-specific range bug

    m1: continue main development

    r1: rebase release change onto main

    c2: fix release-origin bug on main'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: rel1
  branch: release
  parents:
  - c0
  message: 'Rel1: introduce release-specific range bug'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: m1
  branch: main
  parents:
  - c0
  message: 'Continue main development'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main.md
    content: 'main dev

      '
- id: r1
  branch: main
  parents:
  - m1
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
  rebase_of: rel1
- id: c2
  branch: main
  parents:
  - r1
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
