schema_version: graph-0.1-draft
meta:
  id: SZZG-0066
  title: Rebase conflict resolution propagates existing bug
  slug: rebase-conflict-resolution-propagates-existing-bug
  description: A feature BIC is propagated to main by a rebase conflict resolution commit.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - rebase_conflict_resolution
  - origin_bic
  - direct_bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0066-rebase-conflict-resolution-propagates-existing-bug
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: introduce range bug on feature

    m1: add main-line documentation

    r1: resolve rebase conflict by taking buggy feature logic

    c2: fix propagated rebase bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: m1
  branch: main
  parents:
  - c0
  message: 'Add the main documentation note'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main.md
    content: 'main note

      '
- id: r1
  branch: main
  parents:
  - m1
  message: 'Resolve the rebase conflict in favour of the feature version'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
  rebase_of: f1
  rebase_conflict_resolution: true
- id: c2
  branch: main
  parents:
  - r1
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Bug propagated by rebase conflict resolution
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_but_not_correct:
    - f1
    notes: r1 is direct; f1 is origin.
scenario_design:
  purpose: Evaluate direct-vs-origin BIC behavior when conflict resolution propagates an existing bug.
  key_property: The same buggy logic exists in f1, but main-line direct BIC is r1.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
  - Treat f1 as origin.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
