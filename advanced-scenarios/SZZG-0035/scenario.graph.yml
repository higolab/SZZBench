graph:
  model: commit_dag
  history_summary: 'main:    c0 -- c1 bug

    release: c0 -- r1 cherry-pick of c1 -- r2 fix'
commits:
- id: c0
  branch: main
  parents: []
  message: Initial implementation
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: Introduce bug on feature branch
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: feature
  parents:
  - c1
  message: Feature branch follow-up change
  role: intermediate
  operations:
  - type: write_file
    path: docs/feature-note.md
    content: 'feature note

      '
- id: c3
  branch: main
  parents:
  - c0
  - c2
  message: Merge feature branch
  role: merge
  operations: []
- id: c4
  branch: main
  parents:
  - c3
  message: Fix bug
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: r1
  branch: release
  parents:
  - c0
  message: Cherry-pick relevant commit
  role: cherry_pick
  cherry_pick_of: c1
  operations:
  - type: apply_patch_from
    commit: c1
