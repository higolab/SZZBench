scenario_design:
  purpose: bug-introducing commit が別 branch に cherry-pick されるケースを評価する。
  current_schema_limitation: cherry-pick relationship を表現できない。
  required_extensions_from_source: "```yaml\ncommits:\n  - id: \"r1\"\n    cherry_pick_of: \"c1\"\n```"
  evaluation_points:
  - release branch での direct BIC は r1 か original c1 か
  - duplicate commit の扱い
  - hash が違う同一 patch の評価
