schema_version: graph-1.0
meta:
  id: SZZG-0035
  title: One BIC causes multiple bug symptoms
  slug: bic-bug
  description: >-
    One faulty helper — a 3 percent fee computed with 30 — is reached from two call sites and each site is
    repaired by its own commit, so the scenario carries two bug entries with the same bug-introducing commit.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - root-cause-not-in-diff
  - wrong-constant
  difficulty: hard
  status: active
  tier: control
repository:
  name: SZZG-0035-bic-bug
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create the fee helpers (a private 3 percent fee used by two callers)

    c1: compute the fee with 30 instead of 3 (BIC, one line, two symptoms)

    c2: compute the card fee directly instead of calling fee() (fixes the first symptom)

    c3: compute the transfer fee directly instead of calling fee() (fixes the second symptom)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the payment fee helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Fees.java
    content: "package example;\n\npublic class Fees {\n  /** The 3 percent processing fee on {@code cents}. */\n  private int fee(int cents) {\n    return\
      \ (int) ((long) cents * 3 / 100);\n  }\n\n  public int cardFee(int cents) {\n    return fee(cents);\n  }\n\n  public int transferFee(int cents) {\n    return fee(cents);\n\
      \  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Apply the 3 percent fee'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Fees.java
    old: return (int) ((long) cents * 3 / 100);
    new: return (int) ((long) cents * 30 / 100);
- id: c2
  branch: main
  parents:
  - c1
  message: 'Compute the card fee directly instead of calling fee()'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Fees.java
    old: return fee(cents);
    new: return (int) ((long) cents * 3 / 100);
    occurrence: 1
- id: c3
  branch: main
  parents:
  - c2
  message: 'Compute the transfer fee directly in the remaining caller'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Fees.java
    old: return fee(cents);
    new: return (int) ((long) cents * 3 / 100);
    occurrence: 1
bugs:
- id: B001
  title: Card fee symptom caused by the shared helper BIC
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
    description: Fixes this symptom at its call site; the other symptom has its own bug entry.
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Fees.java
    statement: return (int) ((long) cents * 30 / 100);
    location: fee
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Fees.java
    statement: return (int) ((long) cents * 3 / 100);
    location: cardFee
- id: B002
  title: Transfer fee symptom caused by the same shared helper BIC
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
    description: Fixes this symptom at the remaining call site.
  faults:
  - id: F002
    commit: c1
    file: src/main/java/example/Fees.java
    statement: return (int) ((long) cents * 30 / 100);
    location: fee
  fixes:
  - id: X002
    commit: c3
    file: src/main/java/example/Fees.java
    statement: return (int) ((long) cents * 3 / 100);
    location: transferFee
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
bug_groups:
- id: BG001
  root_cause: c1
  bugs:
  - B001
  - B002
scenario_design:
  purpose: >-
    Evaluate whether a method reports the same bug-introducing commit for two symptoms fixed by different commits.
  key_property: >-
    The fee is computed in long before the division, so no snapshot overflows for amounts whose fee fits in
    int. Measured: cardFee(1000) is 30 at c0, 300 at c1, 30 at c2; transferFee(1000) is 30 at c0, 300 at c1 and
    c2, 30 at c3; cardFee(1000000000) is 30000000 at c0 and c2, 300000000 at c1. Each fix deletes a `return fee(cents);` line written by c0, not the faulty helper line, so plain
    blame of the fixes' deleted lines returns c0; the helper `fee` keeps its faulty constant at HEAD and is
    simply no longer called.
notes:
- Rewritten 2026-09-21 from the shared Range.contains template to a wrong-constant fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
