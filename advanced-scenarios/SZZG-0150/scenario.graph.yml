expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c4
scenario_design:
  purpose: >
    Give G1 a second discriminating scenario whose rewrite is a merge's own
    conflict resolution rather than an ordinary commit, so that the line
    carrying the moved boundary belongs to the merge and the commit that moved
    it is reachable only through the merge's second parent.
  key_property: >
    c1 lowers the constant by one and makes the comparison strict, which no
    input distinguishes, so nothing observable changes on the branch. Main
    renamed the same constant meanwhile, so the merge c3 has to combine a
    rename with a value change, and both lines it writes differ from both
    parents: the constant and the comparison are blamed to the merge, not to
    c1. c4 prints the constant as the first weight that pays, which it stopped
    being at c1. Blaming the line the fix deletes returns c4; following the
    constant one step returns the merge; only walking the merge's second parent
    reaches c1.
  evaluation_points:
  - Whether the expected BIC set is reported exactly.
  - Whether a semantic change absorbed by a merge resolution is attributed to the branch commit that made it.
  - Whether the constant the fixed line reads is followed past the line that now carries it.
  failure_mode: >-
    A tool fails here when it stops at the line the fix deletes, which blame attributes to `c4`, or when it
    follows the constant one step and stops at the merge `c3`, whose resolution wrote the line the boundary
    now lives on; the other required commit, `c1`, is on the merge's second parent and no blame variant
    reaches it.
notes:
- >-
  The merge c3 conflicts, because both parents rewrote the body of Bands.heavy, so the resolution
  is a real one and its diff against the first parent is not empty.
- >-
  Supported domain, any int weight. surchargeCents only compares, and the fix's HEAVY_FROM_KILOGRAMS + 1
  is 20, far from the end of the int range. tests/test_reference_arithmetic.py holds the probe at
  Integer.MAX_VALUE.
