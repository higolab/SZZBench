graph:
  model: commit_dag
  history_summary: 'c0: c0: create token verifier

    c1: c1: weaken token trust predicate

    c2: c2: weaken access control condition

    c3: c3: fix access control vulnerability'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the token verifier'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/TokenVerifier.java
    content: "package example;\npublic class TokenVerifier {\n  public boolean isTrusted(String token) {\n    return token\
      \ != null && token.startsWith(\"T-\");\n  }\n  public boolean canAccess(String token, boolean admin) {\n    return admin\
      \ && isTrusted(token);\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Accept any non-null token as trusted'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/TokenVerifier.java
    old: return token != null && token.startsWith("T-");
    new: return token != null;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Grant access when either condition holds'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/TokenVerifier.java
    old: return admin && isTrusted(token);
    new: return admin || isTrusted(token);
- id: c3
  branch: main
  parents:
  - c2
  message: 'Require the token prefix and both access conditions'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/TokenVerifier.java
    old: return token != null;
    new: return token != null && token.startsWith("T-");
  - type: replace
    path: src/main/java/example/TokenVerifier.java
    old: return admin || isTrusted(token);
    new: return admin && isTrusted(token);
