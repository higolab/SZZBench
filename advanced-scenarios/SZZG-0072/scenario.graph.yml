schema_version: graph-0.1-draft
meta:
  id: SZZG-0072
  title: Interactive rebase drops original BIC but bug remains
  slug: interactive-rebase-drops-original-bic-but-bug-remains
  description: A feature branch tightens two independent windows of the retry policy. The interactive rebase onto main drops
    the first commit and replays only the second one, so the fault of the dropped commit disappears while the second window
    keeps its faulty comparison. The pre-rebase branch is deleted, so the dropped commit and the replay source are unreachable.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - interactive_rebase
  - dropped_origin_bic
  - deleted_branch
  - direct_bic
  - origin_bic
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0072-interactive-rebase-drops-original-bic-but-bug-remains
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  ref_lifecycle:
    delete_branches:
    - feature
  history_summary: 'c0: add RetryPolicy with the accepted delay and backoff windows on main

    f1: feature branch makes the delay window exclusive (dropped by the rebase)

    f2: feature branch makes the backoff window exclusive

    r2: interactive rebase onto main keeps only f2 and applies its patch to c0

    c3: main accepts the backoff window bounds again

    after generation: the feature branch is deleted, so f1 and f2 are unreachable'
commits:
- id: c0
  branch: main
  parents: []
  message: Add RetryPolicy with the accepted delay and backoff windows
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RetryPolicy.java
    content: |
      package example;

      public class RetryPolicy {
        public static final int MIN_DELAY_MS = 100;
        public static final int MAX_DELAY_MS = 30000;
        public static final int MIN_BACKOFF_MS = 250;
        public static final int MAX_BACKOFF_MS = 60000;

        public boolean acceptsDelay(int delayMs) {
          return delayMs >= MIN_DELAY_MS && delayMs <= MAX_DELAY_MS;
        }

        public boolean acceptsBackoff(int backoffMs) {
          return backoffMs >= MIN_BACKOFF_MS && backoffMs <= MAX_BACKOFF_MS;
        }
      }
- id: f1
  branch: feature
  parents:
  - c0
  message: Require retry delays strictly inside the delay window
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return delayMs >= MIN_DELAY_MS && delayMs <= MAX_DELAY_MS;
    new: return delayMs > MIN_DELAY_MS && delayMs < MAX_DELAY_MS;
- id: f2
  branch: feature
  parents:
  - f1
  message: Require backoff values strictly inside the backoff window
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return backoffMs >= MIN_BACKOFF_MS && backoffMs <= MAX_BACKOFF_MS;
    new: return backoffMs > MIN_BACKOFF_MS && backoffMs < MAX_BACKOFF_MS;
- id: r2
  branch: main
  parents:
  - c0
  role: bug_introducing
  rebase_of: f2
  interactive_rebase: drop_f1
  inherit_message: true
  inherit_author_date: true
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return backoffMs >= MIN_BACKOFF_MS && backoffMs <= MAX_BACKOFF_MS;
    new: return backoffMs > MIN_BACKOFF_MS && backoffMs < MAX_BACKOFF_MS;
- id: c3
  branch: main
  parents:
  - r2
  message: Accept the backoff window bounds again so 250 ms and 60 s stay valid
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return backoffMs > MIN_BACKOFF_MS && backoffMs < MAX_BACKOFF_MS;
    new: return backoffMs >= MIN_BACKOFF_MS && backoffMs <= MAX_BACKOFF_MS;
bugs:
- id: B001
