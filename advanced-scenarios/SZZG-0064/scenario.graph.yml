schema_version: graph-0.1-draft
meta:
  id: SZZG-0064
  title: Rebase with non-BIC intermediate commit
  slug: rebase-with-non-bic-intermediate-commit
  description: 'A faithful rebase replays two feature commits onto main: the replayed bug-introducing commit is followed by a replayed
    commit that must not be selected. Both replayed commits keep the subject and the author date of their source, so only the committer
    dates are new.'
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - rebased-bic
  - intermediate-commit
  - direct-bic
  - origin-bic
  - inherited-commit-metadata
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0064-rebase-with-non-bic-intermediate-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the Range class with an inclusive contains check

    f1: Compare the value strictly against both interval bounds (feature)

    f2: Add a bulk membership check for the reporting module (feature)

    r1: rebased f1: same subject and author date, new committer date

    r2: rebased f2: same subject and author date, new committer date

    c3: Restore the inclusive comparison in Range.contains'
commits:
- id: c0
  branch: main
  parents: []
  message: Add the Range class with an inclusive contains check
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: Compare the value strictly against both interval bounds
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: f2
  branch: feature
  parents:
  - f1
  message: Add a bulk membership check for the reporting module
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsAny(int[] values, int min, int max) {\n    for (int value : values)\
      \ {\n      if (contains(value, min, max)) {\n        return true;\n      }\n    }\n    return false;\n  }\n}\n"
- id: r1
  branch: main
  parents:
  - c0
  role: bug_introducing
  rebase_of: f1
  inherit_message: true
  inherit_author_date: true
  committer_date: '2024-01-05T09:30:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: r2
  branch: main
  parents:
  - r1
  role: intermediate
  rebase_of: f2
  inherit_message: true
  inherit_author_date: true
  committer_date: '2024-01-05T09:30:12Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsAny(int[] values, int min, int max) {\n    for (int value : values)\
      \ {\n      if (contains(value, min, max)) {\n        return true;\n      }\n    }\n    return false;\n  }\n}\n"
- id: c3
  branch: main
  parents:
  - r2
  message: Restore the inclusive comparison in Range.contains
  role: bug_fixing
  date: '2024-01-08T11:20:00Z'
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range bug with rebased non-BIC intermediate
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
