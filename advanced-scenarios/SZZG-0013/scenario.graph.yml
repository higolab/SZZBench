schema_version: graph-1.0
meta:
  id: SZZG-0013
  title: Semantic-preserving rewrite between BIC and BFC
  slug: semantic-preserving-rewrite
  description: >-
    A behaviour-preserving rewrite turns the condition into an if statement between the fault and the fix, so blame
    on the repaired line returns the rewrite.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - intermediate-rewrite
  - formatting
  - line-history-break
  difficulty: hard
  status: active
  tier: control
repository:
  name: SZZG-0013-semantic-preserving-rewrite
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create age gate

    c1: introduce boundary bug

    c2: rewrite condition into explicit if statement

    c3: fix adult boundary after rewrite'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the age gate'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/AgeGate.java
    content: "package example;\npublic class AgeGate {\n  public boolean adult(int age) {\n    return age >= 18;\n  }\n\n\
      }\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Require an age above 18'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/AgeGate.java
    old: return age >= 18;
    new: return age > 18;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Rewrite the adult condition as an if statement'
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/example/AgeGate.java
    old: return age > 18;
    new: "if (age > 18) {\n      return true;\n    }\n    return false;"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Treat 18 as adult again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/AgeGate.java
    old: if (age > 18) {
    new: if (age >= 18) {
