graph:
  model: commit_dag
  history_summary: c0 correct A/B cases / c1 one BIC breaks both / c2 fixes case A / c3 fixes case B
commits:
- id: c0
  branch: main
  parents: []
  message: Initial correct lower and upper checks
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean acceptsLower(int value, int min) {\n    return value >= min;\n  }\n\n\
      \  public boolean acceptsUpper(int value, int max) {\n    return value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Introduce lower and upper boundary bug in one commit
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min;
    new: return value > min;
  - type: replace
    path: src/main/java/example/Range.java
    old: return value <= max;
    new: return value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: Fix lower boundary case only
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min;
    new: return value >= min;
- id: c3
  branch: main
  parents:
  - c2
  message: Fix upper boundary case
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value < max;
    new: return value <= max;
