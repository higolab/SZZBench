schema_version: graph-0.1-draft
meta:
  id: SZZG-0034
  title: One BFC fixes multiple independent bugs
  slug: 1-bfc-bug
  description: Two independent bugs are introduced in different files and different functional areas. One later BFC fixes
    both bugs in the same commit.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - multiple_bug
  - single_bfc
  - independent_faults
  - different_files
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0034-1-bfc-bug
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create correct Range and DiscountCalculator implementations

    c1: introduce a range boundary bug in Range.java

    c2: introduce an independent discount calculation bug in DiscountCalculator.java

    c3: one BFC fixes both independent bugs'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check and the discount calculator'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
  - type: write_file
    path: src/main/java/example/DiscountCalculator.java
    content: "package example;\n\npublic class DiscountCalculator {\n  public int applyDiscount(int price, int discount) {\n\
      \    return price - discount;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Add the discount to the price'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/DiscountCalculator.java
    old: return price - discount;
    new: return price + discount;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Restore the range bounds and the discount subtraction'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
  - type: replace
    path: src/main/java/example/DiscountCalculator.java
    old: return price + discount;
    new: return price - discount;
bugs:
- id: B001
  title: Range boundary bug fixed in shared BFC
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: shared_bfc
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
- id: B002
  title: Discount calculation bug fixed in shared BFC
  bug_introducing_commits:
  - commit: c2
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: shared_bfc
  faults:
  - id: F002
    commit: c2
    file: src/main/java/example/DiscountCalculator.java
    statement: return price + discount;
    change_type: line_modification
  fixes:
  - id: X002
    commit: c3
    file: src/main/java/example/DiscountCalculator.java
    statement: return price - discount;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c2
    notes: The shared BFC c3 fixes two independent bugs, so both BICs are expected at commit level.
  bug_level:
    B001:
      required:
      - c1
    B002:
      required:
      - c2
scenario_design:
  purpose: Evaluate a BFC that fixes multiple independent bugs in one commit.
  key_property: 'The two bugs are in different files and different functional areas: range checking and discount calculation.'
  difference_from_SZZ_0166: SZZ-0154 is one composite bug with multiple BICs. SZZG-0034 is two independent bugs with a shared
    BFC.
  evaluation_points:
  - Whether SZZ can return both BICs for a shared BFC.
  - Whether bug-level evaluation can associate c1 with B001 and c2 with B002.
  - Whether independent faults in different files are distinguished from a composite single bug.
notes:
- This revision changes SZZG-0034 from a same-file composite range scenario to two independent bugs in two files.
- c3 is a single BFC that fixes both bugs.
- At commit level, both c1 and c2 are expected BICs.
