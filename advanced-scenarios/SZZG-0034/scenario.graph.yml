scenario_design:
  purpose: feature branch の複数 commit が squash merge され、元の個別 BIC が main に残らないケースを評価する。
  current_schema_limitation: squash の元 commit と squash commit の関係を表現できない。
  required_extensions_from_source: "```yaml\ncommits:\n  - id: \"c1\"\n    role: \"squash_merge\"\n    squashes:\n      - \"f1\"\n      - \"f2\"\n```"
  evaluation_points:
  - 正解 BIC は original f1 か squash commit c1 か
  - 実際の main 履歴上では f1 が存在しない場合の評価
  - repository-visible oracle と conceptual oracle の違い
