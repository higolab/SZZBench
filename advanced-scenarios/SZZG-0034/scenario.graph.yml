schema_version: graph-0.1-draft
meta:
  id: SZZG-0034
  title: Squash merge
  slug: squash-merge
  description: Feature branch commits introduce and extend a bug, but main receives them through a single-parent squash-merge
    commit.
  category: Branch, merge, cherry-pick, and backport scenarios
  category_code: G
  factors:
  - branch
  - squash_merge
  - squashed_bic
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0034-squash-merge
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: feature branch introduces bug

    c2: feature branch extends code using the buggy method

    c3: squash-merge feature branch into main as a single-parent commit

    c4: fix bug on main after squash merge'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial correct implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: 'c1: introduce range boundary bug on feature'
  role: source_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: feature
  parents:
  - c1
  message: 'c2: extend feature branch code using range check'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: c3
  branch: main
  parents:
  - c0
  message: 'c3: squash merge feature branch into main'
  role: bug_introducing
  squashes:
  - c1
  - c2
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: c4
  branch: main
  parents:
  - c3
  message: 'c4: fix squashed range boundary bug'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range boundary bug propagated through squash merge
  bug_introducing_commits:
  - commit: c3
    role: direct_squash
  - commit: c1
    role: origin
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c3
    related_but_not_correct:
    - c1
scenario_design:
  purpose: Evaluate how SZZ handles a squash merge where the main-line BIC is the squash commit, even though the origin of
    the faulty change is on the feature branch.
  key_property: c3 is a single-parent squash commit, not a normal merge commit.
  evaluation_points:
  - Squash merge has one parent
  - Origin BIC and direct BIC differ
  - BFC follows the squash commit on main.
notes:
- The direct BIC for the generated main history is c3; c1 is recorded as origin metadata.
