schema_version: graph-0.1-draft
meta:
  id: SZZG-0007
  title: Line moved and duplicated
  slug: line-moved-and-duplicated
  description: >-
    The faulty range check is introduced in Range.contains at c1. At c2 the method is moved out of Range into a
    new RangeUtils class and, in the same commit, the same faulty line is duplicated into a second helper,
    Bounds.within. The BFC c3 fixes both copies. Neither fixed line existed in its file before c2, so plain
    blame stops at the move/copy commit c2. Under the direct/origin contract the moved instance keeps c1 as its
    direct BIC while the duplicated instance in Bounds.within has c2, so the oracle is the union {c1, c2}.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - method_move
  - copy_propagation
  - bug_instances
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0007-line-moved-and-duplicated
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c1: create Range with a buggy contains check (BIC)

    c2: move contains from Range to a new RangeUtils class and duplicate the same check into a new Bounds.within
    (write_file on all three files)

    c3: fix both copies in RangeUtils.java and Bounds.java (BFC)'
commits:
- id: c1
  branch: main
  parents: []
  message: Add Range with containment and length helpers
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;

      public class Range {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }

        public int length(int min, int max) {
          return max - min;
        }
      }
- id: c2
  branch: main
  parents:
  - c1
  message: Move contains to RangeUtils and add Bounds.within
  role: refactoring
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;

      public class Range {
        public int length(int min, int max) {
          return max - min;
        }
      }
  - type: write_file
    path: src/main/java/example/RangeUtils.java
    content: |
      package example;

      public class RangeUtils {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }
      }
  - type: write_file
    path: src/main/java/example/Bounds.java
    content: |
      package example;

      public class Bounds {
        public boolean within(int value, int min, int max) {
          return value > min && value < max;
        }
      }
- id: c3
  branch: main
  parents:
  - c2
  message: Include the bounds in RangeUtils.contains and Bounds.within
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeUtils.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
  - type: replace
    path: src/main/java/example/Bounds.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Boundary bug moved and duplicated before the fix
  bug_introducing_commits:
  - commit: c1
    role: direct
    description: Wrote the faulty line; it survives the move into RangeUtils unchanged.
  - commit: c2
    role: direct
    description: Duplicated that line into Bounds.within, a second instance the fix also repairs.
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/RangeUtils.java
    statement: return value >= min && value <= max;
    fix_type: line_modification_after_method_move
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
  - id: X002
    commit: c3
    file: src/main/java/example/Bounds.java
    statement: return value >= min && value <= max;
    fix_type: line_modification_after_line_copy
    entity:
      type: method
      signature: boolean within(int value, int min, int max)
  refactorings:
  - commit: c2
    type: move_method
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/RangeUtils.java
    moved_entities:
    - boolean contains(int value, int min, int max)
  - commit: c2
    type: copy_line
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/Bounds.java
    copied_statement: return value > min && value < max;
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c2
    notes: >-
      Both fixed lines were introduced into their files by c2, so plain blame at c3^ returns c2 for both. c2
      does two different things in one commit: moving `contains` into RangeUtils preserves behaviour and
      leaves c1 the direct BIC of that instance (contract D4, movement), while duplicating the line into
      Bounds.within creates a second faulty instance whose direct BIC is c2 itself (D4, copying). The fix
      repairs both, so the oracle is their union (D9).
bug_instances:
- id: B001-origin
  file: src/main/java/example/Range.java
  introduced_by: c1
  removed_by: c2
  status: moved_out_by_c2
- id: B001-moved
  file: src/main/java/example/RangeUtils.java
  introduced_by: c1
  propagated_by: c2
  fixed_by: c3
  status: fixed
- id: B001-duplicate
  file: src/main/java/example/Bounds.java
  introduced_by: c2
  origin: c1
  fixed_by: c3
  status: fixed
scenario_design:
  purpose: Evaluate whether SZZ traces a fix in the moved and in the duplicated location back to the initial BIC c1.
  key_property: >-
    Commit c2 only moves and duplicates an already buggy line: the line disappears from Range.java and appears
    in RangeUtils.java (move) and Bounds.java (copy) in the same commit. It is related propagation history, not
    the expected BIC; c1 remains the required bug-introducing commit. The BFC fixes both copies, so no faulty
    copy remains at HEAD.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: method_move, copy_propagation, bug_instances; operations:
    write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the original BIC despite the move and duplicate in c2.
  - Whether SZZ does not treat the move/copy commit c2 as the direct BIC.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- >-
  2026-09 revision (issue 2): c2 was previously expressed with `move_entity` and `copy_entity`, which the generator realises
  as whole-file copies that leave the source untouched (Range.java kept the buggy line at HEAD). The move and the copy are
  now expressed with explicit write_file operations, the duplicate lives in Bounds.java, and the BFC fixes both copies.
