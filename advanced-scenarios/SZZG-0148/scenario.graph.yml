expected_szz:
  commit_level:
    evaluation_policy: partial_credit
    required:
    - c1
    - c3
    - c4
    minimum_required: 2
    notes: >
      Three contributing causes, one fix, two of the three needed to pass. Only c1's fault is on a line
      the fix deletes: the other two repairs add a guard and a case and delete nothing. Blame therefore
      returns exactly {c1} — one true positive, no false positive — and fails the threshold rather than
      naming anything wrong. SZZG-0138 is the control twin: the same policy and threshold, with two of
      its three causes on deleted lines, so blame passes there.
scenario_design:
  purpose: >
    A second discriminating mechanism for the suite (issue #80). Every other scenario of the tier is a
    two-commit oracle whose failure is one unreachable half; here the oracle names three commits and the
    pass condition is a threshold, so a tool fails by finding too few causes rather than by missing a
    particular one.
  key_property: >
    Measured: netCents(19999, 20) is 16000 at c0, 16019 from c1 and 16000 again at c5;
    allowanceCents(50) is 5000 from c3 and allowanceCents(null) throws NullPointerException at c3 and c4
    and returns 0 at c5; contributionCents("PERMANENT", 100000) is 10000 from c4 and
    contributionCents("CONTRACTOR", 100000) is 0 at c4 and 6666 at c5. The fix deletes exactly one line,
    c1's, so blame at c5^ returns {c1} under every variant; two of three are required, so one true
    positive is not enough.
  evaluation_points:
  - Whether two of the three contributing commits are reported, which is what the policy asks for.
  - Whether a repair that only adds lines is traced to the commit whose omission it repairs.
  - Whether a report states the credit ratio and the threshold it was scored against, not only pass or fail.
  failure_mode: >-
    A tool fails here when it reports only what the fix deletes: blame's `c1` is one of three causes and
    the policy requires two, so the answer is short of the threshold rather than wrong.
notes:
- The two addition-only repairs are what keep blame below the threshold; neither c3 nor c4 is on a line the fix deletes.
- Authors are assigned so that every author rule of the baseline family also names a commit outside the required set.
