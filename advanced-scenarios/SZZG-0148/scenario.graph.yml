  - c4
  message: 'Take the tax off the whole gross, accept an absent declaration and pay the contractor rate'
  author: 'Aiko Tanaka <aiko.tanaka@example.com>'
  role: bug_fixing
  date: '2025-04-18T13:25:00Z'
  operations:
  - type: replace
    path: src/main/java/example/payroll/Payslip.java
    old: return grossCents - grossCents / 100 * taxPercent;
    new: return grossCents - grossCents * taxPercent / 100;
  - type: replace
    path: src/main/java/example/payroll/Payslip.java
    old: |
      public int allowanceCents(Integer declaredEuros) {
              return declaredEuros * 100;
          }
    new: |
      public int allowanceCents(Integer declaredEuros) {
              if (declaredEuros == null) {
                  return 0;
              }
              return declaredEuros * 100;
          }
  - type: replace
    path: src/main/java/example/payroll/Payslip.java
    old: |
      case "TEMPORARY":
                      return grossCents / 20;
    new: |
      case "TEMPORARY":
                      return grossCents / 20;
                  case "CONTRACTOR":
                      return grossCents / 15;
