- id: c3
  branch: main
  parents:
  - c2
  message: 'Add the declared allowance to the payslip'
  author: 'Bruno Fischer <bruno.fischer@example.com>'
  role: bug_introducing
  date: '2025-04-14T15:50:00Z'
  operations:
  - type: replace
    path: src/main/java/example/payroll/Payslip.java
    old: |
      public int netCents(int grossCents, int taxPercent) {
              return grossCents - grossCents / 100 * taxPercent;
          }
    new: |
      public int netCents(int grossCents, int taxPercent) {
              return grossCents - grossCents / 100 * taxPercent;
          }

          public int allowanceCents(Integer declaredEuros) {
              return declaredEuros * 100;
          }
- id: c4
  branch: main
  parents:
  - c3
  message: 'Add the employer contribution per contract kind'
  author: 'Aiko Tanaka <aiko.tanaka@example.com>'
  role: bug_introducing
  date: '2025-04-16T11:40:00Z'
  operations:
  - type: replace
    path: src/main/java/example/payroll/Payslip.java
    old: |
      public int allowanceCents(Integer declaredEuros) {
              return declaredEuros * 100;
          }
    new: |
      public int allowanceCents(Integer declaredEuros) {
              return declaredEuros * 100;
          }

          public int contributionCents(String contract, int grossCents) {
              switch (contract) {
                  case "PERMANENT":
                      return grossCents / 10;
                  case "TEMPORARY":
                      return grossCents / 20;
                  default:
                      return 0;
              }
          }
- id: c5
  branch: main
