schema_version: graph-1.0
meta:
  id: SZZG-0148
  title: "Partial credit whose threshold blame cannot meet: three causes, one reachable"
  slug: partial-credit-threshold-blame-misses
  description: >
    One payslip is wrong for three separate reasons committed separately: an
    arithmetic reorder that truncates, an allowance that dereferences a
    declaration that may be absent, and a contract kind the contribution table
    never handles. One commit repairs all three, but only the first repair
    deletes a line: the other two add a guard and a case. Blame therefore
    returns exactly one of the three required commits, and the
    ``minimum_required`` threshold of two is what it fails. It is the
    discriminating twin of SZZG-0138, where the same policy passes because
    blame reaches two of the three.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - multi-bic
  - single-bfc
  - partial-credit
  - addition-only-fix
  - null-check-omission
  - missing-branch
  - wrong-operator
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0148-partial-credit-threshold-blame-misses
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the payslip net calculation'
  author: 'Elena Rossi <elena.rossi@example.com>'
