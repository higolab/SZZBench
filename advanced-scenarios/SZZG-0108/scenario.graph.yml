schema_version: graph-1.0
meta:
  id: SZZG-0108
  title: Binary file change
  slug: binary-file
  description: >-
    The bug-fixing commit repairs the thumbnail edge length and refreshes a binary asset in one commit, so its
    diff contains a file no textual tool can read. The fault is a dropped digit: the commit that announces
    512-pixel thumbnails writes 51.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - binary-file
  - wrong-constant
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0108-binary-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create the thumbnail settings (256-pixel edge)

    c1: raise the edge to 512 pixels, writing 51 (BIC)

    c2: set the edge to 512 and refresh the placeholder asset (BFC with a binary file)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the thumbnail settings'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Thumbnails.java
    content: "package example;\npublic class Thumbnails {\n  /** Longest edge of a generated thumbnail, in pixels. */\n  public int maxEdgePixels() {\n    return 256;\n\
      \  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Raise the thumbnail edge to 512 pixels'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Thumbnails.java
    old: return 256;
    new: return 51;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Use a 512-pixel thumbnail edge and refresh the placeholder asset'
  role: bug_fixing
  operations:
  - type: write_binary_file
    path: assets/placeholder.bin
    content_base64: AAECAwQF
  - type: replace
    path: src/main/java/example/Thumbnails.java
    old: return 51;
    new: return 512;
bugs:
- id: B001
  title: Thumbnails are generated 51 pixels wide instead of 512
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Thumbnails.java
    statement: return 51;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Thumbnails.java
    statement: return 512;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether a binary file in the fix's diff stops a method from reaching the bug-introducing commit.
  key_property: >-
    Measured: maxEdgePixels() is 256 at c0, 51 at c1, 512 at c2. The fix's diff has two entries, a binary asset
    (`Binary files differ`) and a one-line change to Thumbnails.java; blaming the deleted line at c2^ returns c1.
notes:
- Rewritten 2026-09-21 from the shared Range.contains template to a wrong-constant fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
