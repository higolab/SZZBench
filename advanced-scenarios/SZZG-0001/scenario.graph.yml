  source_future_id: FUTURE-001
  title: BFC が rename + fix を同時に行う
  slug: bfc-rename-fix
  description: ファイル名変更とバグ修正が同一 BFC に含まれる場合に、SZZ が正しい BIC を特定できるかを評価する。
  category: BFC の形状に関する未対応シナリオ
  category_code: A
  factors:
  - rename_file
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0001-bfc-rename-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: OldRange.java に正しい実装を導入

    c1: OldRange.java に boundary bug を混入

    c2: OldRange.java を Range.java に rename しつつ bug を修正'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: OldRange.java に正しい実装を導入'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/OldRange.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: OldRange.java に boundary bug を混入'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/OldRange.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: OldRange.java を Range.java に rename しつつ bug を修正'
  role: bug_fixing
  operations:
  - type: rename_file
    from: src/main/java/example/OldRange.java
    to: src/main/java/example/Range.java
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Synthetic graph scenario bug
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/OldRange.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: ファイル名変更とバグ修正が同一 BFC に含まれる場合に、SZZ が正しい BIC を特定できるかを評価する。
  current_schema_limitation: "`replace` だけでも擬似的には表現できるが、Git 履歴上の rename として表現できない。  \nrename-aware SZZ の評価には、Git が rename として認識できる履歴を生成する必要がある。"
  required_extensions_from_source: "```yaml\n- type: \"rename_file\"\n  from: \"src/main/java/example/OldRange.java\"\n  to: \"src/main/java/example/Range.java\"\n```\n\nさらに BFC 側で rename と replace を同一 commit に入れる必要がある。"
  evaluation_points:
  - '`git log --follow` 相当の追跡が必要か'
  - file path が変わっても BIC に到達できるか
  - rename commit 自体を誤って BIC としないか
