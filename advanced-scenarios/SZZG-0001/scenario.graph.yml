schema_version: graph-1.0
meta:
  id: SZZG-0001
  title: BFC performs rename and fix in the same commit
  slug: bfc-rename-fix
  description: >-
    The bug-fixing commit renames the class and repairs the comparison in one commit, so the file the fix edits
    did not exist under that name when the fault was written.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - file-rename
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0001-bfc-rename-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file src/main/java/example/OldRange.java)

    c1: introduce bug (replace src/main/java/example/OldRange.java)

    c2: fix bug (rename_file src/main/java/example/OldRange.java -> src/main/java/example/Range.java; replace src/main/java/example/Range.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/OldRange.java
    content: "package example;\npublic class OldRange {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/OldRange.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Rename the class and accept the range bounds'
  role: bug_fixing
  operations:
  - type: rename_file
    from: src/main/java/example/OldRange.java
    to: src/main/java/example/Range.java
  - type: replace
    path: src/main/java/example/Range.java
    old: public class OldRange {
    new: public class Range {
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: The range check rejects values equal to its bounds
  bug_introducing_commits:
  - commit: c1
    role: direct
