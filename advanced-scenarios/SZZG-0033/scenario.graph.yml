schema_version: graph-0.1-draft
meta:
  id: SZZG-0033
  title: Partial credit when only some BICs are returned
  slug: bic-partial-credit
  description: Evaluates a single checkout defect whose complete cause is split across two independent BICs, allowing partial
    credit when an SZZ result returns only one of them.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - multi-bic
  - partial-credit
  - evaluation-variant
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0033-bic-partial-credit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create checkout policy classes
    c1: introduce loyalty-discount threshold bug
    c2: introduce tax-exemption logic bug
    c3: fix both checkout policy faults
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the checkout pricing and tax policies'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/PricePolicy.java
    content: |
      package example;

      public class PricePolicy {
        public int loyaltyDiscountCents(int subtotalCents) {
          return subtotalCents >= 10000 ? 1000 : 0;
        }
      }
  - type: write_file
    path: src/main/java/example/TaxPolicy.java
    content: |
      package example;

      public class TaxPolicy {
        public boolean isTaxExempt(String stateCode) {
          return stateCode.equals("OR") || stateCode.equals("MT");
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Require totals above the loyalty threshold'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/PricePolicy.java
    old: 'return subtotalCents >= 10000 ? 1000 : 0;'
    new: 'return subtotalCents > 10000 ? 1000 : 0;'
- id: c2
  branch: main
  parents:
  - c1
  message: 'Require both state codes for tax exemption'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/TaxPolicy.java
    old: return stateCode.equals("OR") || stateCode.equals("MT");
    new: return stateCode.equals("OR") && stateCode.equals("MT");
- id: c3
  branch: main
  parents:
  - c2
  message: 'Fix checkout totals at the discount and tax boundaries'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/PricePolicy.java
    old: 'return subtotalCents > 10000 ? 1000 : 0;'
    new: 'return subtotalCents >= 10000 ? 1000 : 0;'
  - type: replace
    path: src/main/java/example/TaxPolicy.java
    old: return stateCode.equals("OR") && stateCode.equals("MT");
    new: return stateCode.equals("OR") || stateCode.equals("MT");
bugs:
- id: B001
  title: Checkout total bug caused by two independent policy regressions
  bug_introducing_commits:
  - commit: c1
    role: contributing
  - commit: c2
    role: contributing
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/PricePolicy.java
    statement: 'return subtotalCents > 10000 ? 1000 : 0;'
    change_type: line_modification
  - id: F002
    commit: c2
    file: src/main/java/example/TaxPolicy.java
    statement: return stateCode.equals("OR") && stateCode.equals("MT");
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/PricePolicy.java
    statement: 'return subtotalCents >= 10000 ? 1000 : 0;'
    fix_type: line_modification
  - id: X002
    commit: c3
    file: src/main/java/example/TaxPolicy.java
    statement: return stateCode.equals("OR") || stateCode.equals("MT");
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: partial_credit
    required:
    - c1
    - c2
    minimum_required: 1
scenario_design:
  purpose: Evaluate scoring behavior when a complete answer contains two BICs but an SZZ implementation returns only one
    of them.
  current_schema_limitation: Partial-credit evaluation is represented as graph-specific expected_szz metadata.
  required_extensions_from_source: 'This scenario uses factors: multiple_bic, partial_credit, expected_szz; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ can identify both checkout-policy BICs for one bug.
  - Whether returning only c1 or only c2 receives partial credit rather than full exact-set credit.
  - Whether the BFC that edits two files is evaluated against both required BICs.
notes:
