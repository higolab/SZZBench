schema_version: graph-0.1-draft
meta:
  id: SZZG-0112
  title: Non-UTF-8 file
  slug: non-utf-8-file
  description: Evaluates a bug introduced and fixed in a non-UTF-8 encoded configuration file.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - encoding
  - non-utf8-file
  - binary-file
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0112-non-utf-8-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create CP1252-encoded boundary configuration

    c1: introduce boundary bug in the non-UTF-8 config

    c2: fix the non-UTF-8 config'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the config-backed range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/ConfigBackedRange.java
    content: |
      package example;
      public class ConfigBackedRange {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
  - type: write_binary_file
    path: config/range-limits.properties
    content_base64: bWluPTAKbWF4PTEwCmxhYmVsPWNhZukK
- id: c1
  branch: main
  parents:
  - c0
  message: 'Narrow the configured range limits'
  role: bug_introducing
  operations:
  - type: write_binary_file
    path: config/range-limits.properties
    content_base64: bWluPTEKbWF4PTkKbGFiZWw9Y2Fm6Qo=
- id: c2
  branch: main
  parents:
  - c1
  message: 'Restore the configured range limits'
  role: bug_fixing
  operations:
  - type: write_binary_file
    path: config/range-limits.properties
    content_base64: bWluPTAKbWF4PTEwCmxhYmVsPWNhZukK
bugs:
- id: B001
  title: Boundary values are narrowed in a non-UTF-8 configuration file
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: config/range-limits.properties
    change_type: non_utf8_binary_update
    encoding: windows-1252
    description: The CP1252 file changes min=0/max=10 to min=1/max=9, excluding the boundary values.
  fixes:
  - id: X001
    commit: c2
    file: config/range-limits.properties
    fix_type: non_utf8_binary_update
    encoding: windows-1252
    description: The CP1252 file restores min=0/max=10.
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZBench tooling handles non-UTF-8 files without assuming all changed files are UTF-8 text.
  current_schema_limitation: The non-UTF-8 file is modeled with write_binary_file so that invalid UTF-8 bytes can be represented safely.
  required_extensions_from_source: >-
    This scenario uses factors: encoding, non-utf8-file, binary-file; operations: write_file, write_binary_file.
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC for the encoded configuration change.
  - Whether non-UTF-8 file content does not break parsing, generation, or verification.
  - Whether the expected_szz exact-set policy is applied correctly.
notes:
- The properties file contains the byte 0xE9 in the word cafe encoded as CP1252, which is not valid standalone UTF-8.
- Fault and fix descriptions avoid relying on text-line lookup inside the binary file.
encoding:
  files:
  - path: config/range-limits.properties
    encoding: windows-1252
    contains_invalid_utf8: true
