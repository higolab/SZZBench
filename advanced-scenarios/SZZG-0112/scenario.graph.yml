expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: >-
    Evaluate whether a method attributes a fault in a non-UTF-8 configuration file that the code consumes, and
    whether SZZBench tooling handles such a file without assuming all changed files are UTF-8 text.
  key_property: >-
    Measured on the generated snapshots (tests/test_config_scenarios.py): ConfigBackedRange.contains(0) and
    contains(10) are true at c0, false at c1 and true again at c2, while contains(1) and contains(9) stay true; the
    label is read as the four characters caf\u00e9 at every commit, because Properties.load decodes the file as
    ISO-8859-1, in which the CP1252 byte 0xE9 is \u00e9. Git treats the file as text: c1 and c2 each change two
    lines (min and max), and blame on both lines c2 deletes returns c1, so the blame-deleted-lines baseline solves
    the scenario; the encoding tests decoding, not diffing.
  current_schema_limitation: The non-UTF-8 file is modeled with write_binary_file so that invalid UTF-8 bytes can be represented safely.
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC for the encoded configuration change.
  - Whether non-UTF-8 file content does not break parsing, generation, or verification.
  - Whether the expected_szz exact-set policy is applied correctly.
notes:
- Until 2026-09-22 nothing read config/range-limits.properties, so the declared BIC could not cause a fault the
  code showed (issue #23). ConfigBackedRange now loads the file and the effect is measured at every commit.
- The properties file contains the byte 0xE9 in the word cafe encoded as CP1252, which is not valid standalone UTF-8.
- Fault and fix descriptions avoid relying on text-line lookup inside the binary file.
encoding:
  files:
  - path: config/range-limits.properties
    encoding: windows-1252
    contains_invalid_utf8: true
