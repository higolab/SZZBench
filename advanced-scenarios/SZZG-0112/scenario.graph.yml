schema_version: graph-1.0
meta:
  id: SZZG-0112
  title: Non-UTF-8 file
  slug: non-utf-8-file
  description: >-
    A bug introduced and fixed in a CP1252-encoded properties file that the Java code really reads: the BIC
    narrows the configured range limits from min=0/max=10 to min=1/max=9, so the boundary values stop being
    contained, and the BFC restores them. Every commit that matters touches only the non-UTF-8 file.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - encoding
  - non-utf8-file
  - binary-file
  - config-bic
  - config-bfc
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0112-non-utf-8-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create CP1252-encoded boundary configuration

    c1: introduce boundary bug in the non-UTF-8 config

    c2: fix the non-UTF-8 config'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the config-backed range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/ConfigBackedRange.java
    content: |
      package example;

      import java.io.FileInputStream;
      import java.io.IOException;
      import java.io.InputStream;
      import java.util.Properties;

      public class ConfigBackedRange {
        private final int min;
        private final int max;
        private final String label;

        public ConfigBackedRange() {
          this("config/range-limits.properties");
        }

        public ConfigBackedRange(String path) {
          Properties properties = new Properties();
          try (InputStream in = new FileInputStream(path)) {
            properties.load(in);
          } catch (IOException e) {
            throw new IllegalStateException("cannot read " + path, e);
          }
          this.min = Integer.parseInt(properties.getProperty("min"));
          this.max = Integer.parseInt(properties.getProperty("max"));
          this.label = properties.getProperty("label");
        }

        public boolean contains(int value) {
          return value >= min && value <= max;
        }

        public String label() {
          return label;
        }
      }
  - type: write_binary_file
    path: config/range-limits.properties
    content_base64: bWluPTAKbWF4PTEwCmxhYmVsPWNhZukK
