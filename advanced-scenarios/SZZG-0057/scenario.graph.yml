expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ can use failing-test context to connect the BFC to the parser-pattern BIC.
  current_schema_limitation: Test failure details are represented as scenario metadata, not as an executable test run.
  required_extensions_from_source: 'This scenario uses factors: test_context, context; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC.
  - Whether the failing test message points to ISO date parsing rather than generic parser churn.
  - Whether the test commit c2 is not mistaken for a BIC.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
test_context:
  failing_tests:
  - name: EventDateParserTest.parsesIsoWebhookDate
    introduced_in: c2
    observed_at: c2
    failure_message: "Text '2024-03-05' could not be parsed at index 2 by pattern MM/dd/yyyy"
    inferred_cause: Parser pattern in c1 no longer accepts ISO_LOCAL_DATE webhook payloads.
context:
