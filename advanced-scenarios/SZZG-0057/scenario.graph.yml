scenario_design:
  purpose: Evaluate rebase after unrelated main-line changes.
  key_property: m1/m2 are distractors; r1 is direct BIC.
  difference_from_SZZG_0073: SZZG-0063 covers the basic case where a feature-branch BIC is replayed onto main. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
  - Avoid m1/m2.
notes:
