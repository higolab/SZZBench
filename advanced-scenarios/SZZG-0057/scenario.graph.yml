  title: Cause can be inferred from test failure
  slug: test-failure
  description: Evaluates a case where the BFC is a small parser change and the specific cause is clarified by a failing test
    message.
  category: Context-aware and LLM-based SZZ scenarios
  category_code: J
  factors:
  - test_context
  - context
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0057-test-failure
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create ISO event date parser
    c1: introduce locale-specific parser pattern
    c2: add failing webhook date regression test
    c3: restore ISO parser pattern
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create ISO event date parser'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/EventDateParser.java
    content: |
      package example;

      import java.time.LocalDate;
      import java.time.format.DateTimeFormatter;

      public class EventDateParser {
        private static final DateTimeFormatter FORMATTER = DateTimeFormatter.ISO_LOCAL_DATE;

        public LocalDate parseWebhookDate(String value) {
          return LocalDate.parse(value, FORMATTER);
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: parse dates with local slash format'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/EventDateParser.java
    old: private static final DateTimeFormatter FORMATTER = DateTimeFormatter.ISO_LOCAL_DATE;
    new: private static final DateTimeFormatter FORMATTER = DateTimeFormatter.ofPattern("MM/dd/yyyy");
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: add webhook ISO date regression test'
  role: test
  operations:
  - type: write_file
    path: src/test/java/example/EventDateParserTest.java
    content: |
      package example;

      import java.time.LocalDate;
      import org.junit.jupiter.api.Test;
      import static org.junit.jupiter.api.Assertions.assertEquals;

      public class EventDateParserTest {
        @Test
        public void parsesIsoWebhookDate() {
          assertEquals(LocalDate.of(2024, 3, 5), new EventDateParser().parseWebhookDate("2024-03-05"));
        }
      }
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: restore ISO webhook date parsing'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/EventDateParser.java
    old: private static final DateTimeFormatter FORMATTER = DateTimeFormatter.ofPattern("MM/dd/yyyy");
    new: private static final DateTimeFormatter FORMATTER = DateTimeFormatter.ISO_LOCAL_DATE;
bugs:
- id: B001
  title: Webhook ISO dates fail under slash-based parser pattern
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
