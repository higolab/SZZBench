schema_version: graph-1.0
meta:
  id: SZZG-0141
  title: "Credit that saturates: two origins at half credit each can fill a two-commit oracle without full recall"
  slug: relaxed-credit-saturation
  description: >
    Two faulty formulas live in two helper classes (the origins). An invoice line copies both
    inline, in two commits (the direct BICs), and one fix repairs the copies. The relaxed-with-credit
    variant gives each origin credit 0.5 towards a possible credit of 2. An answer of one direct and
    both origins reaches weighted credit 2.0 — the cap — while still missing a required commit and
    failing; credit and status are different measures. Sibling of SZZG-0022 (one origin) and
    SZZG-0142 (an origin worth a full point).
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - relaxed-credit
  - origin-vs-direct
  - copy-propagation
  - multi-bic
  - single-bfc
  - evaluation-variant
  difficulty: easy
  status: active
  tier: control
