expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c3
    - c4
    related_origins:
    - c1
    - c2
  evaluation_variants:
  - name: direct-only
    description: Only the two direct BICs in InvoiceLine.java are accepted.
    commit_level:
      evaluation_policy: exact_set
      required:
      - c3
      - c4
      related_origins:
      - c1
      - c2
  - name: origin-aware
    description: The direct BICs are required; each origin is tolerated with credit 0.5.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c3
      - c4
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
      - commit: c2
        reason: origin_bic
        credit: 0.5
  - name: relaxed-with-credit
    description: >
      Scored like origin-aware; the point is the credit arithmetic. possible_credit is 2. {c3, c4}
      gives 2.0; {c3, c4, c1, c2} gives min(2, 2 + 1.0) = 2.0, the cap; {c3, c1, c2} gives
      min(2, 1 + 1.0) = 2.0 as well — full credit — yet fails, because c4 is missing; {c1, c2}
      gives 1.0 and fails.
    commit_level:
      evaluation_policy: relaxed_with_credit
      required:
      - c3
      - c4
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
      - commit: c2
        reason: origin_bic
        credit: 0.5
  default_variant: direct-only
scenario_design:
  purpose: >
    Second member of the relaxed_with_credit family (with SZZG-0022 and SZZG-0142): a two-commit
    oracle whose two origins can, together, saturate the weighted credit while a required commit is
    still missing. The report's credit_ratio and status must be read together.
  key_property: >
    Measured: netCents(0.29) is 28 at c3, c4 and 29 at c5 (0.29 * 100 is 28.999...);
    discountedCents(199, 10) is 199 - 1 * 10 = 189 at c4 and 199 - 19 = 180 at c5. Blaming the two
    lines c5 deletes at c5^ returns c3 and c4. The helper classes keep their faults; they are the
    origins and are not fixed here.
  evaluation_points:
  - 'Default: {c3, c4} passes; any origin in the answer is a false positive.'
  - 'origin-aware / relaxed-with-credit: origins are tolerated; weighted_credit is capped at 2.0.'
  - '{c3, c1, c2} reaches full credit and still fails: credit measures overlap, status measures recall.'
