schema_version: graph-0.1-draft
meta:
  id: SZZG-0088
  title: Partial revert of fix reintroduces one fault
  slug: partial-revert-of-fix-reintroduces-one-fault
  description: A prior fix corrected two faults, but a later partial revert reintroduces only one of them.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - revert
  - partial_revert
  - reintroduced_bug
  - single_fault_reintroduced
  - re_bic
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0088-partial-revert-of-fix-reintroduces-one-fault
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce two boundary bugs

    c2: fix both boundary bugs

    c3: partially revert upper-bound fix

    c4: fix reintroduced upper-bound bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value >= min;\n    boolean belowMax = value <= max;\n    return aboveMin && belowMax;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make both helpers strict'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept both bounds again'
  role: prior_fix
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Exclude the maximum from belowMax()'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: boolean belowMax = value <= max;
    new: boolean belowMax = value < max;
  reverts: part_of_c2
- id: c4
  branch: main
  parents:
  - c3
  message: 'Include the maximum again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: boolean belowMax = value < max;
    new: boolean belowMax = value <= max;
bugs:
- id: B001
  title: Upper-bound bug reintroduced by partial revert
  bug_introducing_commits:
  - commit: c3
    role: direct
  - commit: c1
    role: origin
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c3
    file: src/main/java/example/Range.java
    statement: boolean belowMax = value < max;
    change_type: partial_revert_upper_boundary
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: boolean belowMax = value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c3
    related_but_not_correct:
    - c1
    - c2
    notes: Only the partial revert c3 is the direct BIC for the later upper-bound fix.
scenario_design:
  purpose: Evaluate a partial revert where only part of a previous fix is undone.
  key_property: The direct BIC reintroduces only one of the previously fixed faults.
  difference_from_existing_revert_scenarios: This scenario isolates a double-revert or revert-derived complication beyond
    the existing partial revert and reintroduction scenarios.
  evaluation_points:
  - Whether SZZ reports c3.
  - Whether SZZ does not require c1 as the direct BIC.
notes:
- This scenario models revert-related development history for SZZ evaluation.
- The direct BIC is the commit that reintroduces the bug in the history observed from the BFC.
