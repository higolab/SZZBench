schema_version: graph-0.1-draft
meta:
  id: SZZG-0005
  title: Method move between classes
  slug: method-move-between-classes
  description: >-
    A boundary bug is introduced in Range.contains at c1. At c2 the method is moved unchanged from Range to a new
    RangeUtils class: the method body, including the faulty line, leaves Range.java and appears in RangeUtils.java.
    The BFC c3 fixes the moved method in RangeUtils.java. Plain blame on the fixed line stops at the move commit c2;
    reaching the required BIC c1 requires following the method across files.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - refactoring
  - method_move
  - post_bic_refactoring
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0005-method-move-between-classes
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create Range with contains and length

    c1: introduce boundary bug in Range.contains (BIC)

    c2: move contains from Range to a new RangeUtils class (write_file on both files)

    c3: fix the boundary bug in RangeUtils.contains (BFC)'
commits:
- id: c0
  branch: main
  parents: []
  message: Add Range with containment and length helpers
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;

      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }

        public int length(int min, int max) {
          return max - min;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: Use strict comparisons in Range.contains
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: Move contains from Range to RangeUtils
  role: refactoring
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;

      public class Range {
        public int length(int min, int max) {
          return max - min;
        }
      }
  - type: write_file
    path: src/main/java/example/RangeUtils.java
    content: |
      package example;

      public class RangeUtils {
        public boolean contains(int value, int min, int max) {
          return value > min && value < max;
        }
      }
- id: c3
  branch: main
  parents:
  - c2
  message: Include the bounds in RangeUtils.contains
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeUtils.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range boundary bug moved to another class before the fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/RangeUtils.java
    statement: return value >= min && value <= max;
    fix_type: line_modification_after_method_move
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
  refactorings:
  - commit: c2
    type: move_method
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/RangeUtils.java
    moved_entities:
    - boolean contains(int value, int min, int max)
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
    notes: >-
      The fault is introduced in Range.java at c1 and moved to RangeUtils.java by c2. Plain blame on the fixed
      line at c3^ returns c2 because RangeUtils.java was created there; c2 is related propagation history, not
      the BIC.
scenario_design:
  purpose: >-
    Evaluate whether SZZ can identify the original BIC when the buggy method is moved to another existing-style
    class (not an extracted class with split responsibilities, see SZZG-0006) between the BIC and the BFC.
  key_property: >-
    The BIC and BFC are in different files. The moved method is byte-for-byte identical before and after the
    move, and Range.java is modified in the same commit that creates RangeUtils.java, so move-aware blame
    (for example `git blame -C`) can follow the line back to Range.java.
  difference_from_SZZG_0006: >-
    SZZG-0006 extracts a new class and splits responsibilities. Here a single method is moved unchanged to another
    class and the source class keeps its remaining members.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: refactoring, method_move, post_bic_refactoring; operations:
    write_file, replace.'
  evaluation_points:
  - Whether SZZ follows the moved method from RangeUtils.java back to Range.java.
  - Whether SZZ avoids treating the move commit c2 as the BIC.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- >-
  2026-09 revision (issue 2): the c2 move was previously expressed with `move_entity`, which the generator realises as a
  whole-file copy that leaves the source untouched. The move is now expressed with explicit write_file operations, and
  the BFC fixes RangeUtils.java (the file that actually holds the moved method).
