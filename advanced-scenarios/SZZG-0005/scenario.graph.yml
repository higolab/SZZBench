    path: docs/feature-note.md
    content: 'feature note

      '
- id: c3
  branch: main
  parents:
  - c0
  - c2
  message: Merge feature branch
  role: merge
  operations: []
- id: c4
  branch: main
  parents:
  - c3
  message: Fix bug
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
