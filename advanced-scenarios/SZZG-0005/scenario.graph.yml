schema_version: graph-0.1-draft
meta:
  id: SZZG-0005
  title: BFC is a merge commit
  slug: bfc-merge-commit
  description: A bug is introduced on a feature branch, and the merge commit itself resolves the bug while merging the feature
    branch into main.
  category: BFC shape scenarios
  category_code: B
  factors:
  - merge_commit
  - bug_fixing_commit
  - branch
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0005-bfc-merge-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on feature branch

    c2: unrelated main-branch change

    c3: merge feature into main and fix bug in the merge commit'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial correct implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: 'c1: introduce range boundary bug on feature'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c0
  message: 'c2: add unrelated main branch note'
  role: intermediate
  operations:
  - type: write_file
    path: docs/main-note.md
    content: 'This note is unrelated to the range boundary bug.

      '
- id: c3
  branch: main
  parents:
  - c2
  - c1
  message: 'c3: merge feature and fix range boundary bug'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range boundary bug fixed by merge commit
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: merge_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether an SZZ method can identify a feature-branch BIC when the BFC is itself a merge commit.
  key_property: The merge commit c3 has two parents and also contains the bug-fixing edit.
  evaluation_points:
  - BFC is a merge commit rather than a normal linear commit.
  - The BIC is on the merged feature branch.
  - An unrelated main-branch change exists before the merge.
notes:
- This scenario intentionally makes c3 both a merge commit and the bug-fixing commit.
- If generate-graph cannot apply operations on merge commits, graph_generator.py must be updated to support merge commits
  with operations.
- This revision differentiates SZZG-0005 from SZZG-0030, where the BFC should be a normal main-branch commit after a merge.
