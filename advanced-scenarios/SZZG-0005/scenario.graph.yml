scenario_design:
  purpose: merge commit 上で初めてバグ修正が行われる場合を評価する。
  current_schema_limitation: commit DAG、branch、merge commit の親を表現できない。
  required_extensions_from_source: "```yaml\ncommits:\n  - id: \"c3\"\n    role: \"bug_fixing\"\n    branch: \"main\"\n    parents:\n      - \"c0\"\n      - \"c2\"\n```"
  evaluation_points:
  - merge commit の diff を SZZ が扱えるか
