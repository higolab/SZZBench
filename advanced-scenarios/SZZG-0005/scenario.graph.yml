commits:
- id: c0
  branch: main
  parents: []
  message: Initial implementation
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: Introduce bug on feature branch
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: feature
  parents:
  - c1
  message: Feature branch follow-up change
  role: intermediate
  operations:
