  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: introduce origin bug (write_file src/main/java/example/A.java)

    c1: introduce bug (copy_file src/main/java/example/A.java -> src/main/java/example/B.java)

    c2: fix bug (replace src/main/java/example/A.java)

    c3: fix bug (replace src/main/java/example/B.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: introduce origin bug (write_file src/main/java/example/A.java)'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: "package example;\n\npublic class A {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: introduce bug (copy_file src/main/java/example/A.java -> src/main/java/example/B.java)'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: fix bug (replace src/main/java/example/A.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/A.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix bug (replace src/main/java/example/B.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
