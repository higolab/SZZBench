schema_version: graph-1.0
meta:
  id: SZZG-0027
  title: Clone divergence before fixing one clone
  slug: clone-divergence-before-fix
  description: >-
    The policy is cloned for groups and the clone's parameter is then renamed, so the last commit to touch the line
    the fix repairs changed no behaviour.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - clone
  - clone-divergence
  - ambiguous-blame
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0027-clone-divergence-before-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create base permission check

    c1: introduce permissive delete check

    c2: clone policy to group policy

    c3: diverge copied clone by renaming parameters

    c4: fix copied clone after divergence'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the delete permission check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/UserPolicy.java
    content: "package example;\npublic class UserPolicy {\n  public boolean canDelete(boolean owner, boolean admin) {\n  \
      \  return owner || admin;\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Let every user delete during the rollout'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/UserPolicy.java
    old: return owner || admin;
    new: return owner || admin || true;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Clone the user policy for groups'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/UserPolicy.java
    to: src/main/java/example/GroupPolicy.java
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: public class UserPolicy
    new: public class GroupPolicy
- id: c3
  branch: main
  parents:
  - c2
  message: 'Rename the owner parameter to maintainer'
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: canDelete(boolean owner, boolean admin)
    new: canDelete(boolean maintainer, boolean admin)
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: return owner || admin || true;
    new: return maintainer || admin || true;
- id: c4
  branch: main
  parents:
  - c3
  message: 'Restrict deletion in the group policy again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: return maintainer || admin || true;
    new: return maintainer || admin;
bugs:
- id: B001
  title: Every user may delete group entries
  bug_introducing_commits:
  - commit: c2
    role: direct
    description: Clones the faulty policy into GroupPolicy.java, the instance the fix repairs.
  - commit: c1
    role: origin
    description: Made the source policy faulty; the clone inherited it.
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/GroupPolicy.java
    statement: return owner || admin || true;
    change_type: copy_propagated_line_modification
  origin_faults:
  - id: OF001
    commit: c1
    file: src/main/java/example/UserPolicy.java
    statement: return owner || admin || true;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/GroupPolicy.java
    statement: return maintainer || admin;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    related_origins:
    - c1
    related_but_not_correct:
    - c3
    notes: >
      The fix repairs GroupPolicy.java, which exists only because c2 cloned it,
      so c2 is the direct BIC (contract D4) and c1 is its origin (D2). c3
      renames the parameter in that same file and changes no behaviour, so it
      is never a BIC (D5) even though it is the last commit to touch the line
      the fix deletes.
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
      related_but_not_correct:
      - c3
scenario_design:
  purpose: >-
    Evaluate whether a method looks past a rename that owns the repaired line and reports the commit that cloned
    the fault.
