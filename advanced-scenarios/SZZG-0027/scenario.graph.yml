meta:
  id: SZZG-0027
  title: Clone divergence before fixing one clone
  slug: clone-divergence-before-fix
  description: Evaluates clone divergence before fixing one clone and checks whether SZZ identifies the expected bug-introducing
    commit set.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - clone
  - clone_divergence
  - ambiguous_blame
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0027-clone-divergence-before-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: c0: create base permission check

    c1: c1: introduce permissive delete check

    c2: c2: clone policy to group policy

    c3: c3: diverge copied clone by renaming parameters

    c4: c4: fix copied clone after divergence'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the delete permission check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/UserPolicy.java
    content: "package example;\npublic class UserPolicy {\n  public boolean canDelete(boolean owner, boolean admin) {\n  \
      \  return owner || admin;\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Let every user delete during the rollout'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/UserPolicy.java
    old: return owner || admin;
    new: return owner || admin || true;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Clone the user policy for groups'
  role: other
  operations:
  - type: copy_file
    from: src/main/java/example/UserPolicy.java
    to: src/main/java/example/GroupPolicy.java
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: public class UserPolicy
    new: public class GroupPolicy
- id: c3
  branch: main
  parents:
  - c2
  message: 'Rename the owner parameter to maintainer'
  role: refactoring
  operations:
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: canDelete(boolean owner, boolean admin)
    new: canDelete(boolean maintainer, boolean admin)
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: return owner || admin || true;
    new: return maintainer || admin || true;
- id: c4
  branch: main
  parents:
  - c3
  message: 'Restrict deletion in the group policy again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/GroupPolicy.java
    old: return maintainer || admin || true;
    new: return maintainer || admin;
bugs:
- id: B001
  title: Synthetic graph scenario bug
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
