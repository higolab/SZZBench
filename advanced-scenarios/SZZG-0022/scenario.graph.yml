  factors:
  - clone_relationships
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0022-clone
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: c0 origin bug / c1 copy / c2 divergence / c3 fix clone
commits:
- id: c0
  branch: main
  parents: []
  message: Introduce buggy original A
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: "package example;\n\npublic class A {\n  public boolean contains(int value, int min, int max) {\n    return value > min && value\
      \ < max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Copy buggy A to B
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
- id: c2
  branch: main
  parents:
  - c1
  message: Diverge clone by renaming class and adding note
  role: clone_divergence
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: public class A
    new: public class B
  - type: replace
    path: src/main/java/example/B.java
    old: public boolean contains
    new: public boolean containsCopied
- id: c3
  branch: main
  parents:
  - c2
  message: Fix diverged clone boundary bug
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Diverged clone bug
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c0
    role: origin
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/B.java
    statement: return value > min && value < max;
    role: direct
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/B.java
    statement: return value >= min && value <= max;
expected_szz:
