scenario_design:
  purpose: コピーされたコードが変形された後に修正されるケースを評価する。
  current_schema_limitation: copy とその後の clone divergence を表すメタデータがない。
  required_extensions_from_source: "```yaml\nclone_relationships:\n  - origin_file: \"A.java\"\n    copied_file: \"B.java\"\n    copy_commit:\
    \ \"c1\"\n    divergence_commits:\n      - \"c2\"\n```"
  evaluation_points:
  - 類似性が低下しても origin を追えるか
  - direct BIC は c1 か c2 か
  - clone-aware / semantic SZZ の比較
