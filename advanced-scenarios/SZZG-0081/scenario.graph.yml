expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_but_not_correct:
    - f1
    - r2
    notes: r2 changes only leading whitespace, including the whitespace of the faulty line, so plain line-level blame at c3^ stops
      at r2. A tool has to ignore whitespace (git blame -w, git blame --ignore-rev, or an equivalent heuristic) to reach r1.
scenario_design:
  purpose: Evaluate robustness against a reformatting commit that rewrites the faulty line between the BIC and the fix.
  key_property: 'The reformatting is behaviour preserving and token identical: every line keeps its content and only its indentation
    changes from two to four spaces. Plain git blame at c3^ attributes the faulty line to r2, git blame -w attributes it to r1.'
  difference_from_SZZG_0064: SZZG-0064 has no noise between the replayed BIC and the fix; here a whitespace-only commit sits in
    between and captures naive blame.
  evaluation_points:
  - Report r1.
  - Avoid r2, although plain git blame points at it.
notes:
- 'The generated repository is designed so that plain blame misses the BIC: the graph verifier therefore reports GW703 for this
  scenario. That warning is expected and documents the difficulty, it is not a defect.'
- 'rebase_cleanup: formatting_rewrite records that the reformatting was part of the rebase cleanup.'
