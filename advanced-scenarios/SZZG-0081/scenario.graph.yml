expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_but_not_correct:
    - r2
    notes: r2 changes only leading whitespace, including the whitespace of the faulty line, so plain line-level
      blame at c3^ stops at r2. A tool has to ignore whitespace (git blame -w, git blame --ignore-rev, or an equivalent
      heuristic) to reach r1.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      related_but_not_correct:
      - r2
scenario_design:
  purpose: Evaluate robustness against a reformatting commit that rewrites the faulty line between the BIC and the fix.
  key_property: >
    The reformatting is behaviour preserving and token identical: every line keeps its content and only its
    indentation changes from two to four spaces. Measured: text(null) is "" at c0, throws NullPointerException at
    f1, r1 and r2, and is "" again at c3; text(" x ") is "x" throughout. Plain git blame at c3^ attributes the
    faulty line to r2, git blame -w attributes it to r1.
  difference_from_SZZG_0064: SZZG-0064 has no noise between the replayed BIC and the fix; here a whitespace-only commit sits in
    between and captures naive blame.
  evaluation_points:
  - Report r1.
  - Avoid r2, although plain git blame points at it.
  failure_mode: >-
    A tool fails here when it takes plain blame's answer, the formatting rewrite: reaching `r1` needs
    whitespace-insensitive attribution (`git blame -w`, `--ignore-rev`, or a token-level comparison).
notes:
- 'The generated repository is designed so that plain blame misses the BIC: the graph verifier therefore reports GW703 for this
  scenario. That warning is expected and documents the difficulty, it is not a defect.'
- 'rebase_cleanup: formatting_rewrite records that the reformatting was part of the rebase cleanup.'
- Rewritten 2026-09-21 from the shared Range.contains template to a null-check-omission fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
