schema_version: graph-0.1-draft
meta:
  id: SZZG-0081
  title: Rebase with formatting rewrite noise
  slug: rebase-with-formatting-rewrite-noise
  description: A whitespace-only reformatting commit sits between the rebased bug-introducing commit and the fix and rewrites the
    faulty line itself. Plain git blame at the fix therefore stops at the formatting commit; git blame -w reaches the bug-introducing
    commit.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - formatting_rewrite
  - whitespace_only_change
  - blame_stops_at_formatting
  - direct_bic
  - origin_bic
  difficulty: advanced
  status: draft
  tier: control
