schema_version: graph-1.0
meta:
  id: SZZG-0081
  title: Rebase with formatting rewrite noise
  slug: rebase-with-formatting-rewrite-noise
  description: >
    A whitespace-only reformatting commit sits between the rebased bug-introducing commit and the fix and
    rewrites the faulty line itself. Plain git blame at the fix therefore stops at the formatting commit;
    git blame -w reaches the bug-introducing commit. The fault drops the null guard in front of a trim.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - formatting-noise
  - whitespace-only-change
  - blame-stops-at-formatting
  - direct-bic
  - origin-bic
  - null-check-omission
  difficulty: hard
  status: active
  tier: control
  defeats: [blame, shape]
repository:
  name: SZZG-0081-rebase-with-formatting-rewrite-noise
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the label helper with a null guard in front of the trim

    f1: Trim the label name directly (feature; drops the null guard)

    r1: rebased f1 onto main

    r2: Apply the four-space indentation of the project formatter (re-indents every line, including the faulty one)

    c3: Guard the label name against null again'
