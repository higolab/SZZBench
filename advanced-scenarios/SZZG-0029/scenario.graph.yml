schema_version: graph-0.1-draft
meta:
  id: SZZG-0029
  title: Partial fix followed by complete fix
  slug: bfc-partial-fix
  description: >-
    One fault is repaired by two commits, each accepting one bound, so the bug has a partial fix followed by a complete
    one.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - multi-bfc
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0029-bfc-partial-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file src/main/java/example/Range.java)

    c1: introduce bug (replace src/main/java/example/Range.java)

    c2: fix bug (replace src/main/java/example/Range.java)

    c3: fix bug (replace src/main/java/example/Range.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept the lower bound again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Accept the upper bound again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Boundary values are excluded by a partial fix scenario
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: partial_fix
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value < max;
    fix_type: partial_line_modification
  - id: X002
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: complete_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: >-
    Evaluate whether a method attributes both a partial fix and the commit that completes it to the same bug-introducing
    commit.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: >-
    This scenario uses factors: multi-bfc; operations: write_file, replace.
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether structural or contextual history is handled according to the scenario factors.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
