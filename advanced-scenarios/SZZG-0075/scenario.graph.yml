schema_version: graph-1.0
meta:
  id: SZZG-0075
  title: Interactive rebase squashes BIC and BFC into neutral commit
  slug: interactive-rebase-squashes-bic-and-bfc-into-neutral-commit
  description: 'A fault and its fix are written on a feature branch and squashed into a single commit before the branch reaches
    main. The squashed commit adds the feature in its correct form: the main line contains neither the faulty statement nor a separate
    fix, so main offers no bug-fixing commit to start SZZ from. The pre-squash pair stays reachable on the feature branch.'
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - interactive-rebase
  - squash
  - transient-bug
  - scope-boundary
  - no-main-line-bfc
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0075-interactive-rebase-squashes-bic-and-bfc-into-neutral-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the Range class with an inclusive contains check

    f1: Add a width helper for an interval (feature, width is one too small)

    f2: An inclusive interval is one element wider than max - min (feature)

    r1: Add a width helper that counts both endpoints (squash of f1 and f2 onto main; the two cancel out)'
  ref_lifecycle:
    tags:
    - name: pre-squash/feature
      commit: f2
commits:
- id: c0
  branch: main
  parents: []
  message: Add the Range class with an inclusive contains check
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: Add a width helper for an interval
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n\n  public int width(int min, int max) {\n    return max - min;\n  }\n}\n"
- id: f2
  branch: feature
  parents:
  - f1
  message: An inclusive interval is one element wider than max - min
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return max - min;
    new: return max - min + 1;
- id: r1
  branch: main
  parents:
  - c0
  message: Add a width helper that counts both endpoints
  role: intermediate
  rebase_of:
  - f1
  - f2
  squashes:
  - f1
  - f2
  interactive_rebase: squash
  committer_date: '2024-01-06T14:25:00Z'
  operations:
  - type: apply_squash
    from_commits:
    - f1
    - f2
bugs:
- id: B001
  title: Interval width fault that never reaches the main line
  bug_introducing_commits:
  - commit: f1
    role: direct
  bug_fixing_commits:
  - commit: f2
    role: complete_fix
  faults:
  - id: F001
    commit: f1
    file: src/main/java/example/Range.java
    statement: return max - min;
    change_type: line_modification
  fixes:
  - id: X001
    commit: f2
    file: src/main/java/example/Range.java
    statement: return max - min + 1;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - f1
    related_but_not_correct:
    - r1
    notes: 'The scored pair is the pre-squash pair on the feature branch: given the bug-fixing commit f2, the answer is f1. r1
      is the squashed main-line commit; it is not a bug-fixing commit and it must not be returned as a bug-introducing commit either,
      because the tree it produces contains no fault. The variant ''main-line-only'' states the expectation for a tool that mines
      the main line: there is no bug-fixing commit for B001 on main, so the answer is the empty set.'
  evaluation_variants:
  - name: main-line-only
    description: A tool that mines only the final main history. main carries no bug-fixing commit for B001, so the tool must report
      nothing; every commit it reports is a false positive.
    commit_level:
      evaluation_policy: exact_set
      expect_no_bic: true
      required: []
scenario_design:
  purpose: Make the squashed main-line commit the object of the scenario and fix the scope boundary for faults that do not survive
    into the main line.
  key_property: 'r1 is the squash of f1 (fault) and f2 (fix): it adds the width helper in its correct form. The faulty statement
    ''return max - min;'' occurs in no tree reachable from main, and main carries no separate fix either, so a main-line miner
    has no bug-fixing commit for B001 to start from. The pre-squash commits stay reachable through the feature branch and the tag
    pre-squash/feature.'
  difference_from_SZZG_0064: SZZG-0064 replays a series commit by commit and asks which replayed commit is the BIC. Here the replay
    squashes the fault and its fix into one commit, which removes the bug from the main line entirely.
  evaluation_points:
  - Given the feature-branch fix f2, report f1.
  - 'Given only the main line, report nothing: r1 is neither a BIC nor a BFC for B001.'
  - Do not treat the squashed commit r1 as the bug-introducing commit of a bug that its tree does not contain.
  failure_mode: >-
    A tool fails here when it reports the squashed main-line commit `r1` under the default oracle, or anything
    at all under `main-line-only`: the BIC and BFC were squashed into one neutral commit whose tree does not
    contain the fault.
notes:
- The squash is generated with apply_squash, which cherry-picks f1 and then f2 with --no-commit, so the main-line tree really is
  the result of applying both patches.
- graph.ref_lifecycle creates the lightweight tag pre-squash/feature at f2; together with the feature branch it documents that
  the pre-squash commits remain reachable and are not garbage collected.
