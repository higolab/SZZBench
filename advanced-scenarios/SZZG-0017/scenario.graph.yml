schema_version: graph-1.0
meta:
  id: SZZG-0017
  title: Clone diverges before fix
  slug: clone
  description: >-
    The faulty helper is copied into a second class, and a later commit renames the copied method inside that
    file, so the method the fix edits is not the one the copy was made under. The fault is an off-by-one: the
    last position of a sequence of {@code length} elements is returned as {@code length} instead of
    {@code length - 1}.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - copy-propagation
  - off-by-one
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0017-clone
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add Cursor with an off-by-one lastPosition (origin)

    c1: copy Cursor.java to Selection.java and rename the copied class (direct BIC)

    c2: rename the copied method to endPosition (clone divergence)

    c3: return length - 1 from Selection.endPosition (fix)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the cursor helper'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/Cursor.java
    content: "package example;\n\npublic class Cursor {\n  /** Position of the last element of a sequence of {@code length} elements. */\n\
      \  public int lastPosition(int length) {\n    return length;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Copy the cursor helper into Selection'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/Cursor.java
    to: src/main/java/example/Selection.java
  - type: replace
    path: src/main/java/example/Selection.java
    old: public class Cursor
    new: public class Selection
- id: c2
  branch: main
  parents:
  - c1
  message: 'Rename the copied method to endPosition'
  role: clone_divergence
  operations:
  - type: replace
    path: src/main/java/example/Selection.java
    old: public int lastPosition
    new: public int endPosition
- id: c3
  branch: main
  parents:
  - c2
  message: 'Return the last position, not the length, from Selection.endPosition'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Selection.java
    old: return length;
    new: return length - 1;
bugs:
- id: B001
  title: The copied last-position helper is off by one, and its method was renamed before the fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c0
    role: origin
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Selection.java
    statement: return length;
    role: direct
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Selection.java
    statement: return length - 1;
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_origins:
    - c0
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c1
      acceptable_related:
      - commit: c0
        reason: origin_bic
        credit: 0.5
clone_relationships:
- origin_file: src/main/java/example/Cursor.java
  copied_file: src/main/java/example/Selection.java
  origin_commit: c0
  copy_commit: c1
  divergence_commits:
  - c2
scenario_design:
  purpose: >-
    Evaluate whether a method reaches the copying commit when the copied method has since been renamed in place.
  key_property: >-
    Measured: Selection's helper returns 10 for length 10 at c1 and c2 (as lastPosition and as endPosition) and 9
    at c3; Cursor.lastPosition(10) stays 10, the origin is not fixed here. Blaming the line c3 deletes at c3^
    returns c1: the rename commit c2 touched the signature line, not the faulty return.
notes:
- Rewritten 2026-09-21 from the shared Range.contains template to an off-by-one fault (GitHub issue 13); the history
  shape, oracle and coverage dimensions are unchanged.
