scenario_design:
  purpose: Evaluate a copy-propagated bug where c1 remains the direct BIC for B.java even though A.java is fixed first.
  key_property: Commit c2 fixes the original A.java instance only. For the later B.java fix in c3, the expected direct BIC
    is still c1, the commit that copied the faulty logic into B.java.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: copy_file, faults; operations: write_file, copy_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the direct BIC for the copied B.java instance.
  - Whether SZZ does not treat the later A.java fix c2 as the copied instance's BFC.
  - Whether the expected_szz evaluation policy is applied correctly.
