  required_extensions_from_source: "```yaml\nfixes:\n  - id: \"X001\"\n    bug: \"B001\"\n    commit: \"c3\"\n    file: \"...\"\n    statement:\
    \ \"...\"\n\n  - id: \"X002\"\n    bug: \"B002\"\n    commit: \"c3\"\n    file: \"...\"\n    statement: \"...\"\n```"
  evaluation_points:
  - BFC 内で bug ごとの起点 hunk を分離できるか
  - tangled BFC の拡張ケースとして扱うか
  - bug-level evaluation と commit-level evaluation の違い
