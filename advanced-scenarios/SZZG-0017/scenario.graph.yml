graph:
  model: commit_dag
  history_summary: c0 correct / c1 bug A / c2 bug B / c3 fixes A and B
commits:
- id: c0
  branch: main
  parents: []
  message: Initial correct independent checks
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean containsLower(int value, int min) {\n    return value >= min;\n  }\n\n\
      \  public boolean containsUpper(int value, int max) {\n    return value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Introduce lower-bound BIC
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min;
    new: return value > min;
- id: c2
  branch: main
  parents:
  - c1
  message: Introduce upper-bound BIC
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value <= max;
    new: return value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: Fix both lower and upper bugs together
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min;
    new: return value >= min;
  - type: replace
    path: src/main/java/example/Range.java
    old: return value < max;
    new: return value <= max;
