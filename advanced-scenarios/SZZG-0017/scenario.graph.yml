meta:
  id: SZZG-0017
  title: Buggy code copied while original is fixed later
  slug: buggy-code-copied-original-later-fixed
  description: Evaluates a copied buggy implementation where the original file is fixed before the copied file, and the
    copy commit remains the direct BIC for the copied file.
  category: Copy, clone, and propagation scenarios
  category_code: E
  factors:
  - copy_file
  - faults
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0017-buggy-code-copied-original-later-fixed
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file src/main/java/example/A.java)

    c1: copy buggy code to B.java (copy_file src/main/java/example/A.java -> src/main/java/example/B.java)

    c2: fix original bug in A.java (replace src/main/java/example/A.java)

    c3: fix copied bug in B.java (replace src/main/java/example/B.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial state (write_file src/main/java/example/A.java)'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/A.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: copy buggy code to B.java (copy_file src/main/java/example/A.java -> src/main/java/example/B.java)'
  role: bug_introducing
  operations:
  - type: copy_file
    from: src/main/java/example/A.java
    to: src/main/java/example/B.java
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: fix original bug in A.java (replace src/main/java/example/A.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/A.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix copied bug in B.java (replace src/main/java/example/B.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/B.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
