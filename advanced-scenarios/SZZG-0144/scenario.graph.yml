schema_version: graph-1.0
meta:
  id: SZZG-0144
  title: The fix message names the issue whose change blame cannot reach
  slug: fix-message-names-the-earlier-issue
  description: >
    An issue asks for the idle timeout to be stated in minutes like the other
    timeouts; the change converts the constant and its only reader together, so
    nothing observable moves. A second issue asks for the remaining idle time to
    be shown, and the commit that adds it subtracts seconds from a constant that
    now holds minutes. A report of the negative remaining time follows, and the
    fix repairs the subtraction. Blame on the line the fix deletes reaches the
    consumer only; the fix message, the report and the commit that closed the
    first issue are the evidence that reaches the other half.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - multi-bic
  - single-bfc
  - issue-evidence
  - message-evidence
  - tool-visible-context
  - value-flow
  - wrong-constant
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0144-fix-message-names-the-earlier-issue
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the session idle policy'
  author: 'Dana Okafor <dana.okafor@example.com>'
  role: initial
  date: '2024-05-06T09:10:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/SessionPolicy.java
    content: |
      package example;

      public class SessionPolicy {
          static final int IDLE_TIMEOUT = 900;

          public boolean expired(int idleSeconds) {
              return idleSeconds > IDLE_TIMEOUT;
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Record the request to state the idle timeout in minutes (ISSUE-12)'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: intermediate
  date: '2024-05-08T10:30:00Z'
  operations:
  - type: write_file
    path: docs/issues/ISSUE-12.md
    content: |
      # ISSUE-12: State the idle timeout in minutes like the other timeouts

      Reported: 2024-05-07T16:40:00Z

      Every other timeout in the session settings is a number of minutes. The idle
      timeout is the only one kept in seconds, and the operations team keeps
      converting it by hand when they compare the settings. Please keep it in
      minutes as well, without changing when a session expires.
- id: c2
  branch: main
  parents:
  - c1
  message: 'Express the idle timeout in minutes (ISSUE-12)'
  author: 'Luca Moretti <luca.moretti@example.com>'
  role: bug_introducing
  date: '2024-05-09T14:15:00Z'
  operations:
  - type: replace
    path: src/main/java/example/SessionPolicy.java
    old: |
      static final int IDLE_TIMEOUT = 900;

          public boolean expired(int idleSeconds) {
              return idleSeconds > IDLE_TIMEOUT;
          }
    new: |
      static final int IDLE_TIMEOUT = 15;

          public boolean expired(int idleSeconds) {
              return idleSeconds > IDLE_TIMEOUT * 60;
          }
- id: c3
  branch: main
  parents:
  - c2
  message: 'Record the request to show the remaining idle time (ISSUE-19)'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: intermediate
  date: '2024-05-14T09:45:00Z'
  operations:
  - type: write_file
    path: docs/issues/ISSUE-19.md
    content: |
      # ISSUE-19: Show how long until the session goes idle

      Reported: 2024-05-13T11:20:00Z

      Users are surprised when a session expires. Please expose the remaining idle
      time, in seconds, so the client can show a countdown during the last minute.
- id: c4
  branch: main
  parents:
  - c3
  message: 'Show the remaining idle time in seconds (ISSUE-19)'
  author: 'Aiko Mori <aiko.mori@example.com>'
  role: bug_introducing
  date: '2024-05-16T16:00:00Z'
  operations:
  - type: replace
    path: src/main/java/example/SessionPolicy.java
    old: |
      public boolean expired(int idleSeconds) {
              return idleSeconds > IDLE_TIMEOUT * 60;
          }
    new: |
      public boolean expired(int idleSeconds) {
              return idleSeconds > IDLE_TIMEOUT * 60;
          }

          public int remainingSeconds(int idleSeconds) {
              return IDLE_TIMEOUT - idleSeconds;
          }
- id: c5
  branch: main
  parents:
  - c4
  message: 'Record the report about the negative remaining time (ISSUE-23)'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: intermediate
  date: '2024-05-21T08:50:00Z'
  operations:
  - type: write_file
    path: docs/issues/ISSUE-23.md
    content: |
      # ISSUE-23: The remaining idle time is negative right after signing in

      Reported: 2024-05-20T09:05:00Z

      Twenty seconds after signing in the countdown already reads -5 seconds, and it
      keeps falling from there; ten minutes in it reads -585. Sessions still expire
      after fifteen minutes as they always have, so only the displayed remaining time
      is wrong.
      Seen on every client since the countdown was added (ISSUE-19).
- id: c6
  branch: main
  parents:
  - c5
  message: 'Compute the remaining idle time from the timeout in minutes, as it has been since ISSUE-12 (ISSUE-23)'
  author: 'Tom Becker <tom.becker@example.com>'
  role: bug_fixing
  date: '2024-05-22T13:35:00Z'
  operations:
  - type: replace
    path: src/main/java/example/SessionPolicy.java
    old: return IDLE_TIMEOUT - idleSeconds;
    new: return IDLE_TIMEOUT * 60 - idleSeconds;
