expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    - c4
    notes: >
      Both commits are required. Without c4 nothing reads IDLE_TIMEOUT as seconds; without c2 the
      constant is still 900 and c4's subtraction is right. Blame on the line c6 deletes returns c4
      alone. The fix message names ISSUE-12, whose closing commit is c2, and the report ISSUE-23 says
      that expiry itself is unchanged, which points at a reader of the constant rather than the
      constant's meaning having gone wrong on its own.
scenario_design:
  purpose: >
    A discriminating scenario for G7: the evidence that reaches the second required commit is not
    in any line the fix touches but in the repository's issue documents and in the fix message,
    which names the issue the other commit closed.
  key_property: >
    Measured: expired(899), expired(900), expired(901) are false, false, true at every commit;
    remainingSeconds(20) is -5 from c4 and 880 from c6; remainingSeconds(600) is -585 from c4 and
    300 from c6. Undoing c2 on top of c4 (IDLE_TIMEOUT = 900, expired() compares against it
    directly, remainingSeconds() subtracts from it) gives 880 and 300: the fixed answers. Blaming the
    line c6 deletes at c6^ returns c4 under every variant.
  evaluation_points:
  - Report exactly {c2, c4}.
  - Whether the issue reference in the fix message is followed to the commit that closed ISSUE-12.
  - Whether the report's remark that expiry is unchanged is used to look at the constant's readers rather than the constant alone.
  failure_mode: >-
    A tool fails here when it stops at blame's `c4`: the fix message and the report both name
    ISSUE-12, and the commit that closed it, `c2`, changed what the constant `c4` reads means.
notes:
- The three issue documents are written by ordinary commits and are scanned by the leakage lint like any other text.
- The dates are pinned so that the report-date heuristic of SZZG-0130 can be applied; here it excludes nothing, because both required commits predate ISSUE-23.
