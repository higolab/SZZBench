schema_version: graph-0.1-draft
meta:
  id: SZZG-0054
  title: Fixed on main but unfixed on release
  slug: fixed-on-main-unfixed-on-release
  description: A bug is introduced before a release branch is cut; main fixes the bug, but the release branch continues without
    the fix.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - release_branch
  - partial_fix_propagation
  - unfixed_release
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0054-fixed-on-main-unfixed-on-release
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on main before release branch

    c2: create release branch from buggy state and add release note

    c3: fix bug on main

    c4: release branch continues with bug unfixed'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: release
  parents:
  - c1
  message: 'Cut the release branch'
  role: intermediate
  operations:
  - type: write_file
    path: docs/release-note.md
    content: 'Release branch cut for the 1.0 line.

      '
- id: c3
  branch: main
  parents:
  - c1
  message: 'Accept the range bounds on main'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: c4
  branch: release
  parents:
  - c2
  message: 'Add the release follow-up note'
  role: unfixed_release
  operations:
  - type: write_file
    path: docs/release-followup.md
    content: 'Release branch follow-up notes.

      '
bugs:
- id: B001
  title: Bug fixed on main but still present on release
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: main_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  bug_instances:
  - branch: main
    status: fixed
    fix_commit: c3
  - branch: release
    status: unfixed
    last_commit: c4
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ can identify the original BIC when a fix exists on main but has not been propagated to a release
    branch.
  key_property: The same BIC affects both branches, but only main contains a BFC.
  evaluation_points:
  - Main fixed
  - Release unfixed
  - Bug instance remains active on release.
notes:
- The release branch intentionally remains buggy at c4.
