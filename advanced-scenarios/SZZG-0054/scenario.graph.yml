    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n}\n"
  - type: write_file
    path: src/main/java/example/Caller.java
    content: |
      package example;

      public class Caller {
        private final Range range = new Range();

        public boolean callRange(int value) {
          return range.contains(value, 0, 10);
        }
      }
