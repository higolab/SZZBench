schema_version: graph-1.0
meta:
  id: SZZG-0046
  title: BFC in merge commit
  slug: bfc-in-merge-commit
  description: A bug is introduced before branches diverge; main and feature apply complementary partial changes, and the
    merge commit performs the final fix.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - merge
  - merge-commit-bfc
  - partial-fix
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0046-bfc-in-merge-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug before branch divergence

    c2: main branch adds tests but does not fix the bug

    c3: feature branch adds a helper that still uses the buggy method

    c4: merge main and feature and fix the bug in the merge commit'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Note the boundary cases to cover in tests'
  role: intermediate
  operations:
  - type: write_file
    path: docs/boundary-test-note.md
    content: 'Boundary cases should be covered by tests.

      '
- id: c3
  branch: feature
  parents:
  - c1
  message: 'Add a feature-specific range wrapper'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: c4
  branch: main
  parents:
  - c2
  - c3
  message: 'Merge the feature branch and accept the range bounds'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Shared range boundary bug fixed by merge commit
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
    description: The merge commit itself carries the fix.
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: 'Evaluate a BFC that is a merge commit, but with a different shape from SZZG-0042: the bug predates branch divergence
    and the merge completes the fix after partial contextual changes on both branches.'
  key_property: The BFC is merge commit c4, and both parents still contain the bug before c4 applies the final fix.
  evaluation_points:
  - Merge commit as BFC
  - Bug introduced before branch divergence
  - Both branches contain relevant intermediate context before the merge.
notes:
- >-
  Distinguishes SZZG-0046 from SZZG-0042: there the BIC is on the merged feature branch, while here it
  precedes the branch point, so both branches inherit the fault and the merge is the first commit that
  can fix it.
