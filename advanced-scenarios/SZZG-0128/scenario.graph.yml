expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: >
    The same three feature commits as SZZG-0043, integrated into main by a fast-forward instead of a
    `--no-ff` merge. There is no merge commit: main's history is c0, c1, c2, c4 in a straight line, and
    the `feature` ref still points at c2.
  key_property: >
    In SZZG-0043 the BIC c1 is only on main's second-parent side and `--first-parent` hides it; here it is
    on main's only line. A tool that behaves differently between the twins is reacting to the presence of
    the merge commit, not to the change that introduced the bug.
  evaluation_points:
  - Report c1.
  - Behave the same as on SZZG-0043.
  failure_mode: >-
    A tool fails here when its answer differs from SZZG-0043's: the branch was integrated by fast-forward, and
    a tool reacting to the presence of a merge commit behaves differently between the twins.
notes:
- Twin of SZZG-0043. The fast-forward is expressed by giving the first main commit after the branch the
  feature tip as its parent; the generator moves `main` there and commits on top.
