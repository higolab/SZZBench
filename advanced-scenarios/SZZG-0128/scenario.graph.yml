schema_version: graph-1.0
meta:
  id: SZZG-0128
  title: Feature branch integrated by fast-forward, no merge commit (twin of SZZG-0043)
  slug: fast-forward-integration-twin
  description: A feature branch introduces a bug, extends feature code that depends on the buggy method, is merged into main,
    and is then fixed by a normal main-branch commit.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - fast-forward
  - branch
  - merge
  - feature-branch-bic
  - main-branch-bfc
  difficulty: easy
  status: active
  tier: control
  defeats: [shape]
repository:
  name: SZZG-0128-fast-forward-integration-twin
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on feature branch

    c2: extend feature branch code that uses the buggy method

    c3: merge feature branch into main

    c4: fix bug on main after merge'
commits:
- id: c0
  author: Farid Haddad <farid.haddad@example.com>
  author_date: '2023-02-20T09:00:00Z'
  committer_date: '2023-02-20T09:00:00Z'
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  author: Farid Haddad <farid.haddad@example.com>
  author_date: '2023-02-27T17:36:00Z'
  committer_date: '2023-02-27T17:36:00Z'
  branch: feature
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  author: Elena Rossi <elena.rossi@example.com>
  author_date: '2023-03-08T08:35:00Z'
  committer_date: '2023-03-08T08:35:00Z'
  branch: feature
  parents:
  - c1
  message: 'Add a feature-specific range wrapper'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: c4
  author: Elena Rossi <elena.rossi@example.com>
  author_date: '2023-03-21T12:05:00Z'
  committer_date: '2023-03-21T12:05:00Z'
  branch: main
  parents:
  - c2
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
