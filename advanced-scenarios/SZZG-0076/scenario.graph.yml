scenario_design:
  purpose: Evaluate multiple-BIC handling when BICs are introduced by rebase replay.
  key_property: >
    Origin BIC set maps to direct BIC set, both edits landing on one line. Measured: minutesBetween(0, 120000) is
    2 at c0 and r1, 7200000000 at r2, 2 at c3; minutesBetween(0, 3000000000) — about 35 days — is 50000 at c0,
    -21582 at r1 (the int narrowing wraps), -77698037760000 at r2, 50000 at c3. Blaming the line c3 deletes at
    c3^ returns r2 only, so plain blame recovers half of the required set and the scenario stays in the
    discriminating tier.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Return r1 and r2.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
- Rewritten 2026-09-21 from the shared Range.contains template to an integer-overflow plus wrong-operator fault (GitHub
  issue 13); the history shape, oracle, tier and coverage dimensions are unchanged.
