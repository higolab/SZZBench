schema_version: graph-1.0
meta:
  id: SZZG-0076
  title: Multiple BICs replayed by rebase
  slug: multiple-bics-replayed-by-rebase
  description: >
    Multiple feature BICs are replayed onto main by rebase. Two feature commits damage the same line
    of the elapsed-minutes computation in two different ways — the first narrows the elapsed
    milliseconds to an int, which overflows past 24 days, the second turns the division by 60000
    into a multiplication — and the rebase replays them one by one.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - multi-bic
  - rebased-bic
  - direct-bic
  - origin-bic
  - integer-overflow
  - wrong-operator
  difficulty: advanced
  status: active
  tier: discriminating
repository:
  name: SZZG-0076-multiple-bics-replayed-by-rebase
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add the elapsed-minutes helper (long arithmetic, divide by 60000)

    f1: narrow the elapsed milliseconds to an int (overflows past 24 days)

    f2: multiply instead of dividing by 60000

    r1: rebase the int narrowing

    r2: rebase the multiplication

    c3: restore the long division'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the elapsed-minutes helper'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Elapsed.java
    content: |
      package example;

      public class Elapsed {
        /** Whole minutes between two instants given in epoch milliseconds. */
        public long minutesBetween(long startMillis, long endMillis) {
          return (endMillis - startMillis) / 60000L;
        }
      }
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Narrow the elapsed milliseconds to an int'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Elapsed.java
    old: return (endMillis - startMillis) / 60000L;
    new: return (int) (endMillis - startMillis) / 60000L;
- id: f2
  branch: feature
  parents:
  - f1
  message: 'Simplify the minutes conversion'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Elapsed.java
    old: return (int) (endMillis - startMillis) / 60000L;
    new: return (int) (endMillis - startMillis) * 60000L;
- id: r1
  branch: main
  parents:
  - c0
  message: 'Narrow the elapsed milliseconds to an int'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Elapsed.java
    old: return (endMillis - startMillis) / 60000L;
    new: return (int) (endMillis - startMillis) / 60000L;
  rebase_of: f1
- id: r2
  branch: main
  parents:
  - r1
  message: 'Simplify the minutes conversion'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Elapsed.java
    old: return (int) (endMillis - startMillis) / 60000L;
    new: return (int) (endMillis - startMillis) * 60000L;
  rebase_of: f2
- id: c3
  branch: main
  parents:
  - r2
  message: 'Divide the long elapsed time by 60000 again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Elapsed.java
    old: return (int) (endMillis - startMillis) * 60000L;
    new: return (endMillis - startMillis) / 60000L;
