schema_version: graph-1.0
meta:
  id: SZZG-0061
  title: Cherry-picked BIC appears as duplicate commits on two branches
  slug: cherry-picked-bic-duplicates
  description: >-
    The same change exists as two commits, one per branch, and only the copy in the fix's own history is the bug-introducing
    commit.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - cherry-pick
  - duplicate-patch
  - non-linear-history
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0061-cherry-picked-bic-duplicates
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create status mapper

    c1: introduce wrong error status on release branch

    c2: cherry-pick wrong error status onto main

    c3: fix wrong error status on main'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the status mapper'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/StatusMapper.java
    content: "package example;\npublic class StatusMapper {\n  public int code(boolean ok) {\n    return ok ? 200 : 500;\n\
      \  }\n\n}\n"
- id: c1
  branch: release
  parents:
  - c0
  message: 'Return 400 for the error case'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/StatusMapper.java
    old: 'return ok ? 200 : 500;'
    new: 'return ok ? 200 : 400;'
- id: c2
  branch: main
  parents:
  - c0
  message: 'Cherry-pick the error status change onto main'
  role: bug_introducing
  cherry_pick_of: c1
  operations:
  - type: replace
    path: src/main/java/example/StatusMapper.java
    old: 'return ok ? 200 : 500;'
    new: 'return ok ? 200 : 400;'
- id: c3
  branch: main
  parents:
  - c2
  message: 'Return 500 for the error case again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/StatusMapper.java
    old: 'return ok ? 200 : 400;'
    new: 'return ok ? 200 : 500;'
bugs:
- id: B001
  title: Server errors are reported as client errors
  bug_introducing_commits:
  - commit: c2
    role: direct
    description: The copy of the change that is in the history the fix belongs to.
  - commit: c1
    role: origin
    description: The release-branch commit the change was picked from; not an ancestor of the fix.
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/StatusMapper.java
    statement: 'return ok ? 200 : 400;'
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/StatusMapper.java
    statement: 'return ok ? 200 : 500;'
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    related_origins:
    - c1
    notes: >
      c2 is the copy of the change that lives in main, the history the fix
      belongs to, so it is the direct BIC (contract D4). c1 is on the release
      branch and is not an ancestor of the fix; it is the origin (D2). The
      cherry-pick is manual - the generated commit carries no trailer - so the
      lineage is declared with cherry_pick_of rather than left implicit.
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - c2
      acceptable_related:
      - commit: c1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate whether a method reports the copy of a cherry-picked commit that is in the fix's own history.
