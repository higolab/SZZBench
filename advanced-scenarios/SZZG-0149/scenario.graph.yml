expected_szz:
  commit_level:
    evaluation_policy: partial_credit
    required:
    - c1
    - c3
    - c5
    minimum_required: 2
    notes: >
      Three contributing causes on three branches, one fix, two of the three needed to pass. Only c1's
      fault is on a line the fix deletes; the other two repairs add a case and a guard. Blame therefore
      returns {c1} - one true positive, no false positive - and fails the threshold. SZZG-0148 is the
      linear twin of this shape and SZZG-0138 the control where blame reaches two of three.
scenario_design:
  purpose: >
    Reduce the largest pocket of scenarios solved by naive rules (issue #80, proposal 3). G4 held 27 of its 29
    scenarios in that pocket and every one of them had a one-commit oracle, which a positional rule names
    by construction; this one names three commits under a threshold, and puts them on three branches so
    that the reader has to cross two merges as well.
  key_property: >
    Measured: deliveryDays(1200) is 3 at c0 and 2 from c1 until c7, where it is 3 again; Surcharge
    cents("REMOTE") is 0 from c3 and 1500 at c7, while cents("RURAL") is 500 throughout; expressDays(200)
    is -1 at c5 and 1 at c7, expressDays(1200) is 1 at c5 and 2 at c7. The fix deletes exactly one line,
    c1's, so blame at c7^ returns {c1} under every variant; two of three are required, so one true
    positive is not enough.
  evaluation_points:
  - Whether two of the three contributing commits are reported, which is what the policy asks for.
  - Whether a repair that only adds lines is traced to the commit whose omission it repairs, across a merge.
  - Whether a report states the credit ratio and the threshold it was scored against.
  failure_mode: >-
    A tool fails here when it reports only what the fix deletes: blame's `c1` is one of three causes and
    the policy requires two, so the answer is short of the threshold rather than wrong.
notes:
- The two merges are clean: release-transit edits Quote.java and release-zones adds Surcharge.java.
- c6 touches both files the fix touches and introduces nothing, so the shape baseline - which names the newest commit
  to touch each of those files - answers c6 rather than two of the three required commits.
- Authors are assigned so that every author rule of the baseline family also names a commit outside the required set.
