schema_version: graph-1.0
meta:
  id: SZZG-0149
  title: "Three release branches, three causes, and a credit threshold blame cannot meet"
  slug: three-branches-one-threshold
  description: >
    A delivery quote is wrong for three separate reasons, each committed on its
    own branch and brought to main by a merge: a day dropped from the transit
    estimate, a zone the surcharge table never handles, and an express quote
    with no floor. One commit on main repairs all three, but only the first
    repair deletes a line — the other two add a case and a guard. Blame returns
    one of the three required commits and the policy asks for two, so the
    scenario fails on the threshold rather than on anything blame got wrong. It
    is G4's first three-commit oracle and its first history with three branches.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - release-branch
  - merge
  - multi-bic
  - single-bfc
  - partial-credit
  - addition-only-fix
  - missing-branch
  - off-by-one
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
