schema_version: graph-0.1-draft
meta:
  id: SZZG-0056
  title: Main fix rebased onto release branch
  slug: main-fix-rebased-onto-release-branch
  description: A main-line fix is replayed onto release by rebase.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - rebase
  - release_branch
  - main_fix_to_release
  - rebased_bfc
  - bug_fixing_commits
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0056-main-fix-rebased-onto-release-branch
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce range bug on main

    rel1: cut release branch with bug

    c2: fix bug on main

    r2: rebase main fix onto release'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: rel1
  branch: release
  parents:
  - c1
  message: 'Rel1: cut release branch with bug'
  role: release_branch_point
  operations:
  - type: write_file
    path: release/version.txt
    content: '1.0

      '
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
- id: r2
  branch: release
  parents:
  - rel1
  message: 'Accept the range bounds on release'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
  rebase_of: c2
bugs:
- id: B001
  title: Bug fixed by rebased main fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  - commit: r2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: r2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
scenario_design:
  purpose: Evaluate a release BFC that is a rebased copy of a main fix.
  key_property: r2 is the release BFC replaying c2.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Start from r2.
  - Return c1.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
