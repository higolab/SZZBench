schema_version: graph-1.0
meta:
  id: SZZG-0110
  title: Empty intermediate commit
  slug: empty-intermediate-commit
  description: Evaluates an empty intermediate commit between the BIC and BFC and checks whether SZZ ignores it as a cause.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - single-bic
  - single-bfc
  - boundary-condition
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0110-empty-intermediate-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: add the range containment helper
    c1: switch the containment check to exclusive bounds
    c2: empty commit that only retriggers the build (between the BIC and the BFC)
    c3: restore the inclusive bounds
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range containment helper'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;

      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Align contains() with the exclusive interval used by the scheduler'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Retrigger the release build after the CI cache was cleared'
  role: intermediate
  operations: []
  allow_empty: true
- id: c3
  branch: main
  parents:
  - c2
  message: 'Restore the inclusive bounds of Range.contains()'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Range.contains() rejects the interval bounds
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ identifies the real BIC when an empty commit sits between the BIC and the BFC.
  key_property: The empty commit c2 is the direct parent of the BFC c3, so a tool that walks back from the BFC meets it first
    and must skip it; c2 has no diff at all, so it can carry no blame.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: >-
    This scenario uses factors: single-bic, single-bfc, boundary-condition; operations: write_file, replace.
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether the empty commit c2 between the BIC and the BFC is not reported as the BIC.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
