expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
    - c3
scenario_design:
  purpose: Evaluate whether SZZ can use the issue text behind the identifier carried by the fix message to choose between
    two commits that made the same change to two duplicated normalizers, after a deduplication deleted both changed lines.
  key_property: |
    c1 and c2 give the same null-for-blank contract to two duplicated normalizers, one for the middle-name column and one
    for the nickname column. The two predicates are spelled differently (value.trim().isEmpty() and
    value.trim().length() == 0) but are equivalent on every input, including Unicode whitespace, and the shared normalizer
    c3 writes is a third spelling with the same behaviour. c3's patch therefore deletes both changed lines without changing
    behaviour, and git blame at BFC^ reaches c3 under plain blame and under -w, -M and -C -C. The commit subjects carry
    issue identifiers and no column names, so the subjects do not say which column regressed; the text of ISSUE-401 and
    ISSUE-377, matched against the text of ISSUE-482, names the middle-name column and selects c1.
  code_evidence_limitation: |
    Issue-text evidence is sufficient and direct, not strictly necessary. A tool that reconstructs the call graph across
    the deduplication can also reach c1, because middleName called normalizeMiddleName before c3, and the BFC repairs the
    middleName path. What this scenario establishes is that the line-based blame baselines fail here while the issue texts
    succeed, not that the code is free of clues.
  current_schema_limitation: Issue descriptions are represented as graph metadata linked to bugs; the repository carries only
    the identifiers in the commit messages.
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC from the issue texts, or from equivalent non-line evidence.
  - Whether the nickname change c2 is rejected, although it is equivalent in behaviour and one commit closer to the fix.
  - Whether the deduplication c3, which every tested blame variant reaches, is rejected.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- 'Measured: git blame at BFC^ of the modified line reaches c3 under plain blame and under -w, -M and -C -C, never c1, so
  the generator prints GW703 for this scenario by design.'
- 'Issue context beyond the identifiers is scenario metadata: the repository carries ISSUE-401, ISSUE-377, ISSUE-510 and
  ISSUE-482 only as identifiers in the commit subjects. An external context interface is designed in issue #23.'
- A tool that reconstructs the call graph across c3 can also reach c1, because middleName called normalizeMiddleName before
  the deduplication. The scenario claims only that no line-based blame variant separates c1 from c2; see
  scenario_design.code_evidence_limitation.
- 'The two pre-deduplication predicates are equivalent by construction: value.trim().isEmpty() and value.trim().length() == 0
  agree on every input. An earlier revision spelled c2 with value.isBlank(), which is NOT equivalent to a trim-based test
  (they disagree on U+0000, U+2003 and U+3000), so the deduplication silently changed the nickname contract.'
context:
  required_files:
  - src/main/java/example/CsvContactImporter.java
  ambiguous_code_context: The deduplication deleted the middle-name line and the nickname line in the same patch and replaced
    them with one differently written body, so the line history of the modified line reaches both candidates and no blame
    variant separates them. The call graph before the deduplication still links middleName to c1, which is recorded in
    scenario_design.code_evidence_limitation.
issues:
- id: ISSUE-482
  title: Blank middle names are exported as null after CSV import
  description: Contacts imported from CSV should preserve a blank middle_name column as an empty string. Exports started to
    contain null for those contacts after the release in which the optional-column contract was applied. The same contract
    was applied to the nickname column on purpose and must stay as it is.
  linked_bugs:
  - B001
  referenced_commits:
  - c1
  excludes_commits:
  - c2
  - c3
- id: ISSUE-401
  title: Store a blank middle_name column as null
  description: The importer API docs say that an optional column that is absent or blank is stored as null. The middle_name
    column still stores an empty string instead.
  referenced_commits:
  - c1
- id: ISSUE-377
  title: Store a blank nickname column as null
  description: The nickname column is optional and should follow the same contract as every other optional column, so an
    absent or blank value is stored as null.
  referenced_commits:
  - c2
- id: ISSUE-510
  title: Remove the duplicated optional-column normalizers
  description: The importer carries one private normalizer per optional column and they have drifted apart in wording. Share
    a single normalizer instead.
  referenced_commits:
  - c3
