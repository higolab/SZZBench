schema_version: graph-0.1-draft
meta:
  id: SZZG-0102
  title: Issue description required
  slug: issue-description
  description: Evaluates a case where the issue identifier in the fix message and the issue text behind it are needed to
    distinguish the true BIC from nearby importer cleanups that line-based blame reaches.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - issues
  - context
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0102-issue-description
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create the CSV contact importer
    c1: store missing optional columns as null
    c2: strip the spaces from imported postal codes
    c3: move the field normalizers into a nested helper
    c4: restore empty strings for blank middle names, referencing the issue
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the CSV contact importer'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/CsvContactImporter.java
    content: |
      package example;

      public class CsvContactImporter {
        public String middleName(String[] row) {
          return normalizeOptional(row[1]);
        }

        public String postalCode(String[] row) {
          return row[2].trim();
        }

        private String normalizeOptional(String value) {
          return value == null ? "" : value.trim();
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Store missing optional contact columns as null'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: 'return value == null ? "" : value.trim();'
    new: 'return value == null || value.trim().isEmpty() ? null : value.trim();'
- id: c2
  branch: main
  parents:
  - c1
  message: 'ISSUE-377 strip the spaces from imported postal codes'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: return row[2].trim();
    new: return row[2].replace(" ", "").trim();
- id: c3
  branch: main
  parents:
  - c2
  message: 'ISSUE-510 group the CSV field normalizers in a nested helper'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: return normalizeOptional(row[1]);
    new: return Fields.normalizeOptional(row[1]);
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: |-
      private String normalizeOptional(String value) {
          return value == null || value.trim().isEmpty() ? null : value.trim();
        }
    new: |-
      private static final class Fields {
          static String normalizeOptional(String value) {
            return value == null || value.trim().isEmpty() ? null : value.trim();
          }
        }
- id: c4
  branch: main
  parents:
  - c3
  message: 'ISSUE-482 keep blank middle names as empty strings'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: 'return value == null || value.trim().isEmpty() ? null : value.trim();'
    new: 'return value == null ? "" : value.trim();'
bugs:
- id: B001
  title: Blank middle names are imported as null instead of empty strings
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/CsvContactImporter.java
    statement: 'return value == null || value.trim().isEmpty() ? null : value.trim();'
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/CsvContactImporter.java
    statement: 'return value == null ? "" : value.trim();'
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    related_but_not_correct:
    - c2
    - c3
scenario_design:
  purpose: Evaluate whether SZZ can use the issue identifier carried by the fix message, and the issue text behind it, to
    choose the optional-name normalization BIC over the importer cleanups that line-based blame reaches.
  key_property: |
    c3 moves the normalization helper into a nested class, which changes the indentation of the faulty line without changing
    its text or its behaviour, so git blame at BFC^ attributes that line to c3. The BFC message carries ISSUE-482, so a
    Git-only tool can find the issue at all; the issue text says that blank optional values started to be stored as null,
    which only the message of c1 claims. The neighbouring commits carry their own, different issue identifiers
    (ISSUE-377, ISSUE-510).
  current_schema_limitation: Issue descriptions are represented as graph metadata linked to bugs; the repository carries only
    the identifiers in the commit messages.
  required_extensions_from_source: 'This scenario uses factors: issues, context; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC.
  - Whether the issue text rules out the postal-code cleanup c2 and the helper restructuring c3 that blame reaches.
  - Whether the BFC is interpreted as restoring an empty-string contract for optional middle names.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
- 'Measured: git blame at BFC^ of the deleted line reaches c3, not c1, so the generator prints GW703 for this scenario by
  design.'
- 'Issue context beyond the identifier is scenario metadata: the repository carries ISSUE-482 only in the BFC message. An
  external context interface is designed in issue #23.'
issues:
- id: ISSUE-482
  title: Blank middle names are exported as null after CSV import
  description: Contacts imported from CSV should preserve a blank middle_name column as an empty string. Exports started to
    contain null for those contacts after the release in which blank optional columns began to be stored as null. The
    postal-code whitespace cleanup shipped in the same release is a separate change and does not touch optional names.
  linked_bugs:
  - B001
  referenced_commits:
  - c1
  excludes_commits:
  - c2
  - c3
