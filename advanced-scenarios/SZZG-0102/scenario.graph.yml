schema_version: graph-1.0
meta:
  id: SZZG-0102
  title: Issue text names the regressed column
  slug: issue-description
  description: Evaluates a case where two commits give the same new contract to two duplicated normalizers and a later
    commit deduplicates them, deleting both changed lines. Every tested blame baseline stops at the deduplication, and the
    commit subjects carry only issue identifiers, so the text behind the identifiers is what names the column that
    regressed. A tool that reconstructs the call graph across the deduplication can reach the same answer from code.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - issue-evidence
  - context
  difficulty: hard
  status: active
  tier: control
repository:
  name: SZZG-0102-issue-description
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: |
    c0: create the CSV contact importer with two duplicated optional-column normalizers
    c1: store blank middle names as null (ISSUE-401)
    c2: store blank nicknames as null in the same shape (ISSUE-377)
    c3: deduplicate the two normalizers, deleting both changed lines (ISSUE-510)
    c4: restore the empty-string contract for middle names (ISSUE-482)
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the CSV contact importer'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/CsvContactImporter.java
    content: |
      package example;

      public class CsvContactImporter {
        public String middleName(String[] row) {
          return normalizeMiddleName(row[1]);
        }

        public String nickname(String[] row) {
          return normalizeNickname(row[2]);
        }

        private String normalizeMiddleName(String value) {
          return value == null ? "" : value.trim();
        }

        private String normalizeNickname(String value) {
          return value == null ? "" : value.trim();
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'ISSUE-401 follow the optional-column contract from the importer API docs'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: |-
      private String normalizeMiddleName(String value) {
          return value == null ? "" : value.trim();
        }
    new: |-
      private String normalizeMiddleName(String value) {
          return value == null || value.trim().isEmpty() ? null : value.trim();
        }
- id: c2
  branch: main
  parents:
  - c1
  message: 'ISSUE-377 apply the same optional-column contract to the profile fields'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: |-
      private String normalizeNickname(String value) {
          return value == null ? "" : value.trim();
        }
    new: |-
      private String normalizeNickname(String value) {
          return value == null || value.trim().length() == 0 ? null : value.trim();
        }
- id: c3
  branch: main
  parents:
  - c2
  message: 'ISSUE-510 share one optional-column normalizer between the importer fields'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: return normalizeMiddleName(row[1]);
    new: return normalizeOptional(row[1]);
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: return normalizeNickname(row[2]);
    new: return normalizeOptional(row[2]);
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: |-
      private String normalizeMiddleName(String value) {
          return value == null || value.trim().isEmpty() ? null : value.trim();
        }

        private String normalizeNickname(String value) {
          return value == null || value.trim().length() == 0 ? null : value.trim();
        }
    new: |-
      private String normalizeOptional(String value) {
          String trimmed = value == null ? "" : value.trim();
          return trimmed.isEmpty() ? null : trimmed;
        }
- id: c4
  branch: main
  parents:
  - c3
  message: 'ISSUE-482 keep blank middle names as empty strings'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/CsvContactImporter.java
    old: return normalizeOptional(row[1]);
    new: |-
      String middle = normalizeOptional(row[1]);
          return middle == null ? "" : middle;
