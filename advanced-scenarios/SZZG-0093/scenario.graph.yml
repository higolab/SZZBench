schema_version: graph-0.1-draft
meta:
  id: SZZG-0093
  title: BIC occurs during feature work
  slug: feature-bic
  description: A feature work item consists of multiple commits. The feature starts correctly, the BIC occurs in the middle
    of the work item, and a later commit in the same work item expands code that depends on the buggy method.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - work-item
  - feature-work
  - bic-inside-work-item
  - commit-series
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0093-feature-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create base range filter

    c1: start feature work by adding feature metadata without introducing a bug

    c2: implement feature logic and introduce boundary bug during the work item

    c3: continue the same feature work by adding a caller that uses the buggy logic

    c4: fix the boundary bug after the feature work'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Create base range filter'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RangeFilter.java
    content: "package example;\n\npublic class RangeFilter {\n  public boolean contains(int value, int min, int max) {\n \
      \   return value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'WI-001 start the range filtering feature'
  role: feature_work
  work_item: WI-001
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: "package example;\n\npublic class RangeFilter {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
    new: "package example;\n\npublic class RangeFilter {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n\n  public String featureName() {\n    return \"range-filter\";\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'WI-001 filter values strictly inside the range'
  role: bug_introducing
  work_item: WI-001
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'WI-001 add the caller for range filtering'
  role: feature_work
  work_item: WI-001
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: "package example;\n\npublic class RangeFilter {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n\n  public String featureName() {\n    return \"range-filter\";\n  }\n}\n"
    new: "package example;\n\npublic class RangeFilter {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n\n  public String featureName() {\n    return \"range-filter\";\n  }\n\n  public\
      \ boolean acceptsUserInput(int value) {\n    return contains(value, 0, 100);\n  }\n}\n"
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the range bounds after the feature work'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeFilter.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Boundary bug introduced during feature work
  bug_introducing_commits:
  - commit: c2
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c2
    file: src/main/java/example/RangeFilter.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/RangeFilter.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  work_item: WI-001
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c2
    related_but_not_correct:
    - c1
    - c3
    notes: The BIC occurs in the middle of WI-001. c1 starts the feature and c3 continues it, but neither is the BIC.
scenario_design:
  purpose: Evaluate whether SZZ identifies the specific BIC inside a multi-commit feature work item rather than blaming the
    whole work item or a neighboring commit.
  key_property: c1, c2, and c3 belong to the same feature work item, but only c2 introduces the bug.
  evaluation_points:
  - Whether SZZ identifies c2 as the BIC.
  - Whether neighboring work-item commits c1 and c3 are avoided as false positives.
  - Whether work-item metadata can be used without collapsing all commits in the work item into one cause.
notes:
- This revision makes the work-item structure explicit through the top-level work_items section and per-commit work_item fields.
- c1 and c3 are related feature-work commits but are not the BIC.
- The expected BIC is c2.
work_items:
- id: WI-001
  title: Add range filtering feature
  commits:
  - c1
  - c2
  - c3
  bug_introducing_commit: c2
  description: The BIC occurs in the middle of a multi-commit feature work item.
