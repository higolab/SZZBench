scenario_design:
  purpose: >-
    Evaluate a revert-of-revert BFC that is a real git revert of the BIC, applied with conflict resolution
    after an intervening commit rewrote the reverted lines.
  key_property: >-
    c3 and c5 are real git reverts (their bodies carry "This reverts commit <hash>."). c4 renames the two
    helper variables on exactly the lines c3 reverted, so git revert c3 conflicts and c5's resolution keeps
    c4's names while restoring the inclusive bounds. Measured on the generated snapshots: contains(0, 0, 10)
    and contains(10, 0, 10) are true at c0, false at c1, true at c2, false at c3 and c4, true at c5; the two
    lines c5 deletes were last written by c4, so blame on them returns c4, a related-but-not-correct commit,
    and the declared fault lines are no longer present at c5^ (GI701 by the variable-rename factor).
  difference_from_existing_revert_scenarios: This scenario isolates a double-revert or revert-derived complication beyond
    the existing partial revert and reintroduction scenarios.
  evaluation_points:
  - Whether SZZ reports c3.
  - Whether the intermediate c4 is not selected.
notes:
- >-
  Until 2026-09-22 the two reverts were prose subjects with hand-written operations (GitHub issue 22); they
  are now produced by git revert, and c5's conflict with c4 is real.
- The direct BIC is the commit that reintroduces the bug in the history observed from the BFC.
