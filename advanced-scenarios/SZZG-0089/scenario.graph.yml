  tier: control
repository:
  name: SZZG-0089-revert-of-revert-with-conflict-resolution
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce boundary bug

    c2: fix boundary bug

    c3: git revert of c2, reintroducing the boundary bug

    c4: rename the bound checks on the reverted lines and add a description

    c5: git revert of c3, conflicting with c4 and resolved by hand'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value >= min;\n    boolean belowMax = value <= max;\n    return aboveMin && belowMax;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make both helpers strict'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept both bounds again'
  role: prior_fix
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Revert "Accept both bounds again"'
  role: bug_introducing
  revert_of: c2
- id: c4
  branch: main
  parents:
  - c3
  message: 'Name the bound checks after what they check and add a description'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ lowerOk = value > min;\n    boolean upperOk = value < max;\n    return lowerOk && upperOk;\n  }\n\n  public String\
      \ description() {\n    return \"exclusive range\";\n  }\n}\n"
- id: c5
  branch: main
  parents:
  - c4
  message: 'Revert "Revert "Accept both bounds again""'
  role: bug_fixing
  revert_of: c3
  resolution:
    src/main/java/example/Range.java: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min,\
      \ int max) {\n    boolean lowerOk = value >= min;\n    boolean upperOk = value <= max;\n    return lowerOk && upperOk;\n\
      \  }\n\n  public String description() {\n    return \"inclusive range\";\n  }\n}\n"
