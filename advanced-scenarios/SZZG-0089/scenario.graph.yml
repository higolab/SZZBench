  title: Revert of revert with conflict resolution
  slug: revert-of-revert-with-conflict-resolution
  description: A revert-of-revert fixes a reintroduced bug while resolving conflicts caused by intervening changes.
  category: "Revert-specific reintroduction"
  category_code: "G6"
