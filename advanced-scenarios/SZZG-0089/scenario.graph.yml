repository:
  name: SZZG-0089-revert-of-revert-with-conflict-resolution
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce boundary bug

    c2: fix boundary bug

    c3: revert c2 and reintroduce boundary bug

    c4: add description before resolving revert conflict

    c5: revert c3 with conflict resolution and restore boundary fix'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value >= min;\n    boolean belowMax = value <= max;\n    return aboveMin && belowMax;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make both helpers strict'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept both bounds again'
  role: prior_fix
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Revert the bounds change'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
    new: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
  reverts: c2
- id: c4
  branch: main
  parents:
  - c3
  message: 'Add a range description method'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value > min;\n    boolean belowMax = value < max;\n    return aboveMin && belowMax;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value > min;\n    boolean belowMax = value < max;\n    return aboveMin && belowMax;\n  }\n\n  public String\
      \ description() {\n    return \"exclusive range after revert\";\n  }\n}\n"
- id: c5
  branch: main
  parents:
  - c4
  message: 'Restore the inclusive bounds after the revert'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
  reverts: c3
  revert_conflict_resolution: true
bugs:
- id: B001
  title: Boundary bug fixed by conflict-resolved revert of revert
  bug_introducing_commits:
  - commit: c3
    role: direct
  - commit: c1
    role: origin
  bug_fixing_commits:
