schema_version: graph-1.0
meta:
  id: SZZG-0115
  title: Top-k evaluation
  slug: top-k-evaluation
  description: >-
    Two distractor commits sit between the fault and the fix, and the oracle is scored with a top-k policy rather
    than an exact set.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - evaluation-variant
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0115-top-k-evaluation
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file src/main/java/example/RangeService.java)

    c1: introduce bug (replace src/main/java/example/RangeService.java)

    c2: add distractor change (replace src/main/java/example/RangeService.java)

    c3: add distractor change (write_file docs/range-service-notes.md)

    c4: fix bug (replace src/main/java/example/RangeService.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range service'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RangeService.java
    content: "package example;\n\npublic class RangeService {\n  public boolean isEnabled() { return true; }\n  public boolean\
      \ contains(int value, int min, int max) { return value >= min && value <= max; }\n  public int normalize(int value)\
      \ { return value; }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Read the enabled flag from a system property'
  role: distractor
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: public boolean isEnabled() { return true; }
    new: public boolean isEnabled() { return Boolean.parseBoolean(System.getProperty("range.enabled", "true")); }
- id: c3
  branch: main
  parents:
  - c2
  message: 'Document the range service configuration'
  role: distractor
  operations:
  - type: write_file
    path: docs/range-service-notes.md
    content: 'Notes on the range service configuration.

      '
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Top-k evaluation with distractor commits
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/RangeService.java
    statement: return value > min && value < max;
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/RangeService.java
    statement: return value >= min && value <= max;
expected_szz:
  commit_level:
    evaluation_policy: top_k
    k_values:
    - 1
    - 3
    - 5
    relevant:
    - c1
scenario_design:
  purpose: >-
    Evaluate a top-k oracle: whether the bug-introducing commit is ranked above the distractors rather than returned
    alone.
