schema_version: graph-1.0
meta:
  id: SZZG-0104
  title: Configuration BIC is fixed by code-side normalization
  slug: config-bic-fixed-in-code
  description: >-
    The API client reads api.host from app.properties and hands it to Endpoint.url. The fault is a trailing slash
    added to that property, which makes every URL the client builds contain a doubled slash; the fix normalises the
    value in Java, so the bug-fixing commit opens no file the fault touched.
  category: "Issue, message, context, and non-local evidence"
  category_code: "G7"
  factors:
  - configuration-change
  - cross-artifact-fix
  - caller-callee
  difficulty: hard
  status: active
  tier: control
  defeats: [blame, shape]
repository:
  name: SZZG-0104-config-bic-fixed-in-code
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create endpoint resolver and config

    c1: introduce trailing slash in configuration

    c2: fix endpoint construction in code'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the endpoint resolver, the API client and their configuration'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Endpoint.java
    content: "package example;\npublic class Endpoint {\n  public String url(String host) {\n    return host + \"/api\";\n\
      \  }\n\n}\n"
  - type: write_file
    path: src/main/resources/app.properties
    content: 'api.host=https://example.com

      '
  - type: write_file
    path: src/main/java/example/AppConfig.java
    content: |
      package example;

      import java.io.IOException;
      import java.io.InputStream;
      import java.util.Properties;

      public class AppConfig {
          private final Properties properties = new Properties();

          public AppConfig() {
              try (InputStream in = AppConfig.class.getResourceAsStream("/app.properties")) {
                  if (in == null) {
                      throw new IllegalStateException("app.properties is missing from the classpath");
                  }
                  properties.load(in);
              } catch (IOException e) {
                  throw new IllegalStateException("cannot read app.properties", e);
              }
          }

          public String apiHost() {
              return properties.getProperty("api.host");
          }
      }
  - type: write_file
    path: src/main/java/example/ApiClient.java
    content: |
      package example;

      public class ApiClient {
          private final AppConfig config = new AppConfig();
          private final Endpoint endpoint = new Endpoint();

          public String apiUrl() {
              return endpoint.url(config.apiHost());
          }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Add a trailing slash to the API host'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/resources/app.properties
    old: api.host=https://example.com
    new: api.host=https://example.com/
- id: c2
  branch: main
  parents:
  - c1
  message: 'Strip trailing slashes when building the endpoint URL'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Endpoint.java
    old: return host + "/api";
    new: return host.replaceAll("/+$", "") + "/api";
bugs:
- id: B001
  title: The endpoint URL contains a doubled slash
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/resources/app.properties
    statement: api.host=https://example.com/
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Endpoint.java
    statement: return host.replaceAll("/+$", "") + "/api";
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: >
    Evaluate whether a method reaches a fault in a configuration file from a fix that only changes code. The
    configuration is really consumed: AppConfig loads app.properties from the classpath and ApiClient passes
    api.host to Endpoint.url, so the trailing slash c1 adds is what the doubled slash in c2's fix is about.
  key_property: >
    Measured on the generated snapshots: ApiClient.apiUrl() is https://example.com/api at c0,
    https://example.com//api at c1 and https://example.com/api again at c2. The fix deletes a line of
    Endpoint.java that c0 wrote, so blaming it returns c0; nothing the fix touches was written by c1.
  evaluation_points:
  - Whether SZZ reaches a commit that changed only a properties file from a fix that changed only Java.
  - Whether the fix's deleted line (owned by c0) is mistaken for the answer.
  failure_mode: >-
    A tool fails here when it stays in the Java file the fix touched: blame points at `c0`, and the fault is
    `c1`'s change to the properties file the code reads.
notes:
- >-
  Until 2026-09-21 no code read api.host, so the declared BIC could not cause the fault the BFC fixed
  (issue #23). tests/test_twins_and_transitions.py runs ApiClient.apiUrl() at every commit.
