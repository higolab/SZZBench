schema_version: graph-0.1-draft
meta:
  id: SZZG-0091
  title: Multiple BICs with partial revert reintroducing one fault
  slug: multiple-bics-with-partial-revert-reintroducing-one-fault
  description: Two original BICs are fixed together, but a later partial revert reintroduces only one fault.
  category: "Revert-specific reintroduction"
  category_code: "G6"
  factors:
  - revert
  - partial_revert
  - multiple_bic
  - single_fault_reintroduced
  - re_bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0091-multiple-bics-with-partial-revert-reintroducing-one-fault
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    c1: introduce lower-bound bug

    c2: introduce upper-bound bug

    c3: fix both boundary bugs

    c4: partially revert fix for upper boundary only

    c5: fix reintroduced upper-bound bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    boolean\
      \ aboveMin = value >= min;\n    boolean belowMax = value <= max;\n    return aboveMin && belowMax;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Exclude the minimum from aboveMin()'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: boolean aboveMin = value >= min;
    new: boolean aboveMin = value > min;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Exclude the maximum from belowMax()'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: boolean belowMax = value <= max;
    new: boolean belowMax = value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Accept both bounds again'
  role: prior_fix
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "boolean aboveMin = value > min;\n    boolean belowMax = value < max;"
    new: "boolean aboveMin = value >= min;\n    boolean belowMax = value <= max;"
- id: c4
  branch: main
  parents:
  - c3
  message: 'Revert the upper-bound change'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: boolean belowMax = value <= max;
    new: boolean belowMax = value < max;
  reverts: part_of_c3
- id: c5
  branch: main
  parents:
  - c4
  message: 'Include the maximum again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: boolean belowMax = value < max;
    new: boolean belowMax = value <= max;
bugs:
- id: B001
  title: Upper-bound fault reintroduced after multiple-BIC fix
  bug_introducing_commits:
  - commit: c4
    role: direct
  - commit: c2
    role: origin
  bug_fixing_commits:
  - commit: c5
    role: complete_fix
  faults:
  - id: F001
    commit: c4
    file: src/main/java/example/Range.java
    statement: boolean belowMax = value < max;
    change_type: partial_revert_upper_boundary
  fixes:
  - id: X001
    commit: c5
    file: src/main/java/example/Range.java
    statement: boolean belowMax = value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c4
    related_but_not_correct:
    - c1
    - c2
    - c3
    notes: The final BFC targets only the fault reintroduced by c4; original BICs are related history.
scenario_design:
  purpose: Evaluate multiple original BICs when a later partial revert reintroduces only one of them.
  key_property: The direct BIC for the final fix is the partial revert, not the older original BIC set.
  difference_from_existing_revert_scenarios: This scenario isolates a double-revert or revert-derived complication beyond
    the existing partial revert and reintroduction scenarios.
  evaluation_points:
  - Whether SZZ reports c4.
  - Whether SZZ avoids reporting both old BICs as exact direct answers.
notes:
- This scenario models revert-related development history for SZZ evaluation.
- The direct BIC is the commit that reintroduces the bug in the history observed from the BFC.
