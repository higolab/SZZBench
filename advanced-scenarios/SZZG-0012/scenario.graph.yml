schema_version: graph-1.0
meta:
  id: SZZG-0012
  title: BFC performs method extraction and bug fix in the same commit
  slug: bfc-extract-method-and-fix
  description: >-
    The bug-fixing commit extracts a helper and changes the rounding in one commit, so its diff mixes a refactoring
    with the repair.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - bfc-refactoring
  - extract-method
  - mixed-bfc
  difficulty: easy
  status: active
  tier: control
repository:
  name: SZZG-0012-bfc-extract-method-and-fix
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create tax calculator

    c1: introduce tax rounding bug

    c2: extract tax rate helper and fix rounding'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the tax calculator'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Tax.java
    content: "package example;\npublic class Tax {\n  public int tax(int price) {\n    return price / 10;\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Round the tax up to the next unit'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Tax.java
    old: return price / 10;
    new: return (price + 9) / 10;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Extract the tax rate helper and round down'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Tax.java
    old: return (price + 9) / 10;
    new: return rate(price);
  - type: insert_after
    path: src/main/java/example/Tax.java
    anchor: "    return rate(price);\n  }\n\n"
    content: "  private int rate(int price) {\n    return price / 10;\n  }\n"
bugs:
- id: B001
  title: The tax is rounded up instead of down
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Tax.java
    statement: return (price + 9) / 10;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Tax.java
    statement: return price / 10;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether a method copes with a fix whose diff mixes a method extraction with the repair.
