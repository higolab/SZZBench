schema_version: graph-1.0
meta:
  id: SZZG-0040
  title: Multiple BICs where one true BIC is not directly touched by the BFC
  slug: multi-bic-untouched-root-cause
  description: >-
    The fix inlines the retry limit and narrows the retry condition, so the commit that raised the limit is on no
    line the fix deletes.
  category: "Multiple BICs, multiple BFCs, and partial fixes"
  category_code: "G3"
  factors:
  - multi-bic
  - not-directly-touched-by-fix
  - context-dependent
  difficulty: advanced
  status: active
  tier: discriminating
repository:
  name: SZZG-0040-multi-bic-untouched-root-cause
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create retry policy

    c1: introduce excessive retry limit

    c2: introduce retry on client errors

    c3: fix retry condition without touching retry limit'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the retry policy'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RetryPolicy.java
    content: "package example;\npublic class RetryPolicy {\n  private int maxRetries() {\n    return 3;\n  }\n  public boolean\
      \ shouldRetry(int attempts, int status) {\n    return status >= 500 && attempts < maxRetries();\n  }\n\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Raise the retry limit to 10'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return 3;
    new: return 10;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Retry on client errors as well'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return status >= 500 && attempts < maxRetries();
    new: return status >= 400 && attempts < maxRetries();
- id: c3
  branch: main
  parents:
  - c2
  message: 'Retry only on server errors and inline the retry limit'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RetryPolicy.java
    old: return status >= 400 && attempts < maxRetries();
    new: return status >= 500 && attempts < 3;
bugs:
- id: B001
  title: Client errors are retried, and too many times
  bug_introducing_commits:
  - commit: c1
    role: direct
  - commit: c2
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/RetryPolicy.java
    statement: return 10;
    change_type: line_modification
  - id: F002
    commit: c2
    file: src/main/java/example/RetryPolicy.java
    statement: return status >= 400 && attempts < maxRetries();
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/RetryPolicy.java
    statement: return status >= 500 && attempts < 3;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    - c2
