graph:
  model: commit_dag
  history_summary: c0 correct / c1 excludes both boundaries / c2 fixes lower only / c3 fixes upper too
commits:
- id: c0
  branch: main
  parents: []
  message: Initial correct inclusive range implementation
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value >= min && value\
      \ <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Introduce boundary bug on both sides
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Partial fix: restore lower boundary only'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Complete fix: restore upper boundary'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value < max;
    new: return value >= min && value <= max;
