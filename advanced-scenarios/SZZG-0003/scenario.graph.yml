scenario_design:
  purpose: 1回目の BFC ではバグを完全には修正せず、後続 commit で完全修正される場合を評価する。
  current_schema_limitation: 現状では `bug_fixing_commit` が単数であり、partial fix / complete fix の区別ができない。
  required_extensions_from_source: "```yaml\nbug_fixing_commits:\n  - commit: \"c2\"\n    role: \"partial_fix\"\n  - commit: \"c3\"\n    role:\
    \ \"complete_fix\"\n```"
  evaluation_points:
  - BFC をどの commit と見なすかで BIC 推定結果が変わるか
  - partial fix を起点にすると BIC を過小・過大推定しないか
  - 複数 BFC を入力できる SZZ 実装が有利か
