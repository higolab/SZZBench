  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: introduce range bug on feature

    f2: copy buggy range logic

    r1: rebase original bug

    r2: rebase copied buggy logic

    c3: fix copied range logic'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial correct implementation'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'f1: introduce range bug on feature'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: f2
  branch: feature
  parents:
  - f1
  message: 'f2: copy buggy range logic'
  role: origin_bug_propagating
  operations:
  - type: write_file
    path: src/main/java/example/RangeCopy.java
    content: "package example;\n\npublic class RangeCopy {\n  public boolean containsCopy(int value, int min, int max) {\n\
      \    return value > min && value < max;\n  }\n}\n"
- id: r1
  branch: main
  parents:
  - c0
  message: 'r1: rebase original bug'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
  rebase_of: f1
- id: r2
  branch: main
  parents:
  - r1
  message: 'r2: rebase copied buggy logic'
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/RangeCopy.java
    content: "package example;\n\npublic class RangeCopy {\n  public boolean containsCopy(int value, int min, int max) {\n\
      \    return value > min && value < max;\n  }\n}\n"
  rebase_of: f2
- id: c3
  branch: main
  parents:
  - r2
  message: 'c3: fix copied range logic'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeCopy.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
