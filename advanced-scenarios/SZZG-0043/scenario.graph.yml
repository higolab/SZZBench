commits:
- id: c0
  branch: main
  parents: []
  message: Initial correct range
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value >= min && value\
      \ <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: Introduce boundary bug
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: Add failing boundary test
  role: test_added
  operations:
  - type: write_file
    path: src/test/java/example/RangeTest.java
    content: 'package example;

      // expected: boundary values must be accepted

      '
- id: c3
  branch: main
  parents:
  - c2
  message: Partial fix lower boundary
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value < max;
- id: c4
  branch: main
  parents:
  - c3
  message: Final fix upper boundary
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value < max;
    new: return value >= min && value <= max;
