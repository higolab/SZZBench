schema_version: graph-1.0
meta:
  id: SZZG-0043
  title: BIC on feature branch, BFC on main
  slug: bic-on-feature-branch-bfc-on-main
  description: A feature branch introduces a bug, extends feature code that depends on the buggy method, is merged into main,
    and is then fixed by a normal main-branch commit.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - merge
  - feature-branch-bic
  - main-branch-bfc
  difficulty: easy
  status: active
  tier: control
  defeats: [shape]
repository:
  name: SZZG-0043-bic-on-feature-branch-bfc-on-main
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation on main

    c1: introduce bug on feature branch

    c2: extend feature branch code that uses the buggy method

    c3: merge feature branch into main

    c4: fix bug on main after merge'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: feature
  parents:
  - c1
  message: 'Add a feature-specific range wrapper'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ > min && value < max;\n  }\n\n  public boolean containsForFeature(int value, int min, int max) {\n    return contains(value,\
      \ min, max);\n  }\n}\n"
- id: c3
  branch: main
  parents:
  - c0
  - c2
  message: 'Merge the feature branch into main'
  role: merge
  operations: []
- id: c4
  branch: main
  parents:
  - c3
  message: 'Accept the range bounds again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Feature branch BIC fixed on main
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ can identify a BIC located on a feature branch when the BFC is a normal commit on main after
    the feature branch has been merged.
  key_property: The BIC occurs on feature, while the BFC occurs on main after merge.
  evaluation_points:
  - Feature-branch BIC
  - Normal main-branch BFC
  - Intermediate feature code uses the buggy method before merge.
  failure_mode: >-
    A tool fails here when it stops at the merge that brought the feature branch in, or at the main-line
    commit that extended the buggy method, instead of following the line into the feature branch to `c1`.
notes:
- This scenario is intentionally distinct from SZZG-0046 and SZZG-0042 because the BFC is not a merge commit.
