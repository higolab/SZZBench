  current_schema_limitation: fix series を1つの単位として表現できない。
  required_extensions_from_source: "```yaml\nfix_series:\n  - id: \"FIX-B001\"\n    commits:\n      - \"c2\"\n      - \"c3\"\n      - \"c4\"\n\
    ```"
  evaluation_points:
