schema_version: graph-0.1-draft
meta:
  id: SZZG-0107
  title: BFC includes generated files
  slug: bfc-generated-file
  description: Evaluates a bug-fixing commit that fixes source code while also updating generated artifacts in the same commit.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - generated-files
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0107-bfc-generated-file
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create correct range implementation

    c1: introduce exclusive-boundary bug

    c2: fix range bug and update generated boundary table'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;
      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Accept the range bounds and regenerate the boundary table'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
  - type: write_generated_text_file
    path: build/generated/range-boundary-table.txt
    lines: 5
    template: boundary-case-${line}=generated
bugs:
- id: B001
  title: Boundary bug fixed alongside generated file updates
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ identifies the source BIC when the BFC contains both the real source fix and generated-file noise.
  current_schema_limitation: The generated artifact in the BFC is represented explicitly with graph operations.
  required_extensions_from_source: 'This scenario uses factors: generated_files; operations: write_file, replace, write_generated_text_file.'
  evaluation_points:
  - Whether SZZ identifies c1 as the BIC.
  - Whether generated files added or refreshed in the BFC are ignored as blame targets.
  - Whether the expected_szz exact-set policy is applied correctly.
notes:
- The generated file is intentionally changed only in the BFC.
- The source fix remains in src/main/java/example/Range.java.
