commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the lower and upper acceptance helpers'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean acceptsLower(int value, int min) {\n    return value\
      \ >= min;\n  }\n\n  public boolean acceptsUpper(int value, int max) {\n    return value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Require values strictly inside both bounds'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min;
    new: return value > min;
  - type: replace
    path: src/main/java/example/Range.java
    old: return value <= max;
    new: return value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'Allow a value equal to the minimum'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min;
    new: return value >= min;
- id: c3
  branch: main
  parents:
  - c2
  message: 'Allow a value equal to the maximum'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value < max;
    new: return value <= max;
