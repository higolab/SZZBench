schema_version: graph-0.1-draft
meta:
  id: SZZG-0024
  title: Clone diverges before rebase
  slug: clone-diverges-before-rebase
  description: A cloned buggy implementation diverges on feature and is replayed by rebase.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - branch
  - rebase
  - copy-propagation
  - clone-divergence
  - direct-bic
  - origin-bic
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0024-clone-diverges-before-rebase
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: create buggy clone

    f2: diverge cloned buggy logic

    r1: rebase buggy clone creation

    r2: rebase clone divergence

    c4: fix diverged clone'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Add the cloned range check'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/RangeClone.java
    content: "package example;\n\npublic class RangeClone {\n  public boolean containsClone(int value, int min, int max) {\n\
      \    return value > min && value < max;\n  }\n}\n"
- id: f2
  branch: feature
  parents:
  - f1
  message: 'Annotate the cloned range logic'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RangeClone.java
    old: return value > min && value < max;
    new: return value > min && value < max; // cloned logic
- id: r1
  branch: main
  parents:
  - c0
  message: 'Add the cloned range check'
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/RangeClone.java
    content: "package example;\n\npublic class RangeClone {\n  public boolean containsClone(int value, int min, int max) {\n\
      \    return value > min && value < max;\n  }\n}\n"
  rebase_of: f1
- id: r2
  branch: main
  parents:
  - r1
  message: 'Annotate the cloned range logic'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/RangeClone.java
    old: return value > min && value < max;
    new: return value > min && value < max; // cloned logic
  rebase_of: f2
- id: c4
  branch: main
  parents:
  - r2
  message: 'Accept the range bounds in the clone'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeClone.java
    old: return value > min && value < max; // cloned logic
    new: return value >= min && value <= max; // cloned logic, reviewed
bugs:
- id: B001
  title: Diverged clone bug introduced by rebase
  bug_introducing_commits:
  - commit: r1
    role: direct
    description: Replays the faulty clone into main's history, where the fix lives.
  - commit: f1
    role: origin
    description: The feature-branch commit the clone was replayed from.
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/RangeClone.java
    statement: return value > min && value < max;
    change_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/RangeClone.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/RangeClone.java
    statement: return value >= min && value <= max; // cloned logic, reviewed
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_origins:
    - f1
    related_but_not_correct:
    - r2
    - f2
    notes: >
      r1 replays the faulty clone into the history the fix belongs to, so it is
      the direct BIC (contract D4). r2 and f2 only append a comment to that
      line and change no behaviour - measured, 0 of 27648 probe answers move
      across r2 - so they are never BICs (D5). f1 is the commit the clone was
      replayed from and is therefore the origin (D2).
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      related_but_not_correct:
      - r2
      - f2
scenario_design:
  purpose: Evaluate rebase combined with clone divergence.
  key_property: >
    The fixed instance is the cloned line that r1 replayed into main. r2's
    rebased annotation is the last commit to touch that line, so a method that
    reports the last textual touch answers r2 and is wrong.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1, not the annotation commit r2 that last touched the line.
  - Whether the replayed commit rather than its feature-branch source is reported.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
