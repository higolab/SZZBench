    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'f1: create buggy clone'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/RangeClone.java
    content: "package example;\n\npublic class RangeClone {\n  public boolean containsClone(int value, int min, int max) {\n\
      \    return value > min && value < max;\n  }\n}\n"
- id: f2
  branch: feature
  parents:
  - f1
  message: 'f2: diverge cloned buggy logic'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RangeClone.java
    old: return value > min && value < max;
    new: return value > min && value < max; // cloned logic
- id: r1
  branch: main
  parents:
  - c0
  message: 'r1: rebase buggy clone creation'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/RangeClone.java
    content: "package example;\n\npublic class RangeClone {\n  public boolean containsClone(int value, int min, int max) {\n\
      \    return value > min && value < max;\n  }\n}\n"
  rebase_of: f1
- id: r2
  branch: main
  parents:
  - r1
  message: 'r2: rebase clone divergence'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RangeClone.java
    old: return value > min && value < max;
    new: return value > min && value < max; // cloned logic
  rebase_of: f2
- id: c4
  branch: main
  parents:
  - r2
  message: 'c4: fix diverged clone'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeClone.java
    old: return value > min && value < max; // cloned logic
    new: return value >= min && value <= max; // fixed cloned logic
