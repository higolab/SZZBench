schema_version: graph-1.0
meta:
  id: SZZG-0024
  title: Clone diverges before rebase
  slug: clone-diverges-before-rebase
  description: >
    A cloned buggy implementation diverges on feature and is replayed by rebase. The clone divides before it
    multiplies — `cents / 100 * percent` truncates to a multiple of the percentage — where the original
    multiplies first, in long so that the intermediate product cannot overflow.
  category: "Clone, copy propagation, and origin-vs-direct BIC"
  category_code: "G2"
  factors:
  - branch
  - rebase
  - copy-propagation
  - clone-divergence
  - direct-bic
  - origin-bic
  - wrong-operator
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0024-clone-diverges-before-rebase
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add Rate.percentOf (multiply, then divide)

    f1: add RateClone with a divide-first copy (origin)

    f2: annotate the cloned line (comment only)

    r1: rebase the clone creation (direct BIC)

    r2: rebase the annotation

    c4: multiply before dividing in the clone (fix)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the percentage helper'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Rate.java
    content: "package example;\n\npublic class Rate {\n  /** {@code percent} percent of {@code cents}, in whole cents. */\n  public int percentOf(int cents, int percent) {\n\
      \    return (int) ((long) cents * percent / 100);\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Add the cloned percentage helper'
  role: origin_bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/RateClone.java
    content: "package example;\n\npublic class RateClone {\n  /** {@code percent} percent of {@code cents}, in whole cents. */\n  public int percentOfClone(int cents, int percent) {\n\
      \    return cents / 100 * percent;\n  }\n}\n"
- id: f2
  branch: feature
  parents:
  - f1
  message: 'Annotate the cloned percentage logic'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RateClone.java
    old: return cents / 100 * percent;
    new: return cents / 100 * percent; // cloned logic
- id: r1
  branch: main
  parents:
  - c0
  message: 'Add the cloned percentage helper'
  role: bug_introducing
  operations:
  - type: write_file
    path: src/main/java/example/RateClone.java
    content: "package example;\n\npublic class RateClone {\n  /** {@code percent} percent of {@code cents}, in whole cents. */\n  public int percentOfClone(int cents, int percent) {\n\
      \    return cents / 100 * percent;\n  }\n}\n"
  rebase_of: f1
- id: r2
  branch: main
  parents:
  - r1
  message: 'Annotate the cloned percentage logic'
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/RateClone.java
    old: return cents / 100 * percent;
    new: return cents / 100 * percent; // cloned logic
  rebase_of: f2
- id: c4
  branch: main
  parents:
  - r2
  message: 'Multiply before dividing in the cloned percentage helper'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RateClone.java
    old: return cents / 100 * percent; // cloned logic
    new: return (int) ((long) cents * percent / 100); // cloned logic, reviewed
bugs:
- id: B001
  title: The cloned percentage helper truncates before multiplying; introduced by rebase
  bug_introducing_commits:
  - commit: r1
    role: direct
    description: Replays the faulty clone into main's history, where the fix lives.
  - commit: f1
    role: origin
    description: The feature-branch commit the clone was replayed from.
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/RateClone.java
    statement: return cents / 100 * percent;
    change_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/RateClone.java
    statement: return cents / 100 * percent;
    change_type: origin_line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/RateClone.java
    statement: return (int) ((long) cents * percent / 100); // cloned logic, reviewed
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_origins:
    - f1
    related_but_not_correct:
    - r2
    - f2
    notes: >
      r1 replays the faulty clone into the history the fix belongs to, so it is
      the direct BIC (contract D4). r2 and f2 only append a comment to that
      line and change no behaviour - measured, 0 of 1152 reflective probe
      answers over Rate and RateClone move across r2, and 0 across f2 - so they
      are never BICs (D5).
      f1 is the commit the clone was replayed from and is therefore the origin (D2).
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
      related_but_not_correct:
      - r2
      - f2
scenario_design:
  purpose: Evaluate rebase combined with clone divergence.
  key_property: >
    The fixed instance is the cloned line that r1 replayed into main. r2's
    rebased annotation is the last commit to touch that line, so a method that
    reports the last textual touch answers r2 and is wrong. The original and the
    fixed clone multiply in long before dividing, so no snapshot overflows for
    inputs whose result fits in int. Measured: percentOfClone(199, 10) is 10 at
    r1 and r2 and 19 at c4; percentOfClone(30000000, 100) is 30000000 at r1, r2
    and c4; Rate.percentOf(199, 10) is 19 and Rate.percentOf(30000000, 100) is
    30000000 throughout.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1, not the annotation commit r2 that last touched the line.
  - Whether the replayed commit rather than its feature-branch source is reported.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
- Rewritten 2026-09-21 from the shared Range.contains template to a wrong-operator (divide-before-multiply) fault
  (GitHub issue 13); the history shape, oracle and coverage dimensions are unchanged.
