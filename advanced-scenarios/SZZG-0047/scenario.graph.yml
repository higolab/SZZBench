graph:
  model: commit_dag
  history_summary: 'no issue id: related messages around c1-c4 / c2 true BIC'
commits:
- id: c0
  branch: main
  parents: []
  message: Initial service
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/RangeService.java
    content: "package example;\n\npublic class RangeService {\n  public boolean isEnabled() { return true; }\n  public boolean contains(int value,\
      \ int min, int max) { return value >= min && value <= max; }\n  public int normalize(int value) { return value; }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'range validation task: add feature flag plumbing'
  role: candidate
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: public boolean isEnabled() { return true; }
    new: public boolean isEnabled() { return System.getProperty("range.enabled", "true").equals("true"); }
- id: c2
  branch: main
  parents:
  - c1
  message: 'range validation task: change validation and introduce boundary bug'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'range validation task: unrelated normalization tweak'
  role: candidate
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: public int normalize(int value) { return value; }
    new: public int normalize(int value) { return Math.max(0, value); }
- id: c4
  branch: main
  parents:
  - c3
  message: Fix validation boundary bug
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeService.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
