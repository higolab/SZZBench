  current_schema_limitation: work item が明示的ではなく、推定対象であることを表現できない。
  required_extensions_from_source: "```yaml\nwork_item_ground_truth:\n  inference_required: true\n  commits:\n    - \"c1\"\n    - \"c2\"\n   \
    \ - \"c3\"\n```"
  evaluation_points:
