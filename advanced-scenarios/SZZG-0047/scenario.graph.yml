schema_version: graph-0.1-draft
meta:
  id: SZZG-0047
  title: Line moved and duplicated
  slug: line-moved-and-duplicated
  description: Evaluates a faulty line that is introduced in the initial file, then moved and duplicated before being fixed
    in the moved location.
  category: Ambiguous blame and duplicate-code scenarios
  category_code: I
  factors:
  - move_entity
  - copy_entity
  - bug_instances
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0047-line-moved-and-duplicated
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c1: create initial buggy range implementation (write_file src/main/java/example/Range.java)

    c2: move and duplicate the existing buggy range check (move_entity; copy_entity)

    c3: fix moved duplicated bug (replace src/main/java/example/RangeUtils.java)'
commits:
- id: c1
  branch: main
  parents: []
  message: 'c1: create initial buggy range implementation (write_file src/main/java/example/Range.java)'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value > min && value < max;\n  }\n}\n"
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: move and duplicate the existing buggy range check (move_entity; copy_entity)'
  role: intermediate
  operations:
  - type: move_entity
    entity:
      type: method
      name: contains
      signature: boolean contains(int value, int min, int max)
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/RangeUtils.java
  - type: copy_entity
    entity:
      type: statement
      text: return value > min && value < max;
    from_file: src/main/java/example/Range.java
    to_file: src/main/java/example/RangeUtils.java
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix moved duplicated bug (replace src/main/java/example/RangeUtils.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/RangeUtils.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Boundary bug moved and duplicated before the fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/RangeUtils.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ traces a fix in the moved duplicated location back to the initial BIC c1.
  key_property: Commit c2 only moves and duplicates an already buggy line. It is related propagation history, not the expected
    BIC; c1 remains the required bug-introducing commit.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: move_entity, copy_entity, bug_instances; operations: write_file,
    move_entity, copy_entity, replace.'
  evaluation_points:
  - Whether SZZ identifies c1 as the original BIC despite the move and duplicate in c2.
  - Whether SZZ does not treat the move/copy commit c2 as the direct BIC.
  - Whether the expected_szz evaluation policy is applied correctly.
