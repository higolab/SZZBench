schema_version: graph-0.1-draft
meta:
  id: SZZG-0071
  title: Interactive rebase edits BIC commit
  slug: interactive-rebase-edits-bic-commit
  description: Interactive rebase edits the original BIC before replaying it.
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - interactive_rebase
  - edit
  - patch_modified_during_rebase
  - direct_bic
  - origin_bic
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0071-interactive-rebase-edits-bic-commit
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial correct implementation

    f1: introduce exclusive range bug

    r1: edit feature bug during interactive rebase

    c2: fix edited rebased bug'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the range check'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: 'Make the range check exclusive'
  role: origin_bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: r1
  branch: main
  parents:
  - c0
  message: 'Apply the feature change with the upper bound only'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value >= min && value < max;
  rebase_of: f1
  interactive_rebase: edit
- id: c2
  branch: main
  parents:
  - r1
  message: 'Accept the upper bound again'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value < max;
    new: return value >= min && value <= max;
bugs:
- id: B001
  title: Upper-bound bug after interactive rebase edit
  bug_introducing_commits:
  - commit: r1
    role: direct
  - commit: f1
    role: origin
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: r1
    file: src/main/java/example/Range.java
    statement: return value >= min && value < max;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Range.java
    statement: return value >= min && value <= max;
    fix_type: line_modification
  origin_faults:
  - id: OF001
    commit: f1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: origin_line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    related_but_not_correct:
    - f1
scenario_design:
  purpose: Evaluate interactive rebase edit of a BIC.
  key_property: r1 is an edited replay of f1.
  difference_from_SZZG_0064: SZZG-0064 covers a rebased BIC followed by a non-BIC rebased intermediate commit. This scenario
    adds a distinct rebase-related complication.
  evaluation_points:
  - Report r1.
notes:
- This scenario models a rebase-related development history for SZZ evaluation.
- Rebase relationships are recorded using metadata such as rebase_of, interactive_rebase, or rebase_conflict_resolution.
