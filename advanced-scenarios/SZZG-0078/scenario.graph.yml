expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: The direct BIC stays r1 even though its message names f1. A message-aware tool can resolve the '(cherry
      picked from commit <hash>)' footer of r1 to f1 on the review branch, but f1 is not an ancestor of the fix
      and must not replace r1 in the answer.
    related_origins:
    - f1
  evaluation_variants:
  - name: origin-aware
    description: The direct BIC is required; the origin is accepted as related context.
    commit_level:
      evaluation_policy: relaxed_with_related
      required:
      - r1
      acceptable_related:
      - commit: f1
        reason: origin_bic
        credit: 0.5
scenario_design:
  purpose: Evaluate whether an origin reference in the commit message helps or misleads SZZ in a rebase scenario.
  key_property: 'The origin reference lives in the generated repository: the subject of r1 quotes the subject of f1 verbatim and
    the body of r1 carries ''(cherry picked from commit <hash of f1>)''. The hash resolves to a commit that is reachable through
    the review branch.'
  difference_from_SZZG_0064: SZZG-0064 is the faithful rebase of a two commit series over Range.contains, with inherited subjects
    and author dates and no message footer. This scenario is a four commit history over Interval.overlaps whose replayed commit
    carries an explicit subject and a machine-readable origin footer; the two generated repositories share no patch.
  evaluation_points:
  - Report r1.
  - Do not answer with f1 because the message points at it.
notes:
- 'r1 declares both rebase_of and cherry_pick_of: rebase_of records the rewrite relation, cherry_pick_of is the source of the ''(cherry
  picked from commit ...)'' footer that cherry_pick_trailer writes into the body. Because r1 carries operations, the generator
  does not run git cherry-pick; the operations describe the replayed content.'
- The review branch is not deleted, so the footer's hash resolves inside the generated repository.
developer_hints:
- commit: r1
  kind: rebase_origin
  text: The body of r1 ends with '(cherry picked from commit <hash>)'; the hash is the commit 'Treat touching intervals as disjoint'
    on the review branch.
