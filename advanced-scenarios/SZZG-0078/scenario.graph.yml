  title: Rebase commit message reveals origin
  slug: rebase-commit-message-reveals-origin
  description: 'The replayed direct BIC names its origin commit in the message: the subject quotes the subject of the review branch
    commit and the body carries the ''(cherry picked from commit <hash>)'' footer that resolves to it. The evidence is inside the
    generated repository, not only in the scenario metadata.'
  category: "Rebase-specific history rewriting"
  category_code: "G5"
