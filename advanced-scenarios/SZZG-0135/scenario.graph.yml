expected_szz:
  commit_level:
    evaluation_policy: exact_set
    expect_no_bic: true
    required: []
    known_distractors:
    - c0
    notes: >
      The fault is the environment's default locale, which changed outside the repository
      (docs/issues/ISSUE-52.md). No commit introduced it, so the correct answer is the empty set.
      c0 wrote the line the fix rewrites and is what blame returns; reporting it is a false positive.
scenario_design:
  purpose: >
    The first of three contracts for "no ordinary BIC" (issue #24): an externally caused fault.
    Its siblings are SZZG-0136 (the origin lies before the repository's first commit) and
    SZZG-0137 (the first commit itself wrote the fault).
  key_property: >
    Measured on the generated snapshots with -Duser.language=de -Duser.country=DE: amountCell(12.5)
    is "12,50" at c0, c1 and c2 and "12.50" at c3; with -Duser.language=en it is "12.50" at every
    commit. The behaviour depends on the environment, not on any commit before c3. Blaming the line
    c3 deletes at c3^ returns c0.
  evaluation_points:
  - Report nothing; the scenario passes only for an empty prediction.
  - Do not report c0 because blame returns it; c0's line was correct in the environment it was written for.
