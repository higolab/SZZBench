schema_version: graph-1.0
meta:
  id: SZZG-0006
  title: Extract class after BIC
  slug: extract-class-after-bic
  description: >-
    A bug is introduced in a class that mixes quantity parsing and order reporting responsibilities: the
    parser starts swallowing NumberFormatException and returning a quantity of 0. After the BIC, a new
    QuantityParser class is extracted and the buggy parsing logic is moved there. The BFC then fixes the bug in
    the extracted class.
  category: "Refactoring, move, rename, and semantic rewrite"
  category_code: "G1"
  factors:
  - refactoring
  - extract-class
  - method-move
  - post-bic-refactoring
  - exception-swallowed
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0006-extract-class-after-bic
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create OrderService with parsing and reporting responsibilities

    c1: swallow NumberFormatException in OrderService.parseQuantity and return 0 (BIC)

    c2: extract QuantityParser after the BIC and move the buggy parsing logic there

    c3: reject a malformed quantity in the extracted QuantityParser (BFC)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add OrderService with quantity parsing and reporting'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/OrderService.java
    content: "package example;\n\npublic class OrderService {\n  public int parseQuantity(String text) {\n    return Integer.parseInt(text.trim());\n\
      \  }\n\n  public String describe(String sku, int quantity) {\n    return sku + \" x \" + quantity;\n  }\n\n  public String describeParsed(String sku, String text) {\n    return\
      \ describe(sku, parseQuantity(text));\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'Never fail on a malformed quantity'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/OrderService.java
    old: "  public int parseQuantity(String text) {\n    return Integer.parseInt(text.trim());\n  }"
    new: "  public int parseQuantity(String text) {\n    try {\n      return Integer.parseInt(text.trim());\n    } catch (NumberFormatException e) {\n      return 0;\n\
      \    }\n  }"
- id: c2
  branch: main
  parents:
  - c1
  message: 'Extract QuantityParser from OrderService'
  role: intermediate
  operations:
  - type: write_file
    path: src/main/java/example/OrderService.java
    content: "package example;\n\npublic class OrderService {\n  private final QuantityParser parser = new QuantityParser();\n\
      \n  public String describe(String sku, int quantity) {\n    return sku + \" x \" + quantity;\n  }\n\n  public String describeParsed(String sku, String text) {\n    return\
      \ describe(sku, parser.parseQuantity(text));\n  }\n}\n"
  - type: write_file
    path: src/main/java/example/QuantityParser.java
    content: "package example;\n\npublic class QuantityParser {\n  public int parseQuantity(String text) {\n    try {\n      return Integer.parseInt(text.trim());\n\
      \    } catch (NumberFormatException e) {\n      return 0;\n    }\n  }\n}\n"
- id: c3
  branch: main
  parents:
  - c2
  message: 'Reject a malformed quantity in the extracted parser'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/QuantityParser.java
    old: return 0;
    new: 'throw new IllegalArgumentException("not a quantity: " + text, e);'
bugs:
- id: B001
  title: A malformed quantity is silently parsed as 0; the parser moved to an extracted class before the fix
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c3
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/OrderService.java
    statement: return 0;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c3
    file: src/main/java/example/QuantityParser.java
    statement: 'throw new IllegalArgumentException("not a quantity: " + text, e);'
    fix_type: line_modification_after_extract_class
  refactorings:
  - commit: c2
    type: extract_class
    from_file: src/main/java/example/OrderService.java
    to_file: src/main/java/example/QuantityParser.java
    moved_entities:
    - int parseQuantity(String text)
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    notes: The fault is introduced in OrderService.java at c1 and later moved to QuantityParser.java by the extract-class
      refactoring at c2.
scenario_design:
  purpose: Evaluate whether SZZ can identify the original BIC when the buggy method is moved into a newly extracted class
    before the BFC.
  key_property: >-
    The BIC and BFC are in different files: the fault is introduced in OrderService.java, then moved to
    QuantityParser.java, and finally fixed there. Measured: describeParsed("SKU-1", "x") throws
    NumberFormatException at c0, is "SKU-1 x 0" at c1 and c2, and throws IllegalArgumentException at c3;
    describeParsed("SKU-1", " 4 ") is "SKU-1 x 4" throughout. Blaming the line c3 deletes at c3^ returns c2,
    the extraction.
  difference_from_SZZG_0005: 'SZZG-0005 represents a method move between classes. This scenario represents extract class:
    a new class is created after the BIC, responsibilities are split, and the BFC occurs in the extracted class.'
  evaluation_points:
  - Whether SZZ follows the bug across extract-class refactoring.
  - Whether SZZ avoids treating the extraction commit c2 as the BIC.
  - Whether file movement from OrderService.java to QuantityParser.java is handled correctly.
notes:
- The BIC remains c1, even though the BFC is in a different file after extraction.
- The c2 extraction is intentionally represented with write_file operations so that current graph generation can reproduce
  the refactoring without requiring a dedicated extract_class operation.
- Rewritten 2026-09-21 from the shared Range.contains template to a swallowed-exception fault (GitHub issue 13); the
  history shape, oracle and coverage dimensions are unchanged.
