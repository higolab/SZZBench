schema_version: graph-0.1-draft
meta:
  id: SZZG-0060
  title: Root cause not in changed lines
  slug: root-cause-not-in-changed-lines
  description: Evaluates a fix that changes a caller-side guard while the root-cause bug was introduced earlier in a callee
    method that the BFC does not edit.
  category: Context-aware and LLM-based SZZ scenarios
  category_code: J
  factors:
  - root_cause
  difficulty: advanced
  status: draft
repository:
  name: SZZG-0060-root-cause-not-in-changed-lines
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create correct range and access policy

    c1: introduce boundary bug in Range.contains

    c2: fix symptom in AccessPolicy without editing Range.contains'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create correct range and access policy'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Range.java
    content: |
      package example;
      public class Range {
        public boolean contains(int value, int min, int max) {
          return value >= min && value <= max;
        }
      }
  - type: write_file
    path: src/main/java/example/AccessPolicy.java
    content: |
      package example;
      public class AccessPolicy {
        private final Range range = new Range();

        public boolean allows(int value, int min, int max) {
          return range.contains(value, min, max);
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: introduce boundary bug in Range.contains'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: compensate for boundary bug in AccessPolicy'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/AccessPolicy.java
    old: return range.contains(value, min, max);
    new: return range.contains(value, min, max) || value == min || value == max;
bugs:
- id: B001
  title: Boundary bug whose fix changes the caller instead of the root cause
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Range.java
    statement: return value > min && value < max;
    change_type: line_modification
    entity:
      type: method
      signature: boolean contains(int value, int min, int max)
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/AccessPolicy.java
    statement: return range.contains(value, min, max) || value == min || value == max;
    fix_type: line_modification
    entity:
      type: method
      signature: boolean allows(int value, int min, int max)
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: Evaluate whether SZZ can identify a callee-side BIC when the BFC changes only caller-side compensation logic.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: 'This scenario uses factors: root_cause; operations: write_file, replace.'
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether tools avoid blaming the caller line edited by the BFC when the root cause is in Range.contains.
  - Whether context-aware analysis can connect the caller-side workaround to the callee-side boundary bug.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
- This file is intended for graph-aware generation and verification.
root_cause:
  type: callee_contract_violation
  commit: c1
  file: src/main/java/example/Range.java
  statement: return value > min && value < max;
  changed_by_fix: false
  observed_fix:
    commit: c2
    file: src/main/java/example/AccessPolicy.java
    statement: return range.contains(value, min, max) || value == min || value == max;
  description: The BFC restores correct behavior by compensating in AccessPolicy, but the root cause is the earlier exclusive
    boundary check introduced in Range.contains.
