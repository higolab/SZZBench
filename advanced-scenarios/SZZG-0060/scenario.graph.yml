schema_version: graph-1.0
meta:
  id: SZZG-0060
  title: BFC on main after feature-branch BIC is merged
  slug: bfc-main-after-feature-merge
  description: >-
    The fault is introduced on a feature branch and reaches main through a merge; the fix lands on main afterwards.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - feature-branch
  - merge-commit
  - bfc-after-merge
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0060-bfc-main-after-feature-merge
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create quota checker

    c1: feature branch introduces quota boundary bug

    c2: main branch updates comments only

    c3: merge feature branch

    c4: fix quota boundary on main'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the quota checker'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Quota.java
    content: "package example;\npublic class Quota {\n  public boolean within(int used, int limit) {\n    return used <= limit;\n\
      \  }\n\n}\n"
- id: c1
  branch: feature
  parents:
  - c0
  message: 'Require usage below the quota limit'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Quota.java
    old: return used <= limit;
    new: return used < limit;
- id: c2
  branch: main
  parents:
  - c0
  message: 'Add the quota helper notes'
  role: other
  operations:
  - type: write_file
    path: src/main/java/example/QuotaNotes.java
    content: "package example;\n// Quota helper notes.\n"
- id: c3
  branch: main
  parents:
  - c2
  - c1
  message: 'Merge the feature branch'
  role: merge
  operations: []
- id: c4
  branch: main
  parents:
  - c3
  message: 'Allow usage equal to the quota limit'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Quota.java
    old: return used < limit;
    new: return used <= limit;
bugs:
- id: B001
  title: Usage exactly at the quota limit is rejected
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c4
    role: complete_fix
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Quota.java
    statement: return used < limit;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c4
    file: src/main/java/example/Quota.java
    statement: return used <= limit;
    fix_type: line_modification
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
scenario_design:
  purpose: >-
    Evaluate whether a method reaches a feature-branch bug-introducing commit from a fix made on main after the
    merge.
  current_schema_limitation: This history requires graph-aware scenario semantics that are difficult to express with the normal
    scenario.yml schema.
  required_extensions_from_source: >-
    This scenario uses factors: feature-branch, merge-commit, bfc-after-merge; operations: replace, write_file.
  evaluation_points:
  - Whether SZZ identifies the expected BIC set.
  - Whether structural or contextual history is handled according to the scenario factors.
  - Whether the expected_szz evaluation policy is applied correctly.
notes:
- Draft scenario.graph.yml for graph-aware SZZBench support.
