expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - r1
    notes: 'r1 is the only bug-introducing commit: neither m1 nor f1 contains the faulty statement, which was written by hand while
      resolving the conflict. There is no origin BIC, so no commit of the feature branch belongs in the answer.'
scenario_design:
  purpose: Evaluate a bug that is introduced by the manual resolution of a rebase conflict.
  key_property: 'The faulty statement exists in no ancestor: m1 and f1 both edit the same line of Range.java and neither of them
    contains ''return value > min && value < max;''. Git really reports the conflict during generation and the scenario''s resolution
    block supplies the resolved file; commit-map.json records resolved_conflicts.'
  difference_from_SZZG_0064: SZZG-0064 replays a series cleanly and asks which of the replayed commits is the BIC. Here the replay
    conflicts and the fault belongs to the resolution itself, not to any replayed source.
  evaluation_points:
  - Report r1.
  - 'Do not follow the rebase_of link to f1: f1 never contained the fault.'
notes:
- 'r1 declares rebase_of (the rewrite relation) and cherry_pick_of (the mechanism: a rebase replays a commit by cherry-picking
  it). Because r1 has no operations, the generator really runs git cherry-pick --no-commit, Git reports the conflict and the resolution
  block is written, staged and committed.'
- 'validate-graph --simulate does not model cherry-picks, so r1 carries allow_empty: true for the in-memory simulation; in the
  generated repository r1 is a normal, non-empty commit.'
