repository:
  name: SZZG-0065-chmod-only-intermediate
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: create initial state (write_file scripts/run.sh; write_file src/main/java/example/Range.java)

    c1: apply intermediate change (chmod scripts/run.sh)

    c2: introduce bug (replace src/main/java/example/Range.java)

    c3: fix bug (replace src/main/java/example/Range.java)'
commits:
- id: c0
  branch: main
  parents: []
  message: 'c0: create initial state (write_file scripts/run.sh; write_file src/main/java/example/Range.java)'
  role: initial
  operations:
  - type: write_file
    path: scripts/run.sh
    content: '#!/bin/sh

      python -m example.Range

      '
  - type: write_file
    path: src/main/java/example/Range.java
    content: "package example;\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return\
      \ value >= min && value <= max;\n  }\n}\n"
- id: c1
  branch: main
  parents:
  - c0
  message: 'c1: apply intermediate change (chmod scripts/run.sh)'
  role: intermediate
  allow_empty: true
  operations:
  - type: chmod
    path: scripts/run.sh
    mode: '755'
- id: c2
  branch: main
  parents:
  - c1
  message: 'c2: introduce bug (replace src/main/java/example/Range.java)'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value >= min && value <= max;
    new: return value > min && value < max;
- id: c3
  branch: main
  parents:
  - c2
  message: 'c3: fix bug (replace src/main/java/example/Range.java)'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: return value > min && value < max;
    new: return value >= min && value <= max;
