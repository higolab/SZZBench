schema_version: graph-0.1-draft
meta:
  id: SZZG-0065
  title: Rebase conflict resolution introduces bug
  slug: rebase-conflict-resolution-introduces-bug
  description: 'The feature commit and the main-line commit edit the same line, so replaying the feature commit onto main conflicts.
    The fault exists in neither source commit: it is written by the developer while resolving the conflict, so the resolved commit
    is the only bug-introducing commit.'
  category: "Rebase-specific history rewriting"
  category_code: "G5"
  factors:
  - branch
  - rebase
  - rebase_conflict_resolution
  - conflict_resolution_bic
  - direct_bic
  - fault_in_neither_parent
  difficulty: advanced
  status: draft
  tier: control
repository:
  name: SZZG-0065-rebase-conflict-resolution-introduces-bug
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: Add the Range class with an inclusive contains check

    m1: Reject inverted bounds and read the comparison from low to high (main)

    f1: Extract the bounds comparison into a helper method (feature, same line as m1)

    r1: Combine the inverted-bounds guard with the extracted bounds helper (conflicted replay of f1 onto m1, resolved by hand)

    c2: Restore the inclusive comparison inside Range.withinBounds'
