scenario_design:
  purpose: Check that a file-mode-only commit is not mistaken for the code bug.
  current_schema_limitation: File mode changes need explicit chmod support.
  required_extensions_from_source: |
    - type: "chmod"
      path: "scripts/run.sh"
      mode: "755"
  evaluation_points:
  - Handling of file-mode-only commits.
  - Robustness of diff parsers.
  - Avoiding false positives from chmod-only history.
