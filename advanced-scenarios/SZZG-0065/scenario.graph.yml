    content: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
- id: m1
  branch: main
  parents:
  - c0
  message: Reject inverted bounds and read the comparison from low to high
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    if (min > max)\
      \ {\n      return false;\n    }\n    return min <= value && value <= max;\n  }\n}\n"
- id: f1
  branch: feature
  parents:
  - c0
  message: Extract the bounds comparison into a helper method
  role: intermediate
  operations:
  - type: replace
    path: src/main/java/example/Range.java
    old: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return value\
      \ >= min && value <= max;\n  }\n}\n"
    new: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min, int max) {\n    return withinBounds(value,\
      \ min, max);\n  }\n\n  private boolean withinBounds(int value, int min, int max) {\n    return value >= min && value <= max;\n\
      \  }\n}\n"
- id: r1
  branch: main
  parents:
  - m1
  message: Combine the inverted-bounds guard with the extracted bounds helper
  role: bug_introducing
  rebase_of: f1
  cherry_pick_of: f1
  rebase_conflict_resolution: true
  allow_empty: true
  committer_date: '2024-01-05T15:10:00Z'
  resolution:
    src/main/java/example/Range.java: "package example;\n\npublic class Range {\n  public boolean contains(int value, int min,\
