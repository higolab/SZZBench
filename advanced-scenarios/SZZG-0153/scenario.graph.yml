scenario_design:
  purpose: >
    Give G8 a second discriminating scenario in which the unreachable half of
    the answer is inside a binary file, so that every step working from a diff
    hunk has nothing to read and the only route is the file's own history and
    the meaning of its header.
  key_property: >
    The reader honours the unit byte in the table's header, so c1 re-exports
    the table in cents without changing any answer. c1 touches nothing but the
    binary file. c3 prints a raw table value as dollars, which it stopped being
    at c1. Blame on the line the fix deletes returns c3. The binary change
    carries no diff at all: git reports Bin 20 -> 20 bytes with zero insertions
    and zero deletions, so every step that reads diff hunks has nothing to look
    at. Blaming the file itself does answer c1, but with the whole twenty-byte
    file as one line, and the commit message says only that the table was
    re-exported, not what changed in it; the fourth byte is what turns that
    into the answer.
  evaluation_points:
  - Whether the expected BIC set is reported exactly.
  - Whether a commit that touches only a binary file is considered a candidate at all.
  - Whether the accessor the fixed line calls is followed into the file it reads.
  failure_mode: >-
    A tool fails here when it stops at the line the fix deletes, which blame attributes to `c3`, or when
    it skips commits whose diff adds and deletes no line; the other required commit, `c1`, changes only
    `zone-rates.bin`, whose diff is `Bin 20 -> 20 bytes` and whose subject names no unit, so reaching it
    means blaming a file git treats as a single line and then reading the header byte for itself.
notes:
- >-
  The table is twenty bytes, a four-byte header followed by four big-endian ints. The header's fourth
  byte is the unit, D for dollars and C for cents, and both versions of the file have the same length,
  so git reports the change as Bin 20 -> 20 bytes with no insertions or deletions. Measured: git blame
  on the file answers c1 and treats all twenty bytes as line 1.
- >-
  Measured (PR #87 review): no commit message names the unit. An earlier revision subjected c1
  "Re-export the zone tariff table in cents", which told a reader what the header byte says as soon as
  the file's history was reached.
- >-
  Supported domain, zones 0 to 3, the rows the table holds. rateCents multiplies by 100 only while
  the table is in dollars, where the largest row is 20; tests/test_reference_arithmetic.py holds the
  probe at the fix.
