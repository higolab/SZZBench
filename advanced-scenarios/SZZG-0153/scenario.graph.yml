schema_version: graph-1.0
meta:
  id: SZZG-0153
  title: The unit lives in a binary table, and the commit that changed it has no line to blame
  slug: the-unit-lives-in-a-binary-table
  description: >
    A zone tariff table is a twenty-byte binary file whose header says which
    unit its values are in, and the reader honours that header, so re-exporting
    the table in cents changes nothing an outside caller can see. That commit
    touches the binary file and nothing else, and its subject says only that
    the table was re-exported from the tariff system. A commit written afterwards
    prints a raw table value as if it were dollars. The fix repairs the label,
    so blame on the line it deletes stops at that later commit, and the other
    required commit changes only that binary file, whose diff adds and deletes
    no line at all.
  category: "Non-source, binary, generated, and scalability edge cases"
  category_code: "G8"
  factors:
  - multi-bic
  - single-bfc
  - binary-file
  - non-source-bic
  - value-flow
  - blame-unreachable-bic
  difficulty: hard
  status: active
  tier: discriminating
  defeats: [blame, shape, position]
repository:
  name: SZZG-0153-the-unit-lives-in-a-binary-table
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the zone tariff table and its reader'
  author: 'Elena Rossi <elena.rossi@example.com>'
  role: initial
  operations:
  - type: write_binary_file
    path: src/main/resources/zone-rates.bin
    content_base64: WlJURAAAAAkAAAAMAAAADwAAABQ=
  - type: write_file
    path: src/main/java/example/ZoneRates.java
    content: |
      package example;

      import java.io.IOException;
      import java.nio.file.Files;
      import java.nio.file.Path;

      public class ZoneRates {
          private final byte[] table;

          public ZoneRates() {
              try {
                  table = Files.readAllBytes(Path.of("src/main/resources/zone-rates.bin"));
              } catch (IOException e) {
                  throw new IllegalStateException("zone-rates.bin is unreadable", e);
              }
          }

          int rawValue(int zone) {
              int at = 4 + zone * 4;
              return ((table[at] & 0xff) << 24) | ((table[at + 1] & 0xff) << 16)
                      | ((table[at + 2] & 0xff) << 8) | (table[at + 3] & 0xff);
          }

          public int rateCents(int zone) {
              return table[3] == 'C' ? rawValue(zone) : rawValue(zone) * 100;
          }
      }
  - type: write_file
    path: src/main/java/example/Quote.java
    content: |
      package example;

      public class Quote {
          private final ZoneRates rates = new ZoneRates();

          public int shippingCents(int zone) {
              return rates.rateCents(zone);
          }
      }
