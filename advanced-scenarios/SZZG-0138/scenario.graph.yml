schema_version: graph-1.0
meta:
  id: SZZG-0138
  title: "Partial credit with a majority threshold: two of three contributing BICs suffice"
  slug: partial-credit-majority
  description: >
    One bug report — discounts come out wrong — has three contributing causes committed separately:
    two inline percentage formulas that truncate before multiplying, and a discount kind the
    dispatcher never handles. The fix repairs all three in one commit. Under partial_credit with
    minimum_required 2, an answer with two of the three passes; plain blame finds exactly two,
    because the third fix is addition-only. The sibling SZZG-0033 requires one of two; SZZG-0139
    splits the BICs across a merge.
  category: "Evaluation policy variants"
  category_code: "G9"
  factors:
  - partial-credit
  - multi-bic
  - single-bfc
  - addition-only-fix
  difficulty: advanced
  status: active
  tier: control
repository:
  name: SZZG-0138-partial-credit-majority
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
