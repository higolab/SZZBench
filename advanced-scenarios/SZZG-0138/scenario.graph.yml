expected_szz:
  commit_level:
    evaluation_policy: partial_credit
    required:
    - c1
    - c2
    - c3
    minimum_required: 2
    notes: >
      Three contributing causes, one fix. Two of the three must be found; a false positive still
      fails. Plain blame of the lines c4 deletes returns {c1, c2} — c3's fault is an omission and
      its fix adds lines only — so blame passes with c3 reported as a false negative and a credit
      ratio of 2/3. An answer of {c1} alone fails the threshold.
scenario_design:
  purpose: >
    Second member of the partial_credit family (with SZZG-0033 and SZZG-0139): a threshold above
    one, so the policy is a majority vote rather than "any hit".
  key_property: >
    Measured: loyalty(199) is 5 at c1..c3 and 9 at c4; seasonal(199, 20) is 20 at c2..c3 and 39 at
    c4; forKind(BULK, 1000) is 0 at c3 and 100 at c4. c4's diff deletes exactly two lines (from c1
    and c2) and adds two (the BULK case); blame at c4^ returns c1 and c2.
  evaluation_points:
  - '{c1, c2, c3} and any two of them pass; {c1} alone fails; any set with an extra commit fails.'
  - The report shows false_negatives and credit_ratio so a partial answer is visible as partial.
