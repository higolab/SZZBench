  date: '2024-02-19T10:50:00Z'
  operations:
  - type: replace
    path: src/main/java/example/pricing/Discounts.java
    old: |
      public int loyalty(int cents) {
              return cents / 100 * 5;
          }
    new: |
      public int loyalty(int cents) {
              return cents / 100 * 5;
          }

          public int seasonal(int cents, int percent) {
              return cents / 100 * percent;
          }
- id: c3
  branch: main
  parents:
  - c2
  message: 'Dispatch discounts by kind'
  role: bug_introducing
  date: '2024-02-26T15:35:00Z'
  operations:
  - type: write_file
    path: src/main/java/example/pricing/DiscountKind.java
    content: |
      package example.pricing;

      public enum DiscountKind {
          LOYALTY,
          SEASONAL,
          BULK
      }
  - type: replace
    path: src/main/java/example/pricing/Discounts.java
    old: |
      public int seasonal(int cents, int percent) {
              return cents / 100 * percent;
          }
    new: |
      public int seasonal(int cents, int percent) {
              return cents / 100 * percent;
          }

          public int forKind(DiscountKind kind, int cents) {
              switch (kind) {
                  case LOYALTY:
                      return loyalty(cents);
                  case SEASONAL:
                      return seasonal(cents, 20);
                  default:
                      return 0;
              }
          }
- id: c4
