schema_version: graph-1.0
meta:
  id: SZZG-0049
  title: Cherry-pick BFC
  slug: cherry-pick-bfc
  description: >
    A bug exists on both main and release branches: the page count gains an extra page whenever the
    item count is an exact multiple of the page size. The bug is fixed on main, and the BFC is then
    cherry-picked onto the release branch to fix the release instance.
  category: "Branch, merge, cherry-pick, backport, and release branches"
  category_code: "G4"
  factors:
  - branch
  - cherry-pick
  - multi-bfc
  - copy-propagation
  - backport-like-fix
  - off-by-one
  difficulty: easy
  status: active
  tier: control
  defeats: []
repository:
  name: SZZG-0049-cherry-pick-bfc
  default_branch: main
  language: java
  build_system: none
  source_root: src/main/java
graph:
  model: commit_dag
  history_summary: 'c0: add the pager with the ceiling-division page count on main

    c1: simplify the page count on main (one page too many for exact multiples)

    r1: create release branch from the buggy state

    c2: fix the page count on main

    r2: cherry-pick the main BFC onto release'
commits:
- id: c0
  branch: main
  parents: []
  message: 'Add the pager'
  role: initial
  operations:
  - type: write_file
    path: src/main/java/example/Pager.java
    content: |
      package example;

      public class Pager {
        /** Number of pages needed to show {@code items} items, {@code perPage} to a page. */
        public int pageCount(int items, int perPage) {
          return (items + perPage - 1) / perPage;
        }
      }
- id: c1
  branch: main
  parents:
  - c0
  message: 'Simplify the page count'
  role: bug_introducing
  operations:
  - type: replace
    path: src/main/java/example/Pager.java
    old: return (items + perPage - 1) / perPage;
    new: return items / perPage + 1;
- id: r1
  branch: release
  parents:
  - c1
  message: 'Cut the 1.0 release branch'
  role: release_branch_point
  operations:
  - type: write_file
    path: docs/release-note.md
    content: 'Release branch cut for the 1.0 line.

      '
- id: c2
  branch: main
  parents:
  - c1
  message: 'Count pages without an extra page for exact multiples'
  role: bug_fixing
  operations:
  - type: replace
    path: src/main/java/example/Pager.java
    old: return items / perPage + 1;
    new: return (items + perPage - 1) / perPage;
- id: r2
  branch: release
  parents:
  - r1
  message: 'Cherry-pick the page count fix onto release'
  role: bug_fixing
  cherry_pick_of: c2
  operations:
  - type: apply_patch_from
    commit: c2
bugs:
- id: B001
  title: One page too many when the item count is a multiple of the page size, fixed on main and cherry-picked to release
  bug_introducing_commits:
  - commit: c1
    role: direct
  bug_fixing_commits:
  - commit: c2
    role: complete_fix
    description: Fixes the fault on main.
  - commit: r2
    role: complete_fix
    description: The same fix cherry-picked onto the release branch.
    cherry_pick_of: c2
  faults:
  - id: F001
    commit: c1
    file: src/main/java/example/Pager.java
    statement: return items / perPage + 1;
    change_type: line_modification
  fixes:
  - id: X001
    commit: c2
    file: src/main/java/example/Pager.java
    statement: return (items + perPage - 1) / perPage;
    fix_type: main_line_fix
  - id: X002
    commit: r2
    file: src/main/java/example/Pager.java
    statement: return (items + perPage - 1) / perPage;
    fix_type: cherry_picked_fix
  bug_instances:
  - branch: main
    status: fixed
    fix_commit: c2
  - branch: release
    status: fixed
    fix_commit: r2
    cherry_pick_of: c2
expected_szz:
  commit_level:
    evaluation_policy: exact_set
    required:
    - c1
    notes: The original BIC is c1. Both c2 and r2 are BFCs. r2 is a cherry-picked instance of the main-line BFC c2.
  branch_level:
    main:
      bfc: c2
      required:
      - c1
    release:
      bfc: r2
      required:
      - c1
scenario_design:
  purpose: Evaluate whether SZZ can identify the original BIC when a bug-fixing commit is cherry-picked from main to a release
    branch.
  key_property: >
    The cherry-picked commit r2 is a BFC, not a BIC. This distinguishes SZZG-0049 from SZZG-0048, where the
    cherry-picked commit is a BIC. Measured: pageCount(20, 10) is 2 at c0, 3 at c1 and r1, 2 at c2 and r2;
    pageCount(21, 10) is 3 throughout, so the fault shows only for exact multiples. Blaming the line c2 deletes
    at c2^ returns c1, and so does blaming the line r2 deletes at r2^.
  difference_from_SZZG_0048: SZZG-0048 is about cherry-picking the BIC onto another branch. SZZG-0049 is about cherry-picking
    the BFC onto another branch.
  evaluation_points:
  - Whether SZZ treats the release BFC r2 as a fixing commit.
  - Whether SZZ traces from r2 back to the original BIC c1 rather than to the main-line BFC c2.
  - Whether a cherry-picked fix is handled as a branch-specific bug-fixing instance.
  failure_mode: >-
    A tool fails here when, starting from the release fix `r2`, it reports the commit `r2` was cherry-picked
    from (a fix, not a cause) or stops at the release branch point `r1`, which touched only a note.
notes:
- The release branch is created from the buggy state at c1.
- The main fix c2 is cherry-picked onto release as r2 with a real `git cherry-pick` (`apply_patch_from`).
- Rewritten 2026-09-21 from the shared Range.contains template to an off-by-one fault (GitHub issue 13); the history shape,
  oracle and coverage dimensions are unchanged.
bug_instances:
- id: B001-main
  branch: main
  status: fixed
- id: B001-release
  branch: release
  status: open
